name: Deploy a Apps Script

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar clasp
        run: npm install -g @google/clasp

      - name: Escribir credenciales de clasp
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Escribir .clasp.json
        run: |
          cat > .clasp.json <<EOF
          {
            "scriptId": "${{ secrets.SCRIPT_ID }}",
            "rootDir": "."
          }
          EOF

      - name: Push a Apps Script
        run: clasp push -f

      # Actualiza la implementación EXISTENTE de la web app (mismo deploymentId →
      # misma URL /exec). El equipo entra siempre por el mismo link y ve lo nuevo
      # sin que nadie haga "Versión nueva" a mano. Si el secret no está seteado,
      # saltea sin fallar (el push igual actualizó el código HEAD / dev).
      - name: Redeploy de la web app (misma URL)
        env:
          DEPLOY_ID: ${{ secrets.WEBAPP_DEPLOYMENT_ID }}
        run: |
          if [ -z "$DEPLOY_ID" ]; then
            echo "WEBAPP_DEPLOYMENT_ID no seteado — se omite el redeploy."
            exit 0
          fi
          clasp deploy --deploymentId "$DEPLOY_ID" --description "CI ${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # Igual que el redeploy de la web app, pero para la implementación del Gmail
      # add-on publicada en el Workspace Marketplace (ver docs/GMAIL-ADDON-MARKETPLACE.md).
      # Mantiene la MISMA deploymentId (no cambia lo que el admin instaló) y solo
      # crea una versión nueva con el código actual → los cambios del add-on llegan
      # a los usuarios sin re-publicar ni re-instalar. No-op si el secret no está
      # (ej. antes de publicar). OJO: si CAMBIAN los scopes, los usuarios deben
      # re-consentir.
      - name: Redeploy del Gmail add-on (Marketplace)
        env:
          ADDON_DEPLOY_ID: ${{ secrets.ADDON_DEPLOYMENT_ID }}
        run: |
          if [ -z "$ADDON_DEPLOY_ID" ]; then
            echo "ADDON_DEPLOYMENT_ID no seteado — se omite el redeploy del add-on."
            exit 0
          fi
          clasp deploy --deploymentId "$ADDON_DEPLOY_ID" --description "CI add-on ${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%M:%SZ)"

