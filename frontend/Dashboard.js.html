// NAVEGACIÓN POR TECLADO EN EL TRACKER
// ↓/↑ navegan filas, Enter abre actualizar (variant 'avanzar'),
// Escape cierra el panel. Solo activo cuando vEdTracker es la vista
// activa, no hay foco en input/textarea/select y no hay ningún
// modal abierto. Capture phase para poder consumir Escape antes que
// el handler global cuando corresponde (con stopImmediatePropagation).
// ════════════════════════════════════════════════════════════════
function _anyModalOpen() {
  if ($('uaHost')      && $('uaHost').innerHTML)                       return true;
  if ($('crHost')      && $('crHost').innerHTML)                       return true;
  if ($('crpHost')     && $('crpHost').innerHTML)                      return true;
  if ($('ddM')         && $('ddM').style.display === 'block')          return true;
  if ($('createOv')    && $('createOv').classList.contains('show'))    return true;
  if ($('editOv')      && $('editOv').classList.contains('show'))      return true;
  if ($('confOv')      && $('confOv').classList.contains('show'))      return true;
  if ($('edSearchOv')  && $('edSearchOv').classList.contains('show'))  return true;
  if ($('edHelpOv')    && $('edHelpOv').classList.contains('show'))    return true;
  if (document.getElementById('edNotifOv'))                            return true;
  return false;
}

document.addEventListener('keydown', function(e) {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp' && e.key !== 'Enter' && e.key !== 'Escape' && e.key !== 'a' && e.key !== 'A') return;

  var active = document.querySelector('.view.active');
  if (!active || active.id !== 'vEdTracker') return;

  var ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) return;

  // Capture phase: si hay un modal abierto, dejamos que su handler
  // (o el global) lo cierre y nosotros no actuamos.
  if (_anyModalOpen()) return;

  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    var rows = document.querySelectorAll('#vEdTracker .pa-tbl-r[data-task-id]');
    if (!rows.length) return;
    e.preventDefault();
    var ids = Array.prototype.map.call(rows, function(r){ return r.dataset.taskId; });
    var curIdx = (typeof EDT !== 'undefined' && EDT.selectedId != null)
      ? ids.indexOf(String(EDT.selectedId)) : -1;
    var nextIdx;
    if (e.key === 'ArrowDown') {
      nextIdx = (curIdx === -1) ? 0 : Math.min(curIdx + 1, ids.length - 1);
    } else {
      nextIdx = (curIdx === -1) ? 0 : Math.max(curIdx - 1, 0);
    }
    if (nextIdx === curIdx) return;
    EDT.selectedId = ids[nextIdx];
    if (D && typeof rEdTracker === 'function') rEdTracker(D);
    // Scroll en el siguiente tick (rEdTracker reemplazó el DOM).
    setTimeout(function() {
      var newRow = document.querySelector('#vEdTracker .pa-tbl-r[data-task-id="' + ids[nextIdx] + '"]');
      if (newRow && newRow.scrollIntoView) newRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }, 0);
    return;
  }

  // Enter ABRE la tarea (no la muta): convención universal de tablas (Ley de
  // Jakob — Linear/Notion/Gmail). Antes Enter abría el modal de AVANZAR
  // estado: iniciar una mutación con la tecla de "abrir" era un mismatch
  // mental. Avanzar ahora es la tecla A (la que el README siempre prometió).
  if (e.key === 'Enter') {
    if (typeof EDT === 'undefined') return;
    e.preventDefault();
    e.stopImmediatePropagation();
    if (EDT.selectedId == null) {
      // Sin selección: abrir la primera fila visible.
      var firstRow = document.querySelector('#vEdTracker .pa-tbl-r[data-task-id]');
      if (firstRow && firstRow.dataset.taskId) {
        EDT.selectedId = firstRow.dataset.taskId;
        if (D && typeof rEdTracker === 'function') rEdTracker(D);
      }
    }
    // Con selección, el panel ya está abierto (seleccionar = abrir) — no-op.
    return;
  }

  // A → avanzar el estado de la tarea seleccionada (acción deliberada).
  if (e.key === 'a' || e.key === 'A') {
    if (typeof EDT !== 'undefined' && EDT.selectedId != null && typeof edUOpen === 'function') {
      e.preventDefault();
      e.stopImmediatePropagation();
      edUOpen(EDT.selectedId, 'avanzar');
    }
    return;
  }

  if (e.key === 'Escape') {
    if (typeof EDT !== 'undefined' && EDT.selectedId != null && typeof edClosePanel === 'function') {
      e.preventDefault();
      e.stopImmediatePropagation();
      edClosePanel();
    }
    return;
  }
}, true);

function goEd(viewId) {
  // 'agrupadas' y 'mistareas' se fusionaron en el Tracker: agrupadas abre el
  // Tracker en modo "Por urgencia"; mistareas lo abre como lista. El mapping
  // acá mantiene vivos los deep-links y botones que aún apuntan a esas vistas.
  if (viewId === 'agrupadas') { EDT.groupBy = 'urgency'; viewId = 'tracker'; }
  else if (viewId === 'mistareas') { EDT.groupBy = 'none'; viewId = 'tracker'; }
  // Ocultar tooltip de hover preview del tracker (sino persiste al
  // navegar a otra vista porque el mouseleave nunca se disparó).
  var prev = $('edTkPreview');
  if (prev) prev.style.display = 'none';
  if (typeof _edTkPreviewTimer !== 'undefined' && _edTkPreviewTimer) {
    clearTimeout(_edTkPreviewTimer);
    _edTkPreviewTimer = null;
  }
  document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
  // Toggle sidebar items (legacy + nuevo)
  document.querySelectorAll('.ed-nav-item').forEach(function(n) {
    n.classList.toggle('active', n.dataset && n.dataset.viewid === viewId);
  });
  document.querySelectorAll('.pa-sb-item').forEach(function(n) {
    n.classList.toggle('is-active', n.dataset && n.dataset.viewid === viewId);
  });
  // Update header crumbs
  var head = $('edHead'); if (head) head.innerHTML = renderEdHead(viewId);
  // Cerrar sidebar móvil al navegar (en desktop el body class no
  // existe, así que es no-op).
  if (document.body.classList.contains('sidebar-open')) {
    document.body.classList.remove('sidebar-open');
  }
  // Limpiar el grid 'with-panel' del tracker cuando navegamos a otra vista.
  // Sino, el contenido de home/agrupadas queda apretado a la derecha
  // porque #edMain mantiene grid 1fr 440px sin la 2da columna llena.
  if (viewId !== 'tracker') {
    var em = $('edMain'); if (em) em.classList.remove('with-panel');
  }
  if (viewId === 'home') {
    var v = $('vEdHome'); if (v) v.classList.add('active');
    var role = _effectiveRole();
    if (role === 'head' && typeof rEdHomeHQ === 'function') rEdHomeHQ(D);
    else if (role === 'manager' && typeof rEdHomeManager === 'function') rEdHomeManager(D);
    else if (typeof rEdHomeSpecialist === 'function') rEdHomeSpecialist(D);
    return;
  }
  if (viewId === 'tracker') {
    var v2 = $('vEdTracker'); if (v2) v2.classList.add('active');
    if (typeof rEdTracker === 'function') rEdTracker(D);
    return;
  }
  if (viewId === 'calendar') {
    var vc = $('vEdCalendar'); if (vc) vc.classList.add('active');
    if (typeof rEdCalendar === 'function') rEdCalendar(D);
    return;
  }
  // Editorial Proyectos · Index — disponible para los 3 roles (todos
  // tienen el item "proyectos" en el sidebar).
  if (viewId === 'proyectos' && typeof rEdProyectosIndex === 'function') {
    var v4 = $('vEdProyectosIndex'); if (v4) v4.classList.add('active');
    rEdProyectosIndex(D);
    return;
  }
  // Editorial Historial — disponible para los 3 roles.
  if (viewId === 'historial' && typeof rEdHistorial === 'function') {
    var v6 = $('vEdHistorial'); if (v6) v6.classList.add('active');
    rEdHistorial(D);
    return;
  }
  if (viewId === 'miequipo' && typeof rEdMiequipo === 'function') {
    var v7 = $('vEdMiequipo'); if (v7) v7.classList.add('active');
    rEdMiequipo(D);
    return;
  }
  // Editorial Analytics — destruye instances Chart.js antes de re-render
  if (viewId === 'analytics' && typeof rEdAnalytics === 'function') {
    if (CH.pa)  { try { CH.pa.destroy();  } catch (e) {} CH.pa  = null; }
    if (CH.sa)  { try { CH.sa.destroy();  } catch (e) {} CH.sa  = null; }
    if (CH.eda) { try { CH.eda.destroy(); } catch (e) {} CH.eda = null; }
    if (CH.edb) { try { CH.edb.destroy(); } catch (e) {} CH.edb = null; }
    if (CH.edc) { try { CH.edc.destroy(); } catch (e) {} CH.edc = null; }
    if (CH.spA) { try { CH.spA.destroy(); } catch (e) {} CH.spA = null; }
    if (CH.spB) { try { CH.spB.destroy(); } catch (e) {} CH.spB = null; }
    if (CH.spC) { try { CH.spC.destroy(); } catch (e) {} CH.spC = null; }
    var v8 = $('vEdAnalytics'); if (v8) v8.classList.add('active');
    rEdAnalytics(D);
    return;
  }
  // Editorial Resumen · Por país — solo head (HQ). Si el rol efectivo
  // no es head, mostramos un mensaje claro.
  if (viewId === 'paises') {
    var roleP = _effectiveRole();
    if (roleP !== 'head') {
      var vDeny = $('vEdResumen');
      if (vDeny) {
        vDeny.classList.add('active');
        vDeny.innerHTML = ''
          + '<div class="ed-eye">Acceso restringido</div>'
          + '<h1 class="ed-h1">Solo Global <em>puede ver esta vista</em>.</h1>'
          + '<p class="ed-lede">La vista <b>Por país</b> está reservada al rol <b>Global</b>.</p>'
          + '<div style="margin-top:18px"><button class="ed-btn primary" onclick="goEd(\'home\')">Volver a inicio →</button></div>';
      }
      return;
    }
    if (typeof rEdResumen === 'function') {
      var v9 = $('vEdResumen'); if (v9) v9.classList.add('active');
      rEdResumen(D);
      return;
    }
    return;
  }
  if (viewId === 'plantillas') {
    var vP = $('vEdPlantillas'); if (vP) vP.classList.add('active');
    if (typeof rEdPlantillas === 'function') rEdPlantillas(D);
    return;
  }
  if (viewId === 'recursos') {
    var vR = $('vEdRecursos'); if (vR) vR.classList.add('active');
    if (typeof rEdRecursos === 'function') rEdRecursos(D);
    return;
  }
}

function rEdHomeSpecialist(D) {
  var v = $('vEdHome'); if (!v) return;
  var name = _effectiveUserName();
  var firstName = name ? name.split(/\s+/)[0] : 'Hola';
  var tasks = (D && D.tasks) ? D.tasks.filter(function(t){ return t.resp === name && t.status !== 'Listo'; }) : [];
  var overdue   = tasks.filter(_isOverdueTask).length;
  // Reloj pausado: las On hold tampoco cuentan en "hoy"/"esta semana" — no
  // son accionables y tienen su propio KPI (blocked).
  var dueToday  = tasks.filter(function(t){ return t.etaDays === 0 && t.status !== 'Bloqueado'; }).length;
  var thisWeek  = tasks.filter(function(t){ return typeof t.etaDays === 'number' && t.etaDays >= 0 && t.etaDays <= ED_WEEK_DAYS && t.status !== 'Bloqueado'; }).length;
  var blocked   = tasks.filter(function(t){ return t.status === 'Bloqueado'; }).length;
  var todayLine = D && D.today ? _todayHumanStr(D.today) : '';
  // "Tu próxima tarea" se elige SOLO entre accionables: una bloqueada, por
  // definición, no se puede cerrar hoy — antes el sort las ponía PRIMERAS y
  // el hero ofrecía "Trabajar en esta tarea →" sobre algo que está esperando
  // a un tercero, mientras las que vencen hoy quedaban tapadas. Las
  // bloqueadas tienen su propia línea clickeable bajo el hero.
  var top = tasks.filter(function(t){ return t.status !== 'Bloqueado'; })
    .sort(function(a, b) {
      var ad = (typeof a.etaDays === 'number') ? a.etaDays : 9999;
      var bd = (typeof b.etaDays === 'number') ? b.etaDays : 9999;
      return ad - bd;
    }).slice(0, 4);

  var html = '<div class="pa-page">';

  // Greeting con eyebrow contextual + nombre destacado en accent.
  // (Se probó un encabezado neutro "Vista de Specialist" en modo demo y el
  // feedback fue claro: el "Hola, {nombre}" se queda para todos.)
  var todayLabel = todayLine ? todayLine.split(' ').slice(0, 2).join(' ') : '';
  html += '<div class="pa-greet">'
       +    '<div class="pa-greet-eye">' + esc(todayLabel ? t('— Tu') + ' ' + todayLabel : t('Hoy')) + '</div>'
       +    '<h1>' + esc(t('Hola')) + ', <span class="pa-greet-name">' + esc(firstName) + '</span></h1>'
       +    (todayLine ? '<span class="pa-greet-meta">' + esc(todayLine) + '</span>' : '')
       + '</div>';

  // (El banner rojo de vencidas se eliminó: la misma señal ya vive en el KPI
  // "Vencidas" clickeable y en el hero "Tu próxima tarea" — tres avisos del
  // mismo dato en el primer viewport diluían la jerarquía. Economía de señal.)

  // KPIs
  html += '<div class="pa-kpis">'
       +    '<div class="pa-kpi ' + (overdue ? 'is-critical' : '') + '" onclick="edGoTrackerFiltered(\'overdue\')">'
       +      '<div class="lab"><span class="dot" style="background:var(--critical)"></span> ' + esc(t('Vencidas')) + '</div>'
       +      '<div class="val">' + overdue + '</div>'
       +      '<div class="delta">' + esc(overdue ? t('Resolver primero') : t('Al día')) + '</div>'
       +    '</div>'
       +    '<div class="pa-kpi ' + (dueToday ? 'is-warn' : '') + '" onclick="edGoTrackerFiltered(\'today\')">'
       +      '<div class="lab"><span class="dot" style="background:var(--warn)"></span> ' + esc(t('Vencen hoy')) + '</div>'
       +      '<div class="val">' + dueToday + '</div>'
       +      '<div class="delta">' + esc(dueToday ? t('Cerrar hoy') : t('Día limpio')) + '</div>'
       +    '</div>'
       +    '<div class="pa-kpi" onclick="goEd(\'agrupadas\')">'
       +      '<div class="lab"><span class="dot" style="background:var(--info)"></span> ' + esc(t('Esta semana')) + '</div>'
       +      '<div class="val">' + thisWeek + '</div>'
       +      '<div class="delta">' + esc(t('en cola')) + '</div>'
       +    '</div>'
       +    '<div class="pa-kpi ' + (blocked ? 'is-critical' : '') + '" onclick="edGoTrackerFiltered(\'blocked\')">'
       +      '<div class="lab"><span class="dot" style="background:var(--warn)"></span> ' + esc(t('On hold')) + '</div>'
       +      '<div class="val">' + blocked + '</div>'
       +      '<div class="delta">' + esc(blocked ? t('Necesitan empuje') : t('Sin bloqueos')) + '</div>'
       +    '</div>'
       + '</div>';

  // Tu próxima tarea — 1 sola card grande con la más crítica. Antes era una
  // tabla de "Top 4" pero se parecía a Por urgencia (que ya tiene 4 buckets
  // detallados). Diferenciar: Inicio = la UNA cosa más importante hoy,
  // Por urgencia = TODAS las pendientes agrupadas por bucket.
  var nextTask = top[0];
  if (!nextTask) {
    html += '<div class="pa-section-h">'
         +    '<h3>' + esc(LANG === 'pt' ? 'Tudo no controle' : 'Todo bajo control') + '</h3>'
         + '</div>';
    html += paEmpty('check', LANG === 'pt' ? 'Sem tarefas ativas em sua agenda.' : 'No tenés tareas activas en tu agenda.',
                    LANG === 'pt' ? 'Aproveite para trabalho de projeto ou ver suas fechadas.' : 'Aprovechá para trabajo de proyecto o ver tus cerradas.');
    html += '<div style="margin-top:8px;text-align:center;display:flex;gap:8px;justify-content:center">'
         +    '<button class="pa-btn pa-btn-outline" onclick="goEd(\'historial\')">' + paIcon('refresh', 12) + ' ' + esc(t('Ver mis cerradas')) + '</button>'
         +    '<button class="pa-btn pa-btn-outline" onclick="goEd(\'proyectos\')">' + paIcon('folder', 12) + ' ' + esc(t('Ver proyectos')) + '</button>'
         + '</div>';
  } else {
    var npPn = _projNameForTask(nextTask);
    var npConf = _confLevel(nextTask);
    var npMeta = (nextTask.tipoTrabajo || 'Tarea') + ' · ' + (nextTask.pais || '—') + (npPn && npPn !== 'Sin proyecto' ? ' · ' + npPn : '');
    var npEta = nextTask.eta || paEtaText(nextTask.etaDays);
    var npHeadline;
    if (nextTask.status === 'Bloqueado') {
      npHeadline = LANG === 'pt' ? 'Em on hold · precisa de desbloqueio' : 'En on hold · necesita desbloqueo';
    } else if (typeof nextTask.etaDays === 'number' && nextTask.etaDays < 0) {
      npHeadline = (LANG === 'pt' ? 'Vencida há ' : 'Vencida hace ') + Math.abs(nextTask.etaDays) + 'd · ' + (LANG === 'pt' ? 'primeira prioridade' : 'primera prioridad');
    } else if (nextTask.etaDays === 0) {
      npHeadline = LANG === 'pt' ? 'Vence hoje · feche antes do final do dia' : 'Vence hoy · cerrá antes de fin de día';
    } else if (nextTask.etaDays === 1) {
      npHeadline = LANG === 'pt' ? 'Vence amanhã' : 'Vence mañana';
    } else {
      npHeadline = (LANG === 'pt' ? 'Em ' : 'En ') + nextTask.etaDays + 'd · ' + (LANG === 'pt' ? 'sua próxima' : 'tu próxima');
    }
    html += '<div class="pa-section-h">'
         +    '<h3>' + esc(LANG === 'pt' ? 'O que precisa de mais atenção' : 'Lo que más necesita atención') + '</h3>'
         +    '<button class="link" onclick="goEd(\'agrupadas\')">' + esc(LANG === 'pt' ? 'Ver tudo por urgência →' : 'Ver todo por urgencia →') + '</button>'
         + '</div>';
    html += '<div class="pa-next-task" onclick="edGoTaskInTracker(\'' + esc(nextTask.id) + '\')">'
         +    '<div class="pa-next-task-head">'
         +      paConfDot(npConf)
         +      '<span class="mono" style="font-size:12px;color:var(--fg-3)">#' + esc(nextTask.id) + '</span>'
         +      '<span class="pa-meta-sm">' + esc(npMeta) + '</span>'
         +      '<span style="margin-left:auto">' + paPriorityPill(nextTask.priority) + paStatusPill(nextTask.status) + '</span>'
         +    '</div>'
         +    '<div class="pa-next-task-title">' + esc(nextTask.nombre || '') + '</div>'
         +    '<div class="pa-next-task-meta">'
         +      '<span class="pa-next-task-headline">' + paIcon(nextTask.status === 'Bloqueado' ? 'block' : (nextTask.etaDays != null && nextTask.etaDays < 0 ? 'alert' : 'calendar'), 14) + ' ' + esc(npHeadline) + '</span>'
         +      '<span style="margin-left:auto;display:flex;gap:8px;align-items:center">'
         +        '<span class="pa-next-task-eta mono' + (nextTask.etaDays != null && nextTask.etaDays < 0 ? ' overdue' : '') + '">' + esc(npEta) + '</span>'
         +        '<button class="pa-btn pa-btn-primary" onclick="event.stopPropagation();edGoTaskInTracker(\'' + esc(nextTask.id) + '\')">' + esc(LANG === 'pt' ? 'Trabalhar nesta tarefa →' : 'Trabajar en esta tarea →') + '</button>'
         +      '</span>'
         +    '</div>'
         + '</div>';
    if (tasks.length > 1) {
      html += '<div style="margin-top:8px;text-align:right">'
           +    '<button class="pa-btn pa-btn-ghost" style="font-size:12px" onclick="goEd(\'agrupadas\')">' + (tasks.length - 1) + ' ' + esc(LANG === 'pt' ? 'mais pendentes →' : 'pendientes más →') + '</button>'
           + '</div>';
    }
  }

  // Bloqueadas: línea aparte, clickeable → tracker filtrado por On hold.
  // Fuera del hero (no son accionables hoy) pero nunca invisibles. Si hay
  // sello de bloqueo, mostramos la más antigua — el dato que evita que se
  // pudran en silencio.
  if (blocked > 0) {
    var _maxBlk = -1;
    tasks.forEach(function(t){ if (t.status === 'Bloqueado' && typeof t.blockedDays === 'number' && t.blockedDays > _maxBlk) _maxBlk = t.blockedDays; });
    var _oldestTxt = (_maxBlk >= 0) ? ' · ' + esc(t('la más antigua hace')) + ' ' + _maxBlk + 'd' : '';
    html += '<div class="pa-card" style="margin-top:10px;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-2)" onclick="edGoTrackerFiltered(\'blocked\')">'
         +    '<span>⏸</span>'
         +    '<span>' + blocked + ' ' + esc(blocked === 1 ? t('bloqueada — revisá si ya se destrabó') : t('bloqueadas — revisá si alguna ya se destrabó')) + _oldestTxt + '</span>'
         +    '<span style="margin-left:auto;color:var(--fg-3)">→</span>'
         + '</div>';
  }

  // Sin plazo: el sistema sabe que falta el dato — decirlo (Nielsen #1).
  // Una tarea sin deadline cae al fondo de todos los órdenes y desaparece
  // del radar; esta línea la trae de vuelta. Click → tracker filtrado.
  var noDateMine = tasks.filter(function(t){ return t.etaDays == null; }).length;
  if (noDateMine > 0) {
    html += '<div class="pa-card" style="margin-top:8px;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--warn-fg)" onclick="edGoTrackerFiltered(\'nodate\')">'
         +    '<span>📅</span>'
         +    '<span>' + noDateMine + ' ' + esc(noDateMine === 1 ? t('tarea tuya no tiene plazo definido') : t('tareas tuyas no tienen plazo definido')) + '</span>'
         +    '<span style="margin-left:auto;color:var(--fg-3)">→</span>'
         + '</div>';
  }

  // Grid 2 cols: month + projects
  var me = (D && D.team || []).find(function(m){ return m.name === name; }) || {};
  var streak = (typeof me.streak === 'number' && me.streak > 0) ? me.streak : 0;
  // Cerradas este mes: el backend expone 'cerrado' en formato dd/MM/yyyy
  // (no 'cerradaIso' — ese campo nunca existió). Parsear manualmente.
  var closedThisMonth = ((D && D.historial) || []).filter(function(t){
    if (t.resp !== name || !t.cerrado) return false;
    var parts = String(t.cerrado).split('/');
    if (parts.length !== 3) return false;
    var month = parseInt(parts[1], 10) - 1;
    var year  = parseInt(parts[2], 10);
    var now = new Date();
    return month === now.getMonth() && year === now.getFullYear();
  }).length;

  var projs = (D && D.projects) ? D.projects.filter(function(p){
    if (p.lider === name || p.responsable === name) return true;
    if ((p.participantes || []).indexOf(name) >= 0) return true;
    return (D.tasks || []).some(function(t){ return t.proyectoId == p.id && t.resp === name; });
  }) : [];

  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px;">';

  // Month card
  html += '<div class="pa-card">'
       +    '<div class="pa-card-h">'
       +      '<h3>' + esc(t('Tu mes hasta ahora')) + '</h3>'
       +      '<span class="meta">' + esc((D && D.today) ? _todayHumanStr(D.today) : '') + '</span>'
       +    '</div>'
       +    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">'
       +      '<div>'
       +        '<div class="pa-meta-sm">' + esc(t('Cierres en tiempo seguidos')) + '</div>'
       +        '<div class="mono" style="font-size:26px;font-weight:600;letter-spacing:-0.02em">' + (streak ? '🔥 ' + streak : '0') + '</div>'
       +        (streak ? '' : '<div style="font-size:11px;color:var(--fg-3);margin-top:2px;line-height:1.4">' + esc(t('Cerrá una tarea dentro del plazo para arrancar tu racha')) + '</div>')
       +      '</div>'
       +      '<div>'
       +        '<div class="pa-meta-sm">' + esc(t('Cerradas este mes')) + '</div>'
       +        '<div class="mono" style="font-size:26px;font-weight:600;letter-spacing:-0.02em">' + closedThisMonth + '</div>'
       +      '</div>'
       +    '</div>';
  // Cierre promedio por prioridad
  if ((me.avgAlta && me.avgAlta !== '—') || (me.avgMedia && me.avgMedia !== '—') || (me.avgBaja && me.avgBaja !== '—')) {
    html += '<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line-1)">'
         +    '<div style="font-size:11px;color:var(--fg-3);margin-bottom:10px">' + esc(t('Cierre promedio por prioridad')) + '</div>';
    var rows = [
      { l: t('Alta'), v: me.avgAlta || '—', color: 'var(--critical)' },
      { l: t('Media'), v: me.avgMedia || '—', color: 'var(--warn)' },
      { l: t('Baja'), v: me.avgBaja || '—', color: 'var(--good)' }
    ];
    rows.forEach(function(r) {
      // Antes había una barra decorativa con width:60% fijo (no representaba el
      // dato → engañosa en un scorecard). La reemplazamos por un punto de color
      // por prioridad + el valor real. El "—" pelado lleva tooltip que explica
      // la ausencia (sin cierres de esa prioridad este mes).
      var noData = !r.v || r.v === '—';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;">'
           +    '<span style="font-size:12px;color:var(--fg-2);display:flex;align-items:center;gap:7px"><span style="width:8px;height:8px;border-radius:50%;background:' + r.color + ';display:inline-block;flex:0 0 auto"></span>' + r.l + '</span>'
           +    '<span class="mono" style="font-size:12px;color:var(--fg-1);font-weight:600"' + (noData ? ' title="' + esc(t('Sin cierres de esta prioridad este mes')) + '"' : '') + '>' + esc(r.v) + '</span>'
           + '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  // Projects card
  html += '<div class="pa-card">'
       +    '<div class="pa-card-h">'
       +      '<h3>' + esc(t('Proyectos en los que estás')) + '</h3>'
       +      '<span class="meta">' + projs.length + ' ' + esc(t('activos')) + '</span>'
       +    '</div>';
  if (projs.length === 0) {
    html += '<div style="padding:8px 0">' + paEmpty('folder', t('No formás parte de ningún proyecto activo.'), t('Cuando alguien te asigne tareas dentro de un proyecto, aparecerán acá.')) + '</div>';
  } else {
    var palette = ['#5b8def', '#8a7ff0', '#d0a86b', '#3fa888', '#e07a7a'];
    projs.slice(0, 5).forEach(function(p, i) {
      var done = ((D && D.historial) || []).filter(function(t){ return t.proyectoId == p.id; }).length;
      var openP = ((D && D.tasks) || []).filter(function(t){ return t.proyectoId == p.id && t.status !== 'Listo'; }).length;
      var totalP = done + openP;
      var pct = totalP > 0 ? Math.round((done / totalP) * 100) : 0;
      var color = palette[i % palette.length];
      html += '<div style="display:grid;grid-template-columns:3px 1fr auto;gap:12px;padding:12px 0;border-top:' + (i ? '1px solid var(--line-1)' : '0') + ';align-items:center">'
           +    '<span style="width:3px;height:24px;background:' + color + ';border-radius:2px"></span>'

// Riesgo de una persona — fuente única usada por el Home del manager (ranking
// top-3) y por Mi equipo (conteo). score pondera vencidas(×3), bloqueadas(×2) y
// sobrecapacidad(>100%, ×2). atRisk = score>0 (tiene vencidas, bloqueadas, o
// está sobre el 100% de su capacidad).
function _memberRisk(m) {
  var cap = (m && m.capacity) || 0;
  var load = (m && m.load) || 0;
  var overdue = (m && m.overdue) || 0;
  var blocked = (m && m.blocked) || 0;
  var ratio = cap > 0 ? (load / cap) : 0;
  var score = overdue * 3 + blocked * 2 + Math.max(0, ratio - 1) * 2;
  return { score: score, overdue: overdue, blocked: blocked, overloadPct: Math.round(ratio * 100), atRisk: score > 0 };
}

function rEdHomeHQ(D) {

  var countries = (D && D.countries) || [];
  var latam = (D && D.latam) || {};
  var totalOpen     = latam.totalOpen != null     ? latam.totalOpen     : countries.reduce(function(a,c){ return a + (c.open||0); }, 0);

  var dueToday      = latam.totalDueToday != null ? latam.totalDueToday : countries.reduce(function(a,c){ return a + (c.dueToday||0); }, 0);

  var closedThis    = latam.closedThisWeek || 0;
  var closedPrev    = latam.closedLastWeek || 0;

  var atRiskCount   = countries.filter(function(c){ return (c.overdue || 0) > 3 || (c.slaPct != null && c.slaPct < 85); }).length;
  // Specialists ahora vienen del backend por país (sum de members del sheet Equipos).

  }
  // Líderes DISTINTOS por nombre: la misma persona puede liderar varios países

  var _seenMgr = {};
  countries.forEach(function(c) {

  var totalMgr = Object.keys(_seenMgr).length
              || (D && D.team || []).filter(function(m){ return (m.role || '').toLowerCase().indexOf('manager') !== -1; }).length;
  // Países con actividad (tareas abiertas) vs configurados, para no inflar "N activos".

  // completo con los inactivos vive en la página "Por país".
  var activeCountryList = countries.filter(function(c){ return (c.open || 0) > 0; })
    .sort(function(a, b){ return (b.open || 0) - (a.open || 0); });
  var activeCountries = activeCountryList.length;
  var inactiveCountries = countries.length - activeCountries;
  var todayLine = D && D.today ? _todayHumanStr(D.today) : '';
  // Mayor caída de SLA esta semana (para insight contextual).
  var biggestDrop = null;
  countries.forEach(function(c) {
    if (typeof c.slaPctThisWeek === 'number' && typeof c.slaPctLastWeek === 'number') {
      var d = c.slaPctThisWeek - c.slaPctLastWeek;
      if (d < -3 && (!biggestDrop || d < biggestDrop.delta)) biggestDrop = { c: c, delta: d };
    }
  });
  // País con más vencidas concentradas (para el delta line del KPI).
  var maxOverdueC = null;
  countries.forEach(function(c) {
    if (!maxOverdueC || (c.overdue || 0) > (maxOverdueC.overdue || 0)) maxOverdueC = c;
  });

  var html = '<div class="pa-page">';

       +    '<div class="pa-greet-eye">— ' + esc(todayLine || t('Hoy')) + ' · ' + countries.length + ' ' + esc(t('países')) + (activeCountries < countries.length ? ' · ' + activeCountries + ' ' + esc(activeCountries === 1 ? t('activo') : t('activos')) : '') + ' · ' + (totalSpec || (D && D.team || []).length) + ' specialists · ' + totalMgr + ' managers</div>'
       +    '<h1>' + esc(t('Operaciones')) + ' <span class="pa-greet-name">' + esc(t('legales globales')) + '</span></h1>'
       + '</div>';

  if (totalOpen > 0) {

    if (typeof slaDelta === 'number' && Math.abs(slaDelta) >= 1) {
      slaInsight = '. ' + (slaDelta < 0 ? t('Bajó') : t('Subió')) + ' ' + Math.abs(Math.round(slaDelta)) + 'pt ' + t('vs la semana anterior');
    } else if (biggestDrop) {
      slaInsight = '. ' + esc(biggestDrop.c.code) + ' ' + t('cayó') + ' ' + Math.abs(Math.round(biggestDrop.delta)) + 'pt ' + t('esta semana');
    }
    html += '<div class="pa-narrative">'
         +    t('LATAM está corriendo') + ' <b>' + totalOpen + ' ' + t('tareas activas') + '</b>'
         +    (slaAvg != null ? ' ' + t('con SLA agregado del') + ' <b style="color:var(--' + (slaAvg >= 90 ? 'good' : 'warn') + '-fg)">' + slaAvg + '%</b>' : '')
         +    slaInsight
         +    '.'
         + '</div>';
  }

  // Helper para deltas con triangulito (▲ peor / ▼ mejor para vencidas y vencen-hoy;
  // ▲ mejor / ▼ peor para SLA y cerradas).
  function _deltaLine(value, opts) {
    if (value == null || value === 0) return opts.zero || '';
    var positive = value > 0;
    var upIsGood = !!opts.upIsGood;
    var goodOrBad = (positive === upIsGood) ? 'up' : 'down';
    var arrow = positive ? '▲' : '▼';

       +    '<div class="pa-kpi" onclick="goEd(\'tracker\')">'
       +      '<div class="lab"><span class="dot" style="background:var(--info)"></span> ' + esc(t('Activas LATAM')) + '</div>'
       +      '<div class="val">' + totalOpen + '</div>'

  // Requieren tu atención (cross-LATAM) — el "qué me necesita" antes del "dónde"

  var riskyHq = (D && D.projects || [])
    // En pausa = reloj pausado (mismo criterio que tareas On hold): un proyecto

    .filter(function(p){ return p.status !== 'Completado' && p.status !== 'Cancelado' && p.status !== 'En pausa'; })

      var ovc = pTasks.filter(function(tk){ return (typeof taskOverdueBySLA === 'function') ? taskOverdueBySLA(tk) : false; }).length;
      var totalP = pTasks.length;
      return { p: p, overdue: ovc, total: totalP, pct: totalP > 0 ? (ovc / totalP) : 0 };
    })

  if (riskyHq.length) {

      html += '<div class="pa-tbl-r" style="grid-template-columns: 1fr 130px 80px 110px" onclick="edSetCountryFilter(\'' + esc(rPais) + '\');goEd(\'tracker\')">'

  // Activity feed

var EDT = { filter: 'all', search: '', selectedId: null, country: null, selectedIds: [], skipCountriesView: false, groupBy: 'none', clienteFilter: null };

function _etaTextFromDays(d) {
  // Wrapper para no duplicar lógica con paEtaText. Antes retornaba strings
  // distintos ("venció hace 1d" / "Vencida hace 1d") en mismo concepto.
  if (typeof d !== 'number') return '';
  return paEtaText(d);
}

// Corte de ROL puro (sin el drill-down de país del head): qué tareas le
// pertenecen al scope del rol efectivo. Única fuente para la vista del
// tracker (vía _edFilterByRole) y para los badges del sidebar — la regla de
// producto es "el badge muestra el mismo número que la vista al abrirla".
function _edRoleScopeTasks(tasks, role, userName, userCode) {
  if (role === 'specialist') return tasks.filter(function(t){ return t.resp === userName || _isSharedWithMe(t); });
  if (role === 'manager')    return tasks.filter(function(t){ return (t.pais || '') === userCode || _isSharedWithMe(t); });
  return tasks;
}

function _edFilterByRole(tasks, role, userName, userCode) {
  // Specialist: solo sus tareas. Manager: su país. Head: todo.
  // Las tareas compartidas conmigo (soy colaborador, no responsable) pasan el
  // corte aunque no cumplan la regla de rol: el backend ya decidió mandarlas
  // en D.tasks; sin esto el chip/filtro "Compartidas" quedaba siempre vacío.
  var visible = _edRoleScopeTasks(tasks, role, userName, userCode);
  // Drill por país (EDT.country) — herramienta de HEAD, que ve todos los países
  // y elige cuál mirar. Para manager/specialist el scope ya está acotado por rol
  // (país propio / tareas propias por nombre), así que un EDT.country HEREDADO
  // —p. ej. el head drilleó "COMP" y después pasó a "Ver app como… specialist"—
  // sólo puede ESCONDER tareas propias, nunca ampliar, y esos roles ni siquiera
  // tienen el selector de país para limpiarlo (era head-only): tracker en cero
  // sin salida. Por eso el drill aplica únicamente cuando el rol es head.
  if (EDT.country && role === 'head') {
    visible = visible.filter(function(t){ return (t.pais || '') === EDT.country; });
  }
  return visible;
}

// Helpers para setear/limpiar el filtro de país desde HQ home / resumen.
function edSetCountryFilter(code) {
  // __ALL__ es un sentinel del HQ countries-first view: significa
  // "saltea el grid de países y mostrá todo junto". Lo guardamos como
  // null pero seteamos skipCountriesView para que rEdTracker no
  // vuelva al countries-first hasta el próximo edClearCountryFilter.
  if (code === '__ALL__') {
    EDT.country = null;
    EDT.skipCountriesView = true;
  } else {
    EDT.country = code || null;
    EDT.skipCountriesView = false;
  }
  EDT.selectedId = null;
  _edPersistEDT();
  if (D) rEdTracker(D);
}
function edClearCountryFilter() {
  EDT.country = null;
  EDT.selectedId = null;
  EDT.skipCountriesView = false; // volver al countries-first si es head
  _edPersistEDT();
  if (D) rEdTracker(D);
}

function _edApplyFilter(tasks, filter) {
  if (filter === 'overdue') return tasks.filter(_isOverdueTask);
  if (filter === 'today')   return tasks.filter(function(t){ return t.etaDays === 0 && t.status !== 'Listo' && t.status !== 'Bloqueado'; });
  if (filter === 'blocked') return tasks.filter(function(t){ return t.status === 'Bloqueado'; });
  if (filter === 'alta')    return tasks.filter(function(t){ return t.priority === 'Alta' && t.status !== 'Listo'; });
  if (filter === 'mine')    return tasks.filter(function(t){ return t.resp === _effectiveUserName() && t.status !== 'Listo'; });
  // 'shared': tareas donde soy colaborador (ver/editar) y NO el responsable.
  // El backend ya las incluye en D.tasks; acá solo aislamos esa porción.
  if (filter === 'shared')  return tasks.filter(function(t){ return _isSharedWithMe(t) && t.status !== 'Listo'; });
  // 'nodate': activas sin deadline (etaDays null) — el chip solo aparece
  // cuando existen; el link del home también llega acá.
  if (filter === 'nodate')  return tasks.filter(function(t){ return t.etaDays == null && t.status !== 'Listo'; });
  // 'closed': la fuente ya es el historial completo (rEdTracker cambia de
  // D.tasks a roleHist). No re-filtrar por status: una Cancelada también vive
  // en Historial y el chip "Cerradas" cuenta roleHist.length — deben coincidir.
  if (filter === 'closed')  return tasks;
  return tasks.filter(function(t){ return t.status !== 'Listo'; });
}

// Filtros secundarios del tracker. Se aplican en cascada después del
// status filter principal. Cualquier conjunto activos se persiste en
// localStorage para sobrevivir reloads.
function _edApplySecondaryFilters(tasks) {
  if (EDT.projectFilter) {
    tasks = tasks.filter(function(t){ return String(t.proyectoId || '') === String(EDT.projectFilter); });
  }
  if (EDT.respFilter) {
    var rf = String(EDT.respFilter).toLowerCase();
    tasks = tasks.filter(function(t){ return (t.resp || '').toLowerCase() === rf; });
  }
  if (EDT.confFilter) {
    tasks = tasks.filter(function(t){ return _confLevel(t) === EDT.confFilter; });
  }
  if (EDT.clienteFilter) {
    var cf = EDT.clienteFilter;
    tasks = tasks.filter(function(t){ return (t.areaSolicitante || '') === cf; });
  }
  return tasks;
}
function edSetProjectFilter(id) {
  EDT.projectFilter = id || null;
  EDT.selectedId = null;
  _edPersistEDT();
  if (D) rEdTracker(D);
}
function edSetRespFilter(name) {
  EDT.respFilter = name || null;
  EDT.selectedId = null;
  _edPersistEDT();
  if (D) rEdTracker(D);
}
function edSetConfFilter(level) {
  EDT.confFilter = level || null;
  EDT.selectedId = null;
  _edPersistEDT();
  if (D) rEdTracker(D);
}
function edSetClienteFilter(name) {
  EDT.clienteFilter = name || null;
  EDT.selectedId = null;
  _edPersistEDT();
  if (D) rEdTracker(D);
}
function edClearSecondaryFilters() {
  EDT.projectFilter = null;
  EDT.respFilter = null;
  EDT.confFilter = null;
  EDT.clienteFilter = null;
  _edPersistEDT();
  if (D) rEdTracker(D);
}

function _edApplySearch(tasks, q) {
  if (!q) return tasks;
  var s = q.toLowerCase();
  return tasks.filter(function(t) {
    return ((t.id || '') + '').toLowerCase().indexOf(s) >= 0
        || ((t.nombre || '') + '').toLowerCase().indexOf(s) >= 0
        || ((t.resp || '') + '').toLowerCase().indexOf(s) >= 0
        || ((t.proyecto || '') + '').toLowerCase().indexOf(s) >= 0
        || ((t.tipoTrabajo || '') + '').toLowerCase().indexOf(s) >= 0;
  });
}

function _edSortByUrgency(tasks) {
  return tasks.slice().sort(function(a, b) {
    // On hold al FINAL: el reloj está pausado y no son accionables hoy — iban
    // primeras y tapaban lo que vence. Su atención la canaliza el chip On hold,
    // la línea ⏸ del home y el "hace Nd" de la fila. Entre bloqueadas, la más
    // antigua arriba (la que más urge destrabar).
    var aBlk = a.status === 'Bloqueado' ? 1 : 0;
    var bBlk = b.status === 'Bloqueado' ? 1 : 0;
    if (aBlk !== bBlk) return aBlk - bBlk;
    if (aBlk === 1) {
      return ((typeof b.blockedDays === 'number') ? b.blockedDays : -1)
           - ((typeof a.blockedDays === 'number') ? a.blockedDays : -1);
    }
    var ad = (typeof a.etaDays === 'number') ? a.etaDays : 9999;
    var bd = (typeof b.etaDays === 'number') ? b.etaDays : 9999;
    return ad - bd;
  });
}

// Persistir filtros del tracker en localStorage para que sobrevivan
// al reload de la página o reentry desde otra vista.
function _edPersistEDT() {
  try {
    localStorage.setItem('lt-edt-state', JSON.stringify({
      filter: EDT.filter,
      country: EDT.country,
      search: EDT.search,
      skipCountriesView: EDT.skipCountriesView,
      projectFilter: EDT.projectFilter,
      respFilter: EDT.respFilter,
      confFilter: EDT.confFilter,
      clienteFilter: EDT.clienteFilter
    }));
  } catch(e) {}
}
function _edRestoreEDT() {
  try {
    var raw = localStorage.getItem('lt-edt-state');
    if (!raw) return;
    var s = JSON.parse(raw);
    if (s) {
      if (s.filter) EDT.filter = s.filter;
      if (s.country) EDT.country = s.country;
      if (s.search) EDT.search = s.search;
      if (typeof s.skipCountriesView === 'boolean') EDT.skipCountriesView = s.skipCountriesView;
      if (s.projectFilter) EDT.projectFilter = s.projectFilter;
      if (s.respFilter) EDT.respFilter = s.respFilter;
      if (s.confFilter) EDT.confFilter = s.confFilter;
      if (s.clienteFilter) EDT.clienteFilter = s.clienteFilter;
    }
  } catch(e) {}
}
// Restaurar al cargar el JS (D aún no existe pero EDT sí).
_edRestoreEDT();

// EDT actions wired desde la toolbar / filas del tracker
function edSetFilter(f) { EDT.filter = f; _edPersistEDT(); if (D) rEdTracker(D); }
function edSetSearch(q) {
  // Debounce 250ms: el re-render destruye el input y se pierde el foco.
  // Tras re-renderear restauramos foco + caret al final del valor.
  EDT.search = q || '';
  _edPersistEDT();
  clearTimeout(window._tkSearchT);
  window._tkSearchT = setTimeout(function(){
    if (D) rEdTracker(D);
    var newInput = document.querySelector('#vEdTracker .pa-search input');
    if (newInput) {
      newInput.focus();
      try { newInput.setSelectionRange(EDT.search.length, EDT.search.length); } catch(e){}
    }
  }, 250);
}
function edSelectTask(id) {
  EDT.selectedId = (EDT.selectedId === id) ? null : id;
  EDT.notesRawMode = false; // cada tarea arranca en modo checklist (si tiene)
  if (D) rEdTracker(D);
}
function edClosePanel() {
  // Recordamos qué tarea estaba abierta para scrollear y resaltarla
  // brevemente al volver a la tabla (continuidad visual).
  EDT.lastViewedId = EDT.selectedId;
  EDT.selectedId = null;
  if (D) rEdTracker(D);
}

// Devuelve la próxima tarea urgente del tracker según los filtros
// activos del usuario actual. Usado por edUSubmit tras cerrar una
// tarea para auto-seleccionar la siguiente en la lista.
function _edNextUrgent() {
  if (!D || !D.tasks || typeof _edFilterByRole !== 'function') return null;
  var role = _effectiveRole();
  var userName = _effectiveUserName();
  var userCode = _effectiveUserCode();
  var roleTasks = _edFilterByRole(D.tasks, role, userName, userCode);
  var filtered = (typeof _edApplyFilter === 'function') ? _edApplyFilter(roleTasks, EDT.filter) : roleTasks;
  filtered = (typeof _edApplySearch === 'function') ? _edApplySearch(filtered, EDT.search) : filtered;
  // No auto-ofrecer una bloqueada como "siguiente": no se puede trabajar en
  // ella (salvo que el usuario esté justamente filtrando por bloqueadas).
  if (EDT.filter !== 'blocked') {
    filtered = filtered.filter(function(t){ return t.status !== 'Bloqueado'; });
  }
  var sorted = (typeof _edSortByUrgency === 'function') ? _edSortByUrgency(filtered) : filtered;
  return sorted[0] || null;
}

// ─── BULK ACTIONS DEL TRACKER ───────────────────────────────────
// EDT.selectedIds = Array<string> de task ids seleccionadas vía checkbox.
// La barra de acciones (.pa-bulkbar) se renderiza inline desde rEdTracker
// cuando hay >0 seleccionadas; permite Avanzar / Bloquear / Reasignar.
// El toggle por fila lo maneja edTkToggleSelectId (definida cerca del render).
function edTkSelectAll(checked) {
  var rows = document.querySelectorAll('#vEdTracker .pa-tbl-r[data-task-id]');
  var ids = Array.prototype.map.call(rows, function(r){ return String(r.dataset.taskId); });
  EDT.selectedIds = checked ? ids : [];
  // Re-render completo: los checkboxes son spans (.pa-check), no inputs;
  // el render reflee el estado is-checked desde EDT.selectedIds.
  if (D && typeof rEdTracker === 'function') rEdTracker(D);
}
function edTkBulkClear() {
  EDT.selectedIds = [];
  if (D && typeof rEdTracker === 'function') rEdTracker(D);
}
// Master checkbox del header de la tabla: toggle all / none según estado actual.
// Cuando hay alguno seleccionado pero no todos, click selecciona todos.
function edTkMasterToggle() {
  var rows = document.querySelectorAll('#vEdTracker .pa-tbl-r[data-task-id]');
  var total = rows.length;
  var selected = (EDT.selectedIds || []).length;
  edTkSelectAll(selected < total);
}
function edTkBulkAction(action) {
  var ids = (EDT.selectedIds || []).slice();
  if (!ids.length) return;
  var n = ids.length;
  var label = n + (n === 1 ? ' tarea' : ' tareas');
  if (action === 'reasignar') {
    edTkBulkReasignOpen(ids);
    return;
  }
  if (action === 'bloquear') {
    var labelI18n = n + ' ' + (n === 1 ? t('tarea') : t('tareas'));
    confirm_(t('¿Poner') + ' ' + labelI18n + ' ' + t('en') + ' <b>on hold</b>? ' + t('Quedarán pausadas hasta que las desbloquees.'), function() {
      _edTkBulkRun(ids, 'status', 'Bloqueado', t('En on hold'));
    });
    return;
  }
  if (action === 'avanzar') {
    // Cada tarea avanza según su status actual. Pendiente → En curso,
    // En curso → En revisión, En revisión → Listo. Los que ya están
    // en Listo o Bloqueado se ignoran. Las que cerrarían (next='Listo')
    // requieren resumen — abrimos un mini-wizard que aplica un único
    // resumen a todas las cerrables. Si hay mix (avanzan + cierran),
    // primero corremos las que avanzan y luego abrimos el wizard
    // de cierre con las cerrables seleccionadas.
    var nextOf = { 'Pendiente': 'En curso', 'En curso': 'En revisión', 'En revisión': 'Listo' };
    var toRun = [];
    var toClose = [];
    ids.forEach(function(id) {
      var task = (D.tasks || []).find(function(t){ return t.id == id; });
      if (!task) return;
      var next = nextOf[task.status];
      if (!next) return;
      if (next === 'Listo') toClose.push(id);
      else toRun.push({ id: id, value: next });
    });
    if (!toRun.length && !toClose.length) { toast(t('Ninguna de las seleccionadas puede avanzar.'), 'info'); return; }
    // Solo cerrables → bulk-close wizard directo.
    if (!toRun.length && toClose.length) {
      edBulkCloseOpen(toClose);
      return;
    }
    var runLbl = toRun.length + ' ' + (toRun.length === 1 ? t('tarea') : t('tareas'));
    // Solo avanzables (sin cierres) → flujo original.
    if (toRun.length && !toClose.length) {
      confirm_(t('¿Avanzar') + ' ' + runLbl + ' ' + t('al siguiente estado?'), function() {
        _edTkBulkRunMixed(toRun, 'status', t('Avanzadas'));
      });
      return;
    }
    // Mix: avanzar primero, después abrir el wizard de cierre.
    confirm_(t('De las') + ' ' + ids.length + ' ' + t('seleccionadas:') + ' <b>' + toRun.length + '</b> ' + t('avanzan al siguiente estado y') + ' <b>' + toClose.length + '</b> ' + t('se cerrarían. Vamos en dos pasos — primero avanzamos, luego pedimos un resumen para cerrar.'), function() {
      _edTkBulkRunMixedThen(toRun, 'status', t('Avanzadas'), function() {
        edBulkCloseOpen(toClose);
      });
    }, { confirmLabel: t('Continuar') });
    return;
  }
}

// ─── BULK CLOSE WIZARD ────────────────────────────────────────────
// Mini-modal para cerrar varias tareas con un único resumen aplicado
// a todas. Reusa el styling de cr-overlay/cr-modal. Política: el
// resumen es obligatorio (igual que el cierre individual del panel).
var _EDT_BULK_CLOSE = { ids: [], running: false };

function edBulkCloseOpen(ids) {
  if (!ids || !ids.length) return;
  _EDT_BULK_CLOSE.ids = ids.slice();
  _EDT_BULK_CLOSE.running = false;
  _edBulkCloseRender();
}

function _edBulkCloseRender() {
  var host = $('crHost'); if (!host) return;
  var ids = _EDT_BULK_CLOSE.ids;
  var n = ids.length;
  // Sample de hasta 4 tareas para mostrar título y responsable.
  var sample = [];
  for (var i = 0; i < ids.length && i < 4; i++) {
    var task = (D.tasks || []).find(function(x){ return String(x.id) === String(ids[i]); });
    if (task) sample.push(task);
  }
  var sampleHtml = sample.map(function(tk) {
    return '<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2);padding:3px 0">'
         +   '<span class="pa-mono-sm">' + esc(tk.id) + '</span>'
         +   '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(tk.nombre || '') + '</span>'
         +   '<span style="font-size:11px;color:var(--fg-3);display:flex;align-items:center;gap:4px">' + paAvatar(tk.resp || '?', 14) + ' ' + esc((tk.resp || '').split(' ')[0]) + '</span>'
         + '</div>';
  }).join('');
  if (n > sample.length) {
    sampleHtml += '<div style="font-size:11px;color:var(--fg-3);padding:4px 0">+ ' + (n - sample.length) + ' ' + (n - sample.length === 1 ? t('tarea más') : t('tareas más')) + '</div>';
  }
  var nLbl = n + ' ' + (n === 1 ? t('tarea') : t('tareas'));
  host.innerHTML = ''
    + '<div class="cr-overlay" onclick="if(event.target===this)edBulkCloseClose()">'
    +   '<div class="cr-backdrop" onclick="edBulkCloseClose()"></div>'
    +   '<div class="cr-modal" role="dialog" aria-modal="true" aria-label="' + esc(t('Cerrar tareas')) + '" style="max-width:580px">'
    +     '<div class="cr-head">'
    +       '<div style="width:32px;height:32px;border-radius:8px;background:var(--good-soft, var(--accent-soft));color:var(--good-fg, var(--accent));display:grid;place-items:center;flex-shrink:0">'
    +         '<span style="font-weight:600;font-size:14px">✓</span>'
    +       '</div>'
    +       '<div style="flex:1">'
    +         '<div class="cr-title">' + esc(t('Cerrar')) + ' ' + esc(nLbl) + ' ' + esc(t('como')) + ' <span style="color:var(--good-fg)">' + esc(t('Listo')) + '</span></div>'
    +         '<div style="font-size:12px;color:var(--fg-3);margin-top:2px">' + esc(t('El resumen se guarda como nota de cierre en cada una.')) + '</div>'
    +       '</div>'
    +       '<button type="button" class="cr-x" onclick="edBulkCloseClose()" aria-label="' + esc(t('Cerrar')) + '">×</button>'
    +     '</div>'
    +     '<div class="cr-body">'
    +       '<div style="padding:10px 12px;background:var(--bg-2);border-radius:6px;margin-bottom:14px">'
    +         '<div style="font-size:11px;color:var(--fg-3);margin-bottom:4px">' + esc(t('Vas a cerrar')) + '</div>'
    +         sampleHtml
    +       '</div>'
    +       '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px">'
    +         '<label for="bulkCloseResumen" style="font-size:12px;color:var(--fg-2);font-weight:500">' + esc(t('Resumen de cierre')) + ' <span class="req">*</span></label>'
    +         '<span class="pa-meta-sm">' + esc(t('Se aplica a las')) + ' ' + n + '</span>'
    +       '</div>'
    +       '<textarea id="bulkCloseResumen" class="cr-input" rows="4" style="resize:vertical;min-height:90px" placeholder="' + esc(t('Resumen rápido de cómo se cerraron (lo verán en el historial).')) + '"></textarea>'
    +     '</div>'
    +     '<div class="cr-foot">'
    +       '<div class="cr-foot-info"><b>' + esc(t('Al cerrar')) + ':</b> ' + esc(t('las tareas se mueven al historial · libera')) + ' ' + n + ' ' + (n === 1 ? esc(t('slot de carga.')) : esc(t('slots de carga.'))) + '</div>'
    +       '<button type="button" class="pa-btn pa-btn-outline" onclick="edBulkCloseClose()">' + esc(t('Cancelar')) + '</button>'
    +       '<button type="button" class="pa-btn pa-btn-primary" onclick="edBulkCloseConfirm()">' + paIcon('check', 12) + ' ' + esc(t('Cerrar')) + ' ' + esc(nLbl) + '</button>'
    +     '</div>'
    +   '</div>'
    + '</div>';
  setTimeout(function(){ var ta = $('bulkCloseResumen'); if (ta) ta.focus(); }, 30);
}

function edBulkCloseClose() {
  if (_EDT_BULK_CLOSE.running) return; // no cerrar mientras corre el bulk
  var host = $('crHost'); if (host) host.innerHTML = '';
  _EDT_BULK_CLOSE.ids = [];
}

function edBulkCloseConfirm() {
  var ta = $('bulkCloseResumen');
  var resumen = ta ? String(ta.value || '').trim() : '';
  if (!resumen) {
    toast(t('Falta el resumen para cerrar.'), 'error');
    if (ta) ta.focus();
    return;
  }
  if (resumen.length < 5) {
    toast(t('Contanos un poco más (mín. 5 caracteres).'), 'error');
    if (ta) ta.focus();
    return;
  }
  var ids = (_EDT_BULK_CLOSE.ids || []).slice();
  if (!ids.length) { edBulkCloseClose(); return; }
  _EDT_BULK_CLOSE.running = true;
  var btn = document.querySelector('.cr-foot .pa-btn-primary');
  if (btn) { btn.disabled = true; btn.style.opacity = '0.6'; btn.textContent = t('Cerrando…'); }
  _edTkBulkClose(ids, resumen);
}

function _edTkBulkClose(ids, resumen) {
  var ok = 0, fail = 0, pending = ids.length;
  var nLbl = pending + ' ' + (pending === 1 ? t('tarea') : t('tareas'));
  toast(t('Cerrando') + ' ' + nLbl + '…', 'info');
  ids.forEach(function(id) {
    // notas por tarea: antepone el cierre PRESERVANDO el checklist previo
    // (antes un único fields pisaba las notas de todas las tareas).
    var tk = (D.tasks || []).find(function(x){ return String(x.id) === String(id); });
    var fields = { status: 'Listo', notas: 'CIERRE: ' + resumen + (tk && tk.notas ? '\n\n' + tk.notas : '') };
    google.script.run
      .withSuccessHandler(function(res){ (res && res.success) ? ok++ : fail++; if (--pending === 0) _edBulkCloseDone(ok, fail); })
      .withFailureHandler(function(){ fail++; if (--pending === 0) _edBulkCloseDone(ok, fail); })
      .updateTaskFields(id, fields);
  });
}

function _edBulkCloseDone(ok, fail) {
  _EDT_BULK_CLOSE.running = false;
  var host = $('crHost'); if (host) host.innerHTML = '';
  _EDT_BULK_CLOSE.ids = [];
  if (fail === 0) toast('✅ ' + t('Cerradas:') + ' ' + ok, 'success');
  else if (ok === 0) toast(t('Error: no se pudo cerrar ninguna'), 'error');
  else toast('⚠ ' + t('Cerradas:') + ' ' + ok + ' OK, ' + fail + ' ' + t('fallaron'), 'info');
  EDT.selectedIds = [];
  if (typeof reload === 'function') reload();
}

// Variante de _edTkBulkRunMixed que ejecuta una callback al terminar
// (en lugar del reload por defecto). Lo usa el flujo mix de avanzar:
// terminar de avanzar y luego abrir el wizard de cierre.
function _edTkBulkRunMixedThen(items, field, label, onDone) {
  if (!items.length) { if (typeof onDone === 'function') onDone(); return; }
  var ok = 0, fail = 0, pending = items.length;
  var nLbl = pending + ' ' + (pending === 1 ? t('tarea') : t('tareas'));
  toast(t('Aplicando a') + ' ' + nLbl + '…', 'info');
  items.forEach(function(it) {
    google.script.run
      .withSuccessHandler(function(res){ (res && res.success) ? ok++ : fail++; if (--pending === 0) _edBulkMixedThenDone(label, ok, fail, onDone); })
      .withFailureHandler(function(){ fail++; if (--pending === 0) _edBulkMixedThenDone(label, ok, fail, onDone); })
      .updateTaskField(it.id, field, it.value);
  });
}
function _edBulkMixedThenDone(label, ok, fail, onDone) {
  if (fail === 0) toast('✅ ' + label + ': ' + ok, 'success');
  else if (ok === 0) toast(t('Error en el paso 1: no se pudo avanzar ninguna'), 'error');
  else toast('⚠ ' + label + ': ' + ok + ' OK, ' + fail + ' ' + t('fallaron'), 'info');
  if (typeof onDone === 'function') onDone();
}
// Modal de bulk-reassign: picker visual en vez de window.prompt.
// Muestra los candidates según rol: head ve todos, manager solo su país.
// Reuse cr-overlay/cr-modal styling.
var _EDT_BULK_REASSIGN_SELECTED = '';
var _EDT_BULK_REASSIGN_RUNNING = false;

function _edTkBulkReasignPickPerson(name) {
  _EDT_BULK_REASSIGN_SELECTED = name || '';
  if (EDT._pendingReassignIds) edTkBulkReasignOpen(EDT._pendingReassignIds);
}

function edTkBulkReasignOpen(ids) {
  var role = (typeof _effectiveRole === 'function') ? _effectiveRole() : 'specialist';
  if (!_canAssignToOthers()) {
    toast(t('No tenés permiso para reasignar.'), 'error');
    return;
  }
  var userCode = (typeof _effectiveUserCode === 'function') ? _effectiveUserCode() : '';
  // Roster completo (incl. líderes/managers), igual que el reasignar individual.
  var roster = _reassignRosterObjects();
  var candidates = (role === 'manager')
    ? roster.filter(function(m){ return m && m.country === userCode; })
    : roster.slice();
  if (!candidates.length) {
    toast(t('No hay miembros del equipo a quien reasignar.'), 'error');
    return;
  }
  // Sort by overdue + load
  candidates.sort(function(a, b){
    var aOver = a.overdue || 0, bOver = b.overdue || 0;
    if (aOver !== bOver) return aOver - bOver;
    var aPct = a.capacity ? (a.load || 0) / a.capacity : 0;
    var bPct = b.capacity ? (b.load || 0) / b.capacity : 0;
    return aPct - bPct;
  });
  var suggested = candidates[0];
  var selectedName = _EDT_BULK_REASSIGN_SELECTED || (suggested ? suggested.name : '');

  var host = $('crHost'); if (!host) return;
  EDT._pendingReassignIds = ids.slice();
  var n = ids.length;

  // Sample tasks to show in summary.
  // OJO: la var se llama `found` (no `t`) — `var t` se hoistea a toda la
  // función y shadowearía la función i18n t() usada por memberCard y el modal.
  var sampleTasks = [];
  for (var i = 0; i < ids.length && i < 3; i++) {
    var found = (D.tasks || []).find(function(x){ return String(x.id) === String(ids[i]); });
    if (found) sampleTasks.push(found);
  }

  function memberCard(m) {
    var pct = (m.capacity > 0) ? Math.min(1.15, (m.load || 0) / m.capacity) : 0;
    var over = (m.load || 0) > (m.capacity || 0);
    var loadColor = over ? 'var(--critical)' : pct > 0.85 ? 'var(--warn)' : 'var(--accent)';
    var isSel = m.name === selectedName;
    var isSug = suggested && m.name === suggested.name;
    var esct = esc(escJs(m.name));
    return '<div onclick="_edTkBulkReasignPickPerson(\'' + esct + '\')" style="'
      + 'display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;'
      + 'padding:10px 12px;border-radius:8px;cursor:pointer;'
      + 'background:' + (isSel ? 'var(--accent-soft)' : 'transparent') + ';'
      + 'border:1px solid ' + (isSel ? 'var(--accent)' : 'var(--line-1)') + ';'
      + 'margin-bottom:6px">'
      + paAvatar(m.name, 28, m.country)
      + '<div style="min-width:0">'
      +   '<div class="pa-flex-center">'
      +     '<span style="font-size:13px;font-weight:500;color:var(--fg-1)">' + esc(m.name) + '</span>'
      +     (isSug && !_EDT_BULK_REASSIGN_SELECTED ? '<span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--accent);color:var(--accent-fg);text-transform:uppercase;letter-spacing:0.04em">' + esc(t('Sugerido')) + '</span>' : '')
      +     (over ? '<span class="pa-pill pa-pill-state-bloqueado" style="height:16px;font-size:10px"><span class="dot"></span> ' + esc(t('Sobre capacidad')) + '</span>' : '')
      +   '</div>'
      +   '<div style="font-size:11px;color:var(--fg-3);margin-top:2px">' + esc(m.role || 'Specialist') + (m.country ? ' · ' + esc(m.country) : '') + '</div>'
      + '</div>'
      + '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:120px">'
      +   '<div style="display:flex;align-items:center;gap:6px">'
      +     '<span style="width:70px;height:5px;background:var(--bg-2);border-radius:999px;overflow:hidden"><span style="display:block;height:100%;width:' + Math.min(100, pct * 100) + '%;background:' + loadColor + '"></span></span>'
      +     '<span class="mono" style="font-size:10px;color:' + (over ? 'var(--critical-fg)' : 'var(--fg-2)') + ';min-width:38px;text-align:right">' + (m.load || 0) + '/' + (m.capacity || 0) + '</span>'
      +   '</div>'
      +   '<div class="mono" style="font-size:10px;color:' + ((m.overdue || 0) > 0 ? 'var(--critical-fg)' : 'var(--good-fg)') + '">'
      +     ((m.overdue || 0) > 0 ? m.overdue + ' ' + esc(t('vencidas')) : esc(t('sin vencidas')))
      +   '</div>'
      + '</div>'
      + '</div>';
  }

  var memberList = candidates.map(memberCard).join('');

  var sampleHtml = sampleTasks.map(function(tk) {
    return '<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2);padding:2px 0">'
         +   '<span class="pa-mono-sm">' + esc(tk.id) + '</span>'
         +   '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(tk.nombre || '') + '</span>'
         +   '<span style="font-size:11px;color:var(--fg-3);display:flex;align-items:center;gap:4px">' + esc(t('de')) + ' ' + paAvatar(tk.resp || '?', 14) + ' ' + esc((tk.resp || '').split(' ')[0]) + '</span>'
         + '</div>';
  }).join('');
  if (ids.length > sampleTasks.length) {
    sampleHtml += '<div style="font-size:11px;color:var(--fg-3);padding:4px 0">+ ' + (ids.length - sampleTasks.length) + ' ' + (ids.length - sampleTasks.length === 1 ? t('tarea más') : t('tareas más')) + '</div>';
  }
  var nLbl = n + ' ' + (n === 1 ? t('tarea') : t('tareas'));
  var scopeLbl = (role === 'manager' ? t('Equipo') + ' ' + esc(userCode || '—') : t('Roster LATAM')) + ' · ' + candidates.length + ' ' + t('personas');

  host.innerHTML = ''
    + '<div class="cr-overlay" onclick="if(event.target===this)edTkBulkReasignClose()">'
    +   '<div class="cr-backdrop" onclick="edTkBulkReasignClose()"></div>'
    +   '<div class="cr-modal" role="dialog" aria-modal="true" aria-label="' + esc(t('Reasignación masiva')) + '" style="max-width:580px">'
    +     '<div class="cr-head">'
    +       '<div style="width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0">'
    +         paIcon('users', 16)
    +       '</div>'
    +       '<div style="flex:1">'
    +         '<div class="cr-title">' + esc(t('Reasignar')) + ' ' + esc(nLbl) + '</div>'
    +         '<div style="font-size:12px;color:var(--fg-3);margin-top:2px">' + esc(t('La asignación previa queda en el historial. Avisale al nuevo responsable por Slack/email manualmente.')) + '</div>'
    +       '</div>'
    +       '<button type="button" class="cr-x" onclick="edTkBulkReasignClose()" aria-label="' + esc(t('Cerrar')) + '">×</button>'
    +     '</div>'
    +     '<div class="cr-body">'
    +       (sampleHtml ? '<div style="padding:10px 12px;background:var(--bg-2);border-radius:6px;margin-bottom:14px">'
    +         '<div style="font-size:11px;color:var(--fg-3);margin-bottom:4px">' + esc(t('Vas a reasignar')) + '</div>'
    +         sampleHtml
    +       '</div>' : '')

    +       '</div>'
    +       '<button type="button" class="pa-btn pa-btn-outline" onclick="edTkBulkReasignClose()">' + esc(t('Cancelar')) + '</button>'
    +       '<button type="button" class="pa-btn pa-btn-primary" ' + (selectedName ? '' : 'disabled style="opacity:0.5;cursor:not-allowed"') + ' onclick="edTkBulkReasignConfirm()">' + paIcon('check', 12) + ' ' + esc(t('Reasignar')) + (selectedName ? ' ' + esc(t('a')) + ' ' + esc(selectedName.split(' ')[0]) : '') + '</button>'
    +     '</div>'

}
function edTkBulkReasignClose() {
  var host = $('crHost'); if (host) host.innerHTML = '';
  EDT._pendingReassignIds = null;
  _EDT_BULK_REASSIGN_SELECTED = '';
  _EDT_BULK_REASSIGN_RUNNING = false;
}
function edTkBulkReasignConfirm() {
  if (_EDT_BULK_REASSIGN_RUNNING) return; // double-submit guard
  var newResp = _EDT_BULK_REASSIGN_SELECTED;
  if (!newResp) { toast(t('Primero elegí un responsable.'), 'error'); return; }
  var ids = EDT._pendingReassignIds || [];
  if (!ids.length) { edTkBulkReasignClose(); return; }
  // No cerramos el modal antes del network — mostramos loading state en el CTA
  // y cerramos al final del bulk (_edTkBulkDone llama edTkBulkReasignClose).
  var btn = document.querySelector('#crHost .cr-foot .pa-btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = t('Reasignando…'); }
  _EDT_BULK_REASSIGN_RUNNING = true;
  _edTkBulkRun(ids, 'resp', newResp, 'Reasignadas');
}

// Aplica un cambio de campo en memoria a varias tareas y re-renderiza YA
// (optimistic). El reconcile final (_reloadSilent en _edTkBulkDone) corrige
// cualquier fila que el server haya rechazado, así que no hace falta revertir
// fila por fila.
function _edApplyOptimistic(pairs, field) {
  if (!D || !D.tasks) return;
  var byId = {};
  pairs.forEach(function(p){ byId[String(p.id)] = p.value; });
  D.tasks.forEach(function(t){
    if (byId.hasOwnProperty(String(t.id))) t[field] = byId[String(t.id)];
  });
  _rerenderActive();
}
function _edTkBulkRun(ids, field, value, label) {
  var ok = 0, fail = 0, pending = ids.length;
  _edApplyOptimistic(ids.map(function(id){ return { id: id, value: value }; }), field);
  ids.forEach(function(id) {
    google.script.run
      .withSuccessHandler(function(res){ (res && res.success) ? ok++ : fail++; if (--pending === 0) _edTkBulkDone(label, ok, fail); })
      .withFailureHandler(function(){ fail++; if (--pending === 0) _edTkBulkDone(label, ok, fail); })
      .updateTaskField(id, field, value);
  });
}
function _edTkBulkRunMixed(items, field, label) {
  var ok = 0, fail = 0, pending = items.length;
  _edApplyOptimistic(items, field);
  items.forEach(function(it) {
    google.script.run
      .withSuccessHandler(function(res){ (res && res.success) ? ok++ : fail++; if (--pending === 0) _edTkBulkDone(label, ok, fail); })
      .withFailureHandler(function(){ fail++; if (--pending === 0) _edTkBulkDone(label, ok, fail); })
      .updateTaskField(it.id, field, it.value);
  });
}
function _edTkBulkDone(label, ok, fail) {
  if (fail === 0) toast('✅ ' + label + ': ' + ok, 'success');
  else if (ok === 0) toast(t('Error: no se pudo aplicar ninguna'), 'error');
  else toast('⚠ ' + label + ': ' + ok + ' OK, ' + fail + ' ' + t('fallaron'), 'info');
  // Si el bulk venía del modal de reasignación, cerrarlo acá: es el único
  // punto post-network (el confirm deja el modal abierto con el CTA en loading).
  if (_EDT_BULK_REASSIGN_RUNNING) edTkBulkReasignClose();
  EDT.selectedIds = [];
  // Reconcile sin spinner: el cambio optimista ya se ve; esto sincroniza stats
  // y corrige fallos parciales contra la verdad del server.
  _reloadSilent();
}

// ─── DOCUMENTOS DEL PANEL (tracker side panel) ──────────────────
// Reusa los endpoints uploadDocument / attachDocumentLink ya
// existentes, pero con refresh vía reload() en vez del flujo del
// modal de edición. Mantiene la lista actualizada después de
// adjuntar/subir sin cerrar el panel.
function edTkToggleLinkForm() {
  var f = $('tkLinkForm'); if (!f) return;
  var isHidden = f.style.display === 'none' || !f.style.display;
  f.style.display = isHidden ? 'flex' : 'none';
  if (isHidden) { var u = $('tkLinkUrl'); if (u) u.focus(); }
}
function edTkAttachLink(taskId) {
  var url  = ($('tkLinkUrl')  && $('tkLinkUrl').value  || '').trim();
  var name = ($('tkLinkName') && $('tkLinkName').value || '').trim();
  if (!url) { toast('Primero pegá un enlace', 'error'); return; }
  // Validar scheme http(s) en cliente — el backend rechaza igual, pero
  // validar acá evita un round-trip y da feedback inmediato.
  if (!/^https?:\/\//i.test(url)) {
    toast('El enlace debe empezar con http:// o https://', 'error');
    return;
  }
  showLoader();
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoader();
      if (res && res.success) { toast('✅ Enlace adjuntado', 'success'); reload(); }
      else { toast('Error: ' + ((res && res.error) || ''), 'error'); }
    })
    .withFailureHandler(function(e){ hideLoader(); toast('Error: ' + e.message, 'error'); })
    .attachDocumentLink('task', taskId, { url: url, name: name });
}
function edTkUploadFile(input) {
  var file = input.files && input.files[0];
  if (!file) { toast('No seleccionaste ningún archivo', 'error'); return; }
  var taskId = input.dataset.taskId;
  if (!taskId) { toast('Falta el id de la tarea (recargá la página)', 'error'); return; }
  if (file.size > 45 * 1024 * 1024) {
    toast('Archivo demasiado grande (máx 45 MB en Apps Script)', 'error');
    input.value = ''; return;
  }
  showLoader('Leyendo ' + file.name + '…');
  var reader = new FileReader();
  reader.onerror = function(e) {
    hideLoader();
    console.error('FileReader error', e);
    toast('Error al leer el archivo. Probá otro.', 'error');
    input.value = '';
  };
  reader.onload = function() {
    var base64 = String(reader.result).split(',')[1];
    _loaderSetLabel('Subiendo ' + file.name + ' a Drive… (puede tardar)');
    google.script.run
      .withSuccessHandler(function(res) {
        hideLoader(); input.value = '';
        if (res && res.success) { toast('✅ ' + file.name + ' subido', 'success'); reload(); }
        else {
          console.error('uploadDocument response', res);
          toast('Error: ' + ((res && res.error) || 'falló la subida'), 'error');
        }
      })
      .withFailureHandler(function(e) {
        hideLoader(); input.value = '';
        console.error('uploadDocument failure', e);
        toast('Error del backend: ' + (e && e.message || 'desconocido'), 'error');
      })
      .uploadDocument('task', taskId, { name: file.name, mimeType: file.type, data: base64 });
  };
  try {
    reader.readAsDataURL(file);
  } catch (err) {
    hideLoader();
    console.error('readAsDataURL throw', err);
    toast('Error inesperado: ' + (err && err.message || 'desconocido'), 'error');
    input.value = '';
  }
}

// Mini-modal que reusa el overlay del wizard de crear (cr-overlay/cr-modal)
// pero con un layout reducido: select de responsables + Cancelar/Confirmar.
// El backend (updateTaskField) ya valida permisos.
var EDR = { taskId: null, value: '' };

// Roster COMPLETO de candidatos a responsable, como objetos con load/capacity
// (para sugerir el menos cargado). Usa getAllMembers() — que incluye LÍDERES y
// miembros sin tareas — y reusa el objeto de D.team cuando existe; a los que
// faltan los crea mínimos (load/capacity 0). Sin esto el modal de reasignar salía
// de D.team y omitía a quien no tuviera tareas: un head no podía reasignar a un
// líder/manager. Espeja el roster que ya usan crear/editar (getAllMembers).
function _reassignRosterObjects() {
  var team = (D && D.team) || [];
  var byName = {};
  team.forEach(function(m){ if (m && m.name) byName[m.name] = m; });
  var countryOf = {};
  ((D && D.equipos) || []).forEach(function(eq){
    if (eq.leader && countryOf[eq.leader] == null) countryOf[eq.leader] = eq.code;
    (eq.members || []).forEach(function(m){ if (countryOf[m] == null) countryOf[m] = eq.code; });
  });
  var out = [];
  ((typeof getAllMembers === 'function' ? getAllMembers() : []) || []).forEach(function(name){
    if (!name) return;
    out.push(byName[name] || { name: name, country: countryOf[name] || '', load: 0, capacity: 0, overdue: 0 });
  });
  return out;
}

function _edReasignarCandidates(role, userCode) {
  // Manager: sólo equipo de su país. Head: todo el roster (incl. líderes).
  var pool = _reassignRosterObjects();
  if (role === 'manager') {
    pool = pool.filter(function(m){ return (m.country || '') === userCode; });
  }
  // Dedupe por nombre conservando orden.
  var seen = {}, out = [];
  for (var i = 0; i < pool.length; i++) {
    var n = pool[i].name;
    if (!seen[n]) { seen[n] = 1; out.push(pool[i]); }
  }
  return out;
}

function _edReasignarRender() {
  var host = $('crHost'); if (!host) return;
  var role = _effectiveRole();
  var task = (D && D.tasks || []).find(function(t){ return t.id == EDR.taskId; });

  if (!_canReassignTask(task)) { // rol (manager/head) o dueño del proyecto de la tarea
    host.innerHTML = '';
    return;
  }

  var candidates = _edReasignarCandidates(role, _effectiveUserCode());
  var currentResp = task.resp || '';
  // Excluir current resp del listado pickeable
  var pickable = candidates.filter(function(m){ return m.name !== currentResp; });

  // Sugerido: el de menor carga sin vencidas
  var suggested = null;
  if (pickable.length) {
    suggested = pickable.slice().sort(function(a, b) {
      var aOver = a.overdue || 0, bOver = b.overdue || 0;
      if (aOver !== bOver) return aOver - bOver;
      var aPct = a.capacity ? (a.load || 0) / a.capacity : 0;
      var bPct = b.capacity ? (b.load || 0) / b.capacity : 0;
      return aPct - bPct;

  var selectedName = EDR.value || (suggested ? suggested.name : '');

  function memberCard(m) {
    var pct = (m.capacity > 0) ? Math.min(1.15, (m.load || 0) / m.capacity) : 0;
    var over = (m.load || 0) > (m.capacity || 0);
    var loadColor = over ? 'var(--critical)' : pct > 0.85 ? 'var(--warn)' : 'var(--accent)';
    var isSel = m.name === selectedName;

    return '<div onclick="edReasignarSetValue(\'' + esc(m.name).replace(/'/g, "\\'") + '\');_edReasignarRender()" style="'

      + 'margin-bottom:6px">'

      +     (over ? '<span class="pa-pill pa-pill-state-bloqueado" style="height:16px;font-size:10px"><span class="dot"></span> ' + esc(t('Sobre capacidad')) + '</span>' : '')
      +   '</div>'
      +   '<div style="font-size:11px;color:var(--fg-3);margin-top:2px">' + esc(m.role || 'Specialist') + (m.country ? ' · ' + esc(m.country) : '') + '</div>'
      + '</div>'
      + '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:120px">'
      +   '<div style="display:flex;align-items:center;gap:6px">'
      +     '<span style="width:70px;height:5px;background:var(--bg-2);border-radius:999px;overflow:hidden"><span style="display:block;height:100%;width:' + Math.min(100, pct * 100) + '%;background:' + loadColor + '"></span></span>'
      +     '<span class="mono" style="font-size:10px;color:' + (over ? 'var(--critical-fg)' : 'var(--fg-2)') + ';min-width:38px;text-align:right">' + (m.load || 0) + '/' + (m.capacity || 0) + '</span>'
      +   '</div>'
      +   '<div class="mono" style="font-size:10px;color:' + ((m.overdue || 0) > 0 ? 'var(--critical-fg)' : 'var(--good-fg)') + '">'
      +     ((m.overdue || 0) > 0 ? m.overdue + ' ' + esc(t('vencidas')) : esc(t('sin vencidas')))
      +   '</div>'
      + '</div>'
      + '</div>';
  }

  var memberList = pickable.length
    ? pickable.map(memberCard).join('')
    : '<div style="padding:18px;text-align:center;color:var(--fg-3);font-size:13px">' + esc(t('No hay responsables disponibles para reasignar.')) + '</div>';

  var scopeMsg = role === 'manager'
    ? t('Equipo') + ' ' + esc(_effectiveUserCode() || '—') + ' · ' + pickable.length + ' specialists'
    : t('Roster LATAM') + ' · ' + pickable.length + ' ' + t('personas');

  host.innerHTML = ''
    + '<div class="cr-overlay" onclick="if(event.target===this)edReasignarClose()">'
    +   '<div class="cr-backdrop" onclick="edReasignarClose()"></div>'
    +   '<div class="cr-modal" role="dialog" aria-modal="true" aria-label="' + esc(t('Reasignar tarea')) + '" style="max-width:580px">'
    +     '<div class="cr-head">'
    +       '<div style="width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0">'
    +         paIcon('users', 16)
    +       '</div>'
    +       '<div style="flex:1">'
    +         '<div class="cr-title">' + esc(t('Reasignar tarea')) + '</div>'
    +         '<div style="font-size:12px;color:var(--fg-3);margin-top:2px">' + esc(t('La asignación previa queda en el historial. Avisale al nuevo responsable por Slack/email manualmente.')) + '</div>'
    +       '</div>'
    +       '<button type="button" class="cr-x" onclick="edReasignarClose()" aria-label="' + esc(t('Cerrar')) + '">×</button>'
    +     '</div>'
    +     '<div class="cr-body">'
    +       '<div style="padding:10px 12px;background:var(--bg-2);border-radius:6px;margin-bottom:14px">'
    +         '<div style="font-size:11px;color:var(--fg-3);margin-bottom:4px">' + esc(t('Vas a reasignar')) + '</div>'

    +           '<span style="font-size:11px;color:var(--fg-3);display:flex;align-items:center;gap:4px">' + esc(t('de')) + ' ' + paAvatar(currentResp || '?', 14) + ' ' + esc(currentResp || '—') + '</span>'
    +         '</div>'
    +       '</div>'
    +       '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px">'
    +         '<label style="font-size:12px;color:var(--fg-2);font-weight:500">' + esc(t('Nuevo responsable')) + ' <span class="req">*</span></label>'
    +         '<span class="pa-meta-sm">' + scopeMsg + '</span>'
    +       '</div>'
    +       '<div style="max-height:280px;overflow-y:auto">' + memberList + '</div>'

    +     '<div class="cr-foot">'

    +         (selectedName ? paIcon('check', 11) + ' ' + esc(t('Reasignará a')) + ' <b>' + esc(selectedName) + '</b>.' : esc(t('Elegí un responsable para continuar.')))
    +       '</div>'
    +       '<button type="button" class="pa-btn pa-btn-outline" onclick="edReasignarClose()">' + esc(t('Cancelar')) + '</button>'
    +       '<button type="button" class="pa-btn pa-btn-primary" ' + (selectedName ? '' : 'disabled style="opacity:0.5;cursor:not-allowed"') + ' onclick="edReasignarConfirm()">' + paIcon('check', 12) + ' ' + esc(t('Reasignar')) + (selectedName ? ' ' + esc(t('a')) + ' ' + esc(selectedName.split(' ')[0]) : '') + '</button>'

function edReasignarOpen(taskId) {

function edReasignarSetValue(v) { EDR.value = v || ''; }

function edReasignarConfirm() {
  var taskId = EDR.taskId;
  var newResp = EDR.value;
  if (!taskId) { edReasignarClose(); return; }
  if (!newResp) {
    if (typeof toast === 'function') toast('Elegí un responsable.', 'error');
    return;
  }
  var task = (D && D.tasks || []).find(function(t){ return t.id == taskId; });
  if (task && task.resp === newResp) {
    if (typeof toast === 'function') toast('La tarea ya está asignada a ' + newResp + '.', 'info');
    return;
  }
  // OPTIMISTIC: aplicamos, cerramos picker+panel y re-renderamos al instante.
  var prevResp = task ? task.resp : null;
  if (task) task.resp = newResp;
  edReasignarClose();
  if (typeof edClosePanel === 'function') edClosePanel();
  _rerenderActive();
  if (typeof toast === 'function') toast('✅ Reasignada a ' + newResp, 'success');
  google.script.run
    .withSuccessHandler(function(r){
      if (r && r.success) {
        _reloadSilent();
      } else {
        if (task) task.resp = prevResp;
        _rerenderActive();
        if (typeof toast === 'function') toast('Error: ' + ((r && r.error) || 'no se pudo reasignar') + ' · se revirtió', 'error');
      }
    })
    .withFailureHandler(function(e){
      if (task) task.resp = prevResp;
      _rerenderActive();
      if (typeof toast === 'function') toast('Error: ' + (e && e.message || 'desconocido') + ' · se revirtió', 'error');
    })
    .updateTaskField(taskId, 'resp', newResp);
}

function edColabAddOpen(taskId) {
