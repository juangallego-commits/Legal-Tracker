  var sel = current || '', found = false;
  var opts = '<option value=""' + (!sel ? ' selected' : '') + '>Sin definir</option>';
  (clientes || []).forEach(function(c){ var on = (c === sel); if (on) found = true; opts += '<option value="' + esc(c) + '"' + (on ? ' selected' : '') + '>' + esc(c) + '</option>'; });
  if (sel && !found) opts += '<option value="' + esc(sel) + '" selected>' + esc(sel) + '</option>';
  return '<div class="cr-field"><div class="cr-label">Área solicitante <span style="font-weight:400;color:var(--fg-3)">(cliente interno)</span></div><select id="bibAreaSol" class="cr-input">' + opts + '</select></div>';
}
function _bibModalOpen(mode, doc) {
  _loadBibConfig(function(cfg) {
    var host = $('edPltHost');
    if (!host) { host = document.createElement('div'); host.id = 'edPltHost'; document.body.appendChild(host); }
    var role = cfg.userRole || _effectiveRole();
    var isEdit = mode === 'edit', isFile = mode === 'file';
    var d = doc || {};
    var title = isEdit ? 'Editar documento' : (isFile ? 'Clasificar archivo' : 'Agregar enlace');
    var nameVal = d.nombre || (isFile && _BIB_PENDING_FILE ? _BIB_PENDING_FILE.name : '');
    var confOpts = (role === 'specialist') ? ['estandar', 'restringido'] : (cfg.confidencialidad || ['estandar', 'restringido', 'confidencial']);
    var curConf = d.confidencialidad || 'estandar';
    var confSel = '<div class="cr-field"><div class="cr-label">Confidencialidad</div><select id="bibConf" class="cr-input">';
    confOpts.forEach(function(lv){ confSel += '<option value="' + esc(lv) + '"' + (lv === curConf ? ' selected' : '') + '>' + esc(_bibConfLabel(lv)) + '</option>'; });
    confSel += '</select></div>';

    var fields = '<div class="cr-field"><div class="cr-label">Nombre</div><input id="bibName" class="cr-input" maxlength="120" value="' + esc(nameVal) + '"' + (isEdit ? ' disabled' : '') + ' placeholder="Ej: NDA estándar proveedores"></div>';
    if (mode === 'link') {
      fields += '<div class="cr-field"><div class="cr-label">Enlace <span class="req">*</span></div><input id="bibUrl" class="cr-input" placeholder="https://drive.google.com/…"></div>';
    } else if (isEdit && d.url) {
      fields += '<div class="cr-field"><div class="cr-label">Enlace / archivo</div><input class="cr-input" value="' + esc(d.url) + '" disabled></div>';
    }
    fields += _bibSelectField('bibTipoDoc', 'Tipo de documento', cfg.tiposDocumento, d.tipoDocumento || '', true);
    fields += _bibSelectField('bibArea', 'Área de trabajo', cfg.areas, d.areaTrabajo || '', true);
    // Equipos no-país (COMP/HQ): su code no existe en el vocabulario de países
    // de Biblioteca → preseleccionar 'Global' (sus docs son transversales).
    var _bibPaisDefault = (cfg.paises || []).indexOf(cfg.userCountry) >= 0 ? cfg.userCountry : 'Global';
    fields += _bibSelectField('bibPais', 'País', cfg.paises, d.pais || _bibPaisDefault, true);
    fields += _bibClienteSelect(d.areaSolicitante, cfg.clientesInternos);
    fields += confSel;
    fields += '<div class="cr-field"><div class="cr-label">Tags</div><input id="bibTags" class="cr-input" maxlength="200" value="' + esc(d.tags || '') + '" placeholder="ej: farmacias, ads, mundial"></div>';
    fields += '<div class="cr-field"><div class="cr-label">Notas</div><textarea id="bibNotas" class="cr-input" maxlength="300" rows="2" placeholder="Contexto breve (opcional)">' + esc(d.notas || '') + '</textarea></div>';

    host.innerHTML = '<div class="cr-overlay" onclick="if(event.target===this)edBibDocLinkClose()">'
      +   '<div class="cr-backdrop" onclick="edBibDocLinkClose()"></div>'
      +   '<div class="cr-modal" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">'
      +     '<div class="cr-head"><div><div class="cr-eye">— Biblioteca</div><div class="cr-title">' + esc(title) + '</div></div>'
      +       '<button type="button" class="cr-x" onclick="edBibDocLinkClose()" aria-label="Cerrar">×</button></div>'
      +     '<div class="cr-body">' + fields + '</div>'
      +     '<div class="cr-foot">'
      +       '<div class="cr-foot-info">Clasificá bien para que el equipo lo encuentre.</div>'
      +       '<button type="button" class="ed-btn ghost" onclick="edBibDocLinkClose()">Cancelar</button>'
      +       '<button type="button" class="ed-btn accent" id="bibSaveBtn" onclick="edBibDocSave(\'' + mode + '\',\'' + esc((doc && doc.id) || '') + '\')">' + (isEdit ? 'Guardar' : 'Agregar') + '</button>'
      +     '</div>'
      +   '</div>'
      + '</div>';
    setTimeout(function(){ var i = (mode === 'link') ? $('bibUrl') : $('bibTipoDoc'); if (i && !i.disabled) i.focus(); }, 60);
  });
}
function edBibDocLinkClose() { var host = $('edPltHost'); if (host) host.innerHTML = ''; _BIB_PENDING_FILE = null; }
function _bibCollectMeta() {
  return {
    tipoDocumento: ($('bibTipoDoc') && $('bibTipoDoc').value) || '',
    areaTrabajo: ($('bibArea') && $('bibArea').value) || '',
    pais: ($('bibPais') && $('bibPais').value) || '',
    confidencialidad: ($('bibConf') && $('bibConf').value) || 'estandar',
    tags: ($('bibTags') && $('bibTags').value) || '',
    notas: ($('bibNotas') && $('bibNotas').value) || '',
    areaSolicitante: ($('bibAreaSol') && $('bibAreaSol').value) || ''
  };
}
function edBibDocSave(mode, docId) {
  var meta = _bibCollectMeta();
  var name = ($('bibName') && $('bibName').value || '').trim();
  var btn = $('bibSaveBtn');
  var defLabel = (mode === 'edit') ? 'Guardar' : 'Agregar';
  function reset() { if (btn) { btn.disabled = false; btn.textContent = defLabel; } }
  function ok(msg) { return function(res) {
    reset();
    if (res && res.success) { _BIBDOCS_CACHE = null; _BIB_PENDING_FILE = null; toast(msg, 'success'); edBibDocLinkClose(); _rEdBibDocs(D); }
    else toast(_friendlyError(res, 'No se pudo guardar el documento'), 'error');
  }; }
  function fail(e) { reset(); toast('Error: ' + (e && e.message || 'desconocido'), 'error'); }
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
  if (mode === 'link') {
    var url = ($('bibUrl') && $('bibUrl').value || '').trim();
    if (!url) { toast('Pegá un enlace.', 'error'); reset(); return; }
    google.script.run.withSuccessHandler(ok('Enlace agregado')).withFailureHandler(fail).addBibliotecaDocLink(name, url, meta);
  } else if (mode === 'file') {
    if (!_BIB_PENDING_FILE) { toast('No hay archivo. Reintentá.', 'error'); edBibDocLinkClose(); return; }
    if (typeof showLoader === 'function') showLoader();
    google.script.run
      .withSuccessHandler(function(res){ if (typeof hideLoader === 'function') hideLoader(); ok('Archivo subido')(res); })
      .withFailureHandler(function(e){ if (typeof hideLoader === 'function') hideLoader(); fail(e); })
      .uploadBibliotecaDocFile(_BIB_PENDING_FILE, meta);
  } else if (mode === 'edit') {
    google.script.run.withSuccessHandler(ok('Documento actualizado')).withFailureHandler(fail).updateBibliotecaDocMeta(docId, meta);
  }
}

// ── Fase 2: Adjuntar un documento de la Biblioteca a una tarea ──────────
// Enlaza (no re-sube) un doc existente: usa el attachDocumentLink del tracker
// con la URL del doc de Biblioteca. Reusa _BIBDOCS_CACHE (ya filtrado por rol).
var _BIB_PICKER_TASK = null;
var _BIB_PICKER_Q = '';
function _bibPickerRows() {
  if (_BIBDOCS_CACHE == null) return '<div style="padding:20px;color:var(--fg-3);font-size:13px">Cargando biblioteca…</div>';
  var q = (_BIB_PICKER_Q || '').toLowerCase();
  var docs = (_BIBDOCS_CACHE || []).filter(function(d) {
    if (!q) return true;
    return [(d.nombre || ''), (d.tags || ''), (d.tipoDocumento || ''), (d.pais || '')].join(' ').toLowerCase().indexOf(q) >= 0;
  });
  if (docs.length === 0) return '<div style="padding:20px;color:var(--fg-3);font-size:13px">Sin documentos' + (q ? ' para esa búsqueda.' : ' en la biblioteca.') + '</div>';
  return docs.slice(0, 60).map(function(d) {
    var meta = (d.tipoDocumento && d.tipoDocumento !== 'Otro' ? d.tipoDocumento : '') + (d.pais ? (d.tipoDocumento && d.tipoDocumento !== 'Otro' ? ' · ' : '') + d.pais : '');
    return '<div class="tk-doc pa-flex-center" style="justify-content:space-between;gap:10px">'
      +   '<div style="min-width:0"><div style="font-size:13px;color:var(--fg-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(d.nombre) + '">' + esc(d.nombre) + '</div>'
      +     (meta ? '<div style="font-size:11px;color:var(--fg-3)">' + esc(meta) + '</div>' : '') + '</div>'
      +   '<button class="pa-btn pa-btn-outline" style="height:26px;font-size:11px;padding:0 9px;flex:0 0 auto" onclick="edTkBibPickerAttach(\'' + esc(d.id) + '\')">Adjuntar</button>'
      + '</div>';
  }).join('');
}
function edTkBibPickerOpen(taskId) {
  _BIB_PICKER_TASK = taskId; _BIB_PICKER_Q = '';
  var host = $('edPltHost');
  if (!host) { host = document.createElement('div'); host.id = 'edPltHost'; document.body.appendChild(host); }
  host.innerHTML = '<div class="cr-overlay" onclick="if(event.target===this)edTkBibPickerClose()">'
    +   '<div class="cr-backdrop" onclick="edTkBibPickerClose()"></div>'
    +   '<div class="cr-modal" role="dialog" aria-modal="true" aria-label="Adjuntar desde Biblioteca">'
    +     '<div class="cr-head"><div><div class="cr-eye">— Biblioteca</div><div class="cr-title">Adjuntar a la tarea</div></div>'
    +       '<button type="button" class="cr-x" onclick="edTkBibPickerClose()" aria-label="Cerrar">×</button></div>'
    +     '<div class="cr-body">'
    +       '<input type="text" id="bibPickerSearch" class="cr-input" placeholder="Buscar documento…" oninput="_bibPickerFilter(this.value)">'
    +       '<div id="bibPickerList" style="margin-top:10px;max-height:50vh;overflow-y:auto">' + _bibPickerRows() + '</div>'
    +     '</div>'
    +     '<div class="cr-foot"><div class="cr-foot-info">Enlaza un documento existente sin re-subirlo.</div>'
    +       '<button type="button" class="ed-btn ghost" onclick="edTkBibPickerClose()">Cerrar</button></div>'
    +   '</div>'
    + '</div>';
  if (_BIBDOCS_CACHE == null) _loadBibDocs(function() { var l = $('bibPickerList'); if (l) l.innerHTML = _bibPickerRows(); });
  setTimeout(function() { var i = $('bibPickerSearch'); if (i) i.focus(); }, 60);
}
function _bibPickerFilter(q) { _BIB_PICKER_Q = q || ''; var l = $('bibPickerList'); if (l) l.innerHTML = _bibPickerRows(); }
function edTkBibPickerClose() { var h = $('edPltHost'); if (h) h.innerHTML = ''; }
function edTkBibPickerAttach(docId) {
  var d = (_BIBDOCS_CACHE || []).filter(function(x){ return x.id === docId; })[0];
  if (!d || !d.url) { toast('Ese documento no tiene URL para adjuntar.', 'error'); return; }
  var taskId = _BIB_PICKER_TASK;
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        toast('Documento adjuntado a la tarea', 'success');
        edTkBibPickerClose();
        if (typeof _edScheduleReload === 'function') _edScheduleReload();
      } else { toast((res && res.error) || 'No se pudo adjuntar.', 'error'); }
    })
    .withFailureHandler(function(e) { toast('Error: ' + (e && e.message || 'desconocido'), 'error'); })
    .attachDocumentLink('task', taskId, { url: d.url, name: d.nombre });
}

// ════════════════════════════════════════════════════════════════
// RECURSOS · links curados (herramientas tech/AI, guías, clases) que
// comparte el equipo legal. Todos ven todos; solo el autor (o un head)
// puede editar/eliminar. Backend: getRecursos / addRecurso /
// updateRecurso / deleteRecurso. La vista NO agrupa por categoría
// (deprecada): es una lista plana con búsqueda + chips de tipo + orden.
// ════════════════════════════════════════════════════════════════
var _RECURSOS_CACHE = null;     // null = aún no cargado; array = cargado
var _RECURSOS_FORM_OPEN = false; // toggle del form colapsable "Agregar recurso"
var _RECURSOS_EDIT_ID = null;    // si !== null → el form está en modo edición de ese id
// Estado de filtros de la vista (en memoria, no se persiste). Re-render al cambiar.
var _RECURSOS_UI = { q: '', tipo: 'all', sort: 'recientes' };
// Hub de 2 pestañas: 'links' (links curados del equipo) | 'integraciones'
// (catálogo de "qué puede hacer MyDash"). Default 'links'.
var _RECURSOS_TAB = 'links';
// Cache del catálogo de integraciones: null = aún no cargado; array = cargado.
var _INTEGRACIONES_CACHE = null;
// Filtro por estado de la pestaña integraciones ('all' | estado). En memoria.
var _INTEGRACIONES_FILTER = 'all';

// Enum de tipo de recurso → ícono (emoji) + label i18n. '' = sin clasificar.
// Espejo del backend _REC_TIPOS (tool/guide/course/repo/template/dataset).
// Las labels se llaman con t() literal para que check-i18n las detecte.
var _REC_TIPO_META = {
  'tool':     { icon: '🔧', label: function(){ return t('Herramienta'); } },
  'guide':    { icon: '📘', label: function(){ return t('Guía'); } },
  'course':   { icon: '🎓', label: function(){ return t('Curso'); } },
  'repo':     { icon: '💻', label: function(){ return t('Repo'); } },
  'template': { icon: '📄', label: function(){ return t('Template'); } },
  'dataset':  { icon: '📊', label: function(){ return t('Dataset'); } },
  '':         { icon: '🏷️', label: function(){ return t('Sin clasificar'); } }
};
// Orden de los tipos para los chips/pills (los '' van al final como "Sin clasificar").
var _REC_TIPO_ORDER = ['tool', 'guide', 'course', 'repo', 'template', 'dataset'];
function _recTipoMeta(tipo) { return _REC_TIPO_META[tipo] || _REC_TIPO_META['']; }

// ¿Puede el usuario actual eliminar este recurso? head siempre; o el autor.
function _recursoCanDelete(r) {
  if (USER && USER.role === 'head') return true;
  var mine = (USER && USER.email) || '';
  return !!(r && r.autorEmail && r.autorEmail.toLowerCase() === mine.toLowerCase());
}
// Solo dejamos pasar http(s) al href (defensa en profundidad; el backend ya
// bloquea javascript:/data:/file:). Si no valida, no se renderiza como link.
function _recursoSafeHref(url) {
  return /^https?:\/\//i.test((url || '').toString().trim()) ? url.trim() : '';
}
// Filtra + ordena los recursos según _RECURSOS_UI. Búsqueda client-side sobre
// título + descripción + tags; chip de tipo; orden recientes/más usados.
function _recursoFilterSort(recursos) {
  var q = (_RECURSOS_UI.q || '').trim().toLowerCase();
  var tipo = _RECURSOS_UI.tipo || 'all';
  var out = (recursos || []).filter(function(r) {
    if (tipo !== 'all' && (r.tipo || '') !== tipo) return false;
    if (!q) return true;
    var hay = (r.titulo || '') + ' ' + (r.descripcion || '') + ' ' + ((r.tags || []).join(' '));
    return hay.toLowerCase().indexOf(q) >= 0;
  });
  // Orden. "Más usados" cae a recientes como desempate (hoy clicks=0 → todo recientes).
  // "fecha" llega como dd/MM/yyyy → la parseamos a un comparable para ordenar bien.
  function fechaKey(s) {
    var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec((s || '').trim());
    return m ? (m[3] + m[2] + m[1]) : '';
  }
  out.sort(function(a, b) {
    if (_RECURSOS_UI.sort === 'clicks') {
      var d = (b.clicks || 0) - (a.clicks || 0);
      if (d !== 0) return d;
    }
    var fa = fechaKey(a.fecha), fb = fechaKey(b.fecha);
    if (fa !== fb) return fa < fb ? 1 : -1; // fecha desc
    var ta = (a.titulo || '').toLowerCase(), tb = (b.titulo || '').toLowerCase();
    return ta < tb ? -1 : (ta > tb ? 1 : 0);
  });
  return out;
}

// Hub Recursos · cáscara de 2 pestañas. Renderiza header + barra de pestañas
// ["Links del equipo" | "Qué puede hacer MyDash"] y delega el cuerpo al
// renderer de la pestaña activa. La pestaña 'links' mantiene EXACTAMENTE el
// comportamiento R1 (ver _recRenderLinksTab); 'integraciones' es el catálogo.
function rEdRecursos(D) {
  var v = $('vEdRecursos'); if (!v) return;

  // Barra de 2 pestañas del hub (chips, mismo patrón que _bibSubnav). El header
  // de cada pestaña (título + acciones) lo pone el renderer de la pestaña,
  // igual que Biblioteca: subnav primero, luego el pa-page-h de cada sub-vista.
  function _recHubTabs(active) {
    return '<div style="display:flex;gap:6px;margin:0 0 16px">'
         +    '<div class="pa-chip' + (active === 'links' ? ' is-active' : '') + '" onclick="edRecursoSetTab(\'links\')">' + esc(t('Links del equipo')) + '</div>'
         +    '<div class="pa-chip' + (active === 'integraciones' ? ' is-active' : '') + '" onclick="edRecursoSetTab(\'integraciones\')">' + esc(t('Qué puede hacer MyDash')) + '</div>'
         +  '</div>';
  }

  var html = '<div class="pa-page">' + _recHubTabs(_RECURSOS_TAB);
  if (_RECURSOS_TAB === 'integraciones') {
    html += _recRenderIntegracionesTab(v);
  } else {
    html += _recRenderLinksTab(v);
  }
  html += '</div>';
  v.innerHTML = html;

  // Post-render: foco en el form de alta (solo aplica a la pestaña links).
  if (_RECURSOS_TAB === 'links' && _RECURSOS_FORM_OPEN) {
    setTimeout(function(){ var i = $('recTitulo'); if (i) i.focus(); }, 60);
  }
}

// Cambio de pestaña del hub → re-render.
function edRecursoSetTab(tab) {
  if (tab !== 'links' && tab !== 'integraciones') return;
  _RECURSOS_TAB = tab;
  rEdRecursos(D);
}

// ── Pestaña A · Links del equipo (comportamiento R1 intacto) ──────
// Devuelve el HTML del cuerpo (sin el wrapper .pa-page ni el header del hub,
// que los pone rEdRecursos). Si el cache aún no cargó, dispara la carga y
// devuelve un skeleton. Mantiene toda la lógica de búsqueda/filtros/cards/form.
function _recRenderLinksTab(v) {
  // Cache: si no hay, cargamos del server con loader y re-renderizamos.
  if (_RECURSOS_CACHE == null) {
    if (typeof showLoader === 'function') showLoader();
    google.script.run
      .withSuccessHandler(function(res) {
        if (typeof hideLoader === 'function') hideLoader();
        _RECURSOS_CACHE = (res && res.success && res.recursos) ? res.recursos : [];
        rEdRecursos(D);
      })
      .withFailureHandler(function(e) {
        if (typeof hideLoader === 'function') hideLoader();
        _RECURSOS_CACHE = [];
        toast('Error: ' + (e && e.message || 'desconocido'), 'error');
        rEdRecursos(D);
      })
      .getRecursos();
    return ltSkeleton(5);
  }

  var all = (_RECURSOS_CACHE || []).slice();

  var html = '';
  html += '<div class="pa-page-h">'
       +    '<span class="pa-page-title">' + esc(t('Recursos')) + '</span>'
       +    '<span class="pa-page-sub">' + all.length + ' '
       +      esc(all.length === 1 ? t('recurso') : t('recursos')) + '</span>'
       +    '<div class="pa-page-meta">'
       +      '<button class="pa-btn pa-btn-primary" onclick="edRecursoToggleForm()">' + paIcon('plus', 12) + ' ' + esc(t('Agregar recurso')) + '</button>'
       +    '</div>'
       + '</div>';

  html += '<div class="pa-narrative">' + esc(t('Herramientas, guías y links que comparte el equipo legal')) + '</div>';

  // Form colapsable de alta/edición.
  if (_RECURSOS_FORM_OPEN) html += _recursoFormHtml();

  if (all.length === 0) {
    html += paEmpty('globe', t('Todavía no hay recursos.'), t('Agregá el primero con "Agregar recurso".'));
    return html;
  }

  // ── Toolbar: búsqueda + orden ───────────────────────────────────
  html += '<div class="pa-filterbar">'
       +    '<div class="pa-search" style="width:240px">'
       +      paIcon('search', 12)
       +      '<input type="text" id="recSearch" placeholder="' + esc(t('Buscar recursos')) + '" value="' + esc(_RECURSOS_UI.q) + '" oninput="edRecursoSetSearch(this.value)">'
       +    '</div>'
       +    '<div style="margin-left:auto;display:flex;gap:6px;align-items:center">'
       +      '<div class="pa-chip' + (_RECURSOS_UI.sort === 'recientes' ? ' is-active' : '') + '" onclick="edRecursoSetSort(\'recientes\')">' + esc(t('Recientes')) + '</div>'
       +      '<div class="pa-chip' + (_RECURSOS_UI.sort === 'clicks' ? ' is-active' : '') + '" onclick="edRecursoSetSort(\'clicks\')">' + esc(t('Más usados')) + '</div>'
       +    '</div>'
       + '</div>';

  // ── Chips de filtro por tipo (con contador en vivo) ─────────────
  // Contamos sobre _todos_ los recursos (no sobre el resultado filtrado).
  function tipoCount(key) {
    return all.filter(function(r){ return key === 'all' || (r.tipo || '') === key; }).length;
  }
  function tipoChip(key, label, active) {
    return '<div class="pa-chip' + (active ? ' is-active' : '') + '" onclick="edRecursoSetTipo(\'' + esc(key) + '\')">'
         + esc(label) + ' <span class="ct">' + tipoCount(key) + '</span></div>';
  }
  html += '<div class="pa-filterbar">';
  html += tipoChip('all', t('Todos'), _RECURSOS_UI.tipo === 'all');
  // Un chip por tipo "real" que esté presente, en orden fijo.
  _REC_TIPO_ORDER.forEach(function(key) {
    if (tipoCount(key) === 0) return;
    var meta = _recTipoMeta(key);
    html += tipoChip(key, meta.icon + ' ' + meta.label(), _RECURSOS_UI.tipo === key);
  });
  // "Sin clasificar" siempre que existan recursos sin tipo.
  if (tipoCount('') > 0) {
    html += tipoChip('', _REC_TIPO_META[''].icon + ' ' + t('Sin clasificar'), _RECURSOS_UI.tipo === '');
  }
  html += '</div>';

  // ── Lista plana (filtrada + ordenada) ───────────────────────────
  var recursos = _recursoFilterSort(all);
  if (recursos.length === 0) {
    html += paEmpty('search', t('No hay recursos que coincidan.'), t('Probá con otra búsqueda o filtro.'));
  } else {
    html += '<div class="bib-grid">';
    recursos.forEach(function(r) {
      var href = _recursoSafeHref(r.url);
      var titHtml = href
        ? '<a href="' + esc(href) + '" target="_blank" rel="noopener" class="bib-card-title" style="text-decoration:none">' + esc(r.titulo) + '</a>'
        : '<div class="bib-card-title">' + esc(r.titulo) + '</div>';

      var actions = '';
      if (_recursoCanDelete(r)) {
        actions = '<div class="bib-card-actions">'
          + '<button type="button" class="bib-card-act" onclick="event.stopPropagation();edRecursoEdit(\'' + escJs(r.id) + '\')" title="' + esc(t('Editar')) + '" aria-label="' + esc(t('Editar')) + '" style="font-size:13px;line-height:1">✏️</button>'
          + '<button type="button" class="bib-card-act del" onclick="event.stopPropagation();edRecursoDelete(\'' + escJs(r.id) + '\')" title="' + esc(t('Eliminar')) + '" aria-label="' + esc(t('Eliminar')) + '" style="font-size:15px;line-height:1">×</button>'
          + '</div>';
      }

      var descHtml = r.descripcion
        ? '<div style="font-size:12px;color:var(--fg-2);line-height:1.45;margin:2px 0 4px">' + esc(r.descripcion) + '</div>'
        : '';

      // Clasificación: tipo (chip) + tags (chips chicos) + badges (área / requiere pago).
      var meta = _recTipoMeta(r.tipo);
      var classHtml = '<div class="bib-card-class">';
      classHtml += '<span class="bib-chip">' + meta.icon + ' ' + esc(meta.label()) + '</span>';
      if (r.area) classHtml += '<span class="bib-card-badge">' + esc(r.area) + '</span>';
      if (r.requierePago) classHtml += '<span class="bib-card-badge">💳 ' + esc(t('Requiere cuenta/pago')) + '</span>';
      classHtml += '</div>';

      var tagsHtml = '';
      if (r.tags && r.tags.length) {
        tagsHtml = '<div class="bib-card-tags">';
        r.tags.forEach(function(tg){ tagsHtml += '<span class="bib-tag">' + esc(tg) + '</span>'; });
        tagsHtml += '</div>';
      }

      var metaParts = [];
      if (r.autor) metaParts.push(esc(t('Agregado por')) + ' ' + esc(r.autor));
      if (r.fecha) metaParts.push(esc(r.fecha));

      html += '<div class="bib-card">'
           +    '<div class="bib-card-h">'
           +      '<span class="bib-card-icon">' + paIcon('globe', 16) + '</span>'
           +      titHtml
           +      actions
           +    '</div>'
           +    descHtml
           +    classHtml
           +    tagsHtml
           +    '<div class="bib-card-f">'
           +      '<span class="author">' + metaParts.join(' · ') + '</span>'
           +      (href ? '<a href="' + esc(href) + '" target="_blank" rel="noopener" class="open-hint" style="text-decoration:none;cursor:pointer">↗ ' + esc(t('Abrir')) + '</a>' : '')
           +    '</div>'
           + '</div>';
    });
    html += '</div>';
  }

  return html;
}

// ════════════════════════════════════════════════════════════════
// Pestaña B · Catálogo de integraciones ("Qué puede hacer MyDash").
// Lista read-only de lo que la app puede hacer y cómo se activa cada
// cosa. El contenido (titulo/queHace/comoActivar/ctaTexto) ya viene
// bilingüe del backend (getIntegraciones) → NO pasa por t(); solo el
// chrome (chips/notas) se traduce. Las keys de config viven en Script
// Properties: NUNCA hay un panel de config in-app acá.
// ════════════════════════════════════════════════════════════════

// Elige el campo según LANG. Cae al ES si el PT viene vacío.
function _intLang(it, base) {
  var pt = it[base + '_pt'], es = it[base + '_es'];
  return (LANG === 'pt' && pt) ? pt : (es || '');
}

// Meta por estado: clase de pill semántica (reusa pa-pill-*) + label i18n.
// 'dim' usa la pill .pa-pill-dim (vars --dim-* existentes).
var _INT_ESTADO_META = {
  'activa':        { pill: 'pa-pill-good', label: function(){ return t('Activa'); } },
  'instala_addon': { pill: 'pa-pill-info', label: function(){ return t('La activás vos'); } },
  'setup_admin':   { pill: 'pa-pill-warn', label: function(){ return t('Requiere admin'); } },
  'owner_centrico':{ pill: 'pa-pill-dim',  label: function(){ return t('Limitada al owner'); } }
};
function _intEstadoMeta(estado) {
  return _INT_ESTADO_META[estado] || _INT_ESTADO_META['owner_centrico'];
}

// Devuelve el HTML del cuerpo de la pestaña integraciones (sin wrapper
// .pa-page ni header del hub). Carga perezosa con loader → cachea → re-render.
function _recRenderIntegracionesTab(v) {
  if (_INTEGRACIONES_CACHE == null) {
    if (typeof showLoader === 'function') showLoader();
    google.script.run
      .withSuccessHandler(function(res) {
        if (typeof hideLoader === 'function') hideLoader();
        _INTEGRACIONES_CACHE = (res && res.success && res.integraciones) ? res.integraciones : [];
        rEdRecursos(D);
      })
      .withFailureHandler(function(e) {
        if (typeof hideLoader === 'function') hideLoader();
        _INTEGRACIONES_CACHE = [];
        toast('Error: ' + (e && e.message || 'desconocido'), 'error');
        rEdRecursos(D);
      })
      .getIntegraciones();
    return ltSkeleton(5);
  }

  var role = (typeof _effectiveRole === 'function') ? _effectiveRole() : 'specialist';
  var all = (_INTEGRACIONES_CACHE || []).slice().sort(function(a, b) {
    return (a.orden || 0) - (b.orden || 0);
  });

  var html = '';
  html += '<div class="pa-page-h">'
       +    '<span class="pa-page-title">' + esc(t('Recursos')) + '</span>'
       +    '<span class="pa-page-sub">' + esc(t('Qué puede hacer MyDash')) + '</span>'
       +  '</div>';
  html += '<div class="pa-narrative">' + esc(t('Lo que MyDash puede hacer y cómo se activa cada cosa.')) + '</div>';

  if (all.length === 0) {
    html += paEmpty('globe', t('Todavía no hay integraciones.'), t('Cuando se configuren, vas a verlas acá.'));
    return html;
  }

  // ── Filtro por estado (chips con contador en vivo) ──────────────
  function estadoCount(key) {
    return all.filter(function(it){ return key === 'all' || (it.estado || '') === key; }).length;
  }
  function estadoChip(key, label) {
    var active = _INTEGRACIONES_FILTER === key;
    return '<div class="pa-chip' + (active ? ' is-active' : '') + '" onclick="edRecursoSetIntFilter(\'' + esc(key) + '\')">'
         + esc(label) + ' <span class="ct">' + estadoCount(key) + '</span></div>';
  }
  html += '<div class="pa-filterbar">';
  html += estadoChip('all', t('Todos'));
  ['activa', 'instala_addon', 'setup_admin', 'owner_centrico'].forEach(function(key) {
    if (estadoCount(key) === 0) return;
    html += estadoChip(key, _intEstadoMeta(key).label());
  });
  html += '</div>';

  var items = (_INTEGRACIONES_FILTER === 'all')
    ? all
    : all.filter(function(it){ return (it.estado || '') === _INTEGRACIONES_FILTER; });

  if (items.length === 0) {
    html += paEmpty('search', t('No hay integraciones que coincidan.'), t('Probá con otro filtro.'));
    return html;
  }

  html += '<div class="bib-grid">';
  items.forEach(function(it) {
    var titulo = _intLang(it, 'titulo');
    var queHace = _intLang(it, 'queHace');
    var comoActivar = _intLang(it, 'comoActivar');
    var ctaTexto = _intLang(it, 'ctaTexto');
    var estado = it.estado || 'owner_centrico';
    var meta = _intEstadoMeta(estado);
    var href = _recursoSafeHref(it.ctaUrl);
    var icono = (it.icono || '🔧').toString();

    // Chip de estado.
    var chipHtml = '<div class="bib-card-class">'
                 + '<span class="pa-pill ' + meta.pill + '">' + esc(meta.label()) + '</span>'
                 + '</div>';

    // CTA / nota según estado + rol. Helpers de markup:
    function linkBtn(txt) {
      return '<a href="' + esc(href) + '" target="_blank" rel="noopener" class="pa-btn pa-btn-outline" style="text-decoration:none">'
           + esc(txt) + ' ↗</a>';
    }
    function noteText(txt) {
      return '<div style="font-size:12px;color:var(--fg-3);line-height:1.45">' + esc(txt) + '</div>';
    }
    var ctaHtml = '';
    if (estado === 'activa') {
      // Sin CTA: el chip verde "Activa" ya lo dice todo.
      ctaHtml = '';
    } else if (estado === 'instala_addon') {
      // La activa el propio usuario. Link si hay ctaUrl; si no, guía textual.
      ctaHtml = href ? linkBtn(ctaTexto || comoActivar) : noteText(comoActivar);
    } else if (estado === 'setup_admin') {
      // Requiere admin. specialist: solo "pedíselo"; manager/head: link de pasos.
      if (role === 'manager' || role === 'head') {
        ctaHtml = href ? linkBtn(ctaTexto || comoActivar) : noteText(comoActivar);
      } else {
        ctaHtml = noteText(t('Pedíselo a tu admin'));
      }
    } else { // owner_centrico
      // Limitada al owner / requiere IT. Sin CTA de acción.
      ctaHtml = noteText(t('Hoy limitada al owner / requiere IT'));
    }

    var queHaceHtml = queHace
      ? '<div style="font-size:12px;color:var(--fg-2);line-height:1.45;margin:2px 0 4px">' + esc(queHace) + '</div>'
      : '';
    // "Cómo activar" como texto secundario (no se duplica si ya es la nota CTA).
    var comoHtml = (comoActivar && !(ctaHtml.indexOf(esc(comoActivar)) >= 0))
      ? '<div style="font-size:11px;color:var(--fg-3);line-height:1.4;margin:0 0 6px">' + esc(comoActivar) + '</div>'
      : '';

    html += '<div class="bib-card" onclick="edIntOpenDetail(' + Number(it.id || 0) + ')" style="cursor:pointer" title="' + esc(t('Click para ver qué es y cómo activarla')) + '">'
         +    '<div class="bib-card-h">'
         +      '<span class="bib-card-icon" style="font-size:16px;line-height:1">' + esc(icono) + '</span>'
         +      '<div class="bib-card-title">' + esc(titulo) + '</div>'
         +    '</div>'
         +    queHaceHtml
         +    comoHtml
         +    chipHtml
         +    (ctaHtml ? '<div class="bib-card-f" onclick="event.stopPropagation()"><span></span>' + ctaHtml + '</div>' : '')
         + '</div>';
  });
  html += '</div>';

  return html;
}

// Lee y valida los campos del form. Devuelve {obj} con los campos comunes
// o null si la validación falló (ya marca has-err + toast).
function _recursoReadForm() {
  var titulo = ($('recTitulo') && $('recTitulo').value || '').trim();
  var url = ($('recUrl') && $('recUrl').value || '').trim();
  var fldT = $('recFldTitulo'), fldU = $('recFldUrl');
  if (fldT) fldT.classList.remove('has-err');
  if (fldU) fldU.classList.remove('has-err');
  var bad = false;
  if (!titulo) { if (fldT) fldT.classList.add('has-err'); bad = true; }
  if (!/^https?:\/\//i.test(url)) { if (fldU) fldU.classList.add('has-err'); bad = true; }
  if (bad) { toast(t('Completá título y una URL válida (http/https).'), 'error'); return null; }
  return {
    titulo: titulo,
    url: url,
    categoria: ($('recCategoria') && $('recCategoria').value || '').trim(),
    descripcion: ($('recDescripcion') && $('recDescripcion').value || '').trim(),
    tipo: _recursoReadTipo(),
    tags: ($('recTags') && $('recTags').value || '').trim(),
    area: ($('recArea') && $('recArea').value || '').trim(),
    requierePago: !!($('recRequierePago') && $('recRequierePago').checked)
  };
}

function edRecursoAdd() {
  var obj = _recursoReadForm();
  if (!obj) return;

  var btn = $('recAddBtn');
  if (btn) { btn.disabled = true; btn.textContent = t('Agregando…'); }
  function reset() { if (btn) { btn.disabled = false; btn.textContent = t('Agregar'); } }

  google.script.run
    .withSuccessHandler(function(res) {
      reset();
      if (res && res.success) {
        _RECURSOS_CACHE = null;
        _RECURSOS_FORM_OPEN = false;
        _RECURSOS_EDIT_ID = null;
        toast(t('Recurso agregado'), 'success');
        rEdRecursos(D);
      } else if (res && res.motivo === 'duplicado') {
        // No limpiamos el form: el usuario puede ajustar la URL o abrir el existente.
        var ex = res.recursoExistente;
        var href = ex && _recursoSafeHref(ex.url);
        toast(t('Ya existe un recurso con esa URL'), 'error');
        if (href) {
          // Aviso persistente con link para abrir el recurso duplicado.
          toast(t('Ver el recurso existente') + ': ' + href, 'info');
        }
        // Marcamos el campo URL como el conflictivo.
        var fldU = $('recFldUrl'); if (fldU) fldU.classList.add('has-err');
      } else {
        toast(_friendlyError(res, t('No se pudo agregar el recurso.')), 'error');
      }
    })
    .withFailureHandler(function(e) {
      reset();
      toast('Error: ' + (e && e.message || 'desconocido'), 'error');
    })
    .addRecurso(obj);
}

function edRecursoSave() {
  if (_RECURSOS_EDIT_ID == null) { edRecursoAdd(); return; }
  var obj = _recursoReadForm();
  if (!obj) return;
  var id = _RECURSOS_EDIT_ID;

  var btn = $('recAddBtn');
  if (btn) { btn.disabled = true; btn.textContent = t('Guardando…'); }
  function reset() { if (btn) { btn.disabled = false; btn.textContent = t('Guardar'); } }

  google.script.run
    .withSuccessHandler(function(res) {
      reset();
      if (res && res.success) {
        _RECURSOS_CACHE = null;
        _RECURSOS_FORM_OPEN = false;
        _RECURSOS_EDIT_ID = null;
        toast(t('Recurso actualizado'), 'success');
        rEdRecursos(D);
      } else {
        toast(_friendlyError(res, t('No se pudo actualizar el recurso.')), 'error');
      }
    })
    .withFailureHandler(function(e) {
      reset();
      toast('Error: ' + (e && e.message || 'desconocido'), 'error');
    })
    .updateRecurso(id, obj);
}

function edRecursoDelete(id) {
  confirm_(t('¿Eliminar este recurso? Esta acción no se puede deshacer.'), function() {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          _RECURSOS_CACHE = null;
          // Si estábamos editando justo este recurso, cerrar el form.
          if (_RECURSOS_EDIT_ID === id) { _RECURSOS_EDIT_ID = null; _RECURSOS_FORM_OPEN = false; }
          toast(t('Recurso eliminado'), 'success');
          rEdRecursos(D);
        } else {
          toast(_friendlyError(res, t('No se pudo eliminar el recurso.')), 'error');
        }
      })
      .withFailureHandler(function(e) { toast('Error: ' + (e && e.message || 'desconocido'), 'error'); })
      .deleteRecurso(id);
  }, { danger: true, confirmLabel: t('Eliminar') });
}

// ── Calendario · vista semana (reuniones de Google + deadlines de tareas) ──
var _CALEV_CACHE = null;     // { weekStart, items, error } de la semana visible
var _CAL_WEEK_START = null;  // ISO (yyyy-MM-dd) del lunes de la semana visible

function _calPad(n){ return (n < 10 ? '0' : '') + n; }
function _calIso(d){ return d.getFullYear() + '-' + _calPad(d.getMonth()+1) + '-' + _calPad(d.getDate()); }
function _calParse(iso){ var p = String(iso).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function _calAddDays(iso, n){ var d = _calParse(iso); d.setDate(d.getDate()+n); return _calIso(d); }
function _calMonday(d){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); var dow = x.getDay(); x.setDate(x.getDate() + (dow === 0 ? -6 : 1 - dow)); return x; }
var _CAL_DOW = (typeof LANG !== 'undefined' && LANG === 'pt')
  ? ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'] : ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
var _CAL_MON = (typeof LANG !== 'undefined' && LANG === 'pt')
  ? ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez']
  : ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function _loadCalEvents(weekStart, cb) {
  google.script.run
    .withSuccessHandler(function(res) { _CALEV_CACHE = { weekStart: weekStart, items: (res && res.items) || [], error: res && res.error }; cb(); })
    .withFailureHandler(function(e) { _CALEV_CACHE = { weekStart: weekStart, items: [], error: (e && e.message) || 'No se pudo leer el calendario.' }; cb(); })
    .getUpcomingCalendarEvents(weekStart, 7);
}
function edCalNav(deltaWeeks){ if (!_CAL_WEEK_START) return; _CAL_WEEK_START = _calAddDays(_CAL_WEEK_START, deltaWeeks*7); _CALEV_CACHE = null; rEdCalendar(D); }
function edCalToday(){ _CAL_WEEK_START = _calIso(_calMonday(new Date())); _CALEV_CACHE = null; rEdCalendar(D); }
function edCalRefresh(){ _CALEV_CACHE = null; rEdCalendar(D); }

function rEdCalendar(D) {
  var v = $('vEdCalendar'); if (!v) return;
  if (!_CAL_WEEK_START) _CAL_WEEK_START = _calIso(_calMonday(new Date()));
  if (_CALEV_CACHE == null || _CALEV_CACHE.weekStart !== _CAL_WEEK_START) {
    v.innerHTML = '<div class="pa-page">' + ltSkeleton(5) + '</div>';
    _loadCalEvents(_CAL_WEEK_START, function() { rEdCalendar(D); });
    return;
  }
  var events = _CALEV_CACHE.items || [];
  var err = _CALEV_CACHE.error;
  var me = (typeof _effectiveUserName === 'function') ? _effectiveUserName() : '';
  var todayIso = _calIso(new Date());

  var endIso = _calAddDays(_CAL_WEEK_START, 6);
  var sd = _calParse(_CAL_WEEK_START), ed = _calParse(endIso);
  var rangeLabel = sd.getDate() + ' ' + _CAL_MON[sd.getMonth()] + ' – ' + ed.getDate() + ' ' + _CAL_MON[ed.getMonth()]
    + (sd.getFullYear() !== ed.getFullYear() ? ' ' + ed.getFullYear() : '');

  var html = '<div class="pa-page">';
  html += '<div class="pa-page-h">'
       +    '<span class="pa-page-title">' + esc(t('Calendario')) + '</span>'
       +    '<span class="pa-page-sub">' + esc(rangeLabel) + '</span>'
       +    '<div class="pa-page-meta" style="display:flex;gap:6px;align-items:center">'
       +      '<button class="pa-btn pa-btn-outline" style="padding:0 10px" title="' + esc(t('Semana anterior')) + '" onclick="edCalNav(-1)">‹</button>'
       +      '<button class="pa-btn pa-btn-outline" onclick="edCalToday()">' + esc(t('Hoy')) + '</button>'
       +      '<button class="pa-btn pa-btn-outline" style="padding:0 10px" title="' + esc(t('Semana siguiente')) + '" onclick="edCalNav(1)">›</button>'
       +      '<button class="pa-btn pa-btn-outline" onclick="edCalRefresh()">' + paIcon('refresh', 12) + ' ' + esc(t('Actualizar')) + '</button>'
       +    '</div>'
       + '</div>';
  html += '<div class="pa-narrative">' + esc(t('Tu semana: reuniones de Google Calendar y vencimientos de tus tareas, juntos. Clic en una reunión para agendar un seguimiento; en un vencimiento para abrir la tarea.')) + '</div>';
  // Nota plegable: limitación actual (Beta) + cómo hacer que aparezcan las
  // reuniones (acá y en el correo diario). Colapsada por default para no estorbar.
  html += '<details style="margin:0 0 14px">'
       +    '<summary style="cursor:pointer;font-size:12px;color:var(--fg-3);user-select:none">ℹ️ ¿No ves tus reuniones acá o en el correo diario?</summary>'
       +    '<div style="font-size:12px;color:var(--fg-2);line-height:1.6;margin-top:8px;background:var(--bg-2);border:1px solid var(--line-1);border-radius:8px;padding:10px 12px">'
       +      '<b>El calendario está en Beta.</b> Por ahora lee tus reuniones solo si compartís tu Google Calendar con la cuenta del Legal Tracker (<b>juan.gallego@rappi.com</b>). Se hace una sola vez:'
       +      '<ol style="margin:6px 0 4px;padding-left:18px">'
       +        '<li>Google Calendar → pasá el mouse sobre tu calendario → <b>⋮ → Configuración y uso compartido</b>.</li>'
       +        '<li><b>Compartir con personas o grupos específicos</b> → agregá <b>juan.gallego@rappi.com</b>.</li>'
       +        '<li>Permiso: <b>«Ver todos los detalles del evento»</b> → Guardar.</li>'
       +        '<li>Volvé acá y tocá <b>Actualizar</b> (puede tardar unos minutos en propagar).</li>'
       +      '</ol>'
       +      'Eso también hace que tus reuniones del día aparezcan en el <b>correo diario</b>.'
       +    '</div>'
       +  '</details>';

  if (err) { html += paEmpty('calendar', t('Tu calendario no está conectado'), err); html += '</div>'; v.innerHTML = html; return; }

  // Empty-state semanal: si no hay NI reuniones NI vencimientos en toda la
  // semana, decirlo explícitamente (antes solo se veían 7 columnas con "·").
  if (!events.length) {
    var _weekHasDeadline = (D.tasks || []).some(function(tk){ return tk.deadlineISO >= _CAL_WEEK_START && tk.deadlineISO <= endIso && tk.status !== 'Listo' && tk.status !== 'Cancelado' && (!me || tk.resp === me); });
    if (!_weekHasDeadline) {
      html += '<div class="pa-narrative" style="text-align:center;color:var(--fg-3)">' + esc(t('No tenés reuniones ni vencimientos esta semana.')) + '</div>';
    }
  }

  html += '<div class="cal-week">';
  for (var i = 0; i < 7; i++) {
    var dayIso = _calAddDays(_CAL_WEEK_START, i);
    var dd = _calParse(dayIso);
    var isToday = dayIso === todayIso;
    var deadlines = (D.tasks || []).filter(function(tk){ return tk.deadlineISO === dayIso && tk.status !== 'Listo' && tk.status !== 'Cancelado' && (!me || tk.resp === me); });
    var dayEvents = events.filter(function(ev){ return ev.startIso === dayIso; });
    var allDayEv = dayEvents.filter(function(ev){ return ev.allDay; });
    var timedEv = dayEvents.filter(function(ev){ return !ev.allDay; }).sort(function(a,b){ return (a.startMs||0) - (b.startMs||0); });

    html += '<div class="cal-col' + (isToday ? ' is-today' : '') + '">';
    html += '<div class="cal-col-h"><span class="cal-dow">' + esc(_CAL_DOW[i]) + '</span><span class="cal-dnum">' + dd.getDate() + '</span></div>';
    html += '<div class="cal-col-body">';
    deadlines.forEach(function(tk){
      var tone = tk.priority === 'Alta' ? 'critical' : (tk.priority === 'Baja' ? 'muted' : 'warn');
      html += '<div class="cal-chip cal-task tone-' + tone + '" title="' + esc(tk.nombre) + ' · ' + esc(t('vence')) + '" onclick="edCalOpenTask(' + Number(tk.id) + ')">'
           +    paIcon('flag', 9) + '<span class="cal-chip-t">' + esc(tk.nombre) + '</span></div>';
    });
    allDayEv.forEach(function(ev){
      html += '<div class="cal-chip cal-ev" title="' + esc(ev.title) + '" onclick="edCalEventMenu(\'' + esc(ev.id) + '\')"><span class="cal-chip-t">' + esc(ev.title) + '</span></div>';
    });
    timedEv.forEach(function(ev){
      html += '<div class="cal-chip cal-ev" title="' + esc(ev.title) + (ev.location ? ' · ' + esc(ev.location) : '') + '" onclick="edCalEventMenu(\'' + esc(ev.id) + '\')">'
           +    '<span class="cal-ev-time">' + esc(ev.timeLabel) + '</span><span class="cal-chip-t">' + esc(ev.title) + '</span></div>';
    });
    if (!deadlines.length && !dayEvents.length) html += '<div class="cal-empty">·</div>';
    html += '</div></div>';
  }
  html += '</div></div>';
  v.innerHTML = html;
}

function edCalOpenTask(id){
  if (typeof EDT !== 'undefined') { EDT.selectedId = id; EDT.filter = 'all'; EDT.groupBy = 'none'; }
  if (typeof goEd === 'function') goEd('tracker');
}

// Prep de reunión: cruza el título del evento con el tracker para mostrar
// contexto legal (tareas por contraparte + proyectos por nombre). Substring
// case-insensitive, umbral de longitud para evitar falsos positivos.
function _calRelatedToEvent(ev) {
  var out = [];
  if (!ev || !ev.title) return out;
  var title = ' ' + ev.title.toLowerCase() + ' ';
  var seen = {};
  (D.tasks || []).forEach(function(tk){
    if (tk.status === 'Listo' || tk.status === 'Cancelado') return;
    var cp = (tk.contraparte || '').trim().toLowerCase();
    if (cp && cp.length >= 3 && title.indexOf(cp) >= 0 && !seen['t'+tk.id]) {
      seen['t'+tk.id] = 1;
      out.push({ icon: 'flag', name: tk.nombre, sub: (tk.contraparte || '') + ' · ' + tk.status });
    }
  });
  (D.projects || []).forEach(function(pj){
    var nm = (pj.nombre || '').trim().toLowerCase();
    if (nm && nm.length >= 4 && title.indexOf(nm) >= 0 && !seen['p'+pj.id]) {
      seen['p'+pj.id] = 1;
      out.push({ icon: 'folder', name: pj.nombre, sub: (pj.pais || '') });
    }
  });
  return out.slice(0, 6);
}

// Reunión → tarea de seguimiento (no 1:1) + prep con contexto legal relacionado.
function edCalEventMenu(eventId) {
  var ev = (_CALEV_CACHE && _CALEV_CACHE.items || []).filter(function(x){ return x.id === eventId; })[0];
  var nm = ev ? ev.title : t('esta reunión');
  var related = _calRelatedToEvent(ev);
  var ctxHtml = '';
  if (related.length) {
    ctxHtml = '<div style="margin-top:12px;text-align:left;background:var(--bg-2);border:1px solid var(--line-1);border-radius:8px;padding:10px 12px">'
      + '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-3);margin-bottom:6px">' + esc(t('Contexto legal relacionado')) + '</div>'
      + related.map(function(r){
          return '<div style="font-size:12px;color:var(--fg-1);padding:3px 0;display:flex;gap:6px;align-items:center;min-width:0">'
            + paIcon(r.icon, 10)
            + '<span style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(r.name) + '</span>'
            + (r.sub ? '<span style="color:var(--fg-3);white-space:nowrap">· ' + esc(r.sub) + '</span>' : '')
            + '</div>';
        }).join('')
      + '</div>';
  }
  var head = '<b>' + esc(nm) + '</b>'
    + (ev && ev.startLabel ? '<br><span style="color:var(--fg-3);font-size:12px">' + esc(ev.startLabel) + (ev.location ? ' · ' + esc(ev.location) : '') + '</span>' : '');
  confirm_(head + ctxHtml + '<div style="margin-top:12px">' + esc(t('¿Agendar un seguimiento de esta reunión? Crea una tarea asignada a vos con plazo 2 días hábiles después, lista para editar.')) + '</div>', function() {
    if (typeof showLoader === 'function') showLoader();
    google.script.run
      .withSuccessHandler(function(res) {
        if (typeof hideLoader === 'function') hideLoader();
        if (res && res.success) { toast(t('Seguimiento agendado'), 'success'); if (typeof reload === 'function') reload(); }
        else toast((res && (res.error || res.message)) || t('No se pudo crear la tarea.'), 'error');
      })
      .withFailureHandler(function(e) { if (typeof hideLoader === 'function') hideLoader(); toast(t('Error') + ': ' + (e && e.message || t('desconocido')), 'error'); })
      .createTaskFromCalendarEvent(eventId);
  }, { confirmLabel: t('Agendar seguimiento') });
}

// Envía a demanda el resumen del día al correo del usuario actual.
function edSendMyDigest() {
  if (typeof toast === 'function') toast(t('Enviando tu resumen…'), 'info');
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        toast(res.sent ? t('Te enviamos tu resumen por correo ✉️') : t('Hoy no tenés tareas ni reuniones para resumir'), res.sent ? 'success' : 'info');
      } else toast((res && res.error) || t('No se pudo enviar el resumen'), 'error');
    })
    .withFailureHandler(function(e) { toast(t('Error') + ': ' + (e && e.message || t('desconocido')), 'error'); })
    .sendMyDigestNow();
}


</script>
