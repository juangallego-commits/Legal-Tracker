  if (!_canManageColab(task)) {
    if (typeof toast === 'function') toast(t('No tenés permiso para gestionar colaboradores.'), 'error');
    return;
  }
  EDCOL.taskId = taskId;
  EDCOL.name = '';
  EDCOL.role = 'ver';
  _edColabRender();
}

function edColabAddClose() {
  EDCOL.taskId = null;
  EDCOL.name = '';
  EDCOL.role = 'ver';
  var host = $('crHost'); if (host) host.innerHTML = '';
}

function edColabSetName(v) { EDCOL.name = v || ''; _edColabRender(); }
function edColabSetRole(v) { EDCOL.role = (v === 'editar') ? 'editar' : 'ver'; _edColabRender(); }

// Candidatos: miembros del país de la tarea (head sin país filtra todo el
// roster), excluyendo al responsable y a quienes ya son colaboradores.
function _edColabCandidates(task) {
  var role = _effectiveRole();
  var country = task.pais || mc(task.resp) || '';
  // Manager siempre scopeado a su país; head ve el país de la tarea (o todo
  // si la tarea no tiene país resoluble).
  var pool = (role === 'manager')
    ? _crpMembers(_effectiveUserCode())
    : (country ? _crpMembers(country) : getAllMembers());
  var taken = {};
  (task.colaboradores || []).forEach(function(c){ if (c && c.name) taken[String(c.name).trim().toLowerCase()] = 1; });
  var respKey = String(task.resp || '').trim().toLowerCase();
  return pool.filter(function(n) {
    var k = String(n || '').trim().toLowerCase();
    return k && k !== respKey && !taken[k];
  });
}

function _edColabRender() {
  var host = $('crHost'); if (!host) return;
  var task = (D && D.tasks || []).find(function(t){ return t.id == EDCOL.taskId; });
  if (!task) { host.innerHTML = ''; return; }
  var candidates = _edColabCandidates(task);
  var selectedName = EDCOL.name;

  function memberCard(n) {
    var isSel = _colabNameEq(n, selectedName);
    return '<div onclick="edColabSetName(\'' + esc(String(n).replace(/'/g, "\\'")) + '\')" style="'
      + 'display:grid;grid-template-columns:28px 1fr;align-items:center;gap:10px;'
      + 'padding:9px 12px;border-radius:8px;cursor:pointer;'
      + 'background:' + (isSel ? 'var(--accent-soft)' : 'transparent') + ';'
      + 'border:1px solid ' + (isSel ? 'var(--accent)' : 'var(--line-1)') + ';margin-bottom:6px">'
      + paAvatar(n, 24, mc(n))
      + '<span style="font-size:13px;color:var(--fg-1)">' + esc(n) + '</span>'
      + '</div>';
  }

  var memberList = candidates.length
    ? candidates.map(memberCard).join('')
    : '<div style="padding:18px;text-align:center;color:var(--fg-3);font-size:13px">' + esc(t('No hay personas disponibles para agregar.')) + '</div>';

  function roleBtn(val, label) {
    var on = EDCOL.role === val;
    return '<button type="button" onclick="edColabSetRole(\'' + val + '\')" class="pa-btn ' + (on ? 'pa-btn-primary' : 'pa-btn-outline') + '" style="flex:1;justify-content:center">' + esc(label) + '</button>';
  }

  host.innerHTML = ''
    + '<div class="cr-overlay" onclick="if(event.target===this)edColabAddClose()">'
    +   '<div class="cr-backdrop" onclick="edColabAddClose()"></div>'
    +   '<div class="cr-modal" role="dialog" aria-modal="true" aria-label="' + esc(t('Agregar colaborador')) + '" style="max-width:520px">'
    +     '<div class="cr-head">'
    +       '<div style="width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0">'
    +         paIcon('users', 16)
    +       '</div>'
    +       '<div style="flex:1">'
    +         '<div class="cr-title">' + esc(t('Agregar colaborador')) + '</div>'
    +         '<div style="font-size:12px;color:var(--fg-3);margin-top:2px">' + esc(t('El colaborador verá esta tarea en su tracker.')) + '</div>'
    +       '</div>'
    +       '<button type="button" class="cr-x" onclick="edColabAddClose()" aria-label="' + esc(t('Cerrar')) + '">×</button>'
    +     '</div>'
    +     '<div class="cr-body">'
    +       '<div style="display:flex;gap:8px;margin-bottom:14px">' + roleBtn('ver', t('Puede ver')) + roleBtn('editar', t('Puede editar')) + '</div>'
    +       '<div style="max-height:260px;overflow-y:auto">' + memberList + '</div>'
    +     '</div>'
    +     '<div class="cr-foot">'
    +       '<div class="cr-foot-info">'
    +         (selectedName ? paIcon('check', 11) + ' ' + esc(t('Agregará a')) + ' <b>' + esc(selectedName) + '</b>.' : esc(t('Elegí una persona para continuar.')))
    +       '</div>'
    +       '<button type="button" class="pa-btn pa-btn-outline" onclick="edColabAddClose()">' + esc(t('Cancelar')) + '</button>'
    +       '<button type="button" class="pa-btn pa-btn-primary" ' + (selectedName ? '' : 'disabled style="opacity:0.5;cursor:not-allowed"') + ' onclick="edColabAddConfirm()">' + paIcon('check', 12) + ' ' + esc(t('Agregar')) + '</button>'
    +     '</div>'
    +   '</div>'
    + '</div>';
}

function edColabAddConfirm() {
  var taskId = EDCOL.taskId;

// Dropdown toggle. Cierra otros menús abiertos.
function edExportMenuToggle(ev) {
  if (ev && ev.stopPropagation) ev.stopPropagation();
  var menu = $('edExportMenu');
  var btn = $('edExportBtn');
  if (!menu) return;
  var open = menu.style.display === 'block';
  menu.style.display = open ? 'none' : 'block';
  if (btn) btn.setAttribute('aria-expanded', open ? 'false' : 'true');
  if (!open) {
    // Cerrar al hacer click fuera. Listener self-removing.
    setTimeout(function() {
      document.addEventListener('click', edExportMenuCloseOnce, true);
    }, 0);
  }
}
function edExportMenuCloseOnce(e) {
  var menu = $('edExportMenu');
  if (!menu) { document.removeEventListener('click', edExportMenuCloseOnce, true); return; }
  if (menu.contains(e.target)) return;
  menu.style.display = 'none';
  var btn = $('edExportBtn');
  if (btn) btn.setAttribute('aria-expanded', 'false');
  document.removeEventListener('click', edExportMenuCloseOnce, true);
}

function _panelCell(lbl, val, valCls) {

       + '</div>';
}

// Variante editable: click en el .val abre el editor inline (select/input).
// fieldKey identifica el campo del backend (resp, deadline, riesgo, proyectoId).
function _panelCellEditable(lbl, val, valCls, taskId, fieldKey) {

       + '</div>';

// ─── EDICIÓN INLINE DEL PANEL ───────────────────────────────────
// Convierte la celda en un editor (select/input). Onchange dispara
// guardado y reload(). Onblur cancela y re-renderiza con la data
// actual. Para evitar doble-fire (change + blur), onchange limpia
// onblur antes de guardar.
function edPanelEditCell(taskId, fieldKey) {
  var task = (D && D.tasks || []).find(function(t){ return t.id == taskId; });
  if (!task) return;
  var cell = document.querySelector('[data-pcell-id="pcell-' + taskId + '-' + fieldKey + '"]');
  if (!cell) return;
  var valEl = cell.querySelector('.val');
  if (!valEl || valEl.querySelector('select, input')) return; // ya en edición

  var html = '';
  var saveAttr = 'onchange="this.onblur=null;edPanelSaveField(\'' + esc(taskId) + '\', \'' + fieldKey + '\', this.value)" onblur="edPanelCancelEdit()"';

  if (fieldKey === 'resp') {
    var members = (typeof getAllMembers === 'function') ? getAllMembers() : [];
    var opts = '<option value="">—</option>' + members.map(function(m) {
      var n = (typeof m === 'string') ? m : (m.name || m.label || '');
      return '<option value="' + esc(n) + '"' + (n === task.resp ? ' selected' : '') + '>' + esc(n) + '</option>';
    }).join('');
    html = '<select class="tk-pcell-edit" ' + saveAttr + '>' + opts + '</select>';
  } else if (fieldKey === 'deadline') {
    html = '<input type="date" class="tk-pcell-edit" value="' + esc(task.deadlineISO || '') + '" ' + saveAttr + '>';
  } else if (fieldKey === 'riesgo') {
    var risks = ['', 'Legal', 'Reputacional', 'Negocio'];
    if (task.riesgo && risks.indexOf(task.riesgo) < 0) risks.push(task.riesgo); // preservar valor legacy al editar
    var opts2 = risks.map(function(r) {
      var label = r || 'Sin definir';
      return '<option value="' + esc(r) + '"' + (r === (task.riesgo || '') ? ' selected' : '') + '>' + esc(label) + '</option>';
    }).join('');
    html = '<select class="tk-pcell-edit" ' + saveAttr + '>' + opts2 + '</select>';
  } else if (fieldKey === 'proyectoId') {
    var projects = (D && D.projectList) || [];
    var opts3 = '<option value="">Sin proyecto</option>' + projects.map(function(p) {
      var sel = (String(p.id) === String(task.proyectoId)) ? ' selected' : '';
      return '<option value="' + esc(p.id) + '"' + sel + '>' + esc(p.nombre || ('#' + p.id)) + '</option>';
    }).join('');
    html = '<select class="tk-pcell-edit" ' + saveAttr + '>' + opts3 + '</select>';
  } else if (fieldKey === 'contraparte') {
    // Texto libre. Guardar al blur (Enter también dispara blur via keyHandler).
    var cpSaveAttr = 'onkeydown="if(event.key===\'Enter\'){this.blur();}else if(event.key===\'Escape\'){this.dataset.cancel=\'1\';this.blur();}" '
                  + 'onblur="if(this.dataset.cancel===\'1\'){edPanelCancelEdit();}else{edPanelSaveField(\'' + esc(taskId) + '\', \'contraparte\', this.value)}"';
    html = '<input type="text" class="tk-pcell-edit" value="' + esc(task.contraparte || '') + '" maxlength="120" ' + cpSaveAttr + '>';
  }

  if (!html) return;
  valEl.innerHTML = html;
  var inp = valEl.querySelector('select, input');
  if (inp) inp.focus();
}

// Reload diferido (1.5s): si el usuario hace varias ediciones seguidas,
// solo dispara un reload completo al final. Sin esto, cada cambio
// pegaba un round-trip al server (~1-2s) y la app se sentía trabada.
var _edSaveReloadTimer = null;
function _edScheduleReload() {
  if (_edSaveReloadTimer) clearTimeout(_edSaveReloadTimer);
  _edSaveReloadTimer = setTimeout(function() {
    _edSaveReloadTimer = null;
    if (typeof reload === 'function') reload();
  }, 1500);
}

function edPanelSaveField(taskId, fieldKey, value) {
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        // Optimistic local update: el usuario ve el cambio aplicado de
        // inmediato; el reload diferido sincroniza stats derivadas
        // (eta, slaPct, team load, etc.) sin bloquear la UI.
        if (D && D.tasks) {
          var t = D.tasks.find(function(x){ return x.id == taskId; });
          if (t) {
            if (fieldKey === 'proyectoId' || fieldKey === 'proyecto') {
              var n = parseInt(value, 10);
              t.proyectoId = isNaN(n) ? '' : n;
            } else {
              t[fieldKey] = value;
            }
          }
        }
        // Auto-promote: si el backend cambió status de 'Pendiente' a 'En curso',
        // reflejar en local + avisar al user con un toast informativo.
        if (res.promoted === 'En curso' && D && D.tasks) {
          var tp = D.tasks.find(function(x){ return x.id == taskId; });
          if (tp) tp.status = 'En curso';
          toast(LANG === 'pt' ? 'Tarefa passou a "En curso" automaticamente' : 'Tarea pasó a "En curso" automáticamente', 'info');
        } else {
          toast(LANG === 'pt' ? '✅ Salvo' : '✅ Guardado', 'success');
        }
        if (typeof rEdTracker === 'function') rEdTracker(D);
        _edScheduleReload();
      } else {
        toast('Error: ' + ((res && res.error) || 'could not save'), 'error');
        if (typeof reload === 'function') reload();
      }
    })
    .withFailureHandler(function(e) {
      toast('Error: ' + e.message, 'error');
      if (typeof reload === 'function') reload();
    })
    .updateTaskField(taskId, fieldKey, value);
}

function edPanelCancelEdit() {
  // Re-render del tracker para volver a estado read-only sin cambios.
  setTimeout(function(){ if (D && typeof rEdTracker === 'function') rEdTracker(D); }, 100);
}

function edPanelEditTitle(el) {
  if (!el || el.querySelector('input')) return;
  var taskId = el.dataset.taskId;
  var current = el.textContent || '';
  el.innerHTML = '<input type="text" class="tk-title-edit" value="' + esc(current) + '" '
              + 'onkeydown="if(event.key===\'Enter\'){this.blur();}else if(event.key===\'Escape\'){this.dataset.cancel=\'1\';this.blur();}" '
              + 'onblur="edPanelSaveTitle(this, \'' + esc(taskId) + '\')">';
  var inp = el.querySelector('input');
  if (inp) { inp.focus(); inp.select(); }
}

function edPanelSaveTitle(input, taskId) {
  if (input.dataset.cancel === '1') { edPanelCancelEdit(); return; }
  var newVal = (input.value || '').trim();

function edPanelSaveNotes(el) {

// ─── PANEL DETALLE: TABS DE COMENTARIOS Y DOCUMENTOS ───────────
// Switch entre paneles "Comentarios" y "Documentos" en el right rail
// del task panel. Solo uno visible a la vez. Por default arranca en
// Comentarios. El click marca el tab activo + muestra/oculta los panes.
function edTkPanelSwitchTab(btn) {
  if (!btn) return;
  var pane = btn.dataset.pane;
  var tabs = btn.parentNode;
  if (!tabs) return;
  // Toggle is-active en tabs
  var allTabs = tabs.querySelectorAll('.tk-panel-tab');
  for (var i = 0; i < allTabs.length; i++) allTabs[i].classList.remove('is-active');
  btn.classList.add('is-active');
  // Mostrar/ocultar panes (.tk-pane) bajo el rail-body
  var rail = tabs.nextElementSibling;
  if (!rail) return;
  var panes = rail.querySelectorAll('.tk-pane');
  for (var j = 0; j < panes.length; j++) {
    panes[j].style.display = (panes[j].dataset.pane === pane) ? '' : 'none';
  }

// Render del card de insights. `ai` es el objeto validado del backend.
function _renderInsightsHtml(taskId, docId, ai, analyzedBy) {
  if (!ai) return '';

  }
  function list(label, arr, color) {
    if (!arr || !arr.length) return '';
    var items = arr.map(function(x){ return '<li style="margin-bottom:2px">' + esc(x) + '</li>'; }).join('');
    return '<div style="margin-top:6px"><div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:' + (color || 'var(--fg-3)') + ';margin-bottom:3px">' + esc(label) + '</div><ul style="margin:0;padding-left:16px;font-size:11.5px;color:var(--fg-1)">' + items + '</ul></div>';
  }
  var h = '<div class="tk-ins-card" style="background:var(--bg-2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:6px;padding:10px 12px;margin:6px 0 10px">';
  h += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="font-size:12px;font-weight:600;color:var(--fg-1)">✨ Insights del contrato</span>';
  h += '<button class="pa-btn pa-btn-ghost" style="height:20px;font-size:10px;padding:0 5px;margin-left:auto" title="Re-analizar" onclick="edAnalyzeContract(\'' + esc(taskId) + '\',\'' + esc(docId) + '\')">↻</button></div>';
  if (ai.resumen) h += '<div style="font-size:12px;color:var(--fg-1);margin-bottom:6px;line-height:1.4">' + esc(ai.resumen) + '</div>';
  h += row('Tipo', ai.tipoContrato);
  h += row('Partes', (ai.partes || []).join(' · '));
  h += row('Vigencia', ai.vigenciaTexto);
  h += row('Vence', ai.fechaVencimiento ? (ai.fechaVencimiento + (ai.autoRenovacion ? ' (auto-renovación)' : '')) : '');
  h += row('Jurisdicción', ai.jurisdiccion);
  h += row('Montos', ai.montos);
  h += row('Penalidades', ai.penalidades);
  if (ai.exclusividad) h += row('Exclusividad', 'Sí');
  h += list('Obligaciones clave', ai.obligacionesClave);
  h += list('⚠️ Riesgos', ai.riesgos, 'var(--warn-fg)');
  if (ai.fechaVencimiento) {
    h += '<div style="margin-top:8px"><button class="pa-btn pa-btn-outline" style="height:24px;font-size:11px" onclick="edCreateRenewalReminder(\'' + esc(taskId) + '\',\'' + esc(docId) + '\')">📅 Crear recordatorio de renovación</button></div>';
  }
  if (analyzedBy) h += '<div style="font-size:10px;color:var(--fg-4);margin-top:6px">Analizado por ' + esc(analyzedBy) + '</div>';
  h += '</div>';
  return h;
}

// Cmd+Enter envía. Optimistic: el comment aparece al instante en el
// thread mientras el server confirma.
function edPanelLoadComments(taskId) {
  if (!taskId) return;
  var host = $('tkComments'); if (!host) return;
  google.script.run
    .withSuccessHandler(function(comments) {
      _edPanelRenderComments(comments || [], taskId);
      // Bind Cmd+Enter en el textarea
      var ta = $('tkCommentInput');
      if (ta) {
        _mentionAttach(ta);
        ta.onkeydown = function(e) {
          // El picker de @menciones tiene prioridad sobre las teclas del textarea.
          if (typeof _mentionKeydown === 'function' && _mentionKeydown(e)) { e.preventDefault(); return; }

    })

function _meCommentEmail() {
  return (USER && USER.email) || (D && D._user && D._user.email) || '';
}

// ── @MENCIONES EN COMENTARIOS ───────────────────────────────────
// Escribir "@" en el textarea de comentario abre un picker del roster;
// elegir inserta "@Nombre Completo". El backend (_extractMentions) matchea
// ese nombre completo y le manda un aviso al mencionado. Al mostrar el
// comentario, las menciones se resaltan.
function _mentionNames() {
  return ((D && D.team) || []).map(function(m){ return m && m.name; }).filter(Boolean);
}
function _mentionNorm(s) {
  var out = (s == null ? '' : String(s));
  // Regex de diacríticos vía \u-escape (independiente del encoding del archivo).
  try { out = out.normalize('NFD').replace(new RegExp('[\\u0300-\\u036f]', 'g'), ''); } catch (e) {}
  return out.toLowerCase().replace(/\s+/g, ' ').trim();
}
// Resalta "@Nombre" en HTML YA escapado. Reemplaza el nombre más largo primero
// para no cortar "Juan" dentro de "Juan Camilo Gallego".
function _highlightMentions(escapedHtml) {
  var names = _mentionNames().slice().sort(function(a, b){ return b.length - a.length; });
  if (!names.length || escapedHtml.indexOf('@') < 0) return escapedHtml;
  var alt = names.map(function(n){
    return esc(n).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }).join('|');
  if (!alt) return escapedHtml;
  var re = new RegExp('@(' + alt + ')', 'gi');
  return escapedHtml.replace(re, '<span class="tk-mention">@$1</span>');
}

var _MENTION_STATE = { ta: null, pop: null, items: [], active: 0, start: -1 };
function _mentionClose() {
  if (_MENTION_STATE.pop && _MENTION_STATE.pop.parentNode) _MENTION_STATE.pop.parentNode.removeChild(_MENTION_STATE.pop);
  _MENTION_STATE.pop = null; _MENTION_STATE.items = []; _MENTION_STATE.start = -1;
}
// Detecta si el caret está dentro de un token "@..." (precedido por inicio o
// espacio) y devuelve {start, query} o null.
function _mentionContext(ta) {
  var pos = ta.selectionStart;
  var val = ta.value.slice(0, pos);
  var at = val.lastIndexOf('@');
  if (at < 0) return null;
  if (at > 0 && !/\s/.test(val.charAt(at - 1))) return null; // @ pegado a texto (email) → no
  var frag = val.slice(at + 1);
  // El query puede tener UN espacio (nombre + apellido) pero no saltos ni doble espacio.
  if (/[\n]/.test(frag) || frag.length > 40) return null;
  return { start: at, query: frag };
}
function _mentionRender(ta) {
  var ctx = _mentionContext(ta);
  if (!ctx) { _mentionClose(); return; }
  var q = _mentionNorm(ctx.query);
  var matches = _mentionNames().filter(function(n){
    var nn = _mentionNorm(n);
    return q === '' ? true : nn.indexOf(q) >= 0;
  }).slice(0, 6);
  if (!matches.length) { _mentionClose(); return; }
  _MENTION_STATE.ta = ta; _MENTION_STATE.items = matches; _MENTION_STATE.start = ctx.start;
  if (_MENTION_STATE.active >= matches.length) _MENTION_STATE.active = 0;
  if (!_MENTION_STATE.pop) {
    var pop = document.createElement('div');
    pop.className = 'tk-mention-pop';
    document.body.appendChild(pop);
    _MENTION_STATE.pop = pop;
  }
  var pop = _MENTION_STATE.pop;
  pop.innerHTML = matches.map(function(n, i){
    return '<div class="tk-mention-opt' + (i === _MENTION_STATE.active ? ' is-active' : '') + '" data-i="' + i + '" onmousedown="event.preventDefault();_mentionPick(' + i + ')">' + esc(n) + '</div>';
  }).join('');
  // Posicionar sobre el textarea.
  var r = ta.getBoundingClientRect();
  pop.style.left = r.left + 'px';
  pop.style.width = Math.max(180, r.width) + 'px';
  pop.style.top = (r.top - pop.offsetHeight - 4) + 'px';
}
function _mentionPick(i) {
  var st = _MENTION_STATE, ta = st.ta;
  if (!ta || st.start < 0) return;
  var name = st.items[i]; if (!name) return;
  var pos = ta.selectionStart;
  var before = ta.value.slice(0, st.start);
  var after = ta.value.slice(pos);
  var insert = '@' + name + ' ';
  ta.value = before + insert + after;
  var caret = (before + insert).length;
  ta.focus();
  try { ta.setSelectionRange(caret, caret); } catch (e) {}
  _mentionClose();
}
// Devuelve true si consumió la tecla (el caller debe frenar su default).
function _mentionKeydown(e) {
  if (!_MENTION_STATE.pop || !_MENTION_STATE.items.length) return false;
  if (e.key === 'ArrowDown') { _MENTION_STATE.active = (_MENTION_STATE.active + 1) % _MENTION_STATE.items.length; _mentionRender(_MENTION_STATE.ta); return true; }
  if (e.key === 'ArrowUp')   { _MENTION_STATE.active = (_MENTION_STATE.active - 1 + _MENTION_STATE.items.length) % _MENTION_STATE.items.length; _mentionRender(_MENTION_STATE.ta); return true; }
  if (e.key === 'Enter' || e.key === 'Tab') { _mentionPick(_MENTION_STATE.active); return true; }
  if (e.key === 'Escape') { _mentionClose(); return true; }
  return false;
}
function _mentionAttach(ta) {
  if (!ta) return;
  ta.addEventListener('input', function(){ _mentionRender(ta); });
  ta.addEventListener('blur', function(){ setTimeout(_mentionClose, 150); });
}
// Render de un solo comment item — usado por load (todos) y submit (append optimistic).
// `c` = { id, author_name, author_email, ts, body, edited_ts, deleted_ts }
function _commentItemHtml(c, opts) {
  opts = opts || {};
  var when = opts.fresh ? 'hace un momento' : _commentRelativeTime(c.ts);
  var initials = (c.author_name || '?').split(/\s+/).slice(0, 2).map(function(w){ return (w[0] || '').toUpperCase(); }).join('') || '?';
  var mine = c.author_email && (c.author_email === _meCommentEmail());
  var deleted = !!c.deleted_ts;
  var edited = !!c.edited_ts && !deleted;
  var bodyHtml = deleted
    ? '<i style="color:var(--fg-3)">(comentario eliminado)</i>'
    : _highlightMentions(esc(c.body || '')).replace(/\n/g, '<br>');
  var actions = '';
  if (mine && !deleted) {
    actions = '<div class="tk-comment-actions">'
            +   '<button class="pa-btn pa-btn-ghost" style="height:22px;font-size:11px;padding:0 8px" onclick="edPanelEditComment(\'' + esc(c.id) + '\')">Editar</button>'
            +   '<button class="pa-btn pa-btn-ghost" style="height:22px;font-size:11px;padding:0 8px;color:var(--critical-fg)" onclick="edPanelDeleteComment(\'' + esc(c.id) + '\')">Eliminar</button>'
            + '</div>';
  }
  return '<div class="tk-comment-item' + (mine ? ' mine' : '') + (deleted ? ' is-deleted' : '') + (opts.fresh ? ' new' : '') + '" data-comment-id="' + esc(c.id) + '" data-comment-body="' + esc(c.body || '') + '">'
       +    '<div class="tk-comment-av" title="' + esc(c.author_name || c.author_email || '') + '">' + esc(initials) + '</div>'
       +    '<div class="tk-comment-body">'
       +      '<div class="tk-comment-head">'
       +        '<span class="tk-comment-author">' + esc(c.author_name || c.author_email || 'Anónimo') + '</span>'
       +        '<span class="tk-comment-when">' + esc(when) + (edited ? ' · editado' : '') + '</span>'
       +        actions
       +      '</div>'
       +      '<div class="tk-comment-text">' + bodyHtml + '</div>'
       +    '</div>'
       + '</div>';
}

function _edPanelRenderComments(comments, taskId) {
  var host = $('tkComments'); if (!host) return;
  // Count en la tab — excluye eliminados para que el badge refleje el thread activo.
  var visible = comments.filter(function(c){ return !c.deleted_ts; });
  var countSpan = $('tkCommentsCount');
  if (countSpan) countSpan.textContent = '· ' + visible.length;
  if (!comments.length) {
    host.innerHTML = '<div class="tk-comments-empty">Aún no hay comentarios. Iniciá la conversación.</div>';
    return;
  }
  host.innerHTML = comments.map(function(c){ return _commentItemHtml(c); }).join('');
}

// Edit inline: reemplaza el .tk-comment-text del item por un textarea + botones
// Guardar/Cancelar. El body original lo guardamos en data-comment-body para
// poder volver si se cancela.
function edPanelEditComment(commentId) {
  var item = document.querySelector('.tk-comment-item[data-comment-id="' + commentId + '"]');
  if (!item) return;
  var bodyOrig = item.getAttribute('data-comment-body') || '';
  var textEl = item.querySelector('.tk-comment-text');
  var actionsEl = item.querySelector('.tk-comment-actions');

    + '<textarea class="tk-comment-edit-ta" style="width:100%;min-height:60px;padding:8px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg-1);color:var(--fg-1);font:inherit;font-size:13px;resize:vertical">' + esc(bodyOrig) + '</textarea>'

function edPanelCancelEditComment(commentId) {

  if (!item) return;
  var bodyOrig = item.getAttribute('data-comment-body') || '';
  var textEl = item.querySelector('.tk-comment-text');

function edPanelSubmitEditComment(commentId) {
  var item = document.querySelector('.tk-comment-item[data-comment-id="' + commentId + '"]');
  if (!item) return;
  var ta = item.querySelector('.tk-comment-edit-ta');
  if (!ta) return;
  var newBody = (ta.value || '').trim();
  if (!newBody) { toast('El comentario no puede quedar vacío.', 'error'); return; }
  ta.disabled = true;
  google.script.run
    .withSuccessHandler(function(res) {

        var c = res.comment;
        item.setAttribute('data-comment-body', c.body || '');
        var textEl = item.querySelector('.tk-comment-text');
        if (textEl) textEl.innerHTML = esc(c.body || '').replace(/\n/g, '<br>');

        var actionsEl = item.querySelector('.tk-comment-actions');

      } else {

      }
    })
    .withFailureHandler(function(e) {

    })

}
function edPanelDeleteComment(commentId) {
  confirm_('¿Eliminar este comentario? El hilo conserva la marca de eliminado.', function() {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {

          if (item) {

// Carga el audit trail real desde el backend (sheet Activity) y reemplaza
// el timeline sintético en el panel. Si no hay registros, deja el sintético.
function edPanelLoadActivity(taskId) {

    .withSuccessHandler(function(items) {
      var host = $('tkActivity'); if (!host) return;
      if (!items || !items.length) return; // dejar el sintético tal cual
      var html = '';
      items.slice(0, 12).forEach(function(it) {
        var when = _commentRelativeTime(it.ts);
        var iconName, dot, label;
        switch (it.action) {
          case 'create':         iconName = 'plus';    dot = 'info'; label = LANG === 'pt' ? 'criou a tarefa' : 'creó la tarea'; break;
          case 'comment':        iconName = 'msg';     dot = 'info'; label = LANG === 'pt' ? 'comentou' : 'comentó'; break;
          case 'close':          iconName = 'check';   dot = 'good'; label = LANG === 'pt' ? 'fechou' : 'cerró'; break;
          case 'reopen':         iconName = 'refresh'; dot = 'info'; label = LANG === 'pt' ? 'reabriu' : 'reabrió'; break;
          case 'block':          iconName = 'block';   dot = 'warn'; label = LANG === 'pt' ? 'pôs em on hold' : 'puso en on hold'; break;
          case 'reassign':       iconName = 'users';   dot = 'info'; label = (LANG === 'pt' ? 'reatribuiu a ' : 'reasignó a ') + esc(it.new_value || '—'); break;
          case 'status_change':  iconName = 'arrowR';  dot = 'info'; label = (LANG === 'pt' ? 'mudou status para ' : 'cambió estado a ') + '<b>' + esc(_statusLabel(it.new_value) || it.new_value) + '</b>'; break;
          default:               iconName = 'doc';     dot = 'info'; label = (LANG === 'pt' ? 'atualizou ' : 'actualizó ') + esc(it.field || 'campo');
        }

        html += '<div class="tk-hist-item">'
             +    '<span class="tk-hist-icon tone-' + dot + '">' + paIcon(iconName, 10) + '</span>'
             +    '<div style="font-size:13px;color:var(--fg-2)">' + author + label + '</div>'
             +    '<div class="pa-mono-sm">' + esc(when) + '</div>'

      host.innerHTML = html;
    })
    .withFailureHandler(function(){ /* dejar el sintético */ })
    .getTaskActivity(taskId);
}

// ────────────────────────────────────────────────────────────────
// NOTIFICACIONES IN-APP (badge en avatar + modal de actividad)
// ────────────────────────────────────────────────────────────────
// Estrategia: localStorage 'lt-activity-seen-ts' guarda el último ts
// que el user vio. Al cargar la app, fetch activity desde ese ts. Si
// hay >0, mostrar badge rojo con count en el avatar header. Click →
// modal con la lista. Marcar como vistas al cerrar el modal.
var ACTIVITY_SEEN_KEY = 'lt-activity-seen-ts';
var _NOTIF_RECENT = [];
function _activitySeenTs() {
  try { return localStorage.getItem(ACTIVITY_SEEN_KEY) || ''; }
  catch(e) { return ''; }
}
function _markActivitySeen() {
  try { localStorage.setItem(ACTIVITY_SEEN_KEY, new Date().toISOString()); } catch(e){}
}
function edNotifLoad() {
  google.script.run
    .withSuccessHandler(function(items) {
      var prev = _NOTIF_RECENT.length;
      _NOTIF_RECENT = items || [];
      edNotifRenderBadge();
      // Si llegaron novedades mientras trabajás (no en la primera carga),
      // un toast suave avisa sin interrumpir — "generar la notificación
      // dentro del dash" en vivo, sin recargar.
      if (_NOTIF_POLL_STARTED && _NOTIF_RECENT.length > prev && typeof toast === 'function') {
        var n = _NOTIF_RECENT.length - prev;
        toast('🔔 ' + n + ' ' + (LANG === 'pt'
          ? (n === 1 ? 'nova notificação' : 'novas notificações')
          : (n === 1 ? 'notificación nueva' : 'notificaciones nuevas')), 'info');
      }
    })
    .withFailureHandler(function(){ /* silent */ })
    .getMyRecentActivity(_activitySeenTs());
}
// Refresco periódico del inbox (cada 60s) para que las notificaciones
// aparezcan en vivo sin recargar. Un solo intervalo (guard de re-mount).
var _NOTIF_POLL_STARTED = false;
function _notifStartPolling() {
  if (_NOTIF_POLL_STARTED) return;
  _NOTIF_POLL_STARTED = true;
  setInterval(function(){
    // No pollear con un modal/panel pesado abierto (evita parpadeos y carga).
    if (document.getElementById('edNotifOv')) return;
    edNotifLoad();
  }, 60000);
}
function edNotifRenderBadge() {
  // El badge vive en el bell del header (más visible); fallback al avatar
  // si por algún motivo el bell no está montado.
  var btn = document.getElementById('edBellBtn') || document.querySelector('.pa-hd-avatar');
  if (!btn) return;
  var dot = document.getElementById('paAvNotifDot');
  if (dot) dot.remove();
  if (!_NOTIF_RECENT.length) return;
  var d = document.createElement('span');
  d.id = 'paAvNotifDot';
  d.className = 'pa-av-notif-dot';
  d.textContent = _NOTIF_RECENT.length > 9 ? '9+' : String(_NOTIF_RECENT.length);
  btn.style.position = 'relative';
  btn.appendChild(d);
}
// Label para una notificación action='colaboradores'. El backend manda
// old_value/new_value = JSON de la lista [{name,role}]. Si MI nombre está en
// la lista nueva y NO en la vieja → me acaban de agregar; sino, es un update
// genérico de la lista. Parseo defensivo: si el JSON falla, cae al genérico.
function _notifColabLabel(it) {
  function inList(json) {
    try {
      var arr = JSON.parse(json || '[]');
      if (!Array.isArray(arr)) return false;
      var me = _effectiveUserName();
      for (var i = 0; i < arr.length; i++) {
        if (arr[i] && _colabNameEq(arr[i].name, me)) return true;
      }
    } catch (e) {}
    return false;
  }
  var inNew = inList(it.new_value);
  var inOld = inList(it.old_value);
  if (inNew && !inOld) return LANG === 'pt' ? 'adicionou você como colaborador' : 'te agregó como colaborador';
  return LANG === 'pt' ? 'atualizou os colaboradores' : 'actualizó los colaboradores';
}
function edNotifOpen() {
  edUserMenuClose();
  var items = _NOTIF_RECENT || [];
  var ov = document.createElement('div');
  ov.className = 'cr-overlay';
  ov.id = 'edNotifOv';
  ov.onclick = function(e){ if (e.target === ov) edNotifClose(); };
  var rows = '';
  if (!items.length) {
    rows = '<div style="padding:32px 20px;text-align:center;color:var(--fg-3);font-size:13px">'
         + esc(LANG === 'pt' ? 'Sem notificações novas.' : 'Sin notificaciones nuevas.')
         + '</div>';
  } else {
    items.forEach(function(it) {
      var when = _commentRelativeTime(it.ts);
      var actLabel;
      switch (it.action) {
        case 'comment':       actLabel = LANG === 'pt' ? 'comentou em' : 'comentó en'; break;
        case 'close':         actLabel = LANG === 'pt' ? 'fechou' : 'cerró'; break;
        case 'reopen':        actLabel = LANG === 'pt' ? 'reabriu' : 'reabrió'; break;
        case 'block':         actLabel = LANG === 'pt' ? 'pôs em on hold' : 'puso en on hold'; break;
        case 'reassign':      actLabel = (LANG === 'pt' ? 'reatribuiu a você' : 'te asignó'); break;
        case 'mention':       actLabel = (LANG === 'pt' ? 'mencionou você em' : 'te mencionó en'); break;
        case 'status_change': actLabel = (LANG === 'pt' ? 'mudou status de' : 'cambió estado de'); break;
        case 'colaboradores': actLabel = _notifColabLabel(it); break;
        default:              actLabel = (LANG === 'pt' ? 'atualizou' : 'actualizó');
      }
      rows += '<div class="ed-notif-row" onclick="edNotifClose();edGoTaskInTracker(\'' + esc(it.task_id) + '\')">'
           +    '<div style="font-size:13px;color:var(--fg-1)">'
           +      '<b>' + esc(it.author_name || '—') + '</b> ' + esc(actLabel) + ' <b>#' + esc(it.task_id) + '</b>'
           +    '</div>'
           +    '<div style="font-size:11px;color:var(--fg-3);margin-top:2px">' + esc(when) + '</div>'
           + '</div>';
    });
  }
  ov.innerHTML = '<div class="cr-modal" style="max-width:520px;max-height:80vh;display:flex;flex-direction:column">'
              +    '<div class="cr-head"><div><div class="cr-eye">— ' + esc(LANG === 'pt' ? 'Atividade' : 'Actividad') + '</div>'
              +    '<div class="cr-title">' + esc(LANG === 'pt' ? 'Novidades em suas tarefas' : 'Novedades en tus tareas') + '</div></div>'
              +    '<button class="cr-x" onclick="edNotifClose()" aria-label="' + esc(t('Cerrar')) + '">×</button></div>'
              +    '<div style="flex:1;overflow-y:auto;padding:8px 14px 14px">' + rows + '</div>'
              + '</div>';
  document.body.appendChild(ov);
  _markActivitySeen();
  // Limpiar count del badge tras 1s (UX: el user lo ve un momento más)
  setTimeout(function(){ _NOTIF_RECENT = []; edNotifRenderBadge(); }, 1000);
}
function edNotifClose() {
  var ov = document.getElementById('edNotifOv'); if (ov) ov.remove();
}

function _commentRelativeTime(iso) {
  if (!iso) return '';
  var ms = new Date(iso).getTime();
  if (isNaN(ms)) return iso;
  return _relativeAgo(ms);
}
function edPanelSubmitComment(taskId) {
  var ta = $('tkCommentInput'); if (!ta) return;
  var body = (ta.value || '').trim();
  if (!body) { toast('Escribí un comentario primero', 'error'); return; }
  var btn = $('tkCommentSubmit');
  if (btn) { btn.disabled = true; btn.textContent = 'Enviando…'; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (btn) { btn.disabled = false; btn.textContent = 'Enviar'; }
      if (res && res.success && res.comment) {
        var host = $('tkComments');
        if (host) {
          if (host.querySelector('.tk-comments-empty')) host.innerHTML = '';
          var c = res.comment;
          // Reusar el helper para que el item recién creado tenga los mismos
          // botones Editar/Eliminar que cargan al refresh — sin esto el botón
          // aparece solo después de un reload.
          host.insertAdjacentHTML('beforeend', _commentItemHtml(c, { fresh: true }));
          host.scrollTop = host.scrollHeight;
          // Update count del tab
          var countSpan = $('tkCommentsCount');
          if (countSpan) {
            var n = host.querySelectorAll('.tk-comment-item:not(.is-deleted)').length;
            countSpan.textContent = '· ' + n;
          }
        }
        ta.value = '';
        toast('Comentario enviado', 'success');
        // Auto-promote: si comentar pasó la tarea de Pendiente a En curso, lo
        // reflejamos (antes el backend lo hacía pero el pill quedaba desfasado
        // hasta un reload manual).
        if (res.promoted) {
          var _tk = (D.tasks || []).find(function(x){ return String(x.id) === String(taskId); });
          if (_tk) _tk.status = res.promoted;
          toast(LANG === 'pt' ? 'Tarefa movida para Em andamento' : 'Tarea movida a En curso', 'info');
          if (typeof _edScheduleReload === 'function') _edScheduleReload();
        }
      } else {
        toast('Error: ' + ((res && res.error) || 'no se pudo enviar'), 'error');
      }
    })
    .withFailureHandler(function(e) {
      if (btn) { btn.disabled = false; btn.textContent = 'Enviar'; }
      console.error('addTaskComment failure', e);
      toast('Error del backend: ' + (e && e.message || 'desconocido'), 'error');
    })
    .addTaskComment(taskId, body);
}

function _buildEdTimeline(t) {
  // Timeline sintética desde campos disponibles. No tocamos backend en Fase 1.
  var items = [];
  if (_isOverdueTask(t)) {
    items.push({ when: 'Hoy', what: 'Marcada como <b>vencida</b>. Revisá la siguiente acción.', dot: 'crit' });
  } else if (t.etaDays === 0) {
    items.push({ when: 'Hoy', what: '<b>Vence hoy.</b> Cerrar antes de fin de día.', dot: 'crit' });
  }
  if (t.status === 'Bloqueado' && t.blockedReason) {
    items.push({ when: '—', what: 'Estado: <b>Bloqueada</b> · ' + esc(t.blockedReason), dot: 'crit' });
  }
  if (t.cerrado) {
    items.push({ when: t.cerrado, what: 'Tarea <b>cerrada</b>.', dot: 'good' });
  }
  if (t.creado) {
    items.push({ when: t.creado, what: 'Tarea creada' + (t.resp ? ' · asignada a <b>' + esc(t.resp) + '</b>' : ''), dot: 'info' });
  }
  if (items.length === 0) {
    items.push({ when: '—', what: 'Sin actividad registrada.', dot: 'info' });
  }
  return items;
}

// HQ countries-first landing for the global tracker. Grid de países
// con KPIs clave + sparkline. Click → drill-down al tracker filtrado.
function _rEdTrackerHQCountries(D, v) {
  var countries = (D && D.countries) || [];
  var allTasks = (D && D.tasks) || [];
  var totalOpen   = allTasks.filter(function(t){ return t.status !== 'Listo'; }).length;
  var totalOver   = countries.reduce(function(a, c){ return a + (c.overdue || 0); }, 0);
  var totalAtRisk = countries.filter(function(c){ return (c.overdue || 0) > 3 || (c.slaPct != null && c.slaPct < 85); }).length;
  // SLA LATAM: usar el agregado del backend (ponderado por cierres — el mismo
  // número que la home HQ). El promedio simple por país contaba los null como
  // 0 y cada vista del head mostraba un "SLA LATAM" distinto.
  var slaAvg = (D && D.latam && typeof D.latam.slaPct === 'number') ? D.latam.slaPct : null;
  if (slaAvg == null) {
    var _withSla = countries.filter(function(c){ return typeof c.slaPct === 'number'; });
    slaAvg = _withSla.length ? Math.round(_withSla.reduce(function(a, c){ return a + c.slaPct; }, 0) / _withSla.length) : 0;
  }
  // Sort: worst first (overdue desc, then sla asc)
  var sorted = countries.slice().sort(function(a, b) {
    var dOv = (b.overdue || 0) - (a.overdue || 0);
    if (dOv !== 0) return dOv;
    return (a.slaPct || 0) - (b.slaPct || 0);
  });
  // Max trend value across all countries for sparkline normalization
  var maxTrend = 1;
  countries.forEach(function(c) {
    (c.trend || []).forEach(function(n){ if (n > maxTrend) maxTrend = n; });
  });

  var html = ''
    + '<div class="ed-eye">' + esc(t('Tracker global')) + ' · ' + countries.length + ' ' + esc(t('países')) + '</div>'
    + '<h1 class="ed-h1" style="margin-bottom:8px">' + t('LATAM <em>de un vistazo</em>.') + '</h1>'
    + '<p class="ed-lede" style="margin-bottom:28px"><b>' + totalOpen + '</b> ' + esc(t('tareas activas en')) + ' <b>' + countries.length + '</b> ' + esc(t('países'))
    +   (totalOver ? '. <span class="crit">' + totalOver + ' ' + esc(t('vencidas')) + '</span> ' + esc(t('ahora mismo')) : '')
    +   '. ' + esc(t('Elegí un país para entrar al detalle o saltá a todos los países.')) + '</p>';

  // Hero summary band (4 KPIs)
  html += '<div class="hq-summary-band">'
       +    '<div class="hq-summary-stat"><div class="lbl">' + esc(t('Activas')) + '</div><div class="num">' + (totalOpen || '—') + '</div><div class="ctx">' + esc(t('en LATAM')) + '</div></div>'
       +    '<div class="hq-summary-stat"><div class="lbl">' + esc(t('Vencidas')) + '</div><div class="num crit">' + (totalOver || '—') + '</div><div class="ctx">' + esc(totalOver ? t('reasignar') : t('todo en orden')) + '</div></div>'
       +    '<div class="hq-summary-stat"><div class="lbl">' + esc(t('SLA promedio')) + '</div><div class="num good">' + (slaAvg ? slaAvg + '%' : '—') + '</div><div class="ctx">' + esc(t('en tiempo')) + '</div></div>'
       +    '<div class="hq-summary-stat"><div class="lbl">' + esc(t('En riesgo')) + '</div><div class="num crit">' + (totalAtRisk || '—') + '</div><div class="ctx">' + esc(totalAtRisk ? t('monitorear') : t('sin riesgo')) + '</div></div>'
       + '</div>';

  // Quick action: jump to all-tasks tracker (skip the countries-first)
  html += '<div class="hq-quick-actions">'
       +    '<button class="ed-btn" onclick="edSetCountryFilter(\'__ALL__\')">' + esc(t('Ver todos los países juntos →')) + '</button>'
       + '</div>';

  // Country grid header
  html += '<section class="ed-section">'
       +    '<div class="ed-h2">— ' + esc(t('Países')) + '</div>';

  if (!sorted.length) {
    html += '<div class="ed-lede">' + esc(t('No hay datos de países disponibles.')) + '</div></section>';
    v.innerHTML = html;
    return;
  }

  html += '<div class="hq-country-grid">';
  sorted.forEach(function(c) {
    var sla = c.slaPct == null ? null : c.slaPct;
    var slaCls = sla == null ? 'dim' : (sla >= 90 ? 'good' : (sla >= 75 ? 'warn' : 'crit'));
    var ovCls = (c.overdue || 0) > 3 ? 'crit' : ((c.overdue || 0) > 0 ? 'warn' : '');
    var atRisk = (c.overdue || 0) > 3 || (sla != null && sla < 85);
    var trend = c.trend || [];
    // Build sparkline polyline
    var sparkSvg = '<svg class="hq-card-spark" viewBox="0 0 100 28" preserveAspectRatio="none">';
    if (trend.length > 1) {
      var pts = trend.map(function(n, i) {
        var x = (i / (trend.length - 1)) * 100;
        var y = 28 - (n / maxTrend) * 26 - 1;
        return x.toFixed(1) + ',' + y.toFixed(1);
      }).join(' ');
      sparkSvg += '<polyline points="' + pts + '" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    sparkSvg += '</svg>';
    var leader = c.leader || c.lider || '—';
    var name = c.name || c.code || '—';

    html += '<div class="hq-card ' + (atRisk ? 'at-risk' : '') + '" onclick="edSetCountryFilter(\'' + esc(c.code || '') + '\')" tabindex="0" role="button" '
         +    'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();edSetCountryFilter(\'' + esc(c.code || '') + '\');}" aria-label="' + esc(t('Entrar a')) + ' ' + esc(name) + '">'
         +    '<div class="hq-card-head">'
         +      '<div class="hq-card-flag">' + esc(c.code || '??') + '</div>'
         +      '<div class="hq-card-meta">'
         +        '<div class="hq-card-name">' + esc(name) + '</div>'
         +        '<div class="hq-card-lead">' + esc(leader) + '</div>'
         +      '</div>'
         +      (atRisk ? '<div class="hq-card-flag-risk" title="' + esc(t('En riesgo')) + '">⚠</div>' : '')
         +    '</div>'
         +    '<div class="hq-card-stats">'
         +      '<div class="hq-card-stat"><div class="num">' + (c.open || 0) + '</div><div class="lbl">' + esc(t('Activas')) + '</div></div>'
         +      '<div class="hq-card-stat"><div class="num ' + ovCls + '">' + (c.overdue || 0) + '</div><div class="lbl">' + esc(t('Vencidas')) + '</div></div>'
         +      '<div class="hq-card-stat"><div class="num ' + slaCls + '">' + (sla == null ? '—' : sla + '%') + '</div><div class="lbl">SLA</div></div>'
         +    '</div>'
         +    '<div class="hq-card-spark-wrap ' + slaCls + '">'
         +      '<span class="hq-card-spark-lbl">' + esc(t('Throughput de 12 semanas')) + '</span>'
         +      sparkSvg
         +    '</div>'
         +    '<div class="hq-card-cta">' + esc(t('Entrar →')) + '</div>'
         + '</div>';
  });
  html += '</div></section>';

  v.innerHTML = html;
}

function rEdTracker(D) {
  var v = $('vEdTracker'); if (!v) return;
  var role = _effectiveRole();
  var userName = _effectiveUserName();
  var userCode = _effectiveUserCode();
  var allTasks = (D && D.tasks) || [];

  if (role === 'head' && !EDT.country && !EDT.selectedId && !EDT.skipCountriesView) {
    return _rEdTrackerHQCountries(D, v);
  }

  var roleTasks = _edFilterByRole(allTasks, role, userName, userCode);
  // Para el filter 'closed' incluimos también las del historial (que ya están
  // cerradas — sheet Historial). Aplicamos el mismo filtro de rol.
  var allHist = (D && D.historial) || [];
  var roleHist = _edFilterByRole(allHist, role, userName, userCode);
  var cClosed = roleHist.length;

  var cAll      = roleTasks.filter(function(t){ return t.status !== 'Listo'; }).length;
  var cOverdue  = roleTasks.filter(_isOverdueTask).length;
  var cToday    = roleTasks.filter(function(t){ return t.etaDays === 0 && t.status !== 'Listo' && t.status !== 'Bloqueado'; }).length;
  var cBlocked  = roleTasks.filter(function(t){ return t.status === 'Bloqueado'; }).length;
  var cMine     = roleTasks.filter(function(t){ return t.resp === userName && t.status !== 'Listo'; }).length;
  var cShared   = roleTasks.filter(function(t){ return _isSharedWithMe(t) && t.status !== 'Listo'; }).length;
  var cAlta     = roleTasks.filter(function(t){ return t.priority === 'Alta' && t.status !== 'Listo'; }).length;
  var cNoDate   = roleTasks.filter(function(t){ return t.etaDays == null && t.status !== 'Listo'; }).length;

  // Cuando el filtro es 'closed', la fuente de tareas es el historial (las que
  // ya fueron movidas al sheet Historial). Sino, la fuente es D.tasks (activas).
  var sourceTasks = EDT.filter === 'closed' ? roleHist : roleTasks;
  var rows = _edApplySearch(_edApplySecondaryFilters(_edApplyFilter(sourceTasks, EDT.filter)), EDT.search);
  rows = _edSortByUrgency(rows);

  // La selección bulk solo puede contener tareas actualmente visibles: si el
  // usuario cambió filtro/búsqueda/país, descartamos lo que quedó fuera. Sin
  // esto, la bulkbar decía "3 seleccionadas" y mutaba tareas que ya no se ven.
  if ((EDT.selectedIds || []).length) {
    var _visIds = {};
    rows.forEach(function(r){ _visIds[String(r.id)] = 1; });
    EDT.selectedIds = EDT.selectedIds.filter(function(id){ return _visIds[String(id)] === 1; });
  }

  // sel puede venir de rows visibles, de roleTasks (activas) o de roleHist (cerradas).
  // Necesario buscar en historial también para abrir tareas Listo desde el panel.
  var sel = EDT.selectedId
    ? (rows.find(function(t){ return t.id == EDT.selectedId; })
       || roleTasks.find(function(t){ return t.id == EDT.selectedId; })
       || roleHist.find(function(t){ return t.id == EDT.selectedId; }))
    : null;

  var scopeLabel;
  if (EDT.country) scopeLabel = EDT.country;
  else if (role === 'head') scopeLabel = 'Global';
  else if (role === 'manager') scopeLabel = t('Equipo') + ' ' + (userCode || '');
  else scopeLabel = t('Tus tareas');

  var html = '<div class="pa-page" style="max-width:1280px">';

  // Page header
  html += '<div class="pa-page-h">'
       +    '<span class="pa-page-title">Tracker</span>'
       +    '<span class="pa-page-sub">' + cAll + ' ' + esc(t('tareas activas')) + ' · ' + esc(scopeLabel) + '</span>'
       +    '<div class="pa-page-meta">';
  if (role === 'head' && (EDT.country || EDT.skipCountriesView)) {
    html += '<button class="pa-btn pa-btn-outline" onclick="edClearCountryFilter()">' + paIcon('arrowR', 12, '', 'transform:rotate(180deg)') + ' ' + esc(t('Volver a países')) + '</button>';
  }
  if (role === 'manager' || role === 'head') {
    html += '<button class="pa-btn pa-btn-outline" onclick="edExportMenuToggle(event)" id="edExportBtn">' + paIcon('download', 12) + ' ' + esc(t('Exportar')) + '</button>';
    html += '<div class="dd-menu" id="edExportMenu" style="display:none;position:absolute;right:32px;top:90px;min-width:220px">'
         +    '<button class="dd-item" onclick="exportToXLSX()">' + paIcon('download', 13, 'ico') + ' ' + esc(t('Excel (vista actual)')) + '</button>'
         +    '<button class="dd-item" onclick="edExportPDFOpen()">' + paIcon('doc', 13, 'ico') + ' ' + esc(t('PDF mensual')) + '</button>'
         + '</div>';
  }
  html += '</div></div>';

  // Filter chips
  function chip(key, label, count, tone, active) {
    var cls = 'pa-chip';
    if (tone === 'critical') cls += ' is-critical';
    if (tone === 'warn') cls += ' is-warn';
    if (active) cls += ' is-active';
    return '<div class="' + cls + '" onclick="edSetFilter(\'' + key + '\')">' + esc(label) + ' <span class="ct">' + count + '</span></div>';
  }

  html += '<div class="pa-filterbar">'
       +    chip('all',     t('Activas'),         cAll,     null,       EDT.filter === 'all')
       +    chip('overdue', t('Vencidas'),        cOverdue, 'critical', EDT.filter === 'overdue')
       +    chip('today',   t('Vencen hoy'),      cToday,   'warn',     EDT.filter === 'today')
       +    chip('blocked', t('On hold'),         cBlocked, null,       EDT.filter === 'blocked')
       +    chip('alta',    t('Prioridad alta'),  cAlta,    null,       EDT.filter === 'alta')
       +    '<div class="pa-chip-divider"></div>'
       +    (role !== 'specialist' ? chip('mine', t('Asignadas a mí'), cMine, null, EDT.filter === 'mine') : '')
       +    ((cShared > 0 || EDT.filter === 'shared') ? chip('shared', t('Compartidas conmigo'), cShared, 'info', EDT.filter === 'shared') : '')
       +    ((cNoDate > 0 || EDT.filter === 'nodate') ? chip('nodate', t('Sin plazo'), cNoDate, 'warn', EDT.filter === 'nodate') : '')
       +    chip('closed',  t('Cerradas'),        cClosed,  null,       EDT.filter === 'closed')
       +    '<div style="margin-left:auto;display:flex;gap:6px;align-items:center">'
       +      '<div class="pa-search" style="width:220px">'
       +        paIcon('search', 12)
       +        '<input type="text" placeholder="' + esc(t('Buscar en tracker…')) + '" value="' + esc(EDT.search) + '" oninput="edSetSearch(this.value)">'
       +      '</div>';
  // Country select (head only): drill-down rápido país-por-país sin volver al countries-first.
  if (role === 'head') {
    var allCountries = (D && D.countries) || [];
    var countryOpts = allCountries
      .slice()
      .sort(function(a, b){ return (b.open || 0) - (a.open || 0); })
      .map(function(c) {
        var selA = (EDT.country === c.code) ? ' selected' : '';
        // Mostrar "Global" cuando el code es HQ, no "HQ · Global"
        var displayCode = paCountryLabel(c.code);
        var label = (c.code === 'HQ' ? displayCode : (c.code + ' · ' + (c.name || c.code))) + (c.open ? ' (' + c.open + ')' : '');
        return '<option value="' + esc(c.code) + '"' + selA + '>' + esc(label) + '</option>';
      }).join('');
    if (countryOpts) {
      html += '<select class="pa-select" style="width:auto;height:26px;font-size:12px;padding:0 28px 0 10px" onchange="edSetCountryFilter(this.value || \'__ALL__\')">'
           +    '<option value="">' + esc(t('Todos los países')) + '</option>' + countryOpts
           + '</select>';
    }
  }
  // Project select
  var pIdsWithTasks = {};
  roleTasks.forEach(function(t){ if (t.proyectoId) pIdsWithTasks[t.proyectoId] = true; });
  var projOpts = (D && D.projects || [])
    .filter(function(p){ return pIdsWithTasks[p.id]; })
    .sort(function(a,b){ return (a.nombre || '').localeCompare(b.nombre || ''); })
    .map(function(p) {
      var selAttr = (String(EDT.projectFilter || '') === String(p.id)) ? ' selected' : '';
      return '<option value="' + esc(p.id) + '"' + selAttr + '>' + esc(p.nombre || '#' + p.id) + '</option>';
    }).join('');
  if (projOpts) {
    html += '<select class="pa-select" style="width:auto;height:26px;font-size:12px;padding:0 28px 0 10px" onchange="edSetProjectFilter(this.value)">'
         +    '<option value="">' + esc(t('Todos los proyectos')) + '</option>' + projOpts
         + '</select>';
  }
  // Cliente (área solicitante) select — usa Config.ClientesInternos. Mostramos
  // siempre la lista entera (no solo los que tienen tareas) para que la dimensión
  // sea descubrible aunque no haya tareas taggeadas todavía.
  var clienteOpts = _clientesInternos().map(function(c) {
    var sel = (EDT.clienteFilter === c) ? ' selected' : '';
    return '<option value="' + esc(c) + '"' + sel + '>' + esc(c) + '</option>';
  }).join('');
  if (clienteOpts) {
    html += '<select class="pa-select" style="width:auto;height:26px;font-size:12px;padding:0 28px 0 10px" onchange="edSetClienteFilter(this.value)">'
         +    '<option value="">' + esc(t('Todos los clientes')) + '</option>' + clienteOpts
         + '</select>';
  }
  html += '</div></div>';

  // Indicador de filtro principal activo (no-default): cuando un user vuelve
  // mañana y dejó "Bloqueadas" o "Cerradas" persistido, el chip se ve activo
  // pero puede no ser obvio que solo está viendo una porción. Banner sutil
  // arriba del filterbar con "X de Y" + atajo para limpiar.
  var primaryNonDefault = EDT.filter && EDT.filter !== 'all';
  var totalScope = (EDT.filter === 'closed') ? roleHist.length : cAll;
  if (primaryNonDefault || EDT.search) {
    var filterLabels = {
      overdue: 'Vencidas', today: 'Vencen hoy', blocked: 'On hold',
      alta: 'Prioridad alta', mine: 'Asignadas a mí', shared: 'Compartidas conmigo', closed: 'Cerradas'
    };
    var filtLbl = filterLabels[EDT.filter] || 'filtro';
    html += '<div class="pa-filter-active">'
         +    paIcon('search', 12)
         +    '<span>Viendo <b>' + (EDT.search ? 'búsqueda "' + esc(EDT.search) + '"' : filtLbl) + '</b> · ' + rows.length + ' de ' + totalScope + (totalScope === 1 ? ' tarea' : ' tareas') + '</span>'
         +    '<button class="pa-btn pa-btn-ghost" style="margin-left:auto;font-size:11px;height:22px" onclick="edSetFilter(\'all\');edSetSearch(\'\')">Limpiar</button>'
         + '</div>';
  }

  // Active secondary filters (proyecto, resp, conf)
  if (EDT.projectFilter || EDT.respFilter || EDT.confFilter || EDT.clienteFilter) {
    html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;align-items:center">';
    if (EDT.projectFilter) {
      var pName2 = (D && D.projects || []).find(function(p){ return String(p.id) === String(EDT.projectFilter); });
      var pLbl2 = pName2 ? pName2.nombre : ('#' + EDT.projectFilter);
      html += '<span class="pa-pill pa-pill-tipo">' + esc(t('Proyecto')) + ': ' + esc(pLbl2) + ' <span style="cursor:pointer;margin-left:4px" onclick="edSetProjectFilter(null)">×</span></span>';
    }
    if (EDT.respFilter) {
      html += '<span class="pa-pill pa-pill-tipo">Resp: ' + esc(EDT.respFilter) + ' <span style="cursor:pointer;margin-left:4px" onclick="edSetRespFilter(null)">×</span></span>';
    }
    if (EDT.confFilter) {
      var cfMeta3 = (typeof ED_CONF_LEVELS !== 'undefined' && ED_CONF_LEVELS[EDT.confFilter]) || { label: EDT.confFilter };
      html += '<span class="pa-pill pa-pill-tipo">Conf: ' + esc(cfMeta3.label) + ' <span style="cursor:pointer;margin-left:4px" onclick="edSetConfFilter(null)">×</span></span>';
    }
    if (EDT.clienteFilter) {
      html += '<span class="pa-pill pa-pill-tipo">' + esc(t('Cliente')) + ': ' + esc(EDT.clienteFilter) + ' <span style="cursor:pointer;margin-left:4px" onclick="edSetClienteFilter(null)">×</span></span>';
    }
    html += '<button class="pa-btn pa-btn-ghost" style="font-size:11px;height:22px" onclick="edClearSecondaryFilters()">' + esc(t('Limpiar')) + '</button>';
    html += '</div>';
  }

  // Bulk action bar
  var bulkCount = (EDT.selectedIds || []).length;
  var canReassign = _canAssignToOthers(); // rol real, no demo
  // Bulk actions no aplican a tareas cerradas (Listo) — el backend espera
  // tasks activas. Si filter === 'closed' ocultamos la barra para no
  // exponer botones que tirarian 404 silenciosos al ejecutarse.
  if (bulkCount > 0 && EDT.filter !== 'closed') {
    html += '<div class="pa-bulkbar">'
         +    paIcon('check', 13)
         +    '<b style="font-weight:600">' + bulkCount + ' ' + esc(bulkCount > 1 ? t('seleccionadas') : t('seleccionada')) + '</b>'
         +    '<span style="color:var(--fg-3);font-size:12px">·</span>'
         +    '<button class="pa-btn" onclick="edTkBulkAction(\'avanzar\')">' + paIcon('arrowR', 12) + ' ' + esc(t('Avanzar')) + '</button>'
         +    '<button class="pa-btn" onclick="edTkBulkAction(\'bloquear\')">' + paIcon('block', 12) + ' ' + esc(t('Poner on hold')) + '</button>'
         +    (canReassign ? '<button class="pa-btn" onclick="edTkBulkAction(\'reasignar\')">' + paIcon('users', 12) + ' ' + esc(t('Reasignar')) + '</button>' : '')
         +    '<button class="pa-btn pa-btn-ghost" style="margin-left:auto;color:var(--fg-2)" onclick="edTkBulkClear()">' + esc(t('Cancelar')) + '</button>'
         + '</div>';
  }

  // VIEW MODE: lista plana vs agrupado por urgencia. "Por urgencia" reemplaza
  // a la vieja vista del mismo nombre: ahora es un modo del Tracker.
  var groupByUrgency = (EDT.groupBy === 'urgency' && EDT.filter !== 'closed');
  html += '<div class="pa-tbl-viewmode" style="display:flex;gap:6px;align-items:center;margin:0 0 12px">'
       +    '<span class="pa-meta-sm" style="margin-right:2px">' + esc(t('Ver')) + ':</span>'
       +    '<div class="pa-chip' + (!groupByUrgency ? ' is-active' : '') + '" onclick="edTkSetGroupBy(\'none\')">' + esc(t('Lista')) + '</div>'
       +    '<div class="pa-chip' + (groupByUrgency ? ' is-active' : '') + '" onclick="edTkSetGroupBy(\'urgency\')">' + esc(t('Por urgencia')) + '</div>'
       + '</div>';

  // TABLE
  var totalRows = rows.length;
  var selN = (EDT.selectedIds || []).length;
  var masterCls = 'pa-check';
  if (totalRows > 0 && selN === totalRows) masterCls += ' is-checked';
  else if (selN > 0) masterCls += ' is-indeterminate';
  var masterTitle = (selN === totalRows && totalRows > 0) ? t('Deseleccionar todo') : t('Seleccionar todo');
  // Specialist: sin columna Proyecto — siempre mostraba "—" o duplicaba el
  // chip de proyecto que ya vive bajo el título. El ancho liberado va a la
  // columna Tarea (variante .is-no-proj del grid). Manager/head conservan
  // su columna Responsable.
  var tblCls = 'pa-tbl' + (role === 'specialist' ? ' is-no-proj' : '');
  var tblHeader = '<div class="pa-tbl-h">'
       +      '<div onclick="edTkMasterToggle()" title="' + esc(masterTitle) + '" style="cursor:pointer;display:grid;place-items:center"><span class="' + masterCls + '"></span></div>'
       +      '<div title="' + esc(t('Confidencialidad')) + '" aria-label="' + esc(t('Confidencialidad')) + '"></div>'
       +      '<div>ID</div>'
       +      '<div>' + esc(t('Tarea')) + '</div>'
       +      (role === 'specialist' ? '' : '<div>' + esc(t('Responsable')) + '</div>')
       +      '<div>' + esc(t('Prioridad')) + '</div>'
       +      '<div>' + esc(t('Estado')) + '</div>'
       +      '<div>ETA</div>'
       +    '</div>';

  if (rows.length === 0) {
    // Head drilleado en un país sin tareas (p.ej. HQ) pero con tareas activas en
    // otros países: no es "creá tu primera tarea" (eso miente), es "este país está
    // vacío, volvé a países". Detecta drill activo + tareas activas en el dataset.
    var emptyDrillNoTasks = cAll === 0 && role === 'head' && EDT.country
      && allTasks.some(function(t){ return t.status !== 'Listo'; });
    var emptyIc = cAll === 0 ? (emptyDrillNoTasks ? 'globe' : 'inbox') : 'search';
    var emptyMsg, emptyHint;
    if (emptyDrillNoTasks) {
      emptyMsg = t('{país} no tiene tareas activas.').replace('{país}', paCountryLabel(EDT.country) || EDT.country);
      emptyHint = t('Volvé a países para ver el resto de LATAM.');
    } else if (cAll === 0) {
      emptyMsg = role === 'specialist' ? t('No tenés tareas activas en tu agenda.') : t('No hay tareas activas que trackear.');
      emptyHint = role === 'specialist' ? t('Aprovechá para trabajo de proyecto.') : t('Creá una tarea para empezar.');
    } else if (EDT.search) {
      emptyMsg = t('No hay tareas que coincidan con') + ' "' + esc(EDT.search) + '".';
      emptyHint = t('Probá con menos filtros o limpiá la búsqueda.');
    } else {
      emptyMsg = t('No hay tareas en este filtro.');
      emptyHint = t('Cambiá a "Todas" para ver todo.');
    }
    // CTA: si está vacío porque no hay tareas (no por filtros), invitar
    // a crear la primera. Si está vacío por filtros/search, ofrecer limpiar.
    var ctaBtn = '';
    if (emptyDrillNoTasks) {
      ctaBtn = '<button class="pa-btn pa-btn-outline" onclick="edClearCountryFilter()" style="margin-top:6px">' + paIcon('arrowR', 12, '', 'transform:rotate(180deg)') + ' ' + esc(t('Volver a países')) + '</button>';
    } else if (cAll === 0) {
      ctaBtn = '<button class="pa-btn pa-btn-primary" onclick="edCrearOpen()" style="margin-top:6px">' + paIcon('plus', 12) + ' ' + esc(t('Crear tu primera tarea')) + '</button>';
    } else if (EDT.search || EDT.filter !== 'all' || EDT.projectFilter || EDT.respFilter || EDT.confFilter) {
      ctaBtn = '<button class="pa-btn pa-btn-outline" onclick="edClearSecondaryFilters();edSetFilter(\'all\');edSetSearch(\'\')" style="margin-top:6px">' + esc(t('Limpiar filtros')) + '</button>';
    }
    // Empty state homogéneo con resto de la app (paEmpty helper) + CTA centrado.
    html += '<div class="' + tblCls + '">' + tblHeader;
    html += paEmpty(emptyIc, emptyMsg, emptyHint);
    if (ctaBtn) html += '<div style="margin-top:8px;text-align:center">' + ctaBtn + '</div>';
    html += '</div>';
  } else if (groupByUrgency) {
    // Modo "Por urgencia": 4 franjas (mismas que la vieja vista Agrupadas),
    // reusando _agBuckets sobre las filas ya filtradas/buscadas.
    var _bk = _agBuckets(rows);
    var _ubuckets = [
      { title: t('Vencidas'),    arr: _bk.overdue, dot: 'var(--critical)' },
      { title: t('Vencen hoy'),  arr: _bk.today,   dot: 'var(--warn)' },
      { title: t('Esta semana'), arr: _bk.week,    dot: 'var(--info)' },
      { title: t('Después'),     arr: _bk.later,   dot: 'var(--fg-3)' }
    ];
    _ubuckets.forEach(function(bk) {
      html += '<div class="pa-section-h"><h3><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + bk.dot + ';margin-right:8px;vertical-align:middle"></span>' + esc(bk.title) + '</h3>'
           +    '<span class="meta">' + (bk.arr.length ? bk.arr.length + ' ' + esc(bk.arr.length === 1 ? t('tarea') : t('tareas')) : '—') + '</span></div>';
      if (bk.arr.length === 0) {
        html += '<div class="pa-card" style="padding:12px 16px;color:var(--fg-3);font-size:12px;margin-bottom:6px">' + esc(t('Sin tareas en esta franja.')) + '</div>';
      } else {
        html += '<div class="' + tblCls + '">';
        bk.arr.forEach(function(rowTask){ html += _edTkRowHtml(rowTask, role, sel); });
        html += '</div>';
      }
    });
  } else {
    html += '<div class="' + tblCls + '">' + tblHeader;
    rows.forEach(function(rowTask){ html += _edTkRowHtml(rowTask, role, sel); });
    html += '</div>';
    html += '<div style="text-align:center;padding:12px 0 4px;font-size:11px;color:var(--fg-4)">' + rows.length + ' ' + esc(rows.length === 1 ? t('tarea') : t('tareas')) + ' · ' + esc(t('fin de lista')) + '</div>';
  }
  html += '</div>'; // pa-page

  // PANEL detalle como floating si hay seleccionada
  if (sel) {
    html += _renderTkPanel(sel);
  }

  // Preservar el scrollTop para que las acciones que re-renderean (bulk
  // select, filter chips, search) no devuelvan al usuario al top de la
  // tabla. Restauramos en el siguiente tick — innerHTML lo resetea.
  var prevScroll = v.scrollTop;
  v.innerHTML = html;
  if (prevScroll) v.scrollTop = prevScroll;
  // Post-render: auto-resize del textarea de notas si el panel está
  // abierto. Sin esto, las notas largas aparecen con scroll interno
  // pequeño hasta que el usuario tipea algo.
  var ta = v.querySelector('.tk-notas-edit');
  if (ta) edPanelAutosizeNotes(ta);
  // Lazy-load comments thread cuando el panel está abierto.
  var commentsHost = v.querySelector('#tkComments');
  if (commentsHost) {
    var commentTaskId = commentsHost.closest('[data-task-id]');
    if (commentTaskId) edPanelLoadComments(commentTaskId.getAttribute('data-task-id'));
  }
  // Lazy-load activity log (audit trail real). Reemplaza el timeline sintético.
  var activityHost = v.querySelector('#tkActivity');
  if (activityHost) {
    var actTaskId = activityHost.getAttribute('data-task-id');
    if (actTaskId) edPanelLoadActivity(actTaskId);
  }
  // Lazy-load insights de contratos ya analizados (los pinta en su contenedor).
  var insHost = v.querySelector('.tk-panel-rail-body[data-task-id]');
  if (insHost) edLoadContractInsights(insHost.getAttribute('data-task-id'));
  // Hover preview: tooltip compacto tras 400ms de hover sobre una fila.
  v.querySelectorAll('.pa-tbl-r[data-task-id]').forEach(_edTkAttachPreview);
  if (EDT.lastViewedId) {
    var lvId = String(EDT.lastViewedId);
    EDT.lastViewedId = null;
    setTimeout(function() {
      var row = v.querySelector('.pa-tbl-r[data-task-id="' + lvId + '"]');
      if (!row) return;
      row.scrollIntoView({ block: 'center', behavior: 'smooth' });
      row.classList.add('flash-highlight');
      setTimeout(function(){ row.classList.remove('flash-highlight'); }, 1400);
    }, 50);
  }
}

// Helper: toggle selección de tarea por ID (para el checkbox del tracker)
function edTkToggleSelectId(id) {

  if (ix >= 0) EDT.selectedIds.splice(ix, 1);
  else EDT.selectedIds.push(sid);
  rEdTracker(D);

// Markup de una fila del Tracker. Extraído para reusarlo tanto en la lista
// plana como en los buckets del modo "Por urgencia".
// OJO: el parámetro se llama `tk` (no `t`) para no shadowear la función i18n t().
function _edTkRowHtml(tk, role, sel) {
  var pn = _projNameForTask(tk);
  // Meta = "tipo · país" como contexto pasivo + chips clickeables para
  // proyecto y cliente (filtran el tracker al clickear). Tag-able y accionable
  // sin saturar la fila como hacía el bullet-separated text de 4 dimensiones.
  var metaTxt = (tk.tipoTrabajo || '—') + ' · ' + (tk.pais || '—');
  var chips = '';
  if (pn && pn !== 'Sin proyecto') {
    chips += '<span class="pa-meta-chip" onclick="event.stopPropagation();edSetProjectFilter(\'' + esc(escJs(String(tk.proyectoId || ''))) + '\')" title="Filtrar el tracker por este proyecto">' + paIcon('folder', 10, '', 'opacity:.7') + ' ' + esc(pn) + '</span>';
  }
  if (tk.areaSolicitante) {
    chips += '<span class="pa-meta-chip" onclick="event.stopPropagation();edSetClienteFilter(\'' + esc(escJs(tk.areaSolicitante)) + '\')" title="Filtrar el tracker por este cliente">' + paIcon('users', 10, '', 'opacity:.7') + ' ' + esc(tk.areaSolicitante) + '</span>';
  }
  var blockReasonSuffix = '';
  if (tk.status === 'Bloqueado' && tk.blockedReason) {
    var rsn = String(tk.blockedReason).trim();
    if (rsn) {
      var shortRsn = rsn.length > 50 ? rsn.substring(0, 50) + '…' : rsn;
      blockReasonSuffix = ' · <span style="color:var(--warn-fg)">' + paIcon('block', 9, '', 'opacity:.7;vertical-align:-1px') + ' ' + esc(shortRsn) + '</span>';
    }
  }
  // Mini-progreso del checklist (plantillas): "✓ 3/7" en el meta de la fila.
  // Guard barato: solo parsear si las notas tienen pinta de checklist.
  var checkChip = '';
  if (tk.notas && tk.notas.indexOf('- ') >= 0 && typeof _tkParseNotes === 'function') {
    var _cp = _tkParseNotes(tk.notas);
    if (_cp.items.length > 0) {
      var _cd = _cp.items.filter(function(it){ return it.done; }).length;
      var _cdAll = _cd === _cp.items.length;
      checkChip = ' · <span class="mono" style="font-size:10px;color:' + (_cdAll ? 'var(--good-fg)' : 'var(--fg-3)') + '" title="' + esc(t('Checklist de la tarea')) + '">✓ ' + _cd + '/' + _cp.items.length + '</span>';
    }
  }
  // Preferir el cálculo local (traducible vía t()) cuando etaDays es numérico;
  // tk.eta del server viene pre-armado en español y no pasa por i18n.
  // Sin deadline (etaDays null) en una tarea activa: chip "Sin plazo" en vez
  // del '—' invisible — en legal, una tarea sin plazo que sale del radar es
  // justo el riesgo que la app existe para evitar (el dato falta y se dice).
  var etaCell;
  if (tk.status === 'Bloqueado') {
    // On hold: el reloj está pausado — mostramos cuánto LLEVA bloqueada (el
    // dato accionable: ¿ya se destrabó? ¿lleva demasiado?). Warn a partir de
    // una semana parada. Fallback al deadline si no hay sello (pre-migración).
    if (typeof tk.blockedDays === 'number') {
      var _bTone = tk.blockedDays >= 7 ? 'var(--warn-fg)' : 'var(--fg-3)';
      etaCell = '<span style="color:' + _bTone + '">⏸ ' + esc(t('hace')) + ' ' + tk.blockedDays + 'd</span>';
    } else {
      etaCell = '<span style="color:var(--fg-3)">⏸ ' + esc(tk.deadline || '—') + '</span>';
    }
  } else if (typeof tk.etaDays === 'number') {
    etaCell = esc(paEtaText(tk.etaDays));
  } else if (tk.status !== 'Listo' && tk.status !== 'Cancelado') {
    etaCell = '<span class="pa-pill pa-pill-warn" style="height:18px;font-size:10px">' + esc(t('Sin plazo')) + '</span>';
  } else {
    etaCell = esc(tk.eta || '—');
  }
  var isSel = sel && sel.id == tk.id;
  var isChecked = (EDT.selectedIds || []).indexOf(String(tk.id)) >= 0;
  var cfLvl = _confLevel(tk);
  // Badge "Compartida": esta tarea aparece en mi tracker porque soy
  // colaborador (no el responsable). Lo distingue de las propias.
  var sharedBadge = _isSharedWithMe(tk)
    ? ' <span class="pa-pill pa-pill-info" style="height:16px;font-size:10px" title="' + esc(t('Compartida conmigo')) + '">' + paIcon('users', 9) + ' ' + esc(t('Compartida')) + '</span>'
    : '';
  var h = '<div class="pa-tbl-r' + (isSel ? ' is-selected' : '') + '" data-task-id="' + esc(tk.id) + '" onclick="edSelectTask(\'' + esc(escJs(String(tk.id))) + '\')">'
       +    '<span onclick="event.stopPropagation();edTkToggleSelectId(\'' + esc(escJs(String(tk.id))) + '\')"><span class="pa-check' + (isChecked ? ' is-checked' : '') + '"></span></span>'
       +    paConfDot(cfLvl)
       +    '<span class="id mono">' + esc(tk.id) + '</span>'
       +    '<div class="title"><span class="t">' + esc(tk.nombre || '') + sharedBadge + '</span><span class="meta">' + esc(metaTxt) + chips + checkChip + blockReasonSuffix + '</span></div>';
  // Specialist no tiene celda de Proyecto/Responsable (grid .is-no-proj):
  // el proyecto ya aparece como chip clickeable bajo el título.
  if (role !== 'specialist') {
    if (tk.resp) {
      h += '<span class="resp" onclick="event.stopPropagation();edSetRespFilter(\'' + esc(escJs(tk.resp)) + '\')">' + paAvatar(tk.resp, 18) + '<span style="font-size:12px">' + esc(tk.resp) + '</span></span>';
    } else {
      h += '<span style="color:var(--fg-3)">—</span>';
    }
  }
  h += paPriorityPill(tk.priority)
    +  paStatusPill(tk.status)
    +  '<span class="eta' + (_isOverdueTask(tk) ? ' overdue' : '') + '">' + etaCell + '</span>'
    + '</div>';
  return h;
}

// ─── CHECKLIST RASTREABLE EN NOTAS ───────────────────────────────
// Las plantillas insertan en Notas líneas "- ítem" (ver _addTaskImpl). Acá
// se vuelven workflow real: "- ítem" = pendiente, "- [x] ítem" = hecho
// (también se acepta "- [ ] ítem"). El resto de líneas sigue siendo texto.
// El toggle reescribe SOLO esa línea y guarda por updateTaskField('notas'),
// así el formato sobrevive a cierres/bloqueos (que anteponen texto arriba).
function _tkParseNotes(notas) {
  var lines = String(notas == null ? '' : notas).split('\n');
  var items = [];   // { idx, done, text } — idx = línea dentro de notas
  var others = [];  // { idx, text } — líneas que no son checklist
  lines.forEach(function(ln, i) {
    var m = ln.match(/^\s*-\s*\[(x|X| )?\]\s*(.*)$/);
    if (m) { items.push({ idx: i, done: (m[1] || '').toLowerCase() === 'x', text: m[2] }); return; }
    var m2 = ln.match(/^\s*-\s+(.+)$/);
    if (m2) { items.push({ idx: i, done: false, text: m2[1] }); return; }
    others.push({ idx: i, text: ln });
  });
  return { lines: lines, items: items, others: others };
}

function _tkRenderChecklist(sel, parsed, readOnly) {
  var done = parsed.items.filter(function(it){ return it.done; }).length;
  var total = parsed.items.length;
  var pct = total ? Math.round(done / total * 100) : 0;
  var barColor = pct === 100 ? 'var(--good)' : 'var(--accent)';
  var h = '<div class="tk-checklist">'
        +   '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">'
        +     '<span style="flex:1;height:6px;background:var(--bg-2);border-radius:999px;overflow:hidden"><span style="display:block;height:100%;width:' + pct + '%;background:' + barColor + ';transition:width .25s"></span></span>'
        +     '<span class="mono" style="font-size:11px;color:' + (pct === 100 ? 'var(--good-fg)' : 'var(--fg-2)') + ';white-space:nowrap">' + done + '/' + total + (pct === 100 ? ' ✓' : '') + '</span>'
        +   '</div>';
  parsed.items.forEach(function(it) {
    h += '<div style="display:flex;align-items:flex-start;gap:8px;padding:4px 2px;border-radius:6px;' + (readOnly ? '' : 'cursor:pointer;') + '" '
      +    (readOnly ? '' : 'onmouseover="this.style.background=\'var(--bg-2)\'" onmouseout="this.style.background=\'transparent\'" onclick="edTkToggleCheckItem(\'' + esc(escJs(String(sel.id))) + '\',' + it.idx + ')" ')
      +  '>'
      +    '<span class="pa-check' + (it.done ? ' is-checked' : '') + '" style="margin-top:1px;flex-shrink:0"></span>'
      +    '<span style="font-size:13px;line-height:1.45;color:' + (it.done ? 'var(--fg-3)' : 'var(--fg-1)') + ';' + (it.done ? 'text-decoration:line-through;' : '') + '">' + esc(it.text) + '</span>'
      + '</div>';
  });
  // Líneas no-checklist (contexto, "CIERRE: …", razones de bloqueo) — texto plano.
  var otherTxt = parsed.others.map(function(o){ return o.text; }).join('\n').replace(/^\n+|\n+$/g, '');
  if (otherTxt) {
    h += '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-1);font-size:12px;color:var(--fg-2);white-space:pre-wrap">' + esc(otherTxt) + '</div>';
  }
  return h + '</div>';
}

function edTkToggleNotesMode() {
  EDT.notesRawMode = !EDT.notesRawMode;

function edTkToggleCheckItem(taskId, lineIdx) {
  var task = ((D && D.tasks) || []).find(function(x){ return String(x.id) === String(taskId); });
  if (!task) return;
  var prev = task.notas || '';
  var lines = String(prev).split('\n');
  var ln = lines[lineIdx];
  if (ln == null) return;
  var mDone = ln.match(/^(\s*)-\s*\[(?:x|X)\]\s*(.*)$/);
  var mOpen = ln.match(/^(\s*)-\s*(?:\[\s?\]\s*)?(.+)$/);
  if (mDone)      lines[lineIdx] = mDone[1] + '- ' + mDone[2];
  else if (mOpen) lines[lineIdx] = mOpen[1] + '- [x] ' + mOpen[2];
  else return;
  var nuevo = lines.join('\n');
  // Optimistic: reflejar ya el check + barra; revert si el server rechaza.
  task.notas = nuevo;
  if (D) rEdTracker(D);
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || res.success === false) {
        task.notas = prev;
        if (D) rEdTracker(D);
        toast(_friendlyError(res, t('No se pudo guardar el checklist')), 'error');
        return;
      }
      // El backend puede auto-promover Pendiente → En curso al tocar notas
      // (marcar un paso ES empezar a trabajar) — reflejarlo sin esperar reload.
      if (res.promoted) { task.status = res.promoted; if (D) rEdTracker(D); }
    })
    .withFailureHandler(function() {
      task.notas = prev;
      if (D) rEdTracker(D);
      toast(t('No se pudo guardar el checklist'), 'error');
    })
    .updateTaskField(taskId, 'notas', nuevo);
}

         +      '<button class="pa-btn pa-btn-outline" onclick="edUOpen(\'' + esc(sel.id) + '\',\'cerrar\')">' + esc(t('Cerrar como ✓ Listo')) + '</button>'
         +      '<button class="pa-btn pa-btn-primary" onclick="edUOpen(\'' + esc(sel.id) + '\',\'avanzar\')">' + esc(t('Avanzar →')) + '</button>'
         +    '</div>'
         + '</div>';
  }

  html += '</aside>';

// ─── HOVER PREVIEW EN FILAS DEL TRACKER ────────────────────────
// Tooltip que aparece tras 400ms de hover y muestra resp / deadline /
// próxima acción. Útil para escanear sin abrir el panel.
var _edTkPreviewTimer = null;
function _edTkEnsurePreview() {
  var p = $('edTkPreview');
  if (p) return p;
  p = document.createElement('div');
  p.id = 'edTkPreview';
  p.className = 'tk-preview';
  p.style.display = 'none';
  document.body.appendChild(p);
  return p;
}
function _edTkAttachPreview(row) {
  row.addEventListener('mouseenter', function() {
    if (_edTkPreviewTimer) clearTimeout(_edTkPreviewTimer);
    var id = row.dataset.taskId;
    _edTkPreviewTimer = setTimeout(function() {
      var task = (D && D.tasks || []).find(function(t){ return t.id == id; });
      if (!task) return;
      var p = _edTkEnsurePreview();
      var deadlineLine = esc(task.deadline || '—') + (task.eta ? ' · ' + esc(task.eta) : '');
      p.innerHTML =
        '<div class="tk-preview-row"><span class="lbl">Resp.</span>' + esc(task.resp || '—') + '</div>' +
        '<div class="tk-preview-row"><span class="lbl">Plazo</span>' + deadlineLine + '</div>' +
        '<div class="tk-preview-row"><span class="lbl">Acción</span>' + esc(task.accionable || '—') + '</div>';
      var rect = row.getBoundingClientRect();
      p.style.display = 'block';

      p.style.left = Math.max(10, rect.left) + 'px';

    }, 400);

// ───────────────────────────────────────────────────────────────
// MARKER:EDITORIAL_AGRUPADAS_BEGIN
// Vista intermedia "Por urgencia" — agrupa tareas activas del USER
// en franjas (Pendientes / Hoy / Esta semana / Más adelante) con
// narrativa por bucket. Tabs (prioridad/proyecto/tipo/riesgo) son
// decorativos en Fase 1 (solo "Por prioridad" funcional).
// ───────────────────────────────────────────────────────────────

function _agBuckets(tasks) {
  var overdue = [], today = [], week = [], later = [];
  for (var i = 0; i < tasks.length; i++) {
    var t = tasks[i];
    if (t.status === 'Listo') continue;
    // On hold: no va al bucket "Vencidas" (no es accionable hoy) — cae a
    // "Después", al final del bucket (mismo criterio que la lista Activas).
    if (t.status === 'Bloqueado') { later.push(t); continue; }
    var d = (typeof t.etaDays === 'number') ? t.etaDays : null;
    if (d == null) { later.push(t); continue; }
    if (d < 0) overdue.push(t);
    else if (d === 0) today.push(t);
    else if (d <= ED_WEEK_DAYS) week.push(t);
    else later.push(t);
  }
  // ordenar por urgencia dentro de cada bucket
  function sortAsc(a, b) {
    // On hold al final del bucket (reloj pausado — coherente con _edSortByUrgency).
    var aBlk = a.status === 'Bloqueado' ? 1 : 0;
    var bBlk = b.status === 'Bloqueado' ? 1 : 0;
    if (aBlk !== bBlk) return aBlk - bBlk;
    var ad = (typeof a.etaDays === 'number') ? a.etaDays : 9999;
    var bd = (typeof b.etaDays === 'number') ? b.etaDays : 9999;
    return ad - bd;
  }
  return { overdue: overdue.sort(sortAsc), today: today.sort(sortAsc), week: week.sort(sortAsc), later: later.sort(sortAsc) };
}

// Panel deslizable lateral (560px) con 3 variantes:
