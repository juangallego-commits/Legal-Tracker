<script>
// ════════════════════════════════════════════════════════════════
// 0 · GLOBAL ERROR CATCHER (debe correr ANTES que nada para atrapar
// errores de bootstrap. Auto-contenido, no depende de toast() ni del
// resto del CSS de la app — usa estilos inline en un host propio.)
// ════════════════════════════════════════════════════════════════
(function(){
  var HOST_ID = '__errhost__';
  var LOG_KEY = 'mydash-errors';
  var MAX_LOG = 5;
  // Además del localStorage local, mandamos los errores al backend (hoja ErrorLog)
  // para revisión central — así el admin ve "qué falló" sin pedirle a cada usuario
  // que abra DevTools. Acotado por sesión + dedup para que un loop de errores no
  // martille el servidor; best-effort (nunca rompe el handler de errores).
  var MAX_SENT = 25;
  var _sentCount = 0;
  var _sentMsgs = {};

  // PII redactor: stack traces y msg pueden incluir nombres de tarea,
  // contrapartes o emails si un error se thrown con esos datos en el
  // message. localStorage persiste cross-session y cualquier extensión
  // del browser puede leerlo. Sanitizamos URLs (que pueden tener query
  // strings con datos), emails, y task IDs largos antes de persistir.
  // Mantenemos suficiente contexto para que mydashErrors() siga siendo
  // útil para debug.
  function _redact(s) {
    if (s == null) return s;
    return String(s)
      .replace(/https?:\/\/\S+/g, '<url>')
      .replace(/[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}/g, '<email>')
      .replace(/"[A-ZÁÉÍÓÚÑa-záéíóúñ ]{4,}"/g, '"<txt>"'); // strings largos entre comillas (likely titles)
  }

  function ensureHost() {
    var h = document.getElementById(HOST_ID);
    if (h) return h;
    h = document.createElement('div');
    h.id = HOST_ID;
    h.style.cssText = 'position:fixed;bottom:16px;right:16px;z-index:99999;display:flex;flex-direction:column;gap:8px;max-width:420px;font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;pointer-events:none;';
    if (document.body) document.body.appendChild(h);
    else document.addEventListener('DOMContentLoaded', function(){ document.body.appendChild(h); });
    return h;
  }

  function persist(rec) {
    try {
      var arr = JSON.parse(localStorage.getItem(LOG_KEY) || '[]');
      arr.unshift(rec);
      if (arr.length > MAX_LOG) arr = arr.slice(0, MAX_LOG);
      localStorage.setItem(LOG_KEY, JSON.stringify(arr));
    } catch(e) { /* localStorage puede estar lleno o blockeado, ignorar */ }
  }

  // Fire-and-forget al backend (hoja ErrorLog). Acotado por sesión + dedup +
  // guardas para no romper nunca el handler de errores ni entrar en loop.
  function sendToServer(rec) {
    try {
      if (typeof google === 'undefined' || !google.script || !google.script.run) return;
      if (_sentCount >= MAX_SENT) return;
      var key = (rec.kind || '') + '|' + (rec.msg || '') + '|' + (rec.src || '');
      if (_sentMsgs[key]) return; // no repetir el mismo error
      _sentMsgs[key] = 1;
      _sentCount++;
      var noop = function(){};
      google.script.run.withSuccessHandler(noop).withFailureHandler(noop)
        .logClientError({ where: rec.src || '', message: rec.msg || '', stack: rec.stack || '', kind: rec.kind || '' });
    } catch (e) { /* nunca romper el handler por intentar loguear */ }
  }

  function showError(label, msg, detail) {
    try {
      var h = ensureHost();
      if (!h) return;
      var card = document.createElement('div');
      card.style.cssText = 'background:var(--toast-bg, var(--bg-1));border:1px solid var(--toast-border, var(--critical));border-left:3px solid var(--toast-border, var(--critical));border-radius:8px;padding:12px 14px;color:var(--toast-fg, var(--fg-1));font-size:13px;line-height:1.45;box-shadow:0 12px 40px rgba(0,0,0,0.4);pointer-events:auto;cursor:pointer;animation:slideIn .2s ease-out;';
      card.innerHTML = ''
        + '<div style="display:flex;align-items:start;gap:8px;">'
        +   '<span style="color:#e26a6a;font-weight:600;flex-shrink:0;">' + label + '</span>'
        +   '<span style="flex:1;word-break:break-word;font-family:JetBrains Mono,SFMono-Regular,Menlo,monospace;font-size:12px;"></span>'
        +   '<span style="color:#8a8a92;flex-shrink:0;font-size:11px;">click para copiar</span>'
        + '</div>'
        + (detail ? '<div style="margin-top:6px;color:#8a8a92;font-size:11px;font-family:JetBrains Mono,SFMono-Regular,Menlo,monospace;word-break:break-word;"></div>' : '');
      card.querySelector('span:nth-child(2)').textContent = msg;
      if (detail) card.querySelector('div:last-child').textContent = detail;
      card.addEventListener('click', function(){
        var txt = label + ' ' + msg + (detail ? '\n' + detail : '');
        try { navigator.clipboard.writeText(txt); } catch(e) {}
        card.style.opacity = '0.4';
        setTimeout(function(){ try { h.removeChild(card); } catch(e){} }, 200);
      });
      h.appendChild(card);
      // Auto-dismiss tras 15s (errores de JS son menos efímeros que toasts normales)
      setTimeout(function(){
        if (card.parentNode) card.style.transition = 'opacity .3s'; card.style.opacity = '0';
        setTimeout(function(){ try { h.removeChild(card); } catch(e){} }, 300);
      }, 15000);
    } catch(e) { /* no podemos hacer nada si esto falla */ }
  }

  window.addEventListener('error', function(ev) {
    var src = ev.filename ? (ev.filename.split('/').pop() + ':' + ev.lineno + ':' + ev.colno) : '';
    var msg = (ev.error && ev.error.message) || ev.message || 'Unknown error';
    var stack = (ev.error && ev.error.stack) || '';
    // Persist redactado (PII fuera). console.error sí muestra el original
    // (queda solo en DevTools del dev que abrió la consola, no en localStorage).
    var rec = { t: Date.now(), kind: 'error', msg: _redact(msg), src: src, stack: _redact(stack) };
    persist(rec);
    sendToServer(rec);
    console.error('[GlobalError]', { msg: msg, src: src, stack: stack });
    showError('JS Error', msg, src);
  });

  window.addEventListener('unhandledrejection', function(ev) {
    var reason = ev.reason;
    var msg = (reason && reason.message) || String(reason);
    var stack = (reason && reason.stack) || '';
    var rec = { t: Date.now(), kind: 'rejection', msg: _redact(msg), stack: _redact(stack) };
    persist(rec);
    sendToServer(rec);
    console.error('[UnhandledRejection]', { msg: msg, stack: stack });
    showError('Promise', msg, '');
  });

  // Helper para que el user pueda volcar el log a la consola.
  // Uso: en DevTools, escribí `mydashErrors()` y enter.
  window.mydashErrors = function() {
    try {
      var arr = JSON.parse(localStorage.getItem(LOG_KEY) || '[]');
      console.table(arr.map(function(r){
        return { when: new Date(r.t).toISOString(), kind: r.kind, msg: r.msg, src: r.src || '' };
      }));
      console.log('Full records:', arr);
      return arr;
    } catch(e) { console.error('No se pudo leer el log:', e); return []; }
  };
  window.mydashClearErrors = function() {
    try { localStorage.removeItem(LOG_KEY); console.log('Cleared.'); } catch(e) {}
  };
})();

const PRIO_ORDER   = {'Alta':0,'Media':1,'Baja':2};
const STATUS_ORDER = {'Bloqueado':0,'En curso':1,'Pendiente':2,'En revisión':3,'Listo':4};
const ALL_STATUSES = ['Pendiente','En curso','En revisión','Bloqueado','Listo'];
// Ventana de "Esta semana" (días). Compartida entre el KPI del Home y el
// bucket de la vista Por urgencia para que el conteo coincida (antes 7 vs 5).
const ED_WEEK_DAYS = 7;
const SLA_LIMITS   = {'Alta':2,'Media':5,'Baja':7};
// Fuente única de SLA: prefiere D.slaLimits (del backend); cae a SLA_LIMITS local.
function _slaLimit(prio){ return ((typeof D !== 'undefined' && D && D.slaLimits) || SLA_LIMITS)[prio] || 5; }

const BADGE_PRIO    = {'Alta':'b-alta','Media':'b-media','Baja':'b-baja'};

const BADGE_PSTATUS = {'Activo':'ps-activo','En pausa':'ps-pausa','Completado':'ps-completado','Cancelado':'ps-cancelado'};
const BADGE_RIESGO  = {'Legal':'b-riesgo-legal','Legal alto':'b-riesgo-legal','Reputacional':'b-riesgo-reput','Negocio':'b-riesgo-oper','Operativo':'b-riesgo-oper'};

// Avatar gradients
const AVC = [

  'linear-gradient(135deg,#FFB938,#E5A020)','linear-gradient(135deg,#22D3EE,#0891B2)',
  'linear-gradient(135deg,#F472B6,#DB2777)','linear-gradient(135deg,#FF6B35,#E85D26)',

var D = (typeof window !== 'undefined' && window.__DATA__) ? window.__DATA__ : {};
var USER = (typeof window !== 'undefined' && window.__USER__) ? window.__USER__ : null;
var F = { country:'ALL', status:'ALL', project:'ALL', search:'', resp:'ALL', projStatus:'ALL' };
var SORT = { col: null, asc: true };

var CURRENT_USER = USER ? USER.name : null;

// 2.1 · THEME / TOKEN HELPERS (Fase 0)
// ════════════════════════════════════════════════════════════════
// Read a CSS custom property from :root. Returns the resolved value
// (works for #hex, rgba(), and var() chains).
function getTok(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// Toggle theme (dark is default). Persists to localStorage.
// Charts inline token values at construction, so we destroy + re-render
// the active view to pick up the new palette.
function setTheme(theme) {
  theme = theme === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
  document.body.dataset.theme = theme;
  try { localStorage.setItem('lt-theme', theme); } catch (e) {}
  if (typeof Chart !== 'undefined') Chart.defaults.color = getTok('--fg-3');
  if (typeof CH !== 'undefined') {
    Object.keys(CH).forEach(function(k){ try { CH[k] && CH[k].destroy(); } catch (e) {} CH[k] = null; });
  }
  // Re-mount sidebar (icono del toggle cambia) y re-render vista activa
  if (typeof mountEdShell === 'function') {
    var role = (typeof _effectiveRole === 'function') ? _effectiveRole() : 'specialist';
    var activeViewId = (document.querySelector('.pa-sb-item.is-active') && document.querySelector('.pa-sb-item.is-active').dataset.viewid) || 'home';
    var side = document.getElementById('edSide');
    if (side && typeof renderEdSidebar === 'function') side.innerHTML = renderEdSidebar(role, activeViewId);
    var head = document.getElementById('edHead');
    if (head && typeof renderEdHead === 'function') head.innerHTML = renderEdHead(activeViewId);
  }
  var active = document.querySelector('.view.active');
  if (!active || !active.id || typeof goEd !== 'function') return;
  var EDVIEW_MAP = {
    vEdHome: 'home', vEdTracker: 'tracker', vEdCalendar: 'calendar',
    vEdProyectosIndex: 'proyectos',
    vEdAnalytics: 'analytics', vEdHistorial: 'historial',
    vEdMiequipo: 'miequipo', vEdResumen: 'paises', vEdPlantillas: 'plantillas',
    vEdRecursos: 'recursos'
  };
  if (EDVIEW_MAP[active.id]) goEd(EDVIEW_MAP[active.id]);
}

// Restore preferred theme on load (default to dark).
(function(){
  try {
    var pref = localStorage.getItem('lt-theme') || 'dark';
    document.documentElement.dataset.theme = pref;
    if (document.body) document.body.dataset.theme = pref;
  } catch (e) {}
})();

// Chart styling derived from tokens. Call inside chart configs so colors
// follow theme switches (combined with CH[k].update() in setTheme).
function chartTheme() {
  return {
    prio:      [getTok('--critical'), getTok('--warn'), getTok('--good')],
    info:      getTok('--info'),
    accent:    getTok('--accent'),
    muted:     getTok('--muted'),
    dim:       getTok('--dim'),
    ink:       getTok('--ink'),
    surface:   getTok('--surface'),
    surface2:  getTok('--surface2'),
    rule:      getTok('--rule'),
    ruleSoft:  getTok('--rule-soft')
  };
}

Chart.defaults.color = getTok('--muted');
Chart.defaults.font.family = "'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
Chart.defaults.font.size = 12;

// Badges: si se pasa taskId, el badge actúa como trigger de menú (prioridad/estado)
// vía event delegation (data-act). Sin taskId, es solo visual.
function renderPrioBadge(p, taskId) {
  var cls = BADGE_PRIO[p] || 'b-media';
  var emoji = EMOJI_PRIO[p] || '🟡';
  var attrs = taskId != null ? ' data-act="show-prio-menu" data-id="' + taskId + '"' : '';
  return '<span class="badge ' + cls + '"' + attrs + '>' + emoji + ' ' + esc(p || '') + '</span>';
}

function renderStatusBadge(s, taskId, small) {
  var cls = BADGE_STATUS[s] || 'b-pendiente';
  var attrs = taskId != null ? ' data-act="show-status-menu" data-id="' + taskId + '"' : '';
  var style = small ? ' style="font-size:10px;padding:2px 8px"' : '';
  return '<span class="badge ' + cls + '"' + attrs + style + '>' + esc(s || '') + '</span>';
}

function renderProjStatusBadge(s) {
  var cls = BADGE_PSTATUS[s] || 'ps-activo';
  return '<span class="badge ' + cls + '" style="font-size:10px;padding:2px 8px;cursor:default">' + (s || '') + '</span>';
}

// Parses deadline, returns { html, overdue, diff } for the table cell.
function renderDeadlineBadge(deadline) {
  if (!deadline) return { html: '<span class="dl-none">—</span>', overdue: false, diff: null };
  var cls = 'dl-ok', diff = null, dd = pd(deadline);
  if (dd) {
    diff = Math.ceil((dd - new Date()) / 864e5);
    if (diff < 0) cls = 'dl-over';
    else if (diff <= 2) cls = 'dl-warn';
  }
  var overdue = diff !== null && diff < 0;
  var html = '<span class="dl-badge ' + cls + '">' + esc(deadline) + (overdue ? ' ⚠' : '') + '</span>';
  return { html: html, overdue: overdue, diff: diff };
}

function renderTipoCell(tipo) {
  return tipo ? '<span class="b-tt">' + esc(tipo) + '</span>' : '—';
}
function renderRiesgoCell(riesgo) {
  if (!riesgo) return '—';
  var rc = BADGE_RIESGO[riesgo] || '';
  return '<span class="b-tt ' + rc + '">' + esc(riesgo) + '</span>';
}

// Unique member list across equipos (replaces 4 duplicated loops).
function getAllMembers() {
  var all = [];
  if (D.equipos) D.equipos.forEach(function(eq) {
    if (eq.leader && all.indexOf(eq.leader) < 0) all.push(eq.leader);
    (eq.members || []).forEach(function(m) { if (all.indexOf(m) < 0) all.push(m); });
  });
  return all.sort();
}

// Checks if a task is overdue by SLA (business days since creation).
// Preferir t.slaState del backend: viene calculado con los feriados del país
// de la tarea. El cálculo local (solo lun–vie) queda como fallback y
// sobre-cuenta en países con feriados.
// "Vencida" = el deadline pasó Y la tarea es accionable. Una On hold espera
// algo externo — no se puede cerrar hoy — así que NO cuenta como vencida en
// KPIs, chips, filtros ni digest (tiene su propio bucket On hold). Predicado
// único: si cambia la regla, cambia acá.
function _isOverdueTask(t) {
  return typeof t.etaDays === 'number' && t.etaDays < 0
      && t.status !== 'Listo' && t.status !== 'Cancelado' && t.status !== 'Bloqueado';
}

function taskOverdueBySLA(t) {
  if (t.status === 'Listo' || t.status === 'Bloqueado' || !t.creadoRaw) return false;
  if (t.slaState) return t.slaState === 'overdue';
  var created = new Date(t.creadoRaw), now = new Date(), bizDays = 0, cur = new Date(created);
  while (cur < now) {
    cur.setDate(cur.getDate() + 1);
    var d = cur.getDay();
    if (d !== 0 && d !== 6) bizDays++;
  }
  return bizDays > _slaLimit(t.priority);
}

// ═══ FILTER ═══
function taskProjectName(t) {
  if (t.proyectoId && D.projects) {
    var pp = D.projects.find(function(p){ return p.id == t.proyectoId; });
    if (pp) return pp.nombre;
  }
  return t.proyecto || '';
}

// Filtro principal de tareas: combina country, status, project, resp y búsqueda.
function ft() {
  return D.tasks.filter(function(t) {
    if (F.country !== 'ALL') {
      var c = t.pais || mc(t.resp);
      if (c !== F.country) return false;
    }
    if (F.status !== 'ALL' && t.status !== F.status) return false;
    if (F.project !== 'ALL' && taskProjectName(t) !== F.project) return false;
    if (F.resp !== 'ALL' && t.resp !== F.resp) return false;
    if (F.search) {
      var s = F.search.toLowerCase();
      var pn = taskProjectName(t);
      if ((t.nombre || '').toLowerCase().indexOf(s) < 0 &&
          (t.acc    || '').toLowerCase().indexOf(s) < 0 &&
          (t.resp   || '').toLowerCase().indexOf(s) < 0 &&
          (pn       || '').toLowerCase().indexOf(s) < 0 &&
          (t.notas  || '').toLowerCase().indexOf(s) < 0) return false;
    }
    return true;
  });
}

function fTeam() {
  if (F.country === 'ALL') return D.team;
  return D.team.filter(function(t){ return t.country === F.country; });
}

function fHist() {
  return (D.historial || []).filter(function(t) {
    if (F.country !== 'ALL') {
      var c = t.pais || mc(t.resp);
      if (c !== F.country) return false;
    }
    if (F.search) {
      var s = F.search.toLowerCase();
      var pn = '';
      if (t.proyectoId && D.projects) {
        var pp = D.projects.find(function(p){ return p.id == t.proyectoId; });
        if (pp) pn = pp.nombre;
      }
      if ((t.nombre || '').toLowerCase().indexOf(s) < 0 &&
          (pn || '').toLowerCase().indexOf(s) < 0) return false;
    }
    return true;
  });
}

// Retorna el código de país al que pertenece un miembro (leader o member).
function mc(n) {
  if (!n || !D.equipos) return '';
  for (var i = 0; i < D.equipos.length; i++) {
    var e = D.equipos[i];
    if (e.leader === n) return e.code;
    if (e.members && e.members.indexOf(n) >= 0) return e.code;
  }
  return '';
}

// Cache lazy de plantillas (server fetch una vez por sesión).
var _TEMPLATES_CACHE = null;
var _TEMPLATES_INFLIGHT = null;
function _loadTemplates(cb) {
  if (_TEMPLATES_CACHE) { cb(_TEMPLATES_CACHE); return; }
  if (_TEMPLATES_INFLIGHT) { _TEMPLATES_INFLIGHT.push(cb); return; }
  _TEMPLATES_INFLIGHT = [cb];
  google.script.run
    .withSuccessHandler(function(dict) {
      _TEMPLATES_CACHE = dict || {};
      var queue = _TEMPLATES_INFLIGHT || [];
      _TEMPLATES_INFLIGHT = null;
      queue.forEach(function(fn) { try { fn(_TEMPLATES_CACHE); } catch (e) {} });
    })
    .withFailureHandler(function() {
      _TEMPLATES_CACHE = {};
      var queue = _TEMPLATES_INFLIGHT || [];
      _TEMPLATES_INFLIGHT = null;
      queue.forEach(function(fn) { try { fn(_TEMPLATES_CACHE); } catch (e) {} });
    })
    .getTemplates();
}

// Cache de la lista rica de Biblioteca (incluye estado + autor). Se invalida
// (=null) en cada mutación de plantillas para forzar refetch. Distinta de
// _TEMPLATES_CACHE, que es el dict aprobado que consume el wizard de Crear.
var _BIBLIO_CACHE = null;
function _loadBiblioteca(cb) {
  google.script.run
    .withSuccessHandler(function(res) { _BIBLIO_CACHE = (res && res.items) || []; cb(); })
    .withFailureHandler(function() { _BIBLIO_CACHE = []; cb(); })
    .getBibliotecaTemplates();
}

// ═══ EDIT MODAL ═══
// Helper: build <option> tags. items can be array of strings or [{value,label}].
function buildOptions(items, current, includeBlank) {
  var opts = includeBlank ? '<option value="">' + (typeof includeBlank === 'string' ? includeBlank : '—') + '</option>' : '';
  return opts + items.map(function(item) {
    var v = (typeof item === 'object') ? item.value : item;
    var l = (typeof item === 'object') ? item.label : item;
    var sel = (current == v) ? ' selected' : '';
    return '<option value="' + esc(String(v)) + '"' + sel + '>' + esc(l) + '</option>';
  }).join('');
}

// ═══ DOCUMENTOS ═══
// Sección en el modal de edición: lista de docs actuales + botón subir + pegar link.
// kind: 'task' | 'project'. itemId: id del item. docs: array actual.
function renderDocsSection(kind, itemId, docs) {
  var chips = (docs || []).map(function(d, i) {
    var urlEsc = esc(d.url || '#');
    var nameEsc = esc(d.name || 'Documento');
    var tooltip = d.external ? 'Enlace externo' : 'Subido por ' + esc(d.uploadedBy || '—');
    return '<span class="doc-chip" title="' + tooltip + '">'
      +      '<a href="' + urlEsc + '" target="_blank" rel="noopener">📄 ' + nameEsc + '</a>'
      +      '<button class="doc-chip-x" data-act="remove-doc" data-kind="' + kind + '" data-item-id="' + itemId + '" data-i="' + i + '" aria-label="Quitar">✕</button>'
      +    '</span>';
  }).join('');

  return '<div class="form-section"><div class="form-section-title">Documentos</div>'
    + '<div class="doc-list" id="docList">' + (chips || '<span class="doc-empty">Sin documentos adjuntos</span>') + '</div>'
    + '<div class="doc-actions">'
    +   '<label class="doc-upload-btn">'
    +     '📤 Subir archivo'
    +     '<input type="file" id="docFileInput" data-kind="' + kind + '" data-item-id="' + itemId + '" style="display:none" onchange="onDocFileSelected(this)">'
    +   '</label>'
    +   '<div class="doc-link-row">'
    +     '<input type="text" id="docLinkUrl" placeholder="Pegá el enlace de Drive" class="doc-link-input">'

// File input → base64 → backend. Muestra loader y spinner durante upload.
function onDocFileSelected(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var kind = input.dataset.kind;
  var itemId = Number(input.dataset.itemId);
  if (file.size > 45 * 1024 * 1024) {
    toast('Archivo demasiado grande (máx 45 MB en Apps Script)', 'error');
    input.value = '';
    return;
  }
  var reader = new FileReader();
  reader.onerror = function(){ toast('Error leyendo archivo', 'error'); input.value = ''; };
  reader.onload = function() {
    var dataUrl = reader.result; // data:<mime>;base64,<data>
    var base64 = String(dataUrl).split(',')[1];
    toast('Subiendo ' + file.name + '…', 'info');
    showLoader();
    google.script.run
      .withSuccessHandler(function(res) {
        hideLoader();
        input.value = '';
        if (res && res.success) {
          toast('✅ ' + file.name + ' subido', 'success');
          reopenEditWithFreshData();
        } else {
          toast('Error: ' + ((res && res.error) || 'falló la subida'), 'error');
        }
      })
      .withFailureHandler(function(e) {
        hideLoader();
        input.value = '';
        toast('Error: ' + e.message, 'error');
      })
      .uploadDocument(kind, itemId, { name: file.name, mimeType: file.type, data: base64 });
  };
  reader.readAsDataURL(file);
}

// Pegar un link de Drive existente.
function attachDocLinkFromForm(kind, itemId) {
  var url = $('docLinkUrl').value.trim();
  var name = $('docLinkName').value.trim();
  if (!url) { toast('Primero pegá un enlace', 'error'); return; }
  showLoader();

    })
    .withFailureHandler(function(e){ hideLoader(); toast('Error: ' + e.message, 'error'); })
    .attachDocumentLink(kind, itemId, { url: url, name: name });

// Después de agregar/quitar un doc, recargamos la data del server y re-abrimos
// el modal con la lista refrescada (sin cerrar/volver a abrir visualmente).
function reopenEditWithFreshData() {
  var id = EDIT_ID, kind = EDIT_KIND;
  var modalOpen = !!($('editOv') && $('editOv').classList.contains('show'));
  // El detalle de proyecto también embebe la sección de Documentos; si está
  // abierto (EDP.detailId), refrescamos esa vista en vez del modal.
  var detailOpen = (typeof EDP !== 'undefined') && !!EDP.detailId;
  if (!id && !detailOpen) return;
  showLoader();
  google.script.run
    .withSuccessHandler(function(d) {
      hideLoader();
      D = d;
      if (modalOpen && id) {
        if (kind === 'task') openEdit(id);
        else if (kind === 'project') openEditProj(id);
      } else if (detailOpen && typeof rEdProyectosIndex === 'function') {
        rEdProyectosIndex(D);
      }
    })
    .withFailureHandler(function(e){ hideLoader(); toast('Error al refrescar: ' + e.message, 'error'); })
    // getEditorialData (no getTrackerData): el payload enriquecido trae etaDays/
    // slaState/blockedDays, load/overdue por miembro y open/overdue/trend por país.
    // Con getTrackerData (sin enrichment) toda la UI degradaba en silencio tras
    // tocar documentos (Vencidas a 0, cargas vacías) hasta el próximo reload.
    .getEditorialData();
}

  var btn = $('editSaveBtn');
  if (!btn) return;
  if (saving) {
    btn._orig = btn.textContent;
    btn.disabled = true;
    btn.textContent = '⏳ Guardando...';

    btn.disabled = false;
    btn.textContent = btn._orig || 'Guardar';

// confirm_(txt, onConfirm, opts) — modal custom, reemplaza window.confirm.
// txt puede ser texto plano o HTML (auto-detect: si contiene "<", se trata
// como HTML para permitir énfasis con <b>, <em>, etc. en microcopy).
// Variante "danger" cambia el botón a estilo crítico (rojo). Usar para
// acciones irreversibles: delete comment/doc/template, eliminar tarea, etc.
function confirm_(txt, fn, opts) {
  opts = opts || {};
  var p = $('confTxt');
  var s = String(txt || '');
  if (s.indexOf('<') >= 0) p.innerHTML = s; else p.textContent = s;
  $('confOv').classList.add('show');
  var btn = $('confBtn');
  btn.textContent = opts.confirmLabel || 'Confirmar';
  btn.classList.toggle('btn-danger', !!opts.danger);
  btn.onclick = function(){ closeCf(); fn && fn(); };
}
function closeCf() {
  var ov = $('confOv'); if (ov) ov.classList.remove('show');
  var btn = $('confBtn'); if (btn) btn.classList.remove('btn-danger');
}

// Posiciona el dropdown contenido al viewport — evita que se corte en mobile.
function openDD(anchor, html) {
  var m = $('ddM'), o = $('ddO');
  m.innerHTML = html;
  m.style.display = 'block';
  o.style.display = 'block';
  var r = anchor.getBoundingClientRect();
  var mw = m.offsetWidth || 180;
  var mh = m.offsetHeight || 0;
  var vw = window.innerWidth, vh = window.innerHeight;
  // Horizontal: si se sale por la derecha, alinear a la derecha; dejar 8px de margen.
  var left = Math.min(r.left, vw - mw - 8);
  if (left < 8) left = 8;
  // Vertical: si no cabe debajo, abrir arriba del anchor.
  var top = r.bottom + 6;
  if (top + mh > vh - 8 && r.top - mh - 6 > 8) top = r.top - mh - 6;
  m.style.top = top + 'px';
  m.style.left = left + 'px';
}
function closeDD() {
  $('ddM').style.display = 'none';
  $('ddO').style.display = 'none';
}

// Update single field del tarea (dropdown menu items).
// Optimistic: para cambios no-destructivos aplica el cambio en D.tasks antes de
// que el server responda. Si falla, rollback + toast de error. El reload()
// posterior sincroniza stats (KPI/SLA/team/countries) reales del server.
function uf(id, f, v) {
  closeDD();
  var willMoveToHistorial = (f === 'status' && v === 'Listo');
  var task = D.tasks.find(function(x){ return x.id == id; });
  var prevValue = task ? task[f] : null;

  if (willMoveToHistorial) {
    // Cierre (mueve al historial): no es trivial de simular optimistamente,
    // así que mantenemos loader + reload de sincronización.
    showLoader();
    google.script.run
      .withSuccessHandler(function(r) {
        hideLoader();
        if (r && r.success) { toast(r.moved ? '✅ Movida al historial' : '✅ OK', 'success'); reload(); }
        else toast('Error: ' + ((r && r.error) || ''), 'error');
      })
      .withFailureHandler(function(e) { hideLoader(); toast('Error: ' + (e && e.message || ''), 'error'); })
      .updateTaskField(id, f, v);
    return;
  }

  // OPTIMISTIC: aplicamos el cambio en memoria y re-renderamos YA (sin loader).
  // El server corre en background; si falla, revertimos en silencio + toast.
  if (task) { task[f] = v; _rerenderActive(); }
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        _reloadSilent(); // reconcilia stats reales (KPI/SLA/etaDays) sin spinner
      } else {
        if (task) { task[f] = prevValue; _rerenderActive(); }
        toast('Error: ' + ((r && r.error) || 'no se pudo guardar'), 'error');
      }
    })
    .withFailureHandler(function(e) {

// Tiempo relativo humano: "hoy", "ayer", "hace 3d", "hace 2 sem".
function _relativeAgo(ms) {
  if (!ms) return '';
  var pt = (typeof LANG !== 'undefined' && LANG === 'pt');
  var ago = pt ? 'há ' : 'hace ';
  var diff = Date.now() - ms;
  if (diff < 0) return pt ? 'hoje' : 'hoy';
  var days = Math.floor(diff / 86400000);
  if (days < 1) return pt ? 'hoje' : 'hoy';
  if (days === 1) return pt ? 'ontem' : 'ayer';
  if (days < 7) return ago + days + 'd';
  var weeks = Math.floor(days / 7);
  if (weeks < 5) return ago + weeks + ' sem';
  var months = Math.floor(days / 30);
  if (pt) return 'há ' + months + (months > 1 ? ' meses' : ' mês');
  return 'hace ' + months + ' mes' + (months > 1 ? 'es' : '');
}

// Feed de actividad reciente para el sidebar editorial. Combina las
// últimas tareas cerradas (✓) y creadas (+), sorted por timestamp
// desc, top 5. Se monta solo si D existe y hay datos.
function _edActivityFeed() {
  if (!D || (!D.tasks && !D.historial)) return '';
  var items = [];
  (D.historial || []).forEach(function(t) {
    if (!t.cerrado) return;
    var p = t.cerrado.split('/');
    var ms = new Date(parseInt(p[2],10), parseInt(p[1],10)-1, parseInt(p[0],10)).getTime();
    if (!isNaN(ms)) items.push({ kind: 'closed', name: t.nombre || '?', when: ms });
  });
  (D.tasks || []).forEach(function(t) {

    if (!isNaN(ms)) items.push({ kind: 'created', name: t.nombre || '?', when: ms });
  });
  items.sort(function(a, b){ return b.when - a.when; });

// Días hábiles entre dos Dates (excluye sáb y dom). Implementación
// frontend que matchea backend/codigo.gs#countBizDays. Usado para
// mostrar duración de cierres en la sección "Reciente" del home.
// Sección "Recent" reusable: últimas N tareas cerradas de un set
// (specialist: las propias; manager: las de su país; HQ: globales).
// Si no hay historial, omite la sección entirely.
function _edRecentClosedSection(hist, title, limit) {
  var entries = (hist || [])
    .filter(function(t){ return t.creadoRaw && t.cerrado; })
    .map(function(t) {
      var p = t.cerrado.split('/');
      var cerradoDate = new Date(parseInt(p[2],10), parseInt(p[1],10)-1, parseInt(p[0],10));
      return {
        nombre: t.nombre,
        priority: t.priority,
        resp: t.resp,
        pais: t.pais,
        cerrado: t.cerrado,
        cerradoMs: cerradoDate.getTime(),
        bizDays: _bizDays(new Date(t.creadoRaw), cerradoDate)
      };
    })
    .sort(function(a, b){ return b.cerradoMs - a.cerradoMs; })
    .slice(0, limit || 5);
  if (!entries.length) return '';
  var html = '<section class="ed-section">'
           + '<div class="ed-h2">— ' + esc(title || 'Reciente') + '</div>';
  entries.forEach(function(h) {
    var meta = (h.priority || '') + ' · ' + (h.resp || '—')
             + (h.pais ? ' · ' + h.pais : '')
             + ' · closed ' + h.cerrado
             + (h.bizDays != null ? ' · ' + h.bizDays + ' biz days' : '');
    html += '<div class="esp-recent-row">'
         +    '<div class="esp-recent-icon">✓</div>'
         +    '<div>'
         +      '<div class="esp-recent-name">' + esc(h.nombre || '') + '</div>'
         +      '<div class="esp-recent-meta">' + esc(meta) + '</div>'
         +    '</div>'
         + '</div>';
  });
  return html + '</section>';
}

function _bizDays(start, end) {
  if (!start || !end) return null;
  var s = (start instanceof Date) ? start : new Date(start);
  var e = (end instanceof Date) ? end : new Date(end);
  if (isNaN(s.getTime()) || isNaN(e.getTime())) return null;
  var count = 0;
  var cur = new Date(s.getFullYear(), s.getMonth(), s.getDate());
  var endDate = new Date(e.getFullYear(), e.getMonth(), e.getDate());
  while (cur < endDate) {
    cur.setDate(cur.getDate() + 1);
    var d = cur.getDay();
    if (d !== 0 && d !== 6) count++;
  }
  return count;
}

// escJs: escape para strings interpolados DENTRO de un onclick inline.
// esc() solo no alcanza ahí: el parser HTML decodifica &#39; de vuelta a '
// antes de evaluar el JS. Patrón correcto: esc(escJs(valor)).
// (Para handlers nuevos preferí event delegation con data-act.)
function escJs(s) {
  if (s == null) return '';
  return String(s)
    .replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"')
    .replace(/\n/g, '\\n').replace(/\r/g, '\\r')
    .replace(/</g, '\\x3c').replace(/>/g, '\\x3e').replace(/&/g, '\\x26');
}
// Parser de fechas robusto: DD/MM/YYYY primero (formato local), luego ISO local,
// luego parser nativo. Evita ambigüedad MM/DD vs DD/MM y desfases de zona horaria.
function pd(s) {
  if (!s) return null;
  s = String(s).trim();

  // 1) DD/MM/YYYY — probar primero para evitar MM/DD/YYYY del parser nativo
  var p = s.split('/');
  if (p.length === 3) {
    var dd = parseInt(p[0], 10), mm = parseInt(p[1], 10), yy = parseInt(p[2], 10);
    if (!isNaN(dd) && !isNaN(mm) && !isNaN(yy)) {
      var d = new Date(yy, mm - 1, dd);
      if (!isNaN(d.getTime())) return d;
    }
  }

  // 2) ISO YYYY-MM-DD — construir local (no UTC) para evitar desfase TZ
  var iso = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (iso) {
    var d2 = new Date(parseInt(iso[1], 10), parseInt(iso[2], 10) - 1, parseInt(iso[3], 10));
    if (!isNaN(d2.getTime())) return d2;
  }

  // 3) Fallback: parser nativo
  var d3 = new Date(s);
  if (!isNaN(d3.getTime())) return d3;
  return null;
}
// Toasts apilados con barra de progreso (estilo Linear/Notion).
// Retrocompatible con todas las llamadas existentes toast('msg', 'success'|'error'|'info'|...).
// Mapea types viejos (warn/warning/danger/ok…) a los tres canónicos.
function _ltToastStack() {
  var stack = document.getElementById('lt-toasts');
  if (!stack) {
    stack = document.createElement('div');
    stack.id = 'lt-toasts';
    stack.className = 'lt-toast-stack';
    document.body.appendChild(stack);
  }
  return stack;
}
function _ltToastType(type) {
  switch ((type || '').toLowerCase()) {
    case 'success': case 'ok': case 'good': case 'done': return 'success';
    case 'error': case 'danger': case 'fail': case 'bad': return 'error';
    case 'warn': case 'warning': return 'warn';
    default: return 'info'; // info/notice/'' → info
  }
}
// Mapea res.code (que devuelve el backend vía _err) a copy accionable. Si no
// hay code o no está mapeado, cae a res.error (back-compat con los returns
// viejos). Llamar como toast(_friendlyError(res, 'No se pudo guardar'), 'error')
// para que el user vea acción + razón en vez de "Error: undefined" o jerga.
function _friendlyError(res, fallback) {
  var defaultMsg = fallback || 'Algo salió mal.';
  if (!res) return defaultMsg;
  var code = res.code || '';
  var raw = res.error || defaultMsg;
  switch (code) {
    case 'LOCK_BUSY':
      return 'El servidor está saturado. Reintentá en unos segundos.';
    case 'BACKEND_ERROR':
      return 'Error inesperado del backend. Reintentá; si persiste, contámelo. (' + raw + ')';
    case 'SHEET_NOT_MIGRATED':
      return 'Esta hoja necesita migración antes de guardar. Pedile a un head que corra setupSheets / migrate.';
    case 'PERM_DENIED':
      return 'No tenés permiso para esta acción. Si creés que es un error, pediselo a tu manager.';
    case 'NOT_FOUND':
      return 'No encontré el registro. Otro user pudo borrarlo — refrescá la página.';
    case 'VALIDATION':
    case 'STATE_CONFLICT':
      return raw; // el mensaje del backend ya es claro/contexto-específico
    default:
      return raw;
  }
}
function toast(msg, type) {
  type = _ltToastType(type);
  var stack = _ltToastStack();
  var el = document.createElement('div');
  el.className = 'lt-toast lt-toast-' + type;
  el.setAttribute('role', 'status');
  el.innerHTML = '<span class="lt-toast-msg">' + esc(msg) + '</span>'
               + '<span class="lt-toast-bar"></span>';
  stack.appendChild(el);
  // a ~3340ms iniciar la salida, remover el nodo a 3500ms.
  el._outT = setTimeout(function(){ el.classList.add('lt-toast-out'); }, 3340);
  el._delT = setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 3500);
  return el;
}

// ════════════════════════════════════════════════════════════════
// VALIDACIÓN EN TIEMPO REAL (contrato lt-invalid / lt-field-msg)
// Marca un input como inválido: agrega clase lt-invalid y un mensaje
// <div class="lt-field-msg"> inmediatamente debajo. Sin duplicar mensajes.
// ════════════════════════════════════════════════════════════════
function ltFieldInvalid(input, msg) {
  if (!input) return;
  input.classList.add('lt-invalid');
  input.setAttribute('aria-invalid', 'true');
  var next = input.nextElementSibling;
  if (next && next.classList && next.classList.contains('lt-field-msg')) {
    next.textContent = msg; // actualizar, no duplicar
  } else {
    var div = document.createElement('div');
    div.className = 'lt-field-msg';
    div.textContent = msg;
    if (input.parentNode) input.parentNode.insertBefore(div, input.nextSibling);
  }
}
function ltFieldValid(input) {
  if (!input) return;
  input.classList.remove('lt-invalid');
  input.removeAttribute('aria-invalid');
  var next = input.nextElementSibling;
  if (next && next.classList && next.classList.contains('lt-field-msg')) {
    if (next.parentNode) next.parentNode.removeChild(next);
  }
}
// Valida un campo required: vacío → invalid, sino → valid. Devuelve true si es válido.
function _ltValidateRequired(input, msg) {
  if (!input) return true;
  var val = (input.value || '').trim();
  if (!val) { ltFieldInvalid(input, msg); return false; }
  ltFieldValid(input);
  return true;
}
// Cablea validación en vivo sobre un set de campos {id, msg} de un form,
// deshabilitando elegante el botón submit mientras haya inválidos.
// fields: [{ id, msg }]. submitId: id del botón.
function ltWireValidation(fields, submitId) {
  var btn = submitId ? $(submitId) : null;
  function revalidate(markEmpty) {
    var allOk = true;
    fields.forEach(function(f) {
      var input = $(f.id);
      if (!input) return;
      var empty = !(input.value || '').trim();
      if (empty) {
        allOk = false;
        if (markEmpty) ltFieldInvalid(input, f.msg); // solo marcar tras interacción
      } else {
        ltFieldValid(input);
      }
    });
    if (btn) btn.disabled = !allOk;
    return allOk;
  }
  fields.forEach(function(f) {
    var input = $(f.id);
    if (!input || input._ltWired) return;
    input._ltWired = true;
    var handler = function() {
      // Al editar: si quedó vacío, marcar este campo; sino limpiarlo.
      if (!(input.value || '').trim()) ltFieldInvalid(input, f.msg);
      else ltFieldValid(input);
      revalidate(false);
    };
    input.addEventListener('input', handler);
    input.addEventListener('change', handler);
  });
  // Estado inicial del botón (sin marcar campos vacíos todavía).
  revalidate(false);
  return revalidate;
}

// ═══ TAGS INPUT (accionables y participantes) ═══
function initTagsInput(containerId, hiddenId, suggestions) {
  var container = $(containerId), hidden = $(hiddenId);
  if (!container) return;
  var tags = [];

  function refresh() {
    hidden.value = tags.join(', ');
    container.querySelectorAll('.tag').forEach(function(t){ t.remove(); });
    var input = container.querySelector('.tags-text');
    tags.forEach(function(tag, i) {
      var span = document.createElement('span');
      span.className = 'tag';
      // tag-x usa event delegation via data-act="remove-tag"
      span.innerHTML = esc(tag) + '<span class="tag-x" data-act="remove-tag" data-container="'
        + esc(containerId) + '" data-i="' + i + '">×</span>';
      container.insertBefore(span, input);
    });
  }

  var input = document.createElement('input');
  input.className = 'tags-text';
  input.placeholder = tags.length ? '' : 'Escribe y presiona Enter...';
  input.onkeydown = function(e) {
    if ((e.key === 'Enter' || e.key === ',') && this.value.trim()) {
      e.preventDefault();
      var v = this.value.trim().replace(/,$/, '');
      if (v && tags.indexOf(v) < 0) tags.push(v);
      this.value = '';
      refresh();
    } else if (e.key === 'Backspace' && !this.value && tags.length) {
      tags.pop();
      refresh();
    }
  };
  container.appendChild(input);

  // Sugerencias: usa el ddMenu para mostrar una lista; items con data-act="add-tag".
  if (suggestions) {
    input.onkeyup = function() {
      var v = this.value.toLowerCase();
      if (v.length < 2) return;
      var match = suggestions.filter(function(s) {
        return s.toLowerCase().indexOf(v) >= 0 && tags.indexOf(s) < 0;
      });
      if (!match.length) return;
      var dd = $('ddM'), overlay = $('ddO');
      dd.innerHTML = '<div class="dd-label">Sugerencias</div>' + match.slice(0, 5).map(function(m) {
        return '<div class="dd-item" data-act="add-tag" data-container="' + esc(containerId)
          + '" data-val="' + esc(m) + '">' + esc(m) + '</div>';
      }).join('');
      dd.style.display = 'block';
      overlay.style.display = 'block';
      var r = input.getBoundingClientRect();
      dd.style.top = (r.bottom + 4) + 'px';
      dd.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 200)) + 'px';
    };
  }

  return {
    add: function(v){ if (v && tags.indexOf(v) < 0) { tags.push(v); refresh(); } },
    get: function(){ return tags; },
    clear: function(){ tags = []; refresh(); },
    remove: function(i){ tags.splice(i, 1); refresh(); }
  };
}

// KEYBOARD SHORTCUTS
//  · Esc  → cierra modales/dropdowns
//  · /    → enfoca el buscador
// ════════════════════════════════════════════════════════════════
// Focus trap: cuando hay un modal/overlay abierto, Tab cicla SOLO dentro de él
// (a11y — el foco no se "escapa" al contenido de fondo). Devuelve el contenedor
// del modal abierto más prominente, o null si no hay ninguno.
function _activeModalEl() {
  var sov = $('edSearchOv');
  if (sov && sov.classList.contains('show')) return sov.querySelector('.ed-search-modal') || sov;
  if ($('edHelpOv') && $('edHelpOv').classList.contains('show')) return $('edHelpOv').querySelector('.ed-help-modal') || $('edHelpOv');
  var notifEl = document.getElementById('edNotifOv');
  if (notifEl) return notifEl.querySelector('.cr-modal') || notifEl;
  var hostIds = ['uaHost', 'crHost', 'crpHost', 'edPltHost'];
  for (var i = 0; i < hostIds.length; i++) {
    var h = $(hostIds[i]);
    if (h && h.innerHTML && h.innerHTML.trim()) return h.firstElementChild || h;
  }
  if ($('confOv') && $('confOv').classList.contains('show')) return $('confOv').querySelector('.modal') || $('confOv');
  if ($('editOv') && $('editOv').classList.contains('show')) return $('editOv').querySelector('.modal') || $('editOv');
  if ($('createOv') && $('createOv').classList.contains('show')) return $('createOv').querySelector('.modal') || $('createOv');
  var bulk = document.getElementById('bulkReasignOv'); if (bulk) return bulk.querySelector('.modal, .cr-modal') || bulk;
  var panel = document.getElementById('tkPanelOv'); if (panel) return panel.querySelector('aside') || panel;
  return null;
}
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Tab') return;
  var modal = _activeModalEl();
  if (!modal) return;
  var sel = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  var nodes = Array.prototype.filter.call(modal.querySelectorAll(sel), function(el){ return el.offsetParent !== null; });
  if (!nodes.length) return;
  var first = nodes[0], last = nodes[nodes.length - 1];
  if (!modal.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    // Tour primero (cubre el viewport con z-index 95 + el tour promete
    // explícitamente que Esc cierra en el step 1).
    if ($('edTourOv')) { if (typeof edFinishTour === 'function') edFinishTour(); return; }
    // User menu del avatar — dropdown chico, también cerrable con Esc.
    if ($('edUserMenu')) { if (typeof edUserMenuClose === 'function') edUserMenuClose(); return; }
    // Búsqueda global (Cmd+K): overlay top-level. Sin esto, Esc con el foco
    // fuera del input cerraba lo que estuviera DETRÁS del cmdk.
    if ($('edSearchOv') && $('edSearchOv').classList.contains('show')) { if (typeof edSearchClose === 'function') edSearchClose(); return; }
    // Help, detalle de integración y Notificaciones — overlays top-level,
    // cierran antes que el resto.
    if ($('edHelpOv') && $('edHelpOv').classList.contains('show')) { if (typeof edHelpClose === 'function') edHelpClose(); return; }
    if ($('edIntOv')) { if (typeof edIntCloseDetail === 'function') edIntCloseDetail(); return; }
    if (document.getElementById('edNotifOv')) { if (typeof edNotifClose === 'function') edNotifClose(); return; }
    // Editoriales (más nuevos / más prominentes visualmente)
    if ($('uaHost') && $('uaHost').innerHTML) { if (typeof edUClose === 'function') edUClose(); return; }
    if ($('crHost') && $('crHost').innerHTML) {
      // crHost se comparte entre el wizard de crear, el wizard de bulk-close y
      // el modal de reasignación masiva — despachar al close de quien lo ocupa
      // (cada close limpia su propio estado; edCrearClose no conoce los otros).
      if (EDT && EDT._pendingReassignIds) { if (typeof edTkBulkReasignClose === 'function') edTkBulkReasignClose(); return; }
      if (typeof _EDT_BULK_CLOSE !== 'undefined' && _EDT_BULK_CLOSE.ids && _EDT_BULK_CLOSE.ids.length) { if (typeof edBulkCloseClose === 'function') edBulkCloseClose(); return; }
      if (typeof edCrearClose === 'function') edCrearClose();
      return;
    }
    if ($('crpHost') && $('crpHost').innerHTML) { if (typeof edCrearProyectoClose === 'function') edCrearProyectoClose(); return; }
    if ($('edPltHost') && $('edPltHost').innerHTML) { if (typeof edPltCloseEditor === 'function') edPltCloseEditor(); return; }
    if ($('ddM') && $('ddM').style.display === 'block') { closeDD(); return; }
    if ($('editOv') && $('editOv').classList.contains('show')) { closeEdit(); return; }
    if ($('confOv') && $('confOv').classList.contains('show')) { closeCf(); return; }
    if (document.getElementById('tkPanelOv')) { if (typeof edClosePanel === 'function') edClosePanel(); return; }
    return;
  }
  var ae = document.activeElement;
  var inInput = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT');
  if (inInput) return;
  if (e.key === '/') {
    // Buscar primero el input del tracker (cuando está visible);
    // sino, abrir el Cmd+K global (search universal).
    var trackerInput = document.querySelector('#vEdTracker .pa-search input');
    if (trackerInput) {
      e.preventDefault(); trackerInput.focus(); trackerInput.select();
    } else if (typeof edSearchOpen === 'function') {
      e.preventDefault(); edSearchOpen();
    }
    return;
  }
  // N → abrir wizard editorial de crear. Guard: con un modal/wizard abierto
  // no disparar — edCrearOpen monta en crHost y pisaría un bulk-close o
  // reasignación a medio completar.
  if (e.key === 'n' || e.key === 'N') {
    if (typeof _anyModalOpen === 'function' && _anyModalOpen()) return;
    if (typeof edCrearOpen === 'function') {
      e.preventDefault();
      edCrearOpen();
    }
  }
});

// DEBOUNCE
// ════════════════════════════════════════════════════════════════
function debounce(fn, wait) {
  var t;
  return function() {
    var ctx = this, args = arguments;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(ctx, args); }, wait);
  };
}

// PERSISTENCIA DE FILTROS
// Guarda/restaura F en localStorage para que el contexto de trabajo
// sobreviva al recargar. Excluye propiedades internas (_myTasks, etc).
// ════════════════════════════════════════════════════════════════
var FILTER_KEY = 'lt_filters_v1';
var PERSISTED_KEYS = ['country','status','project','resp','search','projStatus'];

function restoreFilters() {
  try {
    var raw = localStorage.getItem(FILTER_KEY);
    if (!raw) return;
    var obj = JSON.parse(raw);
    PERSISTED_KEYS.forEach(function(k){ if (obj[k] !== undefined) F[k] = obj[k]; });
  } catch (e) {}
}

// LOADER — barra superior mientras hay llamadas al server pendientes
// Refcount para soportar llamadas concurrentes (ej. update + reload).
// ════════════════════════════════════════════════════════════════
var _loaderCount = 0;
function showLoader(msg) {
  _loaderCount++;
  var el = $('loaderBar');
  if (el) el.classList.add('show');
  _loaderSetLabel(msg);
}
function hideLoader() {
  _loaderCount = Math.max(0, _loaderCount - 1);
  if (_loaderCount === 0) {
    var el = $('loaderBar');
    if (el) el.classList.remove('show');
    _loaderSetLabel(null);
  }
}
// Pill central opcional: showLoader('Subiendo archivo…') la muestra; sin texto
// solo queda el glow de los 4 lados. Se crea on-demand para no tocar el HTML.
function _loaderSetLabel(msg) {
  var lbl = document.getElementById('loaderLabel');
  if (!lbl) {
    lbl = document.createElement('div');
    lbl.id = 'loaderLabel';
    lbl.className = 'loader-label';
    document.body.appendChild(lbl);
  }
  if (msg) {
    lbl.innerHTML = '<span class="dot"></span>';
    lbl.appendChild(document.createTextNode(msg));
    lbl.classList.add('show');
  } else {
    lbl.classList.remove('show');
  }
}

// se registra a su nombre).

// Helpers de identidad de usuario. El user real puede ser head/manager/specialist;
// si el real es 'head', además puede activar un modo "ver como" via localStorage
// para previsualizar la app desde la perspectiva de Specialist o Manager. Las
// mutaciones siguen ejecutándose con su identidad real (el backend resuelve por
// email, no confía en este flag de UI).
var DEMO_ROLE_KEY = 'mydash-demo-role';
function _realRole() {
  return (USER && USER.role) || (D && D._role) || 'specialist';
}
function _demoRole() {
  if (_realRole() !== 'head') return null; // solo head puede demoear
  try {
    var v = localStorage.getItem(DEMO_ROLE_KEY);
    if (v === 'specialist' || v === 'manager' || v === 'head') return v;
  } catch(e) {}
  return null;
}
function _effectiveRole() {
  return _demoRole() || _realRole();
}
// Capacidad REAL de asignar/reasignar tareas a otros. Usa _realRole(), NO
// _effectiveRole(): el demo-switcher es cosmético (cambia qué VE un head, no lo
// que PUEDE hacer), y el backend (_authorizeTaskWrite) autoriza por rol real. Sin
// esto, un head "viendo como specialist" perdía la capacidad de asignar en la UI
// aunque el server se la concede. Convención del proyecto: gates de MUTACIÓN → rol real.
function _canAssignToOthers() {
  var r = _realRole();
  return r === 'manager' || r === 'head';
}
// ¿El usuario es el creador (responsable) del proyecto dado? Espeja _isProjectOwner
// del backend: el dueño de un proyecto puede asignar/reasignar sus tareas a quien sea,
// sin importar su rol global.
function _isProjectOwnerClient(projId) {
  if (!projId) return false;
  var p = ((D && D.projects) || []).find(function(x){ return String(x.id) === String(projId); });
  return !!(p && p.responsable && (typeof _colabNameEq === 'function'
    ? _colabNameEq(p.responsable, (USER && USER.name) || '')
    : p.responsable === ((USER && USER.name) || '')));
}

}

function _colabNameEq(a, b) {
  return String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
}
// Mi rol en t.colaboradores: 'ver' | 'editar' | null.
function _myColabRole(t) {
  if (!t || !t.colaboradores || !t.colaboradores.length) return null;
  var me = _effectiveUserName();
  if (!me) return null;
  for (var i = 0; i < t.colaboradores.length; i++) {
    var c = t.colaboradores[i];
    if (c && _colabNameEq(c.name, me)) return (c.role === 'editar') ? 'editar' : 'ver';
  }
  return null;
}
// ¿Puedo gestionar colaboradores de esta tarea? Espeja el backend
// (_authorizeColaboradoresWrite): head siempre; manager si la tarea es de
// su país; cualquiera si es el responsable.
function _canManageColab(t) {
  if (!t) return false;
  var role = _effectiveRole();
  if (role === 'head') return true;
  if (_colabNameEq(t.resp, _effectiveUserName())) return true;
  if (role === 'manager') {
    var cc = t.pais || mc(t.resp);
    if (!cc || cc === _effectiveUserCode()) return true;
  }
  return false;
}

function _todayHumanStr(iso) {
  // Devuelve "Jue 23 abr" desde "YYYY-MM-DD" sin drift de timezone.
  if (!iso) return '';
  var m = iso.toString().match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return '';
  var d = new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
  var dows = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  var mons = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return dows[d.getDay()] + ' ' + d.getDate() + ' ' + mons[d.getMonth()];
}

function _badgeFor(itemId, role) {
  if (!D || !D.tasks) return null;
  var userName = _effectiveUserName();
  var userCode = _effectiveUserCode();
  // Regla de producto: el badge muestra EXACTAMENTE lo que la vista lista al
  // abrirla con su filtro default para el rol efectivo. Antes Tracker contaba
  // el snapshot entero para specialist (sin su corte de rol), Cerradas contaba
  // todo el Historial y Proyectos contaba todos los estados — tres números que
  // no coincidían con sus vistas y minaban la confianza en los datos.
  if (itemId === 'mistareas') {
    return D.tasks.filter(function(t){ return t.resp === userName && t.status !== 'Listo'; }).length || null;
  }
  if (itemId === 'tracker') {
    return _edRoleScopeTasks(D.tasks, role, userName, userCode)
      .filter(function(t){ return t.status !== 'Listo'; }).length || null;
  }
  if (itemId === 'proyectos') {
    // La vista abre en el tab "Activos" (Activo + En pausa).
    return (D.projects || []).filter(function(p){ return p.status === 'Activo' || p.status === 'En pausa'; }).length || null;
  }
  if (itemId === 'paises')    return (D.countries || []).length || null;
  if (itemId === 'historial') return _edRoleScopeTasks((D.historial || []), role, userName, userCode).length || null;
  // Biblioteca: badge de propuestas pendientes de aprobar (solo para quienes
  // aprueban — manager/head). Para specialist no es accionable.
  if (itemId === 'plantillas') return (role !== 'specialist' && D.templatesPending) ? D.templatesPending : null;
  return null;
}

function _edCrumbs(viewId) {
  // Derivar grupo + label del nav REAL del rol, para que el breadcrumb coincida
  // siempre con la sección del sidebar (antes era un mapa estático que se
  // contradecía con el menú: p.ej. Tracker decía "Donde trabajo" pero para el
  // specialist vive en "Mi día").
  var role = (typeof _effectiveRole === 'function') ? _effectiveRole() : 'specialist';
  var navRole = role === 'head' ? 'head' : (role === 'manager' ? 'manager' : 'specialist');
  var nav = (typeof ED_NAV_BY_ROLE !== 'undefined' && ED_NAV_BY_ROLE[navRole]) || [];
  var grp = null, lbl = null;
  for (var gi = 0; gi < nav.length && !lbl; gi++) {
    for (var ii = 0; ii < nav[gi].items.length; ii++) {
      if (nav[gi].items[ii].id === viewId) { grp = nav[gi].section; lbl = nav[gi].items[ii].label; break; }
    }
  }
  var c;
  if (lbl) c = [grp, lbl];
  else c = _ED_CRUMBS_BY_VIEW[viewId] || ['Inicio']; // fallback para vistas sin item de nav
  return c.map(function(seg, i){
    var isLast = i === c.length - 1;
    var sep = i > 0 ? '<span class="sep">/</span>' : '';
    var label = t(seg);
    if (isLast) {
      return sep + '<span class="cur">' + esc(label) + '</span>';
    }
    return sep + '<span class="seg" style="cursor:pointer" onclick="goEd(\'home\')">' + esc(label) + '</span>';
  }).join(' ');
}

function edStartTour() {
  var role = _effectiveRole();
  TOUR_STATE.role = role;
  TOUR_STATE.steps = _tourStepsForRole(role);
  TOUR_STATE.step = 0;
  _tourRender();
}
function _tourRender() {
  var s = TOUR_STATE.steps[TOUR_STATE.step];
  if (!s) { edFinishTour(); return; }
  var total = TOUR_STATE.steps.length;
  var cur = TOUR_STATE.step + 1;
  // Limpiar cualquier spotlight previo antes de re-renderizar (al cambiar step).
  document.querySelectorAll('.tour-spotlight').forEach(function(el) { el.classList.remove('tour-spotlight'); });
  // Limpiar listener interactivo previo (si el step anterior tenía interactive).
  if (TOUR_STATE._listener) {
    document.removeEventListener('keydown', TOUR_STATE._listener);
    TOUR_STATE._listener = null;
  }
  var existing = $('edTourOv'); if (existing) existing.remove();
  var ov = document.createElement('div');
  ov.id = 'edTourOv';
  ov.className = 'ed-tour-overlay';
  ov.onclick = function(e) { if (e.target === ov) edFinishTour(); };
  ov.innerHTML = ''
    + '<div class="ed-tour-modal" role="dialog" aria-modal="true" aria-label="Tour">'
    +   '<div class="ed-tour-progress"><div class="ed-tour-progress-fill" style="width:' + Math.round(cur/total*100) + '%"></div></div>'
    +   '<div class="ed-tour-head">'
    +     '<div>'
    +       '<div class="ed-tour-eye">— ' + esc(s.eye) + ' · ' + esc(t('paso')) + ' ' + cur + ' ' + esc(t('de')) + ' ' + total + '</div>'
    +       '<div class="ed-tour-title">' + s.title + '</div>'
    +     '</div>'
    +     '<button class="ed-tour-x" type="button" onclick="edFinishTour()" aria-label="' + esc(t('Cerrar')) + '">×</button>'
    +   '</div>'
    +   '<div class="ed-tour-body">' + s.body + '</div>'
    +   '<div class="ed-tour-foot">'
    +     '<button class="pa-btn pa-btn-ghost" onclick="edFinishTour()">' + esc(cur === total ? t('Listo') : t('Saltar tour')) + '</button>'
    +     '<div style="margin-left:auto;display:flex;gap:6px">'
    +       (cur > 1 ? '<button class="pa-btn pa-btn-outline" onclick="edTourPrev()">' + esc(t('← Atrás')) + '</button>' : '')
    +       (s.action ? '<button class="pa-btn pa-btn-outline" onclick="' + s.action.fnCode + '">' + esc(s.action.label) + '</button>' : '')
    +       '<button class="pa-btn pa-btn-primary" onclick="' + (cur === total ? 'edFinishTour()' : 'edTourNext()') + '">'
    +         esc(cur === total ? t('Empezar a usar') : t('Siguiente →'))
    +       '</button>'
    +     '</div>'
    +   '</div>'
    + '</div>';
  document.body.appendChild(ov);
  // Aplicar spotlight si el step apunta a un elemento (e.g. item del sidebar).
  // El elemento se eleva sobre el overlay (z-index 96 > 95) y pulsea con un
  // anillo accent — visualmente "iluminado" mientras el resto queda dimmed.
  if (s.target) {
    try {
      var targetEl = document.querySelector(s.target);
      if (targetEl) targetEl.classList.add('tour-spotlight');
    } catch (e) {}
  }
  // Step interactivo: escucha al user ejecutar el atajo y avanza solo.
  // Hoy soporta 'cmdk' — el handler global existente abre la búsqueda; nosotros
  // solo escuchamos para avanzar (no preventDefault).
  if (s.interactive === 'cmdk') {
    TOUR_STATE._listener = function(e) {
      if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
        setTimeout(function() { edTourNext(); }, 250);
      }
    };
    document.addEventListener('keydown', TOUR_STATE._listener);
  }
}
function edTourNext() {
  TOUR_STATE.step = Math.min(TOUR_STATE.step + 1, TOUR_STATE.steps.length - 1);
  _tourRender();
}
function edTourPrev() {
  TOUR_STATE.step = Math.max(TOUR_STATE.step - 1, 0);
  _tourRender();
}
function edFinishTour() {
  var ov = $('edTourOv'); if (ov) ov.remove();
  document.querySelectorAll('.tour-spotlight').forEach(function(el) { el.classList.remove('tour-spotlight'); });
  if (TOUR_STATE._listener) {
    document.removeEventListener('keydown', TOUR_STATE._listener);
    TOUR_STATE._listener = null;
  }
  try { localStorage.setItem(TOUR_FLAG, '1'); } catch(e){}
}

// Fuzzy subsequence matcher con ranking simple. Devuelve un score (mayor = mejor)
// o -1 si no matchea. Premia: match exacto de substring, prefijo, y caracteres
// contiguos. Sirve para tolerar typos/abreviaturas (estilo Linear/Notion).
function _edFuzzyScore(text, q) {
  text = (text || '').toLowerCase();
  q = (q || '').toLowerCase();
  if (!q) return 0;
  if (!text) return -1;
  // Substring exacto: el mejor caso. Prefijo puntúa aún más alto.
  var idx = text.indexOf(q);
  if (idx >= 0) {
    return 1000 - idx + (idx === 0 ? 200 : 0);
  }
  // Subsecuencia: cada char de q debe aparecer en orden dentro de text.
  var score = 0, ti = 0, prevMatch = -2, matched = 0;
  for (var qi = 0; qi < q.length; qi++) {
    var ch = q.charAt(qi);
    var found = -1;
    for (var j = ti; j < text.length; j++) {
      if (text.charAt(j) === ch) { found = j; break; }
    }
    if (found < 0) return -1; // char no encontrado → no matchea
    matched++;
    if (found === prevMatch + 1) score += 5; // contigüidad
    if (found === 0 || /[\s\-_\/.#]/.test(text.charAt(found - 1))) score += 3; // inicio de palabra
    score += 1;
    prevMatch = found;
    ti = found + 1;
  }
  // Penalizar texto muy largo respecto a la query (matches dispersos valen menos).
  return score - Math.floor(text.length / 40);
}

// Devuelve el mejor score fuzzy sobre varios campos (usa el campo más relevante).
function _edFuzzyBest(fields, q) {
  var best = -1;
  for (var i = 0; i < fields.length; i++) {
    var s = _edFuzzyScore(fields[i], q);
    if (s > best) best = s;
  }
  return best;
}

// Acciones globales del Cmd+K (estilo command palette de Linear). Cada entrada
// referencia una función EXISTENTE; solo se incluyen las que existen en runtime.
// Esto evita listar comandos rotos si alguna feature se quita en el futuro.
function _edSearchActions() {

      keywords: 'crear nueva tarea criar nova tarefa create task new',
      run: function(){ edSearchClose(); edCrearOpen(); }
    });
  }
  if (typeof setTheme === 'function') {
    var curTheme = (document.documentElement.dataset.theme === 'light') ? 'light' : 'dark';
    if (curTheme === 'dark') {
      acts.push({
        label: lang === 'pt' ? 'Modo claro' : 'Modo claro',
        hint: lang === 'pt' ? 'Trocar para tema claro' : 'Cambiar al tema claro',
        keywords: 'modo claro light theme tema',

      });

        hint: lang === 'pt' ? 'Trocar para tema escuro' : 'Cambiar al tema oscuro',
        keywords: 'modo oscuro escuro dark theme tema',
        run: function(){ edSearchClose(); setTheme('dark'); }
      });
    }
  }
  if (typeof edNotifOpen === 'function') {
    acts.push({
      label: lang === 'pt' ? 'Ver atividade recente' : 'Ver actividad reciente',
      hint: lang === 'pt' ? 'Abre o painel de atividade' : 'Abre el panel de actividad',
      keywords: 'actividad reciente atividade recente activity notifications notificaciones',

    acts.push({

      hint: toEs ? 'Cambiar la interfaz a Español' : 'Trocar a interface para Português',
      keywords: 'cambiar idioma language idioma español portugues português es pt',
      run: function(){ edSearchClose(); setLang(toEs ? 'es' : 'pt'); }
    });
  }
  return acts;
}

// Filtra acciones globales por fuzzy match. Devuelve [{kind:'action', item, score}].
function _edSearchActionMatches(q) {
  var acts = _edSearchActions();
  var out = [];
  for (var i = 0; i < acts.length; i++) {
    var a = acts[i];
    var s = _edFuzzyBest([a.label, a.keywords], q);
    if (s >= 0) out.push({ kind: 'action', item: a, score: s });
  }
  out.sort(function(x, y){ return y.score - x.score; });
  return out;
}

function _edSearchFilter(query) {
  var q = (query || '').trim().toLowerCase();
  if (!q) return [];
  var tasks = (D && D.tasks) || [];
  var projects = (D && D.projects) || [];
  var pMap = {};
  projects.forEach(function(p){ pMap[p.id] = p.nombre; });
  var out = [];
  // Tareas: ranking fuzzy. El título (nombre) e id pesan más que campos
  // secundarios. Toleramos typos/abreviaturas vía subsecuencia.
  var taskMatches = [];
  for (var i = 0; i < tasks.length; i++) {
    var t = tasks[i];
    var pn = (t.proyectoId && pMap[t.proyectoId]) ? pMap[t.proyectoId] : '';
    var primary = _edFuzzyBest([String(t.nombre || ''), String(t.id || '')], q);
    var secondary = _edFuzzyBest([t.resp, t.notas, t.tipoTrabajo, t.pais, pn], q);
    var score = primary >= 0 ? primary + 50 : secondary; // primary gana siempre
    if (score >= 0) taskMatches.push({ kind: 'task', item: t, projectName: pn, score: score });
  }
  // Tareas CERRADAS (Historial) al MISMO ranking de tareas. Antes el índice solo
  // cubría D.tasks (activas), así que un asunto cerrado era inencontrable salvo
  // que supieras el ID. edSearchPickTask ya detecta historial y abre con el
  // filtro "closed". El pill "Listo" las distingue visualmente.
  var hist = (D && D.historial) || [];
  for (var hi = 0; hi < hist.length; hi++) {
    var ht = hist[hi];
    var hpn = (ht.proyectoId && pMap[ht.proyectoId]) ? pMap[ht.proyectoId] : '';
    var hPrimary = _edFuzzyBest([String(ht.nombre || ''), String(ht.id || '')], q);
    var hSecondary = _edFuzzyBest([ht.resp, ht.notas, ht.tipoTrabajo, ht.pais, hpn], q);
    var hScore = hPrimary >= 0 ? hPrimary + 50 : hSecondary;
    if (hScore >= 0) taskMatches.push({ kind: 'task', item: ht, projectName: hpn, score: hScore, closed: true });
  }
  taskMatches.sort(function(a, b){ return b.score - a.score; });
  for (var tm = 0; tm < taskMatches.length && out.length < 80; tm++) out.push(taskMatches[tm]);
  for (var j = 0; j < projects.length && out.length < 100; j++) {
    var p = projects[j];
    var hay2 = [p.nombre, p.responsable, p.lider, p.notas, p.tipoTrabajo, p.pais].join(' ').toLowerCase();
    if (hay2.indexOf(q) >= 0) out.push({ kind: 'project', item: p });
  }
  // Documents: buscamos en los docs adjuntos a las tareas que el
  // usuario ya puede ver (backend ya filtra tasks por rol +
  // confidencialidad, así que docs visibles == docs autorizados).
  // También buscamos en docs de proyectos.
  for (var ti = 0; ti < tasks.length && out.length < 120; ti++) {
    var tk = tasks[ti];
    var docs = tk.documentos || [];
    for (var di = 0; di < docs.length; di++) {
      var d = docs[di];
      var dName = (d.name || '').toLowerCase();
      if (dName.indexOf(q) >= 0) {
        out.push({ kind: 'document', item: d, taskId: tk.id, taskName: tk.nombre, confLevel: tk.confidencialidad || 'estandar' });
        if (out.length >= 120) break;
      }
    }
  }
  for (var pi = 0; pi < projects.length && out.length < 140; pi++) {
    var pj = projects[pi];
    var pdocs = pj.documentos || [];
    for (var pdi = 0; pdi < pdocs.length; pdi++) {
      var pd = pdocs[pdi];
      var pdName = (pd.name || '').toLowerCase();
      if (pdName.indexOf(q) >= 0) {
        out.push({ kind: 'document', item: pd, projectId: pj.id, projectName: pj.nombre });
        if (out.length >= 140) break;
      }
    }
  }
  // Documentos de la Biblioteca (sheet BibliotecaDocs, ya filtrados por rol en el
  // server). Se cargan lazy vía _loadBibDocs. Matchea por nombre + tags + notas +
  // tipo + área. El contexto muestra "Biblioteca · <tipoDoc> · <país>".
  var bibDocs = (typeof _BIBDOCS_CACHE !== 'undefined' && _BIBDOCS_CACHE) ? _BIBDOCS_CACHE : [];
  for (var bi = 0; bi < bibDocs.length && out.length < 160; bi++) {
    var bd = bibDocs[bi];
    var bdHay = [(bd.nombre || ''), (bd.tags || ''), (bd.notas || ''), (bd.tipoDocumento || ''), (bd.areaTrabajo || '')].join(' ').toLowerCase();
    if (bdHay.indexOf(q) >= 0) {
      var bdCtx = (bd.tipoDocumento && bd.tipoDocumento !== 'Otro' ? bd.tipoDocumento : '') + (bd.pais ? (bd.tipoDocumento && bd.tipoDocumento !== 'Otro' ? ' · ' : '') + bd.pais : '');
      out.push({ kind: 'document', item: { name: bd.nombre, url: bd.url }, biblioteca: true, bibCategoria: bdCtx });
    }
  }
  return out;
}

function _edSearchHighlight(text, query) {
  var safe = esc(text || '');
  if (!query) return safe;
  var qSafe = esc(query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  if (!qSafe) return safe;
  return safe.replace(new RegExp(qSafe, 'gi'), function(m) { return '<mark>' + m + '</mark>'; });
}

function _edSearchRender() {
  var host = $('edSearchResults'); if (!host) return;
  var q = (EDS.query || '').trim();
  if (!q) {
    host.innerHTML = ''
      + '<div class="ed-search-empty">'
      +   '<div style="font-size:13px;color:var(--fg-2)">' + esc(t('Escribí para buscar tareas, proyectos o documentos…')) + '</div>'
      + '</div>';
    return;
  }
  var results = _edSearchFilter(q);
  var actionShow = _edSearchActionMatches(q).slice(0, 5);
  // Cap por sección. Total visible 15: 8 tasks + 4 projects + 3 docs
  // (si una sección no llena su cuota, las otras pueden expandirse).
  var taskAll = results.filter(function(r){ return r.kind === 'task'; });
  var projAll = results.filter(function(r){ return r.kind === 'project'; });
  var docAll  = results.filter(function(r){ return r.kind === 'document'; });
  var taskShow = taskAll.slice(0, 8);
  var projShow = projAll.slice(0, 4);
  var docShow  = docAll.slice(0, 5);

  if (!actionShow.length && !taskShow.length && !projShow.length && !docShow.length) {
    host.innerHTML = ''
      + '<div class="ed-search-empty">'
      +   '<div style="font-size:13px;color:var(--fg-2)">' + esc(t('Sin resultados para')) + ' "<b>' + esc(q) + '</b>"</div>'
      +   '<div style="font-size:11px;color:var(--fg-3);margin-top:6px">' + esc(t('Probá con menos términos, otra grafía, o un código de tarea')) + ' (<b>T-001</b>).</div>'
      + '</div>';
    return;
  }

  var html = '';
  // Acciones globales primero (command palette estilo Linear). Guardamos los
  // handlers en EDS.actions para invocarlos por índice desde el onclick.
  EDS.actions = actionShow.map(function(r){ return r.item; });
  if (actionShow.length) {
    html += '<div class="ed-search-section">' + esc(t('Acciones')) + '</div>';
    actionShow.forEach(function(r, ai) {
      var a = r.item;
      html += '<div class="ed-search-result" onclick="edSearchRunAction(' + ai + ')">'
           +    '<span class="ed-search-r-kind">' + esc(t('acción')) + '</span>'
           +    '<span class="ed-search-r-id">⌘</span>'
           +    '<span class="ed-search-r-name">' + _edSearchHighlight(a.label || '', q) + '</span>'
           +    '<span class="ed-search-r-resp">' + esc(a.hint || '') + '</span>'
           +    '<span class="ed-search-r-eta">↵</span>'
           +  '</div>';
    });
  }
  if (taskShow.length) {
    html += '<div class="ed-search-section">' + esc(t('Tareas')) + '</div>';
    taskShow.forEach(function(r) {
      // tk, no t: el shadowing taparía la función i18n t() usada acá.
      var tk = r.item;
      var statusCls = (typeof _statusClass === 'function') ? _statusClass(tk.status) : '';
      html += '<div class="ed-search-result" onclick="edSearchPickTask(\'' + esc(escJs(String(tk.id))) + '\')">'
           +    '<span class="ed-search-r-kind">' + esc(t('tarea')) + '</span>'
           +    '<span class="ed-search-r-id">' + esc(tk.id) + '</span>'
           +    '<span class="ed-search-r-name">' + _edSearchHighlight(tk.nombre || '', q) + '</span>'
           +    '<span class="ed-search-r-resp">' + _edSearchHighlight(tk.resp || '—', q) + '</span>'
           +    '<span class="ed-pill ' + statusCls + '">' + esc(_statusLabel(tk.status)) + '</span>'
           +    '<span class="ed-search-r-eta">' + esc(tk.eta || '') + '</span>'
           +  '</div>';
    });
  }
  if (projShow.length) {
    html += '<div class="ed-search-section">' + esc(t('Proyectos')) + '</div>';
    projShow.forEach(function(r) {
      var p = r.item;
      html += '<div class="ed-search-result" onclick="edSearchPickProject(\'' + esc(escJs(String(p.id))) + '\')">'
           +    '<span class="ed-search-r-kind">' + esc(t('proyecto')) + '</span>'
           +    '<span class="ed-search-r-id">#' + esc(p.id) + '</span>'
           +    '<span class="ed-search-r-name">' + _edSearchHighlight(p.nombre || '', q) + '</span>'
           +    '<span class="ed-search-r-resp">' + _edSearchHighlight(p.responsable || p.lider || '—', q) + '</span>'
           +    '<span class="ed-pill">' + esc(p.status || 'Activo') + '</span>'
           +    '<span class="ed-search-r-eta">' + esc(p.deadline || '') + '</span>'
           +  '</div>';
    });
  }
  if (docShow.length) {
    html += '<div class="ed-search-section">' + esc(t('Documentos')) + '</div>';
    docShow.forEach(function(r) {
      var d = r.item;
      var url = (d.url || '#').replace(/'/g, '%27');
      var ctx = r.taskId ? (t('Tarea') + ' ' + r.taskId + ' · ' + (r.taskName || ''))
              : r.projectId ? (t('Proyecto') + ' · ' + (r.projectName || ''))
              : r.biblioteca ? (t('Biblioteca') + (r.bibCategoria ? ' · ' + r.bibCategoria : ''))
              : '';
      // Confidentiality indicator (solo de tareas; backend ya filtra
      // los confidenciales que el usuario no puede ver).
      var confChip = '';
      if (r.confLevel && r.confLevel !== 'estandar') {
        var meta = (typeof ED_CONF_LEVELS !== 'undefined' && ED_CONF_LEVELS[r.confLevel]) || { label: r.confLevel };
        confChip = '<span class="ed-search-conf ' + r.confLevel + '" title="' + esc(meta.label) + '">' + esc(meta.label) + '</span>';
      }
      html += '<div class="ed-search-result" onclick="edSearchPickDoc(\'' + esc(url) + '\',\'' + esc(r.taskId || r.projectId || '') + '\',\'' + (r.taskId ? 'task' : (r.biblioteca ? 'biblioteca' : 'project')) + '\')">'
           +    '<span class="ed-search-r-kind">' + esc(t('documento')) + '</span>'
           +    '<span class="ed-search-r-id">📄</span>'
           +    '<span class="ed-search-r-name">' + _edSearchHighlight(d.name || t('Documento'), q) + '</span>'
           +    '<span class="ed-search-r-resp">' + esc(ctx) + '</span>'
           +    confChip
           +    '<span class="ed-search-r-eta">' + esc(t('Abrir')) + ' ↗</span>'
           + '</div>';
    });
  }
  host.innerHTML = html;
  // Marcar el primer resultado como active para que ↓/↑ y Enter
  // tengan un punto de partida visual.
  EDS.activeIdx = 0;
  var firstRow = host.querySelector('.ed-search-result');
  if (firstRow) firstRow.classList.add('active');
}

function edSearchPickTask(taskId) {
  // Si la tarea está cerrada (vive en historial), setear filter='closed' para
  // que el tracker la muestre. Sino el panel queda colgado sobre un tracker
  // vacío y el user no entiende qué pasó.
  if (typeof EDT !== 'undefined') {
    EDT.selectedId = taskId;
    var inHist = ((D && D.historial) || []).some(function(t){ return String(t.id) === String(taskId); });
    if (inHist) EDT.filter = 'closed';
    // Si hay drill-down de país activo (head) y la tarea elegida es de otro
    // país, mover el drill al país de la tarea: sino _edFilterByRole la
    // excluye, rEdTracker no la encuentra y el pick "no hace nada".
    var picked = ((D && D.tasks) || []).concat((D && D.historial) || [])
      .find(function(t){ return String(t.id) === String(taskId); });
    if (picked && EDT.country && (picked.pais || '') !== EDT.country) {
      EDT.country = picked.pais || null;
      if (!EDT.country) EDT.skipCountriesView = true;
      if (typeof _edPersistEDT === 'function') _edPersistEDT();
    }
  }
  edSearchClose();
  if (typeof goEd === 'function') goEd('tracker');
}
function edSearchPickProject(projectId) {
  edSearchClose();
  if (typeof goEd === 'function') goEd('proyectos');
  // Después de navegar al index, abrir el detalle del proyecto seleccionado.
  // setTimeout pequeño para que el render del index termine antes del open.
  if (projectId && typeof edPiOpen === 'function') {
    setTimeout(function(){ edPiOpen(projectId); }, 50);
  }
}
// Document pick: abre el link en pestaña nueva. Si era de una task,
// además navega al panel para que el contexto quede visible.
function edSearchPickDoc(url, parentId, kind) {
  edSearchClose();
  if (url && url !== '#') {
    // Solo http(s): mismo guard que el panel de tarea (evita javascript: y
    // esquemas raros si una celda del sheet vino con un link malformado).
    var decoded = url; try { decoded = decodeURIComponent(url); } catch(e) {}
    if (/^https?:\/\//i.test(decoded)) {
      try { window.open(decoded, '_blank', 'noopener'); } catch(e2) {}
    }
  }
  // Optional: drill into the parent context (task panel or project detail)
  if (kind === 'task' && parentId && typeof EDT !== 'undefined') {
    EDT.selectedId = parentId;
    if (typeof goEd === 'function') goEd('tracker');
  } else if (kind === 'project' && parentId && typeof edPiOpen === 'function') {
    edPiOpen(parentId);
    if (typeof goEd === 'function') goEd('proyectos');
  }
}

// Listener global de Cmd/Ctrl+K. Aparte del handler general para
// que funcione también con foco en otros inputs (atajo universal).
document.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault();
    edSearchOpen();
    return;
  }
  // ? abre el help modal de atajos. Solo cuando no hay foco en input.
  if (e.key === '?' && !e.metaKey && !e.ctrlKey && !e.altKey) {
    var ae = document.activeElement;
    var inInput = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT');
    if (inInput) return;
    e.preventDefault();
    edHelpOpen();
  }
});
