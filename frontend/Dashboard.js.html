var EDU = { taskId: null, variant: null, newConf: null, running: false };

// Helper: el usuario puede opcionalmente cambiar el nivel de confidencialidad
// al cerrar o bloquear. newConf null = no cambia; valor = se incluye en el update.
function edUSetConf(nivel) {
  if (!ED_CONF_LEVELS[nivel]) return;
  // Toggle: si clickea el mismo nivel, lo des-selecciona.
  EDU.newConf = (EDU.newConf === nivel) ? null : nivel;
  if (!EDU.taskId) return;
  var task = D && D.tasks && D.tasks.find(function(t){ return t.id == EDU.taskId; });
  if (!task) return;
  var host = $('uaHost'); if (host) host.innerHTML = _uaRender(task, EDU.variant);
}
var _UA_FLOW = ['Pendiente', 'En curso', 'En revisión', 'Listo'];

function _uaNextStatus(current) {
  var idx = _UA_FLOW.indexOf(current);
  if (idx < 0 || idx >= _UA_FLOW.length - 1) return 'Listo';
  return _UA_FLOW[idx + 1];
}

function _uaFlowIndices(current, variant) {
  var nowIdx = _UA_FLOW.indexOf(current);
  if (nowIdx < 0) nowIdx = 0;
  var targetIdx;
  if (variant === 'cerrar') targetIdx = 3;
  else if (variant === 'bloquear') targetIdx = -1;
  else targetIdx = Math.min(nowIdx + 1, 3);
  return { nowIdx: nowIdx, targetIdx: targetIdx };
}

function _uaRenderFlow(task, variant) {
  var idx = _uaFlowIndices(task.status, variant);
  var html = '<div class="ua-flow">';
  for (var i = 0; i < _UA_FLOW.length; i++) {
    var dotCls = i < idx.nowIdx ? 'done' : i === idx.nowIdx ? 'now' : i === idx.targetIdx ? 'target' : '';
    var lblCls = i === idx.nowIdx ? 'now' : i === idx.targetIdx ? 'target' : '';
    html += '<div class="ua-flow-step">'
         +    '<div class="ua-flow-dot ' + dotCls + '"></div>'
         +    '<div class="ua-flow-lbl ' + lblCls + '">' + esc(_UA_FLOW[i]) + '</div>'
         + '</div>';
    if (i < _UA_FLOW.length - 1) {
      var lineCls = i < idx.nowIdx ? 'done' : '';
      html += '<div class="ua-flow-line ' + lineCls + '"></div>';
    }
  }
  html += '</div>';
  return html;
}

function _uaRenderOptions(variant) {
  function opt(key, lbl, name) {
    var active = variant === key ? ' active' : '';
    return '<button type="button" class="ua-opt' + active + '" onclick="edUSwitchVariant(\'' + key + '\')">'
         +    '<div class="ua-opt-lbl">' + esc(lbl) + '</div>'
         +    '<div class="ua-opt-name">' + esc(name) + '</div>'
         + '</button>';
  }
  return '<div class="ua-options">'
       +    opt('avanzar',  t('Avanzar'),       '→ ' + (LANG === 'pt' ? 'próximo status' : 'siguiente estado'))
       +    opt('cerrar',   t('Cerrar'),        LANG === 'pt' ? 'Marcar como feita' : 'Marcar como hecha')
       +    opt('bloquear', t('Poner on hold'), LANG === 'pt' ? 'Esperando algo externo' : 'Esperando algo externo')
       + '</div>';
}

function _uaRenderActionCard(variant, task) {
  if (variant === 'cerrar') {
    return '<div class="ua-action cerrar">'
         +   '<div class="ua-action-mark">✓</div>'
         +   '<div>'
         +     '<div class="ua-action-h">Estás por cerrar esta tarea.</div>'

         +   '</div>'

         +     '<div class="ua-action-sub">La tarea queda en pausa con el motivo documentado. <b>No consume capacidad activa</b> mientras está bloqueada.</div>'
         +   '</div>'
         + '</div>';

  return '<div class="ua-action avanzar">'
       +   '<div class="ua-action-mark">→</div>'

       +     '<div class="ua-action-h">Avanzar a <em>' + esc(_statusLabel(next)) + '</em>.</div>'

function _uaRenderConfField(task) {
  // Sólo se muestra en variantes cerrar/bloquear: pills opcionales para cambiar
  // el nivel de confidencialidad. Si EDU.newConf es null, ninguna queda activa.
  var current = _confLevel(task);

    ? 'Cambiará a <b>' + esc(ED_CONF_LEVELS[sel].label) + '</b>. Click de nuevo para deseleccionar.'
    : 'Actual: <b>' + esc(ED_CONF_LEVELS[current].label) + '</b>. Click un nivel para cambiarlo.';
  return '<div class="ua-field">'
       +   '<div class="ua-label">Cambiar confidencialidad <span class="opt">(opcional)</span></div>'
       +   '<div class="cr-pills-row">' + pill('estandar') + pill('restringido') + pill('confidencial') + '</div>'
       +   '<div style="font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45">' + hint + '</div>'
       + '</div>';
}

function _uaRenderBody(task, variant) {
  var actionCard = _uaRenderActionCard(variant, task);
  var fieldHtml;
  if (variant === 'cerrar') {
    fieldHtml = '<div class="ua-field">'
              +   '<div class="ua-label">¿Qué se hizo? <span class="req">*</span></div>'
              +   '<textarea class="ua-input ua-textarea" id="uaResumen" placeholder="Resumen rápido de cómo se cerró"></textarea>'
              + '</div>';
  } else if (variant === 'bloquear') {
    fieldHtml = '<div class="ua-field">'
              +   '<div class="ua-label">¿Qué te está bloqueando? <span class="req">*</span></div>'
              +   '<textarea class="ua-input ua-textarea" id="uaRazon" placeholder="ej: RR.HH. no respondió en 4 días."></textarea>'
              + '</div>';
  } else {
    fieldHtml = '<div class="ua-field">'
              +   '<div class="ua-label">Nota para el siguiente paso <span class="opt">(opcional)</span></div>'
              +   '<textarea class="ua-input ua-textarea" id="uaNota" placeholder="ej: prestar especial atención a la cláusula 7.2."></textarea>'
              + '</div>';
  }
  // Confidencialidad opcional sólo en cerrar/bloquear (avanzar es transición de estado pura).
  // Restringido a manager/head — si lo mostrásemos al specialist y eligiera un nivel, el
  // backend rechaza con "Sin permiso: solo manager o head" y aborta el cierre entero.
  var uaRole = (typeof _effectiveRole === 'function') ? _effectiveRole() : 'specialist';
  var uaCanConf = (uaRole === 'manager' || uaRole === 'head');
  var confHtml = (uaCanConf && (variant === 'cerrar' || variant === 'bloquear')) ? _uaRenderConfField(task) : '';
  return '<div class="ua-body">' + _uaRenderOptions(variant) + actionCard + fieldHtml + confHtml + '</div>';
}

function _uaRenderFoot(variant) {
  var info, btn;
  if (variant === 'cerrar') {
    info = '<b>Al cerrar:</b> se mueve al historial · libera 1 slot en tu carga.';
    btn = 'Cerrar tarea ✓';
  } else if (variant === 'bloquear') {
    info = '<b>Al bloquear:</b> la tarea deja de consumir tu capacidad activa.';
    btn = 'Marcar bloqueada';

function _uaRender(task, variant) {
  var pn = _projNameForTask(task);
  return '<div class="ua-overlay" onclick="if(event.target===this)edUClose()">'
       +   '<div class="ua-backdrop" onclick="edUClose()"></div>'
       +   '<aside class="ua-panel" role="dialog" aria-modal="true" aria-label="Actualizar tarea">'
       +     '<div class="ua-head">'
       +       '<button type="button" class="ua-x" onclick="edUClose()" aria-label="Cerrar">×</button>'
       +       '<div class="ua-eye">— Actualizar estado</div>'
       +       '<div class="ua-id">' + esc(task.id + ' · ' + pn) + '</div>'
       +       '<div class="ua-title">' + esc(task.nombre || '') + '</div>'
       +     '</div>'
       +     _uaRenderFlow(task, variant)
       +     _uaRenderBody(task, variant)
       +     _uaRenderFoot(variant)

function edUOpen(taskId, variant) {
  if (!D || !D.tasks) { if (typeof toast === 'function') toast('Sin datos cargados', 'error'); return; }
  var task = D.tasks.find(function(t){ return t.id == taskId; });
  if (!task) { if (typeof toast === 'function') toast('Tarea no encontrada', 'error'); return; }
  EDU.taskId = task.id;
  EDU.variant = variant || 'avanzar';
  EDU.newConf = null;
  var host = $('uaHost'); if (!host) return;
  host.innerHTML = _uaRender(task, EDU.variant);
}

// Desbloquear: una tarea Bloqueada vuelve a 'En curso' (asume que estaba en
// progreso cuando se bloqueó). El usuario puede ajustar después con inline edit
// si era 'Pendiente'. Sin modal — acción directa con toast de feedback.
function edUDesbloquear(taskId) {
  if (!taskId) return;
  if (typeof showLoader === 'function') showLoader();
  google.script.run
    .withSuccessHandler(function(res) {
      if (typeof hideLoader === 'function') hideLoader();
      if (res && res.success) {
        toast('Tarea desbloqueada', 'success');
        if (typeof reload === 'function') reload();
      } else {
        toast((res && res.error) || 'No se pudo desbloquear.', 'error');
      }
    })
    .withFailureHandler(function(e) {
      if (typeof hideLoader === 'function') hideLoader();
      toast('Error: ' + (e && e.message || 'desconocido'), 'error');
    })
    .updateTaskField(taskId, 'status', 'En curso');
}

// Reabre una tarea cerrada: la vuelve a Tracking Activo en estado "En curso".
// Confirma primero porque mueve la fila de Historial → Activo.
function edReabrir(taskId) {
  if (!taskId) return;
  // Aviso del plazo: una reabierta conserva su deadline original — si ya pasó,
  // nace vencida. Mejor avisarlo acá que sorprender con el rojo después.
  confirm_(t('¿Reabrir esta tarea? Volverá a tus tareas activas como "En curso".') + ' ' + t('Si su plazo ya pasó, actualizalo al reabrirla.'), function() {
    if (typeof showLoader === 'function') showLoader();
    google.script.run
      .withSuccessHandler(function(res) {
        if (typeof hideLoader === 'function') hideLoader();
        if (res && res.success) {
          toast(t('Tarea reabierta'), 'success');
          if (typeof edClosePanel === 'function') edClosePanel();
          if (typeof reload === 'function') reload();
        } else {
          toast((res && (res.error || res.message)) || t('No se pudo reabrir.'), 'error');
        }
      })
      .withFailureHandler(function(e) {
        if (typeof hideLoader === 'function') hideLoader();
        toast('Error: ' + (e && e.message || 'desconocido'), 'error');
      })
      .reopenTaskById(taskId);
  }, { confirmLabel: t('Reabrir') });
}

function edUClose() {
  EDU.taskId = null;
  EDU.variant = null;
  EDU.newConf = null;
  EDU.running = false;
  var host = $('uaHost'); if (host) host.innerHTML = '';
}

function edUSwitchVariant(v) {
  if (!EDU.taskId) return;
  EDU.variant = v;
  // Avanzar no muestra el field de confidencialidad — limpiamos para no arrastrar selección.
  if (v === 'avanzar') EDU.newConf = null;
  var task = D.tasks.find(function(t){ return t.id == EDU.taskId; });
  if (!task) return;
  var host = $('uaHost'); if (host) host.innerHTML = _uaRender(task, v);
}

function edUSubmit() {
  if (!EDU.taskId || !EDU.variant) return;
  var task = D.tasks.find(function(t){ return t.id == EDU.taskId; });
  if (!task) return;
  var fields = {};
  if (EDU.variant === 'cerrar') {
    var resumen = ($('uaResumen') && $('uaResumen').value || '').trim();
    // Mínimo 5 caracteres, igual que el cierre masivo (bulk). El resumen es el
    // registro permanente del cierre de un asunto legal; una "x" no sirve.
    if (resumen.length < 5) { if (typeof toast === 'function') toast(LANG === 'pt' ? 'O resumo de fechamento precisa de ao menos 5 caracteres' : 'El resumen de cierre debe tener al menos 5 caracteres', 'error'); return; }
    fields.status = 'Listo';
    // Anteponer el cierre PRESERVANDO las notas previas (checklist/contexto).
    // Antes se sobrescribía notas entero → se perdía el checklist.
    fields.notas = 'CIERRE: ' + resumen + (task.notas ? '\n\n' + task.notas : '');
  } else if (EDU.variant === 'bloquear') {
    var razon = ($('uaRazon') && $('uaRazon').value || '').trim();
    if (!razon) { if (typeof toast === 'function') toast('Falta el motivo para bloquear', 'error'); return; }
    fields.status = 'Bloqueado';
    // La razón debe quedar como PRIMERA línea (el backend deriva blockedReason
    // y accionable de notas[0]), pero conservamos el checklist debajo.
    fields.notas = razon + (task.notas ? '\n\n' + task.notas : '');
  } else {
    // Si "Avanzar" llevaría a 'Listo' (cierre), forzamos la variant 'cerrar'
    // para pedir resumen y respetar la validación de cierre.
    var next = _uaNextStatus(task.status);
    if (next === 'Listo') {
      if (typeof toast === 'function') toast('Para cerrar la tarea, completá el resumen.', 'info');
      edUSwitchVariant('cerrar');
      return;
    }
    fields.status = next;
    var nota = ($('uaNota') && $('uaNota').value || '').trim();
    if (nota) fields.notas = nota;
  }
  // Si el usuario eligió cambiar el nivel de confidencialidad (sólo cerrar/bloquear),
  // lo incluimos en el batch update.
  if ((EDU.variant === 'cerrar' || EDU.variant === 'bloquear') && EDU.newConf) {
    fields.confidencialidad = EDU.newConf;
  }
  // Double-submit guard: doble click (o Enter rápido) en el CTA disparaba dos
  // updateTaskFields; el segundo, con la tarea ya en Historial, devolvía un
  // error confuso. El flag se libera en error; en éxito edUClose lo resetea.
  if (EDU.running) return;
  EDU.running = true;
  var _uaBtn = document.querySelector('#uaHost .ed-btn.accent');
  if (_uaBtn) { _uaBtn.disabled = true; _uaBtn.style.opacity = '0.6'; }
  if (typeof showLoader === 'function') showLoader();
  // Capturamos el variant antes de edUClose() porque ahí se resetea
  // EDU. Lo necesitamos para decidir si auto-seleccionar la siguiente
  // tarea urgente tras un cierre exitoso.
  var submittedVariant = EDU.variant;
  google.script.run
    .withSuccessHandler(function(res) {
      if (typeof hideLoader === 'function') hideLoader();
      if (res && res.success === false) {
        EDU.running = false;
        if (_uaBtn) { _uaBtn.disabled = false; _uaBtn.style.opacity = ''; }
        if (typeof toast === 'function') toast(res.error || 'Error', 'error');
        return;
      }
      var msg = submittedVariant === 'cerrar' ? 'Tarea cerrada' : submittedVariant === 'bloquear' ? 'Tarea bloqueada' : 'Tarea avanzada';
      if (typeof toast === 'function') toast(msg, 'success');
      edUClose();
      google.script.run.withSuccessHandler(function(fresh) {
        if (!fresh) return;
        D = fresh;
        var active = document.querySelector('.view.active');
        if (!active) return;
        // Tras cierre en el tracker, auto-seleccionar la siguiente
        // tarea urgente (top de la lista filtrada) para que el usuario
        // pueda seguir cerrando sin clickear de nuevo.
        if (submittedVariant === 'cerrar' && active.id === 'vEdTracker') {
          var nextT = _edNextUrgent();
          EDT.selectedId = nextT ? nextT.id : null;
        }
        if (active.id === 'vEdHome' && typeof goEd === 'function') goEd('home');
        else if (active.id === 'vEdTracker' && typeof goEd === 'function') goEd('tracker');
      }).withFailureHandler(function(e) {
        console.error(e);
        if (typeof hideLoader === 'function') hideLoader();
        if (typeof toast === 'function') toast('Error al recargar: ' + (e && e.message || 'desconocido'), 'error');
      }).getEditorialData();
    })
    .withFailureHandler(function(e) {
      if (typeof hideLoader === 'function') hideLoader();
      EDU.running = false;
      if (_uaBtn) { _uaBtn.disabled = false; _uaBtn.style.opacity = ''; }
      if (typeof toast === 'function') toast('Error: ' + (e && e.message || 'desconocido'), 'error');
    })
    .updateTaskFields(EDU.taskId, fields);
}

// MARKER:EDITORIAL_CREAR_BEGIN
// Wizard editorial de 3 pasos para crear tarea — versión simplificada del
// rediseño de pendientes/ed-crear.jsx. Mantiene step indicator, pills, resumen
// final + submit a addTask. Descarta features que requieren backend nuevo:
// sugerencias IA, banda IA, niveles de confidencialidad, visibilidad multi-
// persona, adjuntos drive/local. (El modal de creación legacy #createOv fue
// removido: tareas y proyectos se crean solo por los wizards editoriales.)
// ───────────────────────────────────────────────────────────────

var EDC = {
  step: 1,
  values: {
    titulo: '',
    descripcion: '',
    tipo: '',
    pais: '',
    prioridad: 'Media',
    riesgo: '',
    resp: '',
    deadline: '',
    proyectoId: '',
    contraparte: '',
    confidencialidad: 'estandar',
    areaSolicitante: ''
  }
};

var _CR_TIPOS  = ['Contractual', 'Regulatorio', 'Contencioso', 'Privacy', 'Operativo'];
var _CR_PRIOS  = ['Alta', 'Media', 'Baja'];
// Riesgo simplificado: "Legal alto" → "Legal" (lo de "alto" era redundante
// con prioridad Alta), "Operativo" → "Negocio" (evita solape con tipoTrabajo
// "Operativo"). Backend acepta valores legacy por compat.
var _CR_RIESGOS = ['Legal', 'Reputacional', 'Negocio'];
// Fallback solo si D.equipos llega vacío (no debería pasar). Sincronizado
// con todos los países activos del sheet Equipos al 2026-05.
var _CR_PAIS_FALLBACK = ['CO', 'MX', 'BR', 'AR', 'CL', 'PE', 'CR', 'UY', 'EC'];

function _crCountries() {
  // Incluye HQ (Global) como un equipo más — feedback del user. Retorna
  // array de {value, label} para que las pills muestren "Global" en lugar
  // del code crudo "HQ", manteniendo el value como "HQ" para backend.
  if (D && D.equipos && D.equipos.length) {
    var seen = {}, out = [];
    D.equipos.forEach(function(eq){
      var c = eq && eq.code;
      if (c && !seen[c]) {
        seen[c] = 1;
        out.push({ value: c, label: paCountryLabel(c) });
      }
    });
    if (out.length) return out;
  }
  return _CR_PAIS_FALLBACK.map(function(c){ return { value: c, label: paCountryLabel(c) }; });
}
// Display label de un country code: "HQ" → "Global", otros se muestran tal cual.
function paCountryLabel(code) {
  if (!code) return '';
  // Codes de equipos no-país: HQ (head global) y COMP (equipo Compliance,
  // global, transversal a países). El resto son ISO de país y se muestran tal cual.
  if (code === 'HQ') return 'Global';
  if (code === 'COMP') return 'Compliance';
  return code;
}

function _crResponsables() {
  if (typeof getAllMembers === 'function') {
    var m = getAllMembers();
    if (m && m.length) return m;
  }
  if (D && D.team && D.team.length) {
    return D.team.map(function(t){ return t && t.name; }).filter(Boolean);
  }

// ── Conflicto de interés (wizard de tareas) ───────────────────────────
// Si la tarea se liga a un proyecto que declaró "contrapartes en conflicto" y
// la contraparte ingresada matchea una, avisamos en vivo. Criterio de match:
// exacto o substring en cualquier
// dirección, case-insensitive. El backend ya soporta el campo (col 19); esto es
// 100% UI.
function _crMatchConflict(contraparte, declared) {
  var cp = (contraparte || '').toString().trim().toLowerCase();
  if (!cp || !Array.isArray(declared)) return null;
  for (var i = 0; i < declared.length; i++) {
    var d = (declared[i] || '').toString().trim();
    if (!d) continue;
    var dl = d.toLowerCase();
    if (cp === dl || cp.indexOf(dl) !== -1 || dl.indexOf(cp) !== -1) return d;
  }
  return null;
}
function _crConflictMsg(v) {
  if (!v || !v.proyectoId || !v.contraparte) return '';
  var projects = (D && D.projects) || [];
  var proj = projects.find(function(p){ return String(p.id) === String(v.proyectoId); });
  if (!proj) return '';
  var hit = _crMatchConflict(v.contraparte, proj.contrapartesConflicto || []);
  if (!hit) return '';
  return '<div style="margin-top:8px;padding:10px 12px;border-radius:8px;'
    + 'border:1px solid var(--warn,#e6a23c);background:var(--warn-soft,rgba(230,162,60,.14));'
    + 'color:var(--warn,#e6a23c);font-size:12.5px;font-weight:600;line-height:1.45">'
    + '⚠ ' + esc(t('Posible conflicto de interés')) + ': '
    + esc(t('La contraparte coincide con un conflicto declarado en este proyecto'))
    + ' — "' + esc(proj.nombre || ('#' + proj.id)) + '" (' + esc(hit) + ').'
    + '</div>';
}
function _crRefreshConflict() {
  var el = $('crConflictWarn');
  if (el) el.innerHTML = _crConflictMsg(EDC.values);
}

// Fecha objetivo de SLA: hoy + N días hábiles (N = SLA de la prioridad).
// Solo cuenta lun–vie (los feriados por país los aplica el backend al medir;
// acá es una sugerencia, el usuario puede cambiarla). Devuelve ISO yyyy-MM-dd.
function _slaTargetISO(prio) {
  var todayISO = (D && D.today) || '';
  var m = todayISO.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return '';
  var n = _slaLimit(prio);
  var d = new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
  var added = 0;
  while (added < n) {
    d.setDate(d.getDate() + 1);
    var wd = d.getDay();
    if (wd !== 0 && wd !== 6) added++;
  }
  var mm = String(d.getMonth() + 1); if (mm.length < 2) mm = '0' + mm;
  var dd = String(d.getDate()); if (dd.length < 2) dd = '0' + dd;
  return d.getFullYear() + '-' + mm + '-' + dd;
}
function _isoToDDMM(iso) {
  var m = (iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (m[3] + '/' + m[2]) : '';
}
// Setea el deadline al objetivo de SLA de la prioridad elegida y re-renderiza.
function edCrearUseSLA() {
  var iso = _slaTargetISO(EDC.values.prioridad || 'Media');
  if (!iso) return;
  EDC.values.deadline = iso;
  try { localStorage.setItem('lt-edc-draft', JSON.stringify(EDC.values)); } catch (e) {}
  _crMount();
}

// Campo "Colaboradores (opcional)" del paso 2 del wizard de crear tarea.
// Es 100% local: appendea a EDC.values.colaboradores y NO toca el backend —
// la lista se manda recién en edCrearSubmit dentro de addTask(). Espeja el
// patrón/estilo del modal del panel (_edColabRender): picker de personas del
// país + toggle de rol Ver/Editar, y muestra los agregados como chips.
function _crColabFieldHtml(v) {
  var draft = EDC.colabDraft || (EDC.colabDraft = { name: '', role: 'ver' });
  var added = Array.isArray(v.colaboradores) ? v.colaboradores : [];
  // Candidatos: miembros del país (paso 1 ya exige país), menos el responsable
  // y los ya agregados. Mismo criterio laxo de nombres que el resto del tracker.
  var taken = {};
  added.forEach(function(c){ if (c && c.name) taken[String(c.name).trim().toLowerCase()] = 1; });
  var respKey = String(v.resp || '').trim().toLowerCase();
  var candidates = _crpMembers(v.pais).filter(function(n) {
    var k = String(n || '').trim().toLowerCase();
    return k && k !== respKey && !taken[k];
  });
  // Si el draft apunta a alguien que ya no es candidato (recién agregado o
  // pasó a ser el resp), lo limpiamos para no mandar basura.
  if (draft.name && candidates.map(function(n){ return String(n).trim().toLowerCase(); }).indexOf(String(draft.name).trim().toLowerCase()) < 0) {
    draft.name = '';
  }

  // Chips de los ya agregados (nombre · rol · ×).
  var chips = added.map(function(c) {
    if (!c || !c.name) return '';
    return '<span class="cr-pill-btn active" style="cursor:default;gap:6px">'
      + esc(c.name)
      + ' · ' + esc(c.role === 'editar' ? t('Puede editar') : t('Puede ver'))
      + '<button type="button" onclick="edCrearRemoveColab(\'' + escJs(c.name) + '\')" title="' + esc(t('Quitar')) + '" '
      +   'style="background:none;border:0;color:inherit;cursor:pointer;font-size:14px;line-height:1;padding:0 0 0 2px">×</button>'
      + '</span>';
  }).join('');
  var chipsRow = chips
    ? '<div class="cr-pills-row" style="margin-bottom:8px">' + chips + '</div>'
    : '';

  // Sub-control para agregar: picker + toggle de rol + botón Agregar.
  function roleBtn(val, label) {
    var on = draft.role === val;
    return '<button type="button" onclick="edCrearSetColabRole(\'' + val + '\')" '
      + 'class="cr-pill-btn' + (on ? ' active' : '') + '" style="flex:1;justify-content:center">' + esc(label) + '</button>';
  }
  var picker = candidates.length
    ? '<div class="cr-grid2" style="align-items:end">'
      +   '<div>'
      +     _crSelectHtml('crColabPick', candidates.map(function(n){ return { value: n, label: n }; }), draft.name, t('Elegí una persona…')).replace('<select id="crColabPick"', '<select id="crColabPick" onchange="edCrearSetColabName(this.value)"')
      +   '</div>'
      +   '<div style="display:flex;gap:8px">'
      +     '<div style="display:flex;gap:6px;flex:1">' + roleBtn('ver', t('Puede ver')) + roleBtn('editar', t('Puede editar')) + '</div>'
      +     '<button type="button" class="pa-btn pa-btn-primary" ' + (draft.name ? '' : 'disabled style="opacity:.5;cursor:not-allowed"') + ' '
      +       'onclick="edCrearAddColab(\'' + escJs(draft.name) + '\',\'' + escJs(draft.role) + '\')">' + paIcon('plus', 12) + ' ' + esc(t('Agregar')) + '</button>'
      +   '</div>'
      + '</div>'
    : '<div style="font-size:12px;color:var(--fg-3)">' + esc(t('No hay personas disponibles para agregar.')) + '</div>';

  return '<div class="cr-field">'
    +   '<div class="cr-label">' + esc(t('Colaboradores (opcional)')) + '</div>'
    +   chipsRow
    +   picker
    + '</div>';
}

    +     '<div class="cr-conf-cell"><div class="cr-conf-lbl">Tipo</div><div class="cr-conf-val">' + esc(v.tipo || '—') + '</div></div>'
    +     '<div class="cr-conf-cell"><div class="cr-conf-lbl">País</div><div class="cr-conf-val">' + esc(v.pais || '—') + '</div></div>'
    +     '<div class="cr-conf-cell"><div class="cr-conf-lbl">Proyecto</div><div class="cr-conf-val">' + esc(projName) + '</div></div>'
    +   '</div>'
    + '</div>';
  if (v.descripcion) {
    html += '<div class="cr-conf-section">'
         +   '<div class="cr-conf-eye">— Descripción</div>'
         +   '<div class="cr-conf-desc">' + esc(v.descripcion) + '</div>'
         + '</div>';
  }
  return html;
}

function _crStepClasses(stepNum, current) {
  if (current > stepNum) return 'cr-step done';
  if (current === stepNum) return 'cr-step active';
  return 'cr-step';
}

function _crRender(step) {
  var s = step || EDC.step || 1;
  var titles = {
    1: t('Empezá por lo esencial'),
    2: t('Detalles, responsable y plazo'),
    3: t('Lista para publicar')
  };
  var infos = {
    1: t('Siguiente: <b>responsable, prioridad y plazo.</b>'),
    2: t('Cuando estés listo, te llevamos al review final antes de publicar.'),
    3: t('Revisión final. Cuando confirmes, se crea la tarea.')
  };
  var bodyHtml;
  if (s === 1) bodyHtml = _crRenderStep1();
  else if (s === 2) bodyHtml = _crRenderStep2();
  else bodyHtml = _crRenderStep3();

  var footBtns = '';
  var cancelBtn = '<button type="button" class="ed-btn ghost" onclick="edCrearClose()">' + esc(t('Cancelar')) + '</button>';
  if (s === 1) {
    footBtns = cancelBtn
             + '<button type="button" class="ed-btn accent" onclick="edCrearGoStep(2)">' + esc(t('Continuar →')) + '</button>';
  } else if (s === 2) {
    footBtns = cancelBtn
             + '<button type="button" class="ed-btn" onclick="edCrearGoStep(1)">' + esc(t('← Atrás')) + '</button>'
             + '<button type="button" class="ed-btn accent" onclick="edCrearGoStep(3)">' + esc(t('Revisar y publicar →')) + '</button>';
  } else {
    footBtns = cancelBtn
             + '<button type="button" class="ed-btn" onclick="edCrearGoStep(2)">' + esc(t('← Editar')) + '</button>'
             + '<button type="button" class="ed-btn" onclick="edCrearSubmit(true)">' + esc(t('Crear y cerrar')) + '</button>'
             + '<button type="button" class="ed-btn accent" id="crSubmit" onclick="edCrearSubmit()">' + esc(t('Publicar tarea')) + '</button>';
  }

  return '<div class="cr-overlay" onclick="if(event.target===this)edCrearClose()">'
       +   '<div class="cr-backdrop" onclick="edCrearClose()"></div>'
       +   '<div class="cr-modal" role="dialog" aria-modal="true" aria-label="' + esc(t('Crear tarea')) + '">'
       +     '<div class="cr-head">'
       +       '<div>'
       +         '<div class="cr-eye">— ' + esc(t('Crear nueva tarea')) + '</div>'
       +         '<div class="cr-title">' + esc(titles[s] || '') + '</div>'
       +       '</div>'
       +       '<button type="button" class="cr-x" onclick="edCrearClose()" aria-label="Cerrar">×</button>'
       +     '</div>'
       +     '<div class="cr-steps">'
       +       '<div class="' + _crStepClasses(1, s) + '"><span class="cr-step-num">01</span> ' + esc(t('Esencial')) + '</div>'
       +       '<div class="' + _crStepClasses(2, s) + '"><span class="cr-step-num">02</span> ' + esc(t('Detalles')) + '</div>'
       +       '<div class="' + _crStepClasses(3, s) + '"><span class="cr-step-num">03</span> ' + esc(t('Confirmar')) + '</div>'
       +     '</div>'
       +     '<div class="cr-body">' + bodyHtml + '</div>'
       +     '<div class="cr-foot">'
       +       '<div class="cr-foot-info">' + (infos[s] || '') + '</div>'
       +       footBtns
       +     '</div>'
       +   '</div>'
       + '</div>';
}

function _crMount() {
  var host = $('crHost'); if (!host) return;
  host.innerHTML = _crRender(EDC.step);
}

function edCrearOpen() {
  // Pre-fill responsable y país con los datos del usuario efectivo.
  // Para specialist, responsable = ellos mismos (no pueden reasignar
  // de todos modos). Para manager/head, queda como sugerencia
  // editable.
  var currentName = (typeof _effectiveUserName === 'function') ? _effectiveUserName() : '';
  var currentCode = (typeof _effectiveUserCode === 'function') ? _effectiveUserCode() : '';
  // Invalidar cache de templates: si un manager creó/editó plantillas en
  // otra pestaña/sesión, queremos verlas reflejadas en este wizard sin
  // pedir reload de la página. _loadTemplates re-fetcha la primera vez
  // que se accede después de null.
  _TEMPLATES_CACHE = null;
  EDC.step = 1;
  EDC.errors = {};
  // Para head: el pre-fill de país queda vacío (HQ no es un país operativo).
  // Para specialist/manager: su país real. Backend valida igual.
  var openRole = (typeof _effectiveRole === 'function') ? _effectiveRole() : 'specialist';
  var prefillPais = (openRole === 'head') ? '' : (currentCode || '');
  EDC.values = {
    titulo: '',
    descripcion: '',
    tipo: '',
    pais: prefillPais,
    prioridad: 'Media',
    riesgo: '',
    resp: currentName || '',
    deadline: '',
    proyectoId: '',
    confidencialidad: 'estandar',
    areaSolicitante: '',
    colaboradores: []
  };
  // Estado transitorio del sub-control "agregar colaborador" del paso 2.
  // Sobrevive a los re-render del wizard (_crMount re-renderea todo el body),
  // pero NO se persiste en el draft de localStorage. Espeja EDCOL del panel.
  EDC.colabDraft = { name: '', role: 'ver' };
  // Restaurar borrador de localStorage si existe contenido útil (titulo o
  // descripcion). Solo override campos NO vacíos del draft — sino una
  // sesión previa que dejó resp/pais en blanco anula nuestros pre-fills
  // y la validación falla silenciosa al avanzar de paso.
  try {
    var saved = localStorage.getItem('lt-edc-draft');
    if (saved) {
      var v = JSON.parse(saved);
      if (v && (v.titulo || v.descripcion)) {
        Object.keys(v).forEach(function(k) {
          if (v[k]) EDC.values[k] = v[k];
        });
        if (typeof toast === 'function') toast('Borrador restaurado.', 'info');
      }
    }
  } catch(e){}
  // El draft puede traer colaboradores de una sesión previa (o nada). Garantizar
  // que siempre sea un array para que el render del paso 2 no rompa.
  if (!Array.isArray(EDC.values.colaboradores)) EDC.values.colaboradores = [];
  _crMount();
  setTimeout(function() {
    var input = $('crTitulo');
    if (input) input.focus();
  }, 60);
}

function edCrearClose() {
  EDC.step = 1;
  var host = $('crHost'); if (host) host.innerHTML = '';
}

function edCrearSetField(key, value) {
  if (!EDC.values || !(key in EDC.values)) return;
  EDC.values[key] = value;
  // Limpiar el error del campo cuando el usuario lo edita (feedback inmediato).
  if (EDC.errors && EDC.errors[key]) {
    delete EDC.errors[key];
  }
  // Persistir borrador en localStorage para no perder el progreso si el modal se cierra accidentalmente.
  try { localStorage.setItem('lt-edc-draft', JSON.stringify(EDC.values)); } catch(e){}
  // Para campos texto/select que están dentro del DOM actual, no re-renderizamos
  // — el valor ya está en EDC.values. Para pills sí re-renderizamos para
  // reflejar el estado activo.
  var rerenderFields = { tipo: 1, pais: 1, prioridad: 1, confidencialidad: 1 };
  if (rerenderFields[key]) _crMount();
}

// ── Sub-control de colaboradores del paso 2 (todo local, sin backend) ──
// Stagear nombre/rol y commit a EDC.values.colaboradores. Re-renderean el
// wizard (igual que las pills de edCrearSetField) para reflejar el estado.
function edCrearSetColabName(v) {
  if (!EDC.colabDraft) EDC.colabDraft = { name: '', role: 'ver' };
  EDC.colabDraft.name = v || '';
  _crMount();
}
function edCrearSetColabRole(v) {
  if (!EDC.colabDraft) EDC.colabDraft = { name: '', role: 'ver' };
  EDC.colabDraft.role = (v === 'editar') ? 'editar' : 'ver';
  _crMount();
}
function edCrearAddColab(name, role) {
  if (!EDC.values) return;
  if (!Array.isArray(EDC.values.colaboradores)) EDC.values.colaboradores = [];
  // Fallback al estado staged si el arg viene vacío (defensivo).
  var nm = (name || (EDC.colabDraft && EDC.colabDraft.name) || '').toString().trim();
  var rl = ((role || (EDC.colabDraft && EDC.colabDraft.role) || 'ver') === 'editar') ? 'editar' : 'ver';
  if (!nm) return;
  // Dedup laxo por nombre (mismo criterio que _colabNameEq); el último gana rol.
  var exists = false;
  for (var i = 0; i < EDC.values.colaboradores.length; i++) {
    if (_colabNameEq(EDC.values.colaboradores[i].name, nm)) { EDC.values.colaboradores[i].role = rl; exists = true; break; }
  }
  if (!exists) EDC.values.colaboradores.push({ name: nm, role: rl });
  // Reset del picker (el rol se mantiene como sticky para agregar varios igual).
  if (EDC.colabDraft) EDC.colabDraft.name = '';
  try { localStorage.setItem('lt-edc-draft', JSON.stringify(EDC.values)); } catch(e){}
  _crMount();
}
function edCrearRemoveColab(name) {
  if (!EDC.values || !Array.isArray(EDC.values.colaboradores)) return;
  EDC.values.colaboradores = EDC.values.colaboradores.filter(function(c){ return !_colabNameEq(c.name, name); });
  try { localStorage.setItem('lt-edc-draft', JSON.stringify(EDC.values)); } catch(e){}
  _crMount();
}

function edCrearGoStep(n) {
  // Validación del paso actual antes de avanzar.
  // Setea EDC.errors[field] para que el render del paso muestre el mensaje
  // inline debajo de cada campo invalid, y emite un toast resumen.
  var v = EDC.values;
  EDC.errors = {};
  if (n > EDC.step) {
    if (EDC.step === 1) {
      if (!v.titulo || !v.titulo.trim()) EDC.errors.titulo = 'Escribí un título descriptivo.';
      if (!v.tipo) EDC.errors.tipo = 'Elegí un tipo de trabajo.';
      if (!v.pais) EDC.errors.pais = 'Elegí un país.';
    } else if (EDC.step === 2) {
      if (!v.resp) EDC.errors.resp = 'Elegí quién es responsable.';
      if (!v.deadline) EDC.errors.deadline = 'Definí el plazo.';
    }
    var errKeys = Object.keys(EDC.errors);
    if (errKeys.length) {
      toast('Revisá ' + errKeys.length + (errKeys.length === 1 ? ' campo' : ' campos') + ' marcados.', 'error');
      _crMount();
      return;
    }
  }
  EDC.step = n;
  _crMount();
}

function edCrearSubmit(closeOnCreate) {
  closeOnCreate = !!closeOnCreate;
  var v = EDC.values;
  if (!v.titulo || !v.titulo.trim()) { toast('Falta el título', 'error'); return; }
  if (!v.resp) { toast('Falta el responsable', 'error'); return; }
  if (!v.pais) { toast('Falta el país', 'error'); return; }
  var payload = {
    nombre: v.titulo.trim(),
    proyectoId: v.proyectoId || '',
    pais: v.pais || '',
    priority: v.prioridad || 'Media',
    tipoTrabajo: v.tipo || '',
    riesgo: v.riesgo || '',
    resp: v.resp || '',
    lider: '',
    deadline: v.deadline || '',
    acc: '',
    notas: (v.descripcion || '').trim(),
    confidencialidad: v.confidencialidad || 'estandar',
    areaSolicitante: v.areaSolicitante || '',
    contraparte: v.contraparte || '',
    colaboradores: Array.isArray(v.colaboradores) ? v.colaboradores : [],
    // "Crear y cerrar": la tarea nace ya finalizada (caso "ya la había hecho").
    // El backend la crea y la mueve a Historial en la misma llamada.
    closeOnCreate: closeOnCreate
  };
  // Crear es la mutación más frecuente del specialist y era la única que
  // bloqueaba la UI de punta a punta: loader fullscreen + reload() completo
  // con segundo loader (~2-6s sin control). Ahora: cerrar el wizard YA,
  // devolver el control, y reconciliar con _reloadSilent cuando el server
  // responda (la fila aparece sola, sin loader). No insertamos fila optimista:
  // addTask devuelve solo {success,id} y el server completa datos que el
  // cliente no puede calcular bien (checklist del template, ETA con feriados)
  // — una fila provisional clickeable con id falso rompería el panel.
  // El draft de localStorage NO se borra hasta el éxito: si falla, el wizard
  // se reabre con todo lo escrito intacto.
  edCrearClose();
  toast(t('Creando tarea…'), 'info');
  console.log('[create-task] payload', payload);
  google.script.run
    .withSuccessHandler(function(res) {
      console.log('[create-task] response', res);
      if (res && res.success) {
        toast('✅ Tarea #' + res.id + (closeOnCreate ? ' creada y cerrada' : ' creada'), 'success');
        try { localStorage.removeItem('lt-edc-draft'); } catch(e){}
        _reloadSilent();
      } else {
        toast(_friendlyError(res, t('No se pudo crear la tarea. Revisá y reintentá.')), 'error');
        edCrearOpen(); // restaura el borrador con los datos intactos
      }
    })
    .withFailureHandler(function(e) {
      console.error('[create-task] failure', e);
      toast(t('No se pudo crear la tarea. Revisá y reintentá.'), 'error');
      edCrearOpen();
    })
    .addTask(payload);
}

// Atajos de teclado de los wizards de crear (tarea y proyecto):
// · Enter desde un input de texto/fecha → avanzar de paso (con la validación
//   de goStep); en el paso 3, enviar.
// · Cmd/Ctrl+Enter desde cualquier lado del wizard → avanzar/enviar.
// Antes había que ir al mouse en cada paso (quick win del backlog).
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter') return;
  var taskOpen = $('crHost') && $('crHost').innerHTML;
  var projOpen = $('crpHost') && $('crpHost').innerHTML;
  if (!taskOpen && !projOpen) return;
  // crHost también hospeda el wizard de bulk-close y el modal de reasignación
  // masiva — esos tienen su propio flujo, no interferir.
  if (taskOpen && typeof EDT !== 'undefined' && EDT._pendingReassignIds) return;
  if (taskOpen && typeof _EDT_BULK_CLOSE !== 'undefined' && _EDT_BULK_CLOSE.ids && _EDT_BULK_CLOSE.ids.length) return;
  var meta = e.metaKey || e.ctrlKey;
  var ae = document.activeElement;
  var tag = ae ? ae.tagName : '';
  if (tag === 'TEXTAREA' && !meta) return; // Enter escribe newline; Cmd+Enter envía
  if (!meta) {
    // Enter "a secas": solo desde inputs de texto/fecha — sobre selects,
    // botones y pills dejamos el comportamiento nativo.
    if (tag !== 'INPUT') return;
    var tp = (ae.type || 'text').toLowerCase();
    if (tp !== 'text' && tp !== 'date' && tp !== 'search') return;
  }
  e.preventDefault();
  if (taskOpen) {
    if (EDC.step < 3) edCrearGoStep(EDC.step + 1);
    else edCrearSubmit();
  } else {
    if (EDCP.step < 3) edCrearProyectoGoStep(EDCP.step + 1);
    else edCrearProyectoSubmit();
  }
});

// ¿Puede ELIMINAR este proyecto? Más estricto que editar: NO alcanza con ser
// participante. Espeja _deleteProjectImpl del backend (head; manager de su país;

function _piCanDeleteProject(p) {

  var role = (typeof _effectiveRole === 'function') ? _effectiveRole() : 'specialist';
  if (role === 'head') return true;
  if (role === 'manager') return !p.pais || p.pais === _effectiveUserCode();
  return !!(p.responsable && p.responsable === _effectiveUserName());
}

// el proyecto tiene tareas vinculadas (STATE_CONFLICT) — lo mostramos como aviso.
function edPiDeleteProject(id) {

  var nm = p ? (p.nombre || ('#' + id)) : ('#' + id);

// Línea de tiempo del proyecto: hitos con fecha (creación, deadlines de tareas,
// cierres, plazo del proyecto) ordenados cronológicamente. Las filas de tarea son
// clickeables. Devuelve '' si no hay eventos con fecha.
function _piRenderTimeline(p, D) {
  function dmy(s){ var m = (s || '').toString().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? new Date(+m[3], +m[2]-1, +m[1]) : null; }
  function iso(s){ var m = (s || '').toString().match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
  var events = [];
  var c0 = dmy(p.creado); if (c0) events.push({ d: c0, label: t('Proyecto creado'), tone: 'done' });
  ((D && D.tasks) || []).filter(function(tk){ return tk.proyectoId == p.id; }).forEach(function(tk){
    var d = iso(tk.deadlineISO) || dmy(tk.deadline); if (!d) return;
    events.push({ d: d, label: (tk.nombre || t('Tarea')) + ' · ' + _statusLabel(tk.status), tone: _etaToneClass(tk.etaDays, tk.status), taskId: tk.id });
  });
  ((D && D.historial) || []).filter(function(tk){ return tk.proyectoId == p.id; }).forEach(function(tk){
    var d = dmy(tk.cerrado); if (!d) return;
    events.push({ d: d, label: (tk.nombre || t('Tarea')) + ' · ' + t('cerrada'), tone: 'done', taskId: tk.id });
  });
  var pd = iso(p.deadlineISO) || dmy(p.deadline); if (pd) events.push({ d: pd, label: t('Plazo del proyecto'), tone: 'warn', deadline: true });
  if (!events.length) return '';
  events.sort(function(a, b){ return a.d - b.d; });
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var rows = events.map(function(e){
    var past = e.d < today && !e.deadline;
    var dotColor = e.tone === 'crit' ? 'var(--critical)' : (e.tone === 'warn' ? 'var(--warn)' : (e.tone === 'done' ? '#3fa888' : 'var(--accent)'));
    var dateStr = e.d.getDate() + '/' + (e.d.getMonth() + 1) + '/' + e.d.getFullYear();
    var click = e.taskId ? (' style="cursor:pointer" onclick="edGoTaskInTracker(\'' + esc(String(e.taskId)) + '\')"') : '';
    return '<div' + click + ' style="display:flex;gap:10px;align-items:flex-start;padding:6px 0;opacity:' + (past ? '0.65' : '1') + '">'
      +   '<div style="flex-shrink:0;width:10px;height:10px;border-radius:50%;background:' + dotColor + ';margin-top:4px"></div>'
      +   '<div style="flex:1;min-width:0">'
      +     '<div style="font-size:13px;color:var(--fg-1)' + (e.deadline ? ';font-weight:600' : '') + '">' + esc(e.label) + '</div>'
      +     '<div style="font-size:11px;color:var(--fg-3)">' + dateStr + '</div>'
      +   '</div>'
      + '</div>';
  }).join('');
  return '<div style="border-left:2px solid var(--line-1);padding-left:16px;margin:8px 0 0 4px">' + rows + '</div>';
}

// ── Participación en proyectos: UNA definición para header, tabs y cards ──
// Matching laxo de nombres: en la data real conviven "Juan Camilo Gallego",
// "Juan Gallego" y hasta emails como responsable de tareas.
function _piNameEq(a, b) {
  return (a || '').toString().trim().toLowerCase() === (b || '').toString().trim().toLowerCase();
}
// ¿userName participa en p sin ser el responsable? Participar = estar en la
// lista de Participantes O tener tareas propias dentro del proyecto.
function _piParticipa(p, userName, tasks) {
  if (!p || !userName) return false;
  if (_piNameEq(p.responsable, userName)) return false;
  if ((p.participantes || []).some(function(n){ return _piNameEq(n, userName); })) return true;
  return (tasks || []).some(function(t){ return t.proyectoId == p.id && _piNameEq(t.resp, userName); });
}
function _piRoleOf(project, userName, tasks) {
  if (!project) return 'Observador';
  if (_piNameEq(project.responsable, userName)) return 'Owner';
  return _piParticipa(project, userName, tasks) ? 'Participante' : 'Observador';
}

// ¿El usuario actual puede editar/cerrar ESTE proyecto? Espeja exactamente
// _authorizeProjectWrite del backend para no mostrar un botón que luego falla:
// head siempre; manager si es de su país; specialist si es responsable o
// participante del proyecto. Antes era manager/head-only y un specialist que
// lidera su propio proyecto no tenía cómo editarlo/cerrarlo desde la UI.
function _piCanEditProject(p) {
  if (!p) return false;
  var role = (typeof _effectiveRole === 'function') ? _effectiveRole() : 'specialist';
  if (role === 'head') return true;
  var me = _effectiveUserName();
  if (role === 'manager') return !p.pais || p.pais === _effectiveUserCode();
  // specialist: responsable o participante (mismo criterio que el backend)
  if (p.responsable && p.responsable === me) return true;
  return (p.participantes || []).indexOf(me) >= 0;
}

// ¿Puede GOBERNAR el proyecto (estado/cancelar, plazo, prioridad, nombre,
// participantes)? Más estricto que _piCanEditProject (contenido: notas/docs):
// responsable, manager del país o head. Espeja _updateProjectFieldsImpl —
// un participante no-responsable solo puede editar notas y descripción.
function _piCanGovernProject(p) {
  if (!p) return false;
  var role = (typeof _effectiveRole === 'function') ? _effectiveRole() : 'specialist';
  if (role === 'head') return true;
  if (role === 'manager') return !p.pais || p.pais === _effectiveUserCode();
  return !!(p.responsable && p.responsable === _effectiveUserName());
}

function _piEnrichProject(p, D, userName) {
  var tasks  = (D && D.tasks)     || [];
  var hist   = (D && D.historial) || [];
  var pTasks = tasks.filter(function(t){ return t.proyectoId == p.id; });
  var pHist  = hist.filter(function(t){ return t.proyectoId == p.id; });
  var mine    = pTasks.filter(function(t){ return t.resp === userName; }).length;
  var overdue = pTasks.filter(_isOverdueTask).length;
  // Progreso/total del proyecto: usar p.taskStats/p.pctDone del backend,
  // calculados sobre TODAS las tareas del proyecto. Recalcular acá desde
  // D.tasks/D.historial (filtrados por rol) hacía que un specialist viera
  // "100% · Completado" con solo cerrar SU tarea, y que cada rol viera un %
  // distinto del mismo proyecto. Fallback local por si llega un snapshot viejo.
  var s = p.taskStats;
  var done, curso, crit, total, activeCount;
  if (s && typeof s.total === 'number') {
    done  = s.listo || 0;
    curso = (s.enCurso || 0) + (s.enRevision || 0);
    crit  = s.bloqueado || 0;
    total = s.total;
    activeCount = Math.max(0, total - done);
  } else {
    done    = pHist.length;
    curso   = pTasks.filter(function(t){ return t.status === 'En curso' || t.status === 'En revisión'; }).length;
    crit    = pTasks.filter(function(t){ return t.status === 'Bloqueado' || (typeof t.etaDays === 'number' && t.etaDays < 0 && t.status !== 'Listo'); }).length;
    total   = pTasks.length + done;
    activeCount = pTasks.length;
  }
  var pctNum  = (typeof p.pctDone === 'number') ? p.pctDone : (total > 0 ? Math.round(done / total * 100) : 0);
  var donePct  = total > 0 ? Math.round(done / total * 100) : 0;
  var cursoPct = total > 0 ? Math.round(curso / total * 100) : 0;
  var critPct  = total > 0 ? Math.round(crit / total * 100) : 0;

  var deadlineDays = null;
  var _pDl = p.deadlineISO || p.deadline;  // deadlineISO es ISO normalizado; deadline es display dd/MM/yyyy
  if (_pDl && D && D.today) {
    var m1 = (_pDl + '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    var m2 = D.today.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m1 && m2) {
      var d1 = new Date(parseInt(m1[1],10), parseInt(m1[2],10)-1, parseInt(m1[3],10));
      var d2 = new Date(parseInt(m2[1],10), parseInt(m2[2],10)-1, parseInt(m2[3],10));
      deadlineDays = Math.round((d1.getTime() - d2.getTime()) / 86400000);
    }
  }

  var seen = {}, peopleArr = [], more = 0;
  for (var i = 0; i < pTasks.length; i++) {
    var r = pTasks[i].resp;
    if (!r || seen[r]) continue;
    seen[r] = true;
    if (peopleArr.length < 4) peopleArr.push({ name: r, initials: _userInitials(r) });
    else more++;
  }

  return {
    p: p,
    role: _piRoleOf(p, userName, tasks),
    tasks: activeCount,
    mine: mine,
    overdue: overdue,
    deadlineDays: deadlineDays,
    progress: { done: donePct, curso: cursoPct, crit: critPct },
    pctNum: pctNum,
    people: peopleArr,
    more: more
  };
}

function _piBucket(projects, tab, userName, tasks) {
  if (!projects || !projects.length) return [];
  if (tab === 'cerrados') {
    return projects.filter(function(p){ return p.status === 'Completado' || p.status === 'Cancelado'; });
  }
  var open = projects.filter(function(p){ return p.status === 'Activo' || p.status === 'En pausa'; });
  if (tab === 'lideras')    return open.filter(function(p){ return _piNameEq(p.responsable, userName); });
  if (tab === 'participas') return open.filter(function(p){ return _piParticipa(p, userName, tasks); });
  return open;
}

function _piPersonAvatar(person, isMore) {
  var bg = isMore ? 'var(--paper3)' : 'var(--accent)';
  var color = isMore ? 'var(--muted)' : '#fff';
  var label = person && person.initials ? person.initials : '+';
  return '<div class="pi-person' + (isMore ? ' more' : '') + '" style="background:' + bg + ';color:' + color + '">' + esc(label) + '</div>';
}

// (Se eliminaron _piRenderHero y _piRenderRow: renders legacy sin call sites
//  que mantenían una tercera definición del rol de participación. El índice
//  usa el grid de cards de rEdProyectosIndex con _piRoleOf/_piParticipa.)


function edPSetTab(key) { EDP.tab = key; if (D) rEdProyectosIndex(D); }

// ─── PROYECTO · DETALLE ─────────────────────────────────────────
// Render dentro de vEdProyectosIndex cuando EDP.detailId está set.
// Header (nombre + pills + meta), barra multi-segmento por estado,
// 3 KPIs (totales, %completado, próximo deadline) y tabla de tareas.
function _piRenderDetail(p, D) {
  var allTasks = (D && D.tasks) || [];
  var hist     = (D && D.historial) || [];
  var pTasksActive = allTasks.filter(function(t){ return t.proyectoId == p.id; });
  var pTasksDone   = hist.filter(function(t){ return t.proyectoId == p.id; });
  var allP = pTasksActive.concat(pTasksDone);

  // Conteo por status (Pendiente, En curso, En revisión, Bloqueado, Listo).
  // Preferir p.taskStats del backend: cubre TODAS las tareas del proyecto,
  // no solo las visibles para este rol (sino el % difería entre roles y un
  // participante sin tareas veía "0 totales"). Fallback local por compat.
  var byStatus = { 'Pendiente': 0, 'En curso': 0, 'En revisión': 0, 'Bloqueado': 0, 'Listo': 0 };
  var total, pct;
  var _ps = p.taskStats;
  if (_ps && typeof _ps.total === 'number') {
    byStatus['Pendiente']   = _ps.pendiente  || 0;
    byStatus['En curso']    = _ps.enCurso    || 0;
    byStatus['En revisión'] = _ps.enRevision || 0;
    byStatus['Bloqueado']   = _ps.bloqueado  || 0;
    byStatus['Listo']       = _ps.listo      || 0;
    total = _ps.total;
    pct = (typeof p.pctDone === 'number') ? p.pctDone : (total ? Math.round((byStatus['Listo'] / total) * 100) : 0);
  } else {
    pTasksActive.forEach(function(t){ if (byStatus[t.status] != null) byStatus[t.status]++; });
    byStatus['Listo'] = pTasksDone.length;
    total = allP.length;
    pct = total ? Math.round((byStatus['Listo'] / total) * 100) : 0;
  }

  // Próximo deadline: tarea activa con deadlineISO más cercano (futuro o pasado).
  var nextDl = null;
  pTasksActive.forEach(function(t) {
    if (!t.deadlineISO) return;
    if (!nextDl || t.deadlineISO < nextDl.deadlineISO) nextDl = t;
  });
  var nextDlText = nextDl ? (nextDl.deadline + (nextDl.eta ? ' · ' + nextDl.eta : '')) : '—';

  // Avatares de participantes
  var people = (p.participantes || []).slice(0, 6);
  var moreP = (p.participantes || []).length - people.length;
  var avHtml = '';
  people.forEach(function(name) {
    var ini = name.split(/\s+/).slice(0, 2).map(function(w){ return (w[0] || '').toUpperCase(); }).join('');
    avHtml += '<span class="pi-detail-av" title="' + esc(name) + '">' + esc(ini || '?') + '</span>';
  });
  if (moreP > 0) avHtml += '<span class="pi-detail-av more" title="' + moreP + t(' más') + '">+' + moreP + '</span>';

  // Barra multi-segmento (porcentajes)
  function segPct(n) { return total ? (n / total * 100) : 0; }
  var segPend = segPct(byStatus['Pendiente']);
  var segCur  = segPct(byStatus['En curso']);
  var segRev  = segPct(byStatus['En revisión']);
  var segBlk  = segPct(byStatus['Bloqueado']);
  var segLis  = segPct(byStatus['Listo']);

  // Editar/cerrar: head, manager de su país, o el responsable/participante del
  // proyecto (incl. specialists). Espeja _authorizeProjectWrite del backend.
  var piCanEdit = _piCanEditProject(p);
  var piCanGovern = _piCanGovernProject(p);
  var piCanDelete = _piCanDeleteProject(p);
  var html = ''
    + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">'
    +   '<button class="ed-btn pi-detail-back" style="margin:0" onclick="edPiClose()">' + t('← Volver a proyectos') + '</button>'
    +   '<div style="margin-left:auto;display:flex;gap:6px">'
    +     '<button class="pa-btn pa-btn-outline" onclick="edPiNewTaskInProject(\'' + esc(String(p.id)) + '\')">' + paIcon('plus', 12) + ' ' + t('Nueva tarea en proyecto') + '</button>'
    +     (piCanGovern ? '<button class="pa-btn pa-btn-outline" onclick="openEditProj(\'' + esc(String(p.id)) + '\')">' + paIcon('save', 12) + ' ' + t('Editar proyecto') + '</button>' : '')
    +     (piCanDelete ? '<button class="pa-btn pa-btn-outline" style="color:var(--critical-fg);border-color:var(--critical)" onclick="edPiDeleteProject(\'' + esc(String(p.id)) + '\')">🗑 ' + t('Eliminar') + '</button>' : '')
    +   '</div>'
    + '</div>'
    + '<div class="pi-detail-head">'
    +   '<h1 class="pi-detail-name">' + esc(p.nombre || '') + '</h1>'
    +   '<div class="pi-detail-pills">'
    +     '<span class="ed-pill ' + (p.priority || '').toLowerCase() + '">' + esc(_priorityLabel(p.priority)) + '</span>'
    +     '<span class="ed-pill">' + esc(t(p.status || 'Activo')) + '</span>'
    +   '</div>'
    +   '<div class="pi-detail-meta">'
    +     '<span><span class="lbl">' + t('Responsable') + '</span>' + esc(p.responsable || '—') + '</span>'
    +     '<span><span class="lbl">' + t('Plazo') + '</span>' + esc(p.deadline || '—') + '</span>'
    +     (p.pais ? '<span><span class="lbl">' + t('País') + '</span>' + esc(p.pais) + '</span>' : '')
    +     (p.tipoTrabajo ? '<span><span class="lbl">' + t('Tipo') + '</span>' + esc(p.tipoTrabajo) + '</span>' : '')
    +   '</div>'
    +   (p.descripcion ? '<p class="pi-detail-desc">' + esc(p.descripcion) + '</p>' : '')
    +   (avHtml ? '<div class="pi-detail-people">' + avHtml + '</div>' : '')
    + '</div>';

  // Barra multi-segmento por estado
  html += '<div class="pi-detail-progress">'
       +    '<div class="pi-detail-bar">'
       +      '<div class="pi-detail-seg pend"  style="width:' + segPend + '%" title="' + t('Pendiente') + ': ' + byStatus['Pendiente'] + '"></div>'
       +      '<div class="pi-detail-seg curso" style="width:' + segCur + '%" title="' + t('En curso') + ': ' + byStatus['En curso'] + '"></div>'
       +      '<div class="pi-detail-seg rev"   style="width:' + segRev + '%" title="' + t('En revisión') + ': ' + byStatus['En revisión'] + '"></div>'
       +      '<div class="pi-detail-seg blk"   style="width:' + segBlk + '%" title="' + t('Bloqueado') + ': ' + byStatus['Bloqueado'] + '"></div>'
       +      '<div class="pi-detail-seg done"  style="width:' + segLis + '%" title="' + t('Listo') + ': ' + byStatus['Listo'] + '"></div>'
       +    '</div>'
       +    '<div class="pi-detail-legend">'
       +      '<span><i class="dot pend"></i>' + t('Pendiente') + ' · ' + byStatus['Pendiente'] + '</span>'
       +      '<span><i class="dot curso"></i>' + t('En curso') + ' · ' + byStatus['En curso'] + '</span>'
       +      '<span><i class="dot rev"></i>' + t('Revisión') + ' · ' + byStatus['En revisión'] + '</span>'
       +      '<span><i class="dot blk"></i>' + t('Bloqueada') + ' · ' + byStatus['Bloqueado'] + '</span>'
       +      '<span><i class="dot done"></i>' + t('Listo') + ' · ' + byStatus['Listo'] + '</span>'
       +    '</div>'
       + '</div>';

  // KPIs (3)
  html += '<div class="pi-detail-kpis">'
       +    '<div class="pi-detail-kpi"><div class="num">' + (total ? total : '—') + '</div><div class="lbl">' + t('Tareas totales') + '</div></div>'
       +    '<div class="pi-detail-kpi"><div class="num">' + pct + '<em>%</em></div><div class="lbl">' + t('Completado') + '</div></div>'
       +    '<div class="pi-detail-kpi"><div class="num small">' + esc(nextDlText) + '</div><div class="lbl">' + t('Próximo deadline') + '</div></div>'
       + '</div>';

  // Participantes (nombres)
  if ((p.participantes || []).length) {
    html += '<div style="font-size:12px;color:var(--fg-3);margin:0 0 14px"><span style="color:var(--fg-2);font-weight:600">' + t('Participantes: ') + '</span>' + esc((p.participantes || []).join(', ')) + '</div>';
  }

  // Contrapartes en conflicto declaradas (antes invisibles en la UI)
  if (p.contrapartesConflicto && p.contrapartesConflicto.length) {
    html += '<section class="ed-section"><div class="ed-h2">— ' + t('Contrapartes en conflicto') + '</div>'
         +    '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">'
         +      p.contrapartesConflicto.map(function(c){ return '<span class="ed-pill" style="border-color:var(--warn);color:var(--warn)">⚠ ' + esc(c) + '</span>'; }).join('')
         +    '</div>'
         +    '<div style="font-size:11px;color:var(--fg-3);margin-top:6px">' + t('Al crear una tarea con una de estas contrapartes, salta una alerta de conflicto de interés.') + '</div>'
         + '</section>';
  }

  // Notas del proyecto (editable si tiene permiso)
  html += '<section class="ed-section"><div class="ed-h2">— ' + t('Notas') + '</div>'
       +    (piCanEdit
          ? '<textarea id="piDetailNotas" rows="3" style="width:100%;resize:vertical;padding:10px;border-radius:8px;border:1px solid var(--line-1);background:var(--bg-2);color:var(--fg-1);font-family:inherit;font-size:13px" placeholder="' + esc(t('Agregá contexto, links, decisiones…')) + '">' + esc(p.notas || '') + '</textarea>'
            + '<div style="margin-top:8px"><button class="pa-btn pa-btn-outline" onclick="edPiSaveNotas(\'' + esc(String(p.id)) + '\')">' + t('Guardar notas') + '</button></div>'
          : (p.notas ? '<p class="pi-detail-desc">' + esc(p.notas) + '</p>' : '<div style="font-size:12px;color:var(--fg-3)">' + t('Sin notas.') + '</div>'))
       + '</section>';

  // Documentos del proyecto (componente completo si puede editar; lista read-only si no)
  if (piCanEdit) {
    html += renderDocsSection('project', p.id, p.documentos || []);
  } else if ((p.documentos || []).length) {
    html += '<section class="ed-section"><div class="ed-h2">— ' + t('Documentos del proyecto') + '</div><div class="doc-list">'
         +    (p.documentos || []).map(function(d){ return '<span class="doc-chip"><a href="' + esc(d.url || '#') + '" target="_blank" rel="noopener">📄 ' + esc(d.name || 'Documento') + '</a></span>'; }).join('')
         +    '</div></section>';
  }

  // Línea de tiempo del proyecto
  var _tl = _piRenderTimeline(p, D);
  if (_tl) html += '<section class="ed-section"><div class="ed-h2">— ' + t('Línea de tiempo') + '</div>' + _tl + '</section>';

  // Tabla de tareas del proyecto
  html += '<section class="ed-section">'
       +    '<div class="ed-h2">— ' + t('Tareas del proyecto') + '</div>';
  if (allP.length === 0) {
    html += _emptyState('📋', t('Sin tareas asignadas todavía'),
                        t('Creá la primera tarea de este proyecto para empezar a trackear.'),
                        piCanEdit ? t('+ Crear primera tarea') : null,
                        piCanEdit ? ("edPiNewTaskInProject('" + esc(String(p.id)) + "')") : null);
  } else {
    // Activas primero, luego cerradas. Dentro de cada grupo, por etaDays asc.
    var activeSorted = pTasksActive.slice().sort(function(a, b) {
      var ad = (typeof a.etaDays === 'number') ? a.etaDays : 9999;
      var bd = (typeof b.etaDays === 'number') ? b.etaDays : 9999;
      return ad - bd;
    });
    var rows = activeSorted.concat(pTasksDone);
    html += '<table class="tk-table" style="margin-top:12px">'
         +    '<thead><tr>'
         +      '<th></th><th></th><th>' + t('ID') + '</th><th>' + t('Tarea') + '</th><th>' + t('Resp.') + '</th><th>' + t('Prioridad') + '</th><th>' + t('Estado') + '</th><th>' + t('ETA') + '</th>'
         +    '</tr></thead><tbody>';
    rows.forEach(function(t) {
      var etaTxt = t.eta || _etaTextFromDays(t.etaDays);
      var etaTone = _etaToneClass(t.etaDays, t.status);
      var cfLvl = (typeof _confLevel === 'function') ? _confLevel(t) : 'estandar';
      var cfMeta = (typeof ED_CONF_LEVELS !== 'undefined') ? ED_CONF_LEVELS[cfLvl] : { label: '' };
      html += '<tr class="tk-row" data-task-id="' + esc(t.id) + '" onclick="edGoTaskInTracker(\'' + esc(t.id) + '\')">'
           +    '<td></td>'
           +    '<td><span class="cf-dot ' + cfLvl + '" title="' + esc(cfMeta.label || '') + '"></span></td>'
           +    '<td><span class="tk-id">' + esc(t.id) + '</span></td>'
           +    '<td><div class="tk-name">' + esc(t.nombre || '') + '</div></td>'
           +    '<td>' + esc(t.resp || '—') + '</td>'
           +    '<td><span class="ed-pill ' + (t.priority || '').toLowerCase() + '">' + esc(_priorityLabel(t.priority)) + '</span></td>'
           +    '<td><span class="ed-pill ' + _statusClass(t.status) + '">' + esc(_statusLabel(t.status)) + '</span></td>'
           +    '<td><span class="tk-eta ' + etaTone + '">' + esc(etaTxt) + '</span></td>'
           + '</tr>';
    });
    html += '</tbody></table>';
  }
  html += '</section>';

  return html;
}

function rEdProyectosIndex(D) {
  var v = $('vEdProyectosIndex'); if (!v) return;
  // Si hay un proyecto seleccionado, render del detalle; sino, index.
  if (EDP.detailId) {
    var detailP = ((D && D.projects) || []).find(function(p){ return String(p.id) === String(EDP.detailId); });
    if (detailP) { v.innerHTML = _piRenderDetail(detailP, D); return; }
    EDP.detailId = null; // proyecto eliminado o invalido — fallback a index
  }
  var userName = _effectiveUserName();
  var projects = (D && D.projects) || [];
  var tasks = (D && D.tasks) || [];

  var open = projects.filter(function(p){ return p.status === 'Activo' || p.status === 'En pausa'; });
  var cActivos    = open.length;
  // Mismo predicado que el tab "Donde participo" y el eyebrow de las cards
  // (_piParticipa). Antes convivían tres definiciones distintas y el header
  // contaba "acompañando" como TODO lo no-propio (mera visibilidad).
  var cParticipas = open.filter(function(p){ return _piParticipa(p, userName, tasks); }).length;
  var cLideras    = open.filter(function(p){ return _piNameEq(p.responsable, userName); }).length;
  var cCerrados   = projects.filter(function(p){ return p.status === 'Completado' || p.status === 'Cancelado'; }).length;

  var bucket = _piBucket(projects, EDP.tab, userName, tasks);
  var enriched = bucket.map(function(p){ return _piEnrichProject(p, D, userName); });
  enriched.sort(function(a, b) {
    var ad = (typeof a.deadlineDays === 'number') ? a.deadlineDays : 9999;
    var bd = (typeof b.deadlineDays === 'number') ? b.deadlineDays : 9999;
    return ad - bd;
  });

  // "Acompañando" = participación REAL (lista de participantes o tareas
  // propias en el proyecto), no "todo lo que no es tuyo". Era open - tuyos:
  // el head veía "3 acompañando" en proyectos donde no participaba de nada.
  var totalOwner       = cLideras;
  var totalParticipant = cParticipas;

  var html = '<div class="pa-page">';

  // Page header — el segmento "acompañando" se omite cuando es 0 (un cero
  // más no informa; el tab "Donde participo" ya lo dice si hace falta).
  html += '<div class="pa-page-h">'
       +    '<span class="pa-page-title">' + t('Proyectos') + '</span>'
       +    '<span class="pa-page-sub">' + cActivos + t(' activos · ') + totalOwner + t(' tuyos') + (totalParticipant ? ' · ' + totalParticipant + t(' acompañando') : '') + '</span>'
       +    '<div class="pa-page-meta">'
       +      '<button class="pa-btn pa-btn-outline" onclick="goEd(\'historial\')">' + paIcon('refresh', 12) + ' ' + t('Historial') + '</button>'
       +      '<button class="pa-btn pa-btn-primary" onclick="if(typeof edCrearProyectoOpen===\'function\')edCrearProyectoOpen()">' + paIcon('plus', 12) + ' ' + t('Nuevo proyecto') + '</button>'
       +    '</div>'
       + '</div>';

  // (Se quitó el lede "Estás en N proyectos activos con N tareas tuyas." —

    var paletteByIdx = ['#5b8def','#8a7ff0','#d0a86b','#3fa888','#e07a7a','#6aa6e0','#a06bcb','#cc7470'];

// Historial editorial · "Cerradas" (specialist) / "Historial" (manager/head).
// Hero stats (total · on-time · tarde · esta semana) + tabla narrativa de
// tareas cerradas filtradas por rol. Reutiliza .esp-hero / .esp-stat /
// .tk-table / .ed-pill — no agrega CSS nuevo. Las filas no abren panel
// detallado todavía (las cerradas no tienen tracker view); click muestra
// toast informativo. Robust ante D.historial vacío con empty state cálido.
// ───────────────────────────────────────────────────────────────

function _edHistFilterByRole(D) {
  var hist = (D && D.historial) || [];
  var role = (typeof _effectiveRole === 'function') ? _effectiveRole() : 'specialist';
  // Mismo scope de rol que el tracker y el badge del sidebar (incluye las
  // compartidas conmigo) — antes esta vista era la única que las excluía y
  // su número no cuadraba con el chip "Cerradas" del tracker.
  return _edRoleScopeTasks(hist, role, _effectiveUserName(), _effectiveUserCode()).slice();
}

// Días hábiles entre dos Date.
// para no depender del orden de declaración entre archivos editados.
function _edBizDaysBetween(from, to) {
  var biz = 0, cur = new Date(from);
  while (cur < to) {
    cur.setDate(cur.getDate() + 1);
    var dy = cur.getDay();
    if (dy !== 0 && dy !== 6) biz++;
  }
  return biz;
}

// ¿Cerrada dentro de SLA? Devuelve null si no podemos calcular (faltan fechas).
function _edWasOnTime(t) {
  if (!t || !t.creado || !t.cerrado) return null;
  var c = pd(t.creado), f = pd(t.cerrado);
  if (!c || !f) return null;
  var biz = _edBizDaysBetween(c, f);
  var lim = _slaLimit(t.priority);
  return biz <= lim;
}

// Días hábiles cerrada vs SLA (negativo = sobró tiempo / on-time).
function _edDaysVsSla(t) {
  if (!t || !t.creado || !t.cerrado) return null;
  var c = pd(t.creado), f = pd(t.cerrado);
  if (!c || !f) return null;
  var biz = _edBizDaysBetween(c, f);
  var lim = _slaLimit(t.priority);
  return biz - lim;
}

// Click en una fila del historial: navega al tracker filtrado por "Cerradas"
// con la tarea seleccionada. El panel detalle se abre readonly (el render del
// panel detecta status === 'Listo' y oculta las acciones).
function _edHistOnClick(taskId) {
  if (!taskId) return;
  EDT.filter = 'closed';
  EDT.selectedId = String(taskId);
  if (typeof _edPersistEDT === 'function') _edPersistEDT();
  if (typeof goEd === 'function') goEd('tracker');
}

function rEdHistorial(D) {
  var v = $('vEdHistorial'); if (!v) return;
  var role = (typeof _effectiveRole === 'function') ? _effectiveRole() : 'specialist';
  var hist = _edHistFilterByRole(D);
  var total = hist.length;

  // Métricas: on-time / tarde / esta semana
  var onTime = 0, late = 0, unknown = 0;
  hist.forEach(function(t){
    var ot = _edWasOnTime(t);
    if (ot === true) onTime++;
    else if (ot === false) late++;
    else unknown++;
  });
  var weekCutoff = Date.now() - 7 * 864e5;
  var thisWeek = hist.filter(function(t){
    var f = pd(t.cerrado);
    return f && f.getTime() >= weekCutoff;
  }).length;

  // Eyebrow/H1/Lede by role
  var todayLine = D && D.today ? _todayHumanStr(D.today) : '';
  var eyebrow;
  if (role === 'specialist') {
    eyebrow = 'Tu historial · ' + total + (total === 1 ? ' tarea cerrada' : ' tareas cerradas');
  } else if (role === 'manager') {
    eyebrow = 'Historial · ' + total + (total === 1 ? ' tarea cerrada en tu equipo' : ' tareas cerradas en tu equipo');
  } else {
    eyebrow = 'Historial global · ' + total + (total === 1 ? ' tarea cerrada en LATAM' : ' tareas cerradas en LATAM');
  }
  if (todayLine) eyebrow += ' · ' + todayLine;

  var h1Inner;
  if (total === 0) {
    h1Inner = 'Aún no hay <em>tareas cerradas</em>.';
  } else if (thisWeek > 0) {
    h1Inner = '<em>' + esc(String(thisWeek).padStart(2,'0')) + '</em> ' + (thisWeek === 1 ? 'tarea cerrada' : 'tareas cerradas') + '<br>esta semana.';
  } else {
    h1Inner = '<em>' + esc(String(total).padStart(2,'0')) + '</em> ' + (total === 1 ? 'tarea cerrada' : 'tareas cerradas') + ' en total.';
  }

  // Lede
  var lede;
  if (total === 0) {
    lede = 'Aún no hay tareas cerradas. Cuando cierres tu primera, va a aparecer acá.';
  } else {
    var ratio = (onTime + late) > 0 ? Math.round(onTime / (onTime + late) * 100) : null;
    var bits = [];
    if (ratio !== null) bits.push('<span class="good">' + ratio + '% en tiempo</span>');
    if (late > 0) bits.push('<span class="crit">' + late + ' fuera de SLA</span>');
    if (thisWeek > 0 && total !== thisWeek) bits.push(thisWeek + ' esta semana');
    if (bits.length === 0) bits.push('Aún no hay datos suficientes de SLA para calcular ritmo.');
    lede = bits.join(' · ') + '.';
  }

  var roleScope = role === 'specialist' ? 'tu historial' : (role === 'manager' ? 'en tu equipo' : 'en LATAM');
  var html = '<div class="pa-page">';

  // Page header
  html += '<div class="pa-page-h">'
       +    '<span class="pa-page-title">Historial</span>'
       +    '<span class="pa-page-sub">' + total + ' cerradas · ' + esc(roleScope) + '</span>'
       +    '<span class="pa-page-meta">' + esc(todayLine || '') + '</span>'
       + '</div>';

  if (total > 0) {
    html += '<div class="pa-narrative">' + lede + '</div>';
  }

  // KPIs
  html += '<div class="pa-kpis">'
       +    '<div class="pa-kpi">'
       +      '<div class="lab"><span class="dot" style="background:var(--info)"></span> Total cerradas</div>'
       +      '<div class="val">' + total + '</div>'
       +      '<div class="delta">' + esc(roleScope) + '</div>'
       +    '</div>'
       +    '<div class="pa-kpi is-good">'
       +      '<div class="lab"><span class="dot" style="background:var(--good)"></span> En tiempo</div>'
       +      '<div class="val">' + onTime + '</div>'
       +      '<div class="delta">dentro de SLA</div>'
       +    '</div>'
       +    '<div class="pa-kpi ' + (late ? 'is-critical' : '') + '">'
       +      '<div class="lab"><span class="dot" style="background:var(--critical)"></span> Tarde</div>'
       +      '<div class="val">' + late + '</div>'
       +      '<div class="delta">' + (late ? 'fuera de SLA' : 'sin incumplimientos') + '</div>'
       +    '</div>'
       +    '<div class="pa-kpi">'
       +      '<div class="lab"><span class="dot" style="background:var(--accent)"></span> Esta semana</div>'
       +      '<div class="val">' + thisWeek + '</div>'
       +      '<div class="delta">cerradas en 7d</div>'
       +    '</div>'
       + '</div>';

  // Table
  html += '<div class="pa-section-h">'
       +    '<h3>' + (role === 'specialist' ? 'Tus tareas cerradas' : (role === 'manager' ? 'Cerradas del equipo' : 'Cerradas LATAM')) + '</h3>'
       +    '<span class="meta">ordenadas por fecha (más recientes primero)</span>'
       + '</div>';

  if (total === 0) {
    html += paEmpty('refresh', 'Aún no hay tareas cerradas.', 'Cuando cierres tu primera, va a aparecer acá.');
  } else {
    var rows = hist.slice().sort(function(a, b){
      var fa = pd(a.cerrado), fb = pd(b.cerrado);
      var ta = fa ? fa.getTime() : 0;
      var tb = fb ? fb.getTime() : 0;
      return tb - ta;
    });
    var showResp = (role === 'manager' || role === 'head');
    var cols = showResp ? '20px 64px 1fr 130px 90px 110px 90px' : '20px 64px 1fr 90px 120px 110px';
    html += '<div class="pa-tbl pa-tbl-hist">';
    rows.forEach(function(t) {
      var pn = _projNameForTask(t);
      var meta = (t.tipoTrabajo || '—') + ' · ' + (t.pais || '—') + (pn && pn !== 'Sin proyecto' ? ' · ' + pn : '') + (t.areaSolicitante ? ' · ' + t.areaSolicitante : '');
      var dvs = _edDaysVsSla(t);
      var conf = _confLevel(t);
      var slaTxt, slaCls;
      if (dvs === null) { slaTxt = '—'; slaCls = ''; }
      else if (dvs <= 0) { slaTxt = (dvs === 0 ? 'en tiempo' : (Math.abs(dvs) + 'd antes')); slaCls = 'good'; }
      else { slaTxt = '+' + dvs + 'd tarde'; slaCls = 'overdue'; }
      var slaColor = slaCls === 'good' ? 'var(--good-fg)' : slaCls === 'overdue' ? 'var(--critical-fg)' : 'var(--fg-3)';
      html += '<div class="pa-tbl-r" style="grid-template-columns:' + cols + ';cursor:pointer" onclick="_edHistOnClick(\'' + esc(t.id) + '\')">'
           +    paConfDot(conf)
           +    '<span class="id mono">' + esc(t.id) + '</span>'
           +    '<div class="title"><span class="t">' + esc(t.nombre || '') + '</span><span class="meta">' + esc(meta) + '</span></div>'
           +    (showResp ? '<span class="resp">' + paAvatar(t.resp || '?', 18) + '<span style="font-size:12px">' + esc(t.resp || '—') + '</span></span>' : '')
           +    paPriorityPill(t.priority)
           +    '<span class="pa-mono-sm">' + esc(t.cerrado || '—') + '</span>'
           +    '<span class="mono" style="font-size:11px;color:' + slaColor + '">' + esc(slaTxt) + '</span>'
           + '</div>';
    });
    html += '</div>';
  }

  html += '</div>'; // pa-page
  v.innerHTML = html;
}
