// MARKER:EDITORIAL_MIEQUIPO_BEGIN  (owned by Agente O2)
// Vista editorial "Mi equipo" (manager) / "Equipos" (head).
// Reemplaza el legacy vMiequipo (cards azules de hotspots + grid
// de cards). Aquí: hero stats + tabla equipo con load bars.
// Para head, agrupa por país con sub-headers .ed-h2.
// Defensive: si el rol no tiene acceso, muestra mensaje cálido.
// ───────────────────────────────────────────────────────────────
function rEdMiequipo(D) {
  var v = $('vEdMiequipo'); if (!v) return;
  var role = (typeof _effectiveRole === 'function') ? _effectiveRole() : ((USER && USER.role) || 'specialist');
  if (role !== 'manager' && role !== 'head') {
    v.innerHTML = ''
      + '<div class="ed-eye">' + esc(t('Sin acceso')) + '</div>'
      + '<h1 class="ed-h1">' + t('Esta vista es para <em>manager o head</em>.') + '</h1>'
      + '<p class="ed-lede">' + esc(t('Si creés que es un error, contactá a quien configuró tu acceso.')) + '</p>';
    return;
  }

  var team = (D && D.team) || [];
  var userCode = _effectiveUserCode();

  // ── Hero metrics + render ─────────────────────────────────────
  // Cuenta de personas, carga promedio (% utilización), vencidas y
  // bloqueadas se computan sobre el conjunto visible (manager filtra
  // por country; head usa todo el team).
  var visible = (role === 'manager')
    ? team.filter(function(m){ return m && m.country === userCode; })
    : team.slice();

  var totalLoad = 0, totalCap = 0, totalOver = 0, totalBlk = 0;
  visible.forEach(function(m){
    totalLoad += (m && m.load)     || 0;
    totalCap  += (m && m.capacity) || 0;
    totalOver += (m && m.overdue)  || 0;
    totalBlk  += (m && m.blocked)  || 0;
  });
  var loadPct = totalCap > 0 ? Math.round((totalLoad / totalCap) * 100) : 0;
  // Países distintos (head). Filtra falsy y duplicados.
  var countries = [];
  if (role === 'head') {
    var seenC = {};
    for (var ci = 0; ci < visible.length; ci++) {
      var cc = visible[ci] && visible[ci].country;
      if (!cc || seenC[cc]) continue;
      seenC[cc] = true; countries.push(cc);
    }
    countries.sort();
  }
  // Unificado con el Home del manager: at-risk = _memberRisk().atRisk (score>0:
  // vencidas, bloqueadas, o sobrecapacidad >100%). Nota: antes el umbral de carga
  // era >90%; ahora >100% — el conteo puede bajar levemente para gente en 91-100%.
  var atRisk = visible.filter(function(m){ return _memberRisk(m).atRisk; }).length;

  // ── Eyebrow + H1 + Lede ───────────────────────────────────────
  var eyebrow, h1, ledeBits = [];
  if (role === 'manager') {
    eyebrow = t('Equipo') + (userCode ? ' · ' + userCode : '');
    h1 = t('Tu equipo,') + ' <em>' + visible.length + ' '
       + (visible.length === 1 ? t('persona') : t('personas')) + '</em>.';
    ledeBits.push(t('Carga promedio') + ' <b>' + (totalCap ? loadPct + '%' : '—') + '</b>');
    if (totalOver) ledeBits.push('<span class="crit">' + totalOver + ' ' + t('vencidas') + '</span> ' + t('en el equipo'));
    if (atRisk)    ledeBits.push('<b>' + atRisk + '</b> ' + (atRisk === 1 ? t('persona') : t('personas')) + ' ' + t('en riesgo'));
    if (ledeBits.length === 0) ledeBits.push(t('Sin alertas — el equipo va al día'));
  } else {
    eyebrow = t('Equipos LATAM') + ' · ' + countries.length + ' ' + (countries.length === 1 ? t('país') : t('países'));
    h1 = '<em>' + countries.length + ' ' + t('equipos') + '</em> ' + t('activos') + '<br>' + t('en LATAM.');
    ledeBits.push('<b>' + visible.length + '</b> ' + (visible.length === 1 ? t('persona') : t('personas')) + ' ' + t('en total'));
    ledeBits.push(t('utilización') + ' <b>' + (totalCap ? loadPct + '%' : '—') + '</b>');
    if (totalOver) ledeBits.push('<span class="crit">' + totalOver + ' ' + t('vencidas') + '</span>');
    if (atRisk)    ledeBits.push('<b>' + atRisk + '</b> ' + t('en riesgo'));
  }

  var html = '<div class="pa-page">';

  // Page header
  html += '<div class="pa-page-h">'
       +    '<span class="pa-page-title">' + esc(role === 'manager' ? t('Mi equipo') : t('Equipos LATAM')) + '</span>'
       +    '<span class="pa-page-sub">' + visible.length + ' ' + esc(visible.length === 1 ? t('persona') : t('personas')) + (role === 'head' ? ' · ' + countries.length + ' ' + esc(countries.length === 1 ? t('país') : t('países')) : (userCode ? ' · ' + userCode : '')) + '</span>'
       + '</div>';

  if (visible.length > 0) {
    html += '<div class="pa-narrative">' + ledeBits.join(' · ') + '.</div>';
  }

  // KPIs
  html += '<div class="pa-kpis">'
       +    '<div class="pa-kpi">'
       +      '<div class="lab"><span class="dot" style="background:var(--info)"></span> ' + esc(role === 'manager' ? t('Personas activas') : t('Personas LATAM')) + '</div>'
       +      '<div class="val">' + visible.length + '</div>'
       +      '<div class="delta">' + esc(role === 'manager' ? (userCode || t('tu país')) : countries.length + ' ' + (countries.length === 1 ? t('país') : t('países'))) + '</div>'
       +    '</div>'
       +    '<div class="pa-kpi ' + (loadPct > 90 ? 'is-warn' : '') + '">'
       +      '<div class="lab"><span class="dot" style="background:var(--accent)"></span> ' + esc(t('Carga promedio')) + '</div>'
       +      '<div class="val">' + (totalCap ? loadPct + '%' : '—') + '</div>'
       +      '<div class="delta">' + totalLoad + '/' + totalCap + ' ' + esc(t('capacidad')) + '</div>'
       +    '</div>'
       +    '<div class="pa-kpi ' + (totalOver ? 'is-critical' : '') + '" style="cursor:pointer" onclick="edGoTrackerFiltered(\'overdue\')" title="' + esc(t('Ver en el tracker')) + '">'
       +      '<div class="lab"><span class="dot" style="background:var(--critical)"></span> ' + esc(t('Vencidas')) + '</div>'
       +      '<div class="val">' + totalOver + '</div>'
       +      '<div class="delta">' + esc(totalOver ? t('reasignar') : t('todo en orden')) + '</div>'
       +    '</div>'
       +    '<div class="pa-kpi ' + (totalBlk ? 'is-warn' : '') + '" style="cursor:pointer" onclick="edGoTrackerFiltered(\'blocked\')" title="' + esc(t('Ver en el tracker')) + '">'
       +      '<div class="lab"><span class="dot" style="background:var(--warn)"></span> ' + esc(t('On hold')) + '</div>'
       +      '<div class="val">' + totalBlk + '</div>'
       +      '<div class="delta">' + esc(totalBlk ? t('desbloquear') : '—') + '</div>'
       +    '</div>'
       + '</div>';

  // Empty state
  if (visible.length === 0) {
    html += '<div class="pa-card" style="text-align:center;padding:48px 20px;margin-top:18px">'
         +    '<div style="width:40px;height:40px;border-radius:10px;background:var(--bg-2);display:grid;place-items:center;color:var(--fg-3);margin:0 auto 12px">' + paIcon('users', 20) + '</div>'
         +    '<div style="font-size:13px;font-weight:600;color:var(--fg-1)">' + esc(role === 'manager' ? t('Sin miembros visibles') : t('No hay equipos cargados')) + '</div>'
         +    '<div style="font-size:12px;color:var(--fg-3);margin:6px 0">' + esc(role === 'manager' ? t('Si esperabas ver gente, contactá a quien gestiona equipos.') : t('Agregá personas desde la hoja Equipos.')) + '</div>'
         + '</div></div>';
    v.innerHTML = html;
    return;
  }

  // Sort: vencidas/bloqueadas primero
  function _miqSorted(arr) {
    return arr.slice().sort(function(a, b){
      var heatA = ((a && a.overdue) || 0) * 2 + ((a && a.blocked) || 0);
      var heatB = ((b && b.overdue) || 0) * 2 + ((b && b.blocked) || 0);
      if (heatA !== heatB) return heatB - heatA;
      return (a.name || '').localeCompare(b.name || '');
    });
  }

         + '</div>';
  }

  if (role === 'manager') {
    html += '<div class="pa-section-h"><h3>' + esc(t('Tu equipo')) + '</h3><span class="meta">' + esc(t('Carga, vencidas, bloqueadas y SLA mes')) + '</span></div>'
         +  '<div class="pa-tbl">'
         +    '<div class="pa-tbl-h" style="grid-template-columns: 1fr 220px 80px 90px 80px 100px">'
         +      '<div>' + esc(t('Persona')) + '</div><div>' + esc(t('Carga')) + '</div><div>' + esc(t('Vencidas')) + '</div><div>' + esc(t('On hold')) + '</div><div>' + esc(t('SLA mes')) + '</div><div></div>'
         +    '</div>';
    var sorted = _miqSorted(visible);
    sorted.forEach(function(m) { html += _miqRow(m); });
    html += '</div>';
  } else {
    // Head: por país
    var groups = {};
    visible.forEach(function(mm) {
      var key = (mm && mm.country) || '—';

    });
    var keys = Object.keys(groups).sort();
    keys.forEach(function(k) {
      var arr = _miqSorted(groups[k]);
      var gOver = 0, gLoad = 0, gCap = 0;
      arr.forEach(function(m){ gOver += (m.overdue || 0); gLoad += (m.load || 0); gCap += (m.capacity || 0); });
      var gPct = gCap > 0 ? Math.round(gLoad / gCap * 100) : 0;
      html += '<div class="pa-section-h">'
           +    '<h3><span class="pa-pill pa-pill-country" style="margin-right:8px">' + esc(k) + '</span>' + arr.length + ' ' + esc(arr.length === 1 ? t('persona') : t('personas')) + '</h3>'
           +    '<span class="meta">' + (gCap ? gPct + '% ' + esc(t('carga')) + ' · ' : '') + esc(gOver ? gOver + ' ' + t('vencidas') : t('sin vencidas')) + '</span>'
           + '</div>'
           + '<div class="pa-tbl">'
           +   '<div class="pa-tbl-h" style="grid-template-columns: 1fr 220px 80px 90px 80px 100px">'
           +     '<div>' + esc(t('Persona')) + '</div><div>' + esc(t('Carga')) + '</div><div>' + esc(t('Vencidas')) + '</div><div>' + esc(t('On hold')) + '</div><div>' + esc(t('SLA mes')) + '</div><div></div>'

  html += '</div>'; // pa-page

function _edaTopResponsables(team, n) {
  if (!team || !team.length) return [];
  // Ordenar por carga activa (total - listo) descendente y tomar top N
  return team.slice().sort(function(a, b) {
    var aa = (a.total || 0) - (a.listo || 0);
    var bb = (b.total || 0) - (b.listo || 0);
    return bb - aa;
  }).slice(0, n || 6);
}

// Cerradas este mes. Las cerradas viven en D.historial (no en D.tasks) y el
// backend expone la fecha como 'cerrado' en dd/MM/yyyy — 'cerradoRaw' nunca
// existió, por eso este KPI daba siempre 0. countryCode opcional (manager).
function _edaCerradasMes(historial, countryCode) {
  if (!historial || !historial.length) return 0;
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth();
  var cnt = 0;
  historial.forEach(function(t) {
    if (countryCode && (t.pais || '') !== countryCode) return;
    if (!t.cerrado) return;
    var parts = String(t.cerrado).split('/');
    if (parts.length !== 3) return;
    if (parseInt(parts[1], 10) - 1 === m && parseInt(parts[2], 10) === y) cnt++;
  });
  return cnt;
}

// Aging insight: distribución de tareas activas por edad (días desde
// creación). Muestra cuánto tiempo lleva cada cosa parada en la mesa.
// Buckets: >14d (crit), 7-14d (warn), 3-7d (default), <3d (fresh).
function _edaAgingSection(tasks) {
  var nowMs = Date.now();
  var buckets = [
    { key: 'old',    lbl: '> 14d',    cls: 'crit', count: 0 },
    { key: 'aging',  lbl: '7–14d',    cls: 'warn', count: 0 },
    { key: 'recent', lbl: '3–7d',     cls: '',     count: 0 },
    { key: 'fresh',  lbl: '< 3d',     cls: 'good', count: 0 }
  ];
  var active = (tasks || []).filter(function(t){ return t.status !== 'Listo'; });
  active.forEach(function(t) {
    if (!t.creadoRaw) return;
    var d = new Date(t.creadoRaw);
    if (isNaN(d.getTime())) return;
    var days = Math.floor((nowMs - d.getTime()) / 86400000);
    if (days > 14) buckets[0].count++;
    else if (days >= 7) buckets[1].count++;
    else if (days >= 3) buckets[2].count++;
    else buckets[3].count++;
  });
  var total = buckets.reduce(function(s, b){ return s + b.count; }, 0);
  var oldest = buckets[0].count;

  var html = '<section class="ed-section">'
           + '<div class="ed-h2">— ' + esc(t('Antigüedad de tareas activas')) + '</div>';
  if (total === 0) {
    html += '<div class="ed-lede">' + esc(t('No hay tareas activas para medir antigüedad.')) + '</div></section>';
    return html;
  }
  // Lede dinámico
  if (oldest > 0) {
    html += '<p class="ed-lede"><span class="crit">' + oldest + ' ' + esc(oldest === 1 ? t('tarea') : t('tareas')) + '</span> ' + esc(oldest === 1 ? t('lleva') : t('llevan')) + ' ' + esc(t('más de 2 semanas activas. Considerá revisarlas o cerrarlas.')) + '</p>';
  } else if (buckets[1].count > 0) {
    html += '<p class="ed-lede">' + esc(t('La mayoría de las tareas lleva menos de dos semanas en agenda. Cadencia saludable.')) + '</p>';
  } else {
    html += '<p class="ed-lede">' + esc(t('Todas las tareas activas son recientes (menos de una semana). Mantené el ritmo.')) + '</p>';
  }
  // Stacked bar
  html += '<div class="aging-bar">';
  buckets.forEach(function(b) {
    if (b.count === 0) return;
    var pct = Math.round(b.count / total * 1000) / 10;
    html += '<div class="aging-seg ' + b.cls + '" style="width:' + pct + '%" title="' + b.lbl + ': ' + b.count + ' tareas (' + pct + '%)">' + b.count + '</div>';
  });
  html += '</div>';
  // Legend
  html += '<div class="aging-legend">';
  buckets.forEach(function(b) {
    html += '<span class="aging-legend-item"><i class="dot ' + b.cls + '"></i>' + b.lbl + ' · <b>' + b.count + '</b></span>';
  });
  html += '</div></section>';
  return html;
}

function _edaSlaTrendSection(D, currentTasks, role, userCode) {
  var hist = (D && D.historial) || [];
  if (role === 'manager' && userCode) {
    hist = hist.filter(function(t){ return (t.pais || '') === userCode; });
  }
  if (!hist.length) return '';
  var nowMs = Date.now();
  var WEEK = 7 * 86400000;
  var weeks = [];
  for (var w = 7; w >= 0; w--) {
    var weekStart = nowMs - (w + 1) * WEEK;
    var weekEnd   = nowMs - w * WEEK;
    var inWeek = [];
    hist.forEach(function(t) {
      if (!t.creadoRaw || !t.cerrado) return;
      var p = t.cerrado.split('/');
      var cerradoDate = new Date(parseInt(p[2], 10), parseInt(p[1], 10) - 1, parseInt(p[0], 10));
      var ms = cerradoDate.getTime();
      if (ms < weekStart || ms >= weekEnd) return;
      var biz = (typeof _bizDays === 'function') ? _bizDays(new Date(t.creadoRaw), cerradoDate) : null;
      var lim = _slaLimit(t.priority);
      var onTime = (biz != null) && (biz <= lim);
      inWeek.push(onTime);
    });
    var ot = inWeek.filter(function(x){ return x; }).length;
    var pct = inWeek.length > 0 ? Math.round(ot / inWeek.length * 100) : null;
    weeks.push({ count: inWeek.length, onTime: ot, pct: pct, label: w === 0 ? 'hoy' : (w + 's') });
  }
  // Average across weeks with data
  var withData = weeks.filter(function(w){ return w.count > 0; });
  if (!withData.length) return '';
  var avgPct = Math.round(withData.reduce(function(s, w){ return s + w.pct; }, 0) / withData.length);
  // Trend slope: compare first half vs second half
  var firstHalf = withData.slice(0, Math.floor(withData.length / 2));
  var lastHalf  = withData.slice(Math.floor(withData.length / 2));
  var firstAvg = firstHalf.length ? firstHalf.reduce(function(s,w){return s+w.pct;}, 0) / firstHalf.length : 0;
  var lastAvg  = lastHalf.length  ? lastHalf.reduce(function(s,w){return s+w.pct;}, 0)  / lastHalf.length  : 0;
  var trendArrow = '→', trendCls = 'dim';
  if (lastAvg > firstAvg + 5) { trendArrow = '↑'; trendCls = 'good'; }
  else if (lastAvg < firstAvg - 5) { trendArrow = '↓'; trendCls = 'crit'; }

  var html = '<section class="ed-section">'
           + '<div class="ed-h2">— ' + esc(t('Tendencia SLA, últimas 8 semanas')) + '</div>'
           + '<p class="ed-lede">' + esc(t('Promedio')) + ' <b>' + avgPct + '% ' + esc(t('en tiempo')) + '</b>. ' + esc(t('Tendencia')) + ' <span class="' + trendCls + '" style="font-weight:700">' + trendArrow + '</span></p>';
  // Sparkline-ish bar chart
  html += '<div class="sla-trend-grid">';
  weeks.forEach(function(w) {
    var hbar = w.pct == null ? 2 : Math.max(4, Math.round(w.pct / 100 * 100));
    var fillCls = w.pct == null ? 'empty' : (w.pct >= 90 ? 'good' : (w.pct >= 75 ? 'warn' : 'crit'));
    html += '<div class="sla-trend-col" title="' + w.label + ': ' + (w.pct == null ? 'sin datos' : (w.pct + '% (' + w.onTime + '/' + w.count + ')')) + '">'
         +    '<div class="sla-trend-bar ' + fillCls + '" style="height:' + hbar + '%"></div>'
         +    '<div class="sla-trend-pct">' + (w.pct == null ? '—' : w.pct + '%') + '</div>'
         +    '<div class="sla-trend-lbl">' + w.label + '</div>'
         + '</div>';
  });
  html += '</div></section>';
  return html;
}

function rEdAnalytics(D) {
  var v = $('vEdAnalytics'); if (!v) return;
  var role = (typeof _effectiveRole === 'function') ? _effectiveRole() : ((D && D._role) || 'manager');
  // Specialist tiene su propio scorecard personal (uso/desempeño).
  // Manager y head ven analytics de equipo (existente).
  if (role === 'specialist') return _rEdAnalyticsSpecialist(D);
  var userCode = (typeof _effectiveUserCode === 'function') ? _effectiveUserCode() : '';
  var allTasks = (D && D.tasks) || [];

  // Filtrado por rol: manager → su país; head → todo. (El backend ya filtra
  // tasks por rol/país, pero lo reforzamos por defensa frente a DEMO_AS.)
  var tasks = allTasks;
  if (role === 'manager' && userCode) {
    tasks = allTasks.filter(function(t){ return (t.pais || '') === userCode; });
  }

  var kpi = (D && D.kpi) || { total: 0, alta: 0, media: 0, baja: 0, listo: 0 };
  var sla = (D && D.sla) || { onTime: 0, atRisk: 0, overdue: 0 };
  var totalSla = (sla.onTime || 0) + (sla.atRisk || 0) + (sla.overdue || 0);
  var slaPct = totalSla > 0 ? Math.round((sla.onTime || 0) / totalSla * 100) : 0;

  // Activas = no Listo. Cerradas mes = del Historial, cerradas en mes actual.
  var activas = tasks.filter(function(t){ return t.status !== 'Listo'; }).length;
  var cerradasMes = _edaCerradasMes((D && D.historial) || [], role === 'manager' ? userCode : null);
  // Vencidas por DEADLINE (mismo predicado que el tracker/home, a donde
  // drillea el KPI). sla.overdue es otra métrica (días desde creación vs SLA)
  // y abajo se rotula "fuera de SLA" para no mezclar vocabularios.
  var vencidasDl = tasks.filter(_isOverdueTask).length;

  var sem = (D && D.semana) ? D.semana : '';
  var eyebrow = t('Analítica') + (sem ? ' · ' + t('semana') + ' ' + sem : '');

    lede = t('LATAM tiene') + ' <b>' + activas + ' ' + t('tareas activas') + '</b>'
         + (altaLede ? ', <b>' + altaLede + ' ' + t('de prioridad alta') + '</b>' : '')

  var html = '<div class="pa-page">';

  // Page header
  html += '<div class="pa-page-h">'
       +    '<span class="pa-page-title">' + esc(role === 'head' ? t('Analytics LATAM') : t('Métricas del equipo')) + '</span>'

       + '</div>';

  if (lede) {
    html += '<div class="pa-narrative">' + lede + '</div>';
  }

  // KPIs — clickeables: drillean al tracker ya filtrado, igual que en los
  // homes (antes acá eran estáticos y el patrón quedaba inconsistente).
  // "En tiempo" se reemplazó por "Vencidas": era el mismo número que
  // "SLA cumplido" con otro label (dos tarjetas idénticas confundían).
  html += '<div class="pa-kpis">'
       +    '<div class="pa-kpi" style="cursor:pointer" onclick="edGoTrackerFiltered(\'all\')" title="' + esc(t('Ver en el tracker')) + '">'
       +      '<div class="lab"><span class="dot" style="background:var(--info)"></span> ' + esc(t('Activas')) + '</div>'
       +      '<div class="val">' + activas + '</div>'
       +      '<div class="delta">' + esc(role === 'head' ? t('en LATAM') : t('en tu equipo')) + '</div>'
       +    '</div>'
       +    '<div class="pa-kpi is-good" style="cursor:pointer" onclick="edGoTrackerFiltered(\'closed\')" title="' + esc(t('Ver en el tracker')) + '">'
       +      '<div class="lab"><span class="dot" style="background:var(--good)"></span> ' + esc(t('Cerradas (mes)')) + '</div>'
       +      '<div class="val">' + cerradasMes + '</div>'
       +      '<div class="delta">' + esc(cerradasMes ? t('completadas') : t('sin cierres aún')) + '</div>'
       +    '</div>'
       +    '<div class="pa-kpi ' + (vencidasDl > 0 ? 'is-critical' : 'is-good') + '" style="cursor:pointer" onclick="edGoTrackerFiltered(\'overdue\')" title="' + esc(t('Ver en el tracker')) + '">'
       +      '<div class="lab"><span class="dot" style="background:var(--critical)"></span> ' + esc(t('Vencidas')) + '</div>'
       +      '<div class="val">' + vencidasDl + '</div>'
       +      '<div class="delta">' + esc(vencidasDl ? t('necesitan acción') : t('todo en tiempo')) + '</div>'
       +    '</div>'
       +    '<div class="pa-kpi ' + (slaPct >= 90 ? 'is-good' : (slaPct >= 75 ? 'is-warn' : 'is-critical')) + '">'
       +      '<div class="lab"><span class="dot" style="background:var(--accent)"></span> ' + esc(t('SLA cumplido')) + '</div>'
       +      '<div class="val">' + (totalSla ? slaPct + '%' : '—') + '</div>'
       +      '<div class="delta">' + esc(sla.overdue ? sla.overdue + ' ' + t('fuera de SLA') : t('todo dentro de SLA')) + '</div>'
       +    '</div>'
       + '</div>';

  // For HQ: country comparison matrix + projects at risk
  if (role === 'head') {
    html += _edaHQCountriesSection(D);
    html += _edaHQRiskSection(D);
  }

  // Aging + SLA trend (manager + HQ)
  html += _edaAgingSection(tasks);
  html += _edaSlaTrendSection(D, tasks, role, userCode);
  html += _edaAreaSolicitanteSection(tasks);

  // Charts: prioridad + estado por responsable
  html += '<div class="pa-section-h"><h3>' + esc(role === 'head' ? t('Carga por prioridad') : t('Distribución por prioridad')) + '</h3><span class="meta">' + esc(t('tareas activas')) + '</span></div>'
       +  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'
       +    '<div class="pa-card" style="min-height:280px"><canvas id="cEdAPrio" height="220"></canvas></div>'
       +    '<div class="pa-card" style="min-height:280px"><canvas id="cEdAResp" height="220"></canvas></div>'
       +  '</div>';

  // SLA chart
  html += '<div class="pa-section-h"><h3>' + esc(t('Cumplimiento de SLA')) + '</h3><span class="meta">' + esc(t('tareas activas vs SLA target')) + '</span></div>'
       +  '<div class="pa-card"><canvas id="cEdASla" height="180"></canvas></div>';

  html += '</div>'; // pa-page
  v.innerHTML = html;

  // Charts.js: destruir instances previas y crear nuevas con tokens editoriales.
  if (typeof Chart === 'undefined') return;
  var th = (typeof chartTheme === 'function') ? chartTheme() : null;
  if (!th) return;

  // ── Donut prioridad (Alta/Media/Baja) ────────────────────────────
  var c1 = $('cEdAPrio');
  if (c1) {
    if (CH.eda) { try { CH.eda.destroy(); } catch (e) {} CH.eda = null; }
    var alta = 0, media = 0, baja = 0;
    tasks.forEach(function(t) {
      if (t.status === 'Listo') return;
      if (t.priority === 'Alta') alta++;
      else if (t.priority === 'Media') media++;
      else baja++;
    });
    var totalP = alta + media + baja;
    if (totalP > 0) {
      CH.eda = new Chart(c1, {
        type: 'doughnut',
        data: {
          labels: ['Alta', 'Media', 'Baja'],
          datasets: [{
            data: [alta, media, baja],
            backgroundColor: th.prio,
            borderColor: th.surface,
            borderWidth: 4
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '68%',
          plugins: {
            legend: { position: 'bottom', labels: { padding: 14, usePointStyle: true, font: { size: 11 } } },
            title:  { display: true, text: 'Activas por prioridad', color: th.muted, font: { size: 11, weight: '700' }, padding: { bottom: 8 } }
          }
        }
      });
    }
  }

  // ── Barra horizontal: estado por responsable, top 5-6 ────────────
  var c2 = $('cEdAResp');
  if (c2) {
    if (CH.edb) { try { CH.edb.destroy(); } catch (e) {} CH.edb = null; }
    var team = (D && D.team) || [];
    // Para manager filtrar team al país (defensa adicional).
    if (role === 'manager' && userCode) {
      team = team.filter(function(m){ return m.country === userCode; });
    }
    var top = _edaTopResponsables(team, 6);
    if (top.length) {
      CH.edb = new Chart(c2, {
        type: 'bar',
        data: {
          labels: top.map(function(t){ return (t.name || '').split(' ').slice(0, 2).join(' '); }),
          datasets: [
            { label: 'Pendiente', data: top.map(function(t){ return t.pendiente || 0; }),  backgroundColor: th.dim,     borderRadius: 3, barPercentage: .7 },
            { label: 'En curso',  data: top.map(function(t){ return t.enCurso || 0; }),    backgroundColor: th.info,    borderRadius: 3, barPercentage: .7 },
            { label: 'Revisión',  data: top.map(function(t){ return t.enRevision || 0; }), backgroundColor: th.accent,  borderRadius: 3, barPercentage: .7 },
            { label: 'Bloqueada', data: top.map(function(t){ return t.bloqueado || 0; }),  backgroundColor: th.prio[0], borderRadius: 3, barPercentage: .7 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          indexAxis: 'y',
          scales: {
            x: { stacked: true, grid: { color: th.ruleSoft }, ticks: { stepSize: 1, font: { size: 10 } } },
            y: { stacked: true, grid: { display: false }, ticks: { font: { size: 11, weight: '700' } } }
          },
          plugins: {
            legend: { position: 'bottom', labels: { padding: 12, usePointStyle: true, font: { size: 11 } } },
            title:  { display: true, text: 'Top responsables · estado activo', color: th.muted, font: { size: 11, weight: '700' }, padding: { bottom: 8 } }
          }
        }
      });
    }
  }

  // ── Donut SLA cumplimiento (on-time / atrasadas / bloqueadas) ────
  var c3 = $('cEdASla');
  if (c3) {
    if (CH.edc) { try { CH.edc.destroy(); } catch (e) {} CH.edc = null; }
    if (totalSla > 0) {
      CH.edc = new Chart(c3, {
        type: 'doughnut',
        data: {
          labels: ['En tiempo', 'En riesgo', 'Vencidas'],
          datasets: [{
            data: [sla.onTime || 0, sla.atRisk || 0, sla.overdue || 0],
            // tokens editoriales: good / warn / critical
            backgroundColor: [getTok('--good'), getTok('--warn'), getTok('--critical')],
            borderColor: th.surface,
            borderWidth: 4
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '70%',
          plugins: {
            legend: { position: 'bottom', labels: { padding: 14, usePointStyle: true, font: { size: 11 } } },
            title:  { display: true, text: slaPct + '% en tiempo · SLA Alta ' + _slaLimit('Alta') + 'd / Media ' + _slaLimit('Media') + 'd / Baja ' + _slaLimit('Baja') + 'd', color: th.muted, font: { size: 11, weight: '700' }, padding: { bottom: 8 } }
          }
        }
      });
    }
  }
}

// ── Specialist scorecard ────────────────────────────────────────
// Vista personal: cuánto cumpliste, en qué priorizás tu trabajo,
// cómo viene tu cadencia. 3 KPIs hero + 3 cards.
function _rEdAnalyticsSpecialist(D) {
  var v = $('vEdAnalytics'); if (!v) return;
  var name = (typeof _effectiveUserName === 'function') ? _effectiveUserName() : '';
  var firstName = name ? name.split(/\s+/)[0] : 'Vos';
  var allHist = ((D && D.historial) || []).filter(function(t){ return t.resp === name; });
  var myActive = ((D && D.tasks) || []).filter(function(t){ return t.resp === name && t.status !== 'Listo'; });

  // Parsear historial → date + bizDays + onTime flag
  var entries = allHist.filter(function(t){ return t.creadoRaw && t.cerrado; }).map(function(t) {
    var p = t.cerrado.split('/');
    var cerradoDate = new Date(parseInt(p[2], 10), parseInt(p[1], 10) - 1, parseInt(p[0], 10));
    var biz = (typeof _bizDays === 'function') ? _bizDays(new Date(t.creadoRaw), cerradoDate) : null;
    var sla = _slaLimit(t.priority);
    return {
      priority: t.priority || 'Media',
      cerradoMs: cerradoDate.getTime(),
      bizDays: biz,
      onTime: (biz != null) && (biz <= sla)
    };
  });

  // Hero stats
  var totalClosed = entries.length;
  var onTimeCount = entries.filter(function(e){ return e.onTime; }).length;
  var onTimePct = totalClosed > 0 ? Math.round((onTimeCount / totalClosed) * 100) : null;
  var me = ((D && D.team) || []).find(function(m){ return m.name === name; }) || {};
  var streak = (typeof me.streak === 'number') ? me.streak : 0;

  // Last 8 weeks: closed + on-time per week (week 0 = current, walk back)
  var nowMs = Date.now();
  var WEEK_MS = 7 * 24 * 60 * 60 * 1000;
  var weeks = [];
  for (var w = 7; w >= 0; w--) {
    var weekStart = nowMs - (w + 1) * WEEK_MS;
    var weekEnd   = nowMs - w * WEEK_MS;
    var inWeek = entries.filter(function(e){ return e.cerradoMs >= weekStart && e.cerradoMs < weekEnd; });
    var ontime = inWeek.filter(function(e){ return e.onTime; }).length;
    weeks.push({ count: inWeek.length, onTime: ontime, label: w === 0 ? 'hoy' : (w + 's') });
  }
  var maxWeek = weeks.reduce(function(m, w){ return Math.max(m, w.count); }, 0);

  // Priority mix
  var byPrio = { 'Alta': 0, 'Media': 0, 'Baja': 0 };
  entries.forEach(function(e){ if (byPrio[e.priority] != null) byPrio[e.priority]++; });

  var html = '<div class="pa-page">';

  // Page header
  html += '<div class="pa-page-h">'
       +    '<span class="pa-page-title">Mi desempeño</span>'
       +    '<span class="pa-page-sub">Cómo te está yendo, ' + esc(firstName) + '</span>'
       + '</div>';

  // Narrative
  if (totalClosed === 0) {
    html += '<div class="pa-narrative">Aún no cerraste tareas. Cuando empieces a cerrar, tus stats van a aparecer acá.</div>';
  } else {
    var bits = ['Cerraste <b>' + totalClosed + (totalClosed === 1 ? ' tarea' : ' tareas') + '</b>'];
    if (onTimePct != null) bits.push('con un <b>' + onTimePct + '% en tiempo</b>');
    html += '<div class="pa-narrative">' + bits.join(' ') + '. '
         +    (myActive.length > 0
                ? 'Actualmente tenés <b>' + myActive.length + ' activas</b>.'
                : 'No tenés tareas activas ahora.')
         + '</div>';
  }

  // KPIs (3)
  var ontimeCls = onTimePct == null ? '' : (onTimePct >= 90 ? 'is-good' : (onTimePct >= 75 ? 'is-warn' : 'is-critical'));
  html += '<div class="pa-kpis">'
       +    '<div class="pa-kpi ' + ontimeCls + '">'
       +      '<div class="lab"><span class="dot" style="background:var(--good)"></span> % en tiempo</div>'
       +      '<div class="val">' + (onTimePct == null ? '—' : onTimePct + '%') + '</div>'
       +      '<div class="delta">' + (totalClosed ? 'de ' + totalClosed + ' cerradas' : 'sin datos aún') + '</div>'
       +    '</div>'
       +    '<div class="pa-kpi">'
       +      '<div class="lab"><span class="dot" style="background:var(--info)"></span> Cerradas total</div>'
       +      '<div class="val">' + (totalClosed || '—') + '</div>'
       +      '<div class="delta">' + (totalClosed ? 'tareas completadas' : 'empezá a cerrar') + '</div>'
       +    '</div>'
       +    '<div class="pa-kpi ' + (streak ? 'is-good' : '') + '">'
       +      '<div class="lab"><span style="display:inline-block;margin-right:4px">🔥</span> Racha actual</div>'
       +      '<div class="val">' + (streak || '—') + '</div>'
       +      '<div class="delta">' + (streak ? 'seguidas, en tiempo' : 'arrancá una racha') + '</div>'
       +    '</div>'
       + '</div>';

  // Throughput (last 8 weeks): bar chart inline con SVG
  html += '<div class="pa-section-h">'
       +    '<h3>Tareas cerradas, últimas 8 semanas</h3>'
       +    '<span class="meta">Alto = total cerradas · color = % en tiempo</span>'
       + '</div>';
  if (maxWeek === 0) {
    html += paEmpty('refresh', 'Aún no hay cierres.', 'Empezá a cerrar tareas para armar tu tendencia.');
  } else {
    html += '<div class="pa-card" style="padding:18px 22px;display:flex;align-items:flex-end;gap:14px;height:200px">';
    weeks.forEach(function(wk) {
      var pct = maxWeek > 0 ? Math.max(6, Math.round(wk.count / maxWeek * 100)) : 6;
      var ontimeShare = wk.count > 0 ? Math.round(wk.onTime / wk.count * 100) : 0;
      var color = wk.count === 0
        ? 'var(--bg-3)'
        : (ontimeShare >= 80 ? 'var(--good)' : (ontimeShare >= 50 ? 'var(--warn)' : 'var(--critical)'));
      html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;gap:6px" title="' + esc(wk.label) + ': ' + wk.count + ' cerradas, ' + wk.onTime + ' en tiempo">'
           +    '<div style="font-size:11px;color:var(--fg-2);font-family:var(--font-mono)">' + (wk.count || '—') + '</div>'
           +    '<div style="flex:1;width:100%;display:flex;align-items:flex-end">'
           +      '<div style="width:100%;background:' + color + ';height:' + pct + '%;border-radius:4px 4px 0 0;transition:height .3s"></div>'
           +    '</div>'
           +    '<div style="font-size:10px;color:var(--fg-3);font-weight:500">' + esc(wk.label) + '</div>'
           + '</div>';
    });
    html += '</div>';
  }

  // Priority mix
  var totalP = byPrio.Alta + byPrio.Media + byPrio.Baja;
  html += '<div class="pa-section-h">'
       +    '<h3>Lo que más manejás</h3>'
       +    '<span class="meta">Por prioridad · promedio de días vs SLA</span>'
       + '</div>';
  if (totalP === 0) {
    html += paEmpty('chart', 'Aún no hay tareas cerradas para desglosar.', 'Cuando cierres tareas, vas a ver tu mix acá.');
  } else {
    html += '<div class="pa-card" style="padding:14px 18px">';
    var rows = [
      { lbl: 'Alta',  val: byPrio.Alta,  color: 'var(--critical)', avg: me.avgAlta  || '—', sla: 'SLA ' + _slaLimit('Alta') + 'd' },
      { lbl: 'Media', val: byPrio.Media, color: 'var(--warn)',     avg: me.avgMedia || '—', sla: 'SLA ' + _slaLimit('Media') + 'd' },
      { lbl: 'Baja',  val: byPrio.Baja,  color: 'var(--good)',     avg: me.avgBaja  || '—', sla: 'SLA ' + _slaLimit('Baja') + 'd' }
    ];
    rows.forEach(function(r, i) {
      var pct = totalP > 0 ? Math.round(r.val / totalP * 100) : 0;
      html += '<div style="display:grid;grid-template-columns:140px 1fr 200px;gap:14px;align-items:center;padding:10px 0;border-top:' + (i ? '1px solid var(--line-1)' : '0') + '">'
           +    '<div style="font-size:13px;font-weight:500;color:var(--fg-1)">' + esc(r.lbl) + ' <span style="font-size:11px;color:var(--fg-3);font-weight:400;margin-left:6px">' + esc(r.sla) + '</span></div>'
           +    '<div style="height:8px;background:var(--bg-2);border-radius:999px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:' + r.color + '"></div></div>'
           +    '<div style="font-size:12px;color:var(--fg-2);display:flex;gap:10px;justify-content:flex-end">'
           +      '<span class="mono">' + r.val + '</span>'
           +      '<span class="mono" style="color:var(--fg-3)">' + pct + '%</span>'
           +      '<span style="color:var(--fg-3)">prom. ' + esc(r.avg) + '</span>'
           +    '</div>'
           + '</div>';
    });
    html += '</div>';
  }

  html += '</div>'; // pa-page
  v.innerHTML = html;
}

// MARKER:EDITORIAL_RESUMEN_BEGIN  (owned by Agente O4)
// Vista editorial "Por país" (head only). Hero stats + tabla por
// país (reusa .hq-* y la lógica de sparkbar slope coloring de
// rEdHomeHQ) + sección "Proyectos en riesgo" derivada de tasks.
// ───────────────────────────────────────────────────────────────

function rEdResumen(D) {
  var v = $('vEdResumen'); if (!v) return;
  // Defensa adicional: si por alguna razón se llamó directo sin pasar por
  // goEd('paises'), validamos rol.
  var role = (typeof _effectiveRole === 'function') ? _effectiveRole() : 'specialist';
  if (role !== 'head') {
    v.innerHTML = ''
      + '<div class="ed-eye">' + esc(t('Restringido')) + '</div>'
      + '<h1 class="ed-h1">' + t('Solo Global <em>puede ver esta vista</em>.') + '</h1>'
      + '<p class="ed-lede">' + t('La vista <b>Por país</b> está reservada para el rol <b>Global</b>.') + '</p>'
      + '<div style="margin-top:18px"><button class="ed-btn primary" onclick="goEd(\'home\')">' + esc(t('Volver a Inicio →')) + '</button></div>';
    return;
  }

  var countries = (D && D.countries) || [];
  var allTasks  = (D && D.tasks) || [];
  var projects  = (D && D.projects) || [];

  // Países con actividad (tareas abiertas) vs configurados: "N países activos" mentía
  // cuando solo 1 tiene movimiento. Mostramos total · activos cuando difieren.
  var activeCountries = countries.filter(function(c){ return (c.open || 0) > 0; }).length;
  var paisesLabel = (activeCountries === countries.length)
    ? countries.length + ' ' + (countries.length === 1 ? t('país activo') : t('países activos'))
    : countries.length + ' ' + (countries.length === 1 ? t('país') : t('países')) + ' · ' + activeCountries + ' ' + (activeCountries === 1 ? t('activo') : t('activos'));

  // ── Hero KPIs (idéntica lógica que rEdHomeHQ para coherencia visual)
  var totalOpen    = allTasks.filter(function(t){ return t.status !== 'Listo'; }).length;
  var totalOverdue = countries.reduce(function(a, c){ return a + (c.overdue || 0); }, 0);
  // SLA LATAM: mismo agregado ponderado que la home HQ (ver _rEdTrackerHQCountries).
  var slaAvg = (D && D.latam && typeof D.latam.slaPct === 'number') ? D.latam.slaPct : null;
  if (slaAvg == null) {
    var _withSla = countries.filter(function(c){ return typeof c.slaPct === 'number'; });
    slaAvg = _withSla.length ? Math.round(_withSla.reduce(function(a, c){ return a + c.slaPct; }, 0) / _withSla.length) : 0;
  }
  var atRiskCountries = countries.filter(function(c){
    return (c.overdue || 0) > 3 || (c.slaPct != null && c.slaPct < 85);
  });
  var atRisk = atRiskCountries.length;

  // ── Lede narrativo derivado: países en riesgo + países brillando.
  var briefShine = countries
    .filter(function(c){ return (c.slaPct || 0) >= 95 && (c.overdue || 0) === 0; })
    .map(function(c){ return c.code || c.name; })
    .filter(Boolean)
    .slice(0, 3);
  var briefRisk = atRiskCountries
    .map(function(c){ return c.code || c.name; })
    .filter(Boolean)
    .slice(0, 3);
  var ledeParts = [];
  ledeParts.push(t('LATAM tiene') + ' <b>' + totalOpen + '</b> ' + t('tareas activas'));

  if (countries.length === 0) {

         +    '</div>';
    countries.forEach(function(c) {
      var sla = c.slaPct || 0;
      var ovColor = (c.overdue || 0) > 3 ? 'var(--critical-fg)' : 'var(--fg-2)';

      html += '<div class="pa-tbl-r" style="grid-template-columns: 180px 1fr 80px 90px 90px 130px;gap:16px;height:52px" onclick="edSetCountryFilter(\'' + esc(c.code) + '\');goEd(\'tracker\')">'

           +    '<div class="mono" style="font-size:13px;text-align:right;color:' + ovColor + '">' + (c.overdue || 0) + '</div>'
           +    '<div class="mono" style="font-size:13px;text-align:right;color:' + slaColor + '">' + (sla || '—') + (sla ? '%' : '') + '</div>'
           +    '<div>' + (hasTrend ? paSparkline(trend, 110, 28, sparkTone) : '<span style="font-size:11px;color:var(--fg-4)">—</span>') + '</div>'
           + '</div>';
    });
    html += '</div>';
  }

  // ── Proyectos en riesgo (derivado de tasks; ordenado por % atrasadas).
  var risky = projects
    // En pausa fuera de "riesgo": reloj pausado, igual que tareas On hold.
    .filter(function(p){ return p.status !== 'Completado' && p.status !== 'Cancelado' && p.status !== 'En pausa'; })

    })
    .filter(function(x){ return x.overdue > 0; })

           +    '<span class="pa-pill ' + pillTone + '"><span class="dot"></span>' + esc(pctTxt) + '</span>'
           + '</div>';
    });
    html += '</div>';
  }

  html += '</div>'; // pa-page
  v.innerHTML = html;
}

// Líderes disponibles según rol y país elegido en paso 1.
// - head: todos los líderes de todos los equipos.
// - manager/specialist: el líder del país del usuario; si seleccionó otro país
//   (poco común, restringido por backend), se devuelve el del país elegido.
// Si no hay país elegido todavía: lista vacía.
function _crpLideres(paisCode) {
  var equipos = (D && D.equipos) || [];
  var role = (typeof _effectiveRole === 'function') ? _effectiveRole() : 'specialist';
  var out = [];
  var seen = {};
  function push(name) {
    if (name && !seen[name]) { seen[name] = 1; out.push(name); }
  }
  if (role === 'head') {
    equipos.forEach(function(eq){ push(eq && eq.leader); });
    return out;
  }
  // manager/specialist: prioritariamente el lider del pais elegido
  if (paisCode) {
    var eq = equipos.find(function(e){ return e && e.code === paisCode; });
    if (eq) {
      push(eq.leader);
      // Plus: cualquier otro miembro del país marcado como leader (caso multi-leader)
      (eq.members || []).forEach(function(m){
        if (m && m === eq.leader) push(m);
      });
    }
  }
  return out;
}

// Todos los miembros del país (líder + members) para elegir participantes.
function _crpMembers(paisCode) {
  var equipos = (D && D.equipos) || [];
  var out = [];
  equipos.forEach(function(eq) {
    if (!eq || (paisCode && eq.code !== paisCode)) return;
    if (eq.leader) out.push(eq.leader);
    (eq.members || []).forEach(function(m){ if (m) out.push(m); });
  });
  return out.filter(function(n, i){ return out.indexOf(n) === i; });
}

// Picker de participantes agrupado por país (colapsable). Usa D.rosterByCountry
// (todos los países, names-only); el país del proyecto va abierto por default.
function _crpParticipantPicker(v) {
  var roster = (D && D.rosterByCountry) || [];
  if (!roster.length && D && D.equipos) { // fallback deploy viejo: solo equipos visibles
    roster = D.equipos.map(function(eq){
      var mm = []; if (eq && eq.leader) mm.push(eq.leader);
      ((eq && eq.members) || []).forEach(function(m){ if (m) mm.push(m); });
      return { code: eq.code, country: eq.country || eq.code, members: mm };
    });
  }
  if (!roster.length) return '<div style="font-size:12px;color:var(--fg-3);padding:6px 0">' + t('No hay equipos en el sheet Equipos.') + '</div>';
  var partList = (v.participantes || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  var myCode = v.pais || '';
  var ordered = roster.slice().sort(function(a, b){ return (a.code === myCode ? 0 : 1) - (b.code === myCode ? 0 : 1); });
  return ordered.map(function(grp){
    var sel = grp.members.filter(function(n){ return partList.indexOf(n) >= 0; }).length;
    var openAttr = (grp.code === myCode) ? ' open' : '';
    var chips = grp.members.map(function(name){
      var on = partList.indexOf(name) >= 0;
      return '<button type="button" class="cr-pill-btn' + (on ? ' active' : '') + '" onclick="edCrearProyectoToggleParticipante(\'' + escJs(name) + '\')">' + esc(name) + '</button>';
    }).join('');
    return '<details' + openAttr + ' style="margin-bottom:6px">'
      + '<summary style="cursor:pointer;font-size:12px;color:var(--fg-2);user-select:none;padding:3px 0">'
      + esc(grp.country || grp.code) + (sel ? ' <span style="color:var(--accent);font-weight:600">· ' + sel + '</span>' : '')
      + '</summary>'
      + '<div class="cr-pills-row" style="margin-top:4px">' + (chips || '<span style="font-size:12px;color:var(--fg-3)">—</span>') + '</div>'
      + '</details>';
  }).join('');
}

  if (!EDCP || !EDCP.values) return;

function _crpRender(step) {
  var s = step || EDCP.step || 1;
  var titles = {
    1: t('Empezá por lo esencial'),
    2: t('Detalles y plazo'),
    3: t('Listo para publicar')
  };
  var infos = {
    1: t('Siguiente: <b>tipo, riesgo y plazo.</b>'),
    2: t('Cuando estés listo, te llevamos al review final antes de publicar.'),
    3: t('Revisión final. Cuando confirmes, se crea el proyecto.')
  };
  var bodyHtml;
  if (s === 1) bodyHtml = _crpRenderStep1();
  else if (s === 2) bodyHtml = _crpRenderStep2();
  else bodyHtml = _crpRenderStep3();

  var footBtns = '';

}

function _crpMount() {
  var host = $('crpHost'); if (!host) return;
  host.innerHTML = _crpRender(EDCP.step);
}

function edCrearProyectoOpen() {
  // Pre-fill país y líder con los del user. Para specialist/manager, el país
  // es fijo (no eligible). Para head queda vacío para que elija. El líder se
  // deriva del país elegido en step 2.
  var openRole = (typeof _effectiveRole === 'function') ? _effectiveRole() : 'specialist';
  var userCode = (typeof _effectiveUserCode === 'function') ? _effectiveUserCode() : '';
  var prefillPais = (openRole === 'head') ? '' : (userCode || '');
  EDCP.step = 1;
  EDCP.values = {
    nombre: '',
    descripcion: '',
    pais: prefillPais,
    priority: 'Media',
    tipoTrabajo: '',
    riesgo: '',
    lider: '',
    deadline: '',
    participantes: '',
    contrapartesConflicto: ''
  };
  // Restaurar borrador si tiene contenido útil
  try {
    var saved = localStorage.getItem('lt-edcp-draft');
    if (saved) {
      var v = JSON.parse(saved);
      if (v && (v.nombre || v.descripcion)) {
        // Copiar solo claves con contenido: un draft viejo con pais/lider
        // vacíos no debe pisar el prefill recién calculado (mismo criterio
        // que el restore del wizard de tareas).
        Object.keys(EDCP.values).forEach(function(k) {
          if (v[k] != null && String(v[k]) !== '') EDCP.values[k] = v[k];
        });
        if (typeof toast === 'function') toast(t('Restauré tu borrador anterior.'), 'info');
      }
    }
  } catch(e){}
  _crpMount();
  setTimeout(function() {
    var input = $('crpNombre');
    if (input) input.focus();
  }, 60);
}

function edCrearProyectoClose() {
  EDCP.step = 1;
  var host = $('crpHost'); if (host) host.innerHTML = '';
}

function edCrearProyectoSetField(key, value) {
  if (!EDCP.values || !(key in EDCP.values)) return;
  EDCP.values[key] = value;
  // Si cambia el país, invalidar el líder elegido (puede ya no aplicar al nuevo país)
  if (key === 'pais') {
    var allowed = _crpLideres(value);
    if (EDCP.values.lider && allowed.indexOf(EDCP.values.lider) < 0) {
      EDCP.values.lider = '';
    }
  }
  try { localStorage.setItem('lt-edcp-draft', JSON.stringify(EDCP.values)); } catch(e){}
  // Re-render para pills (refleja activo) y cuando cambia país (recalcula select de líder)
  var rerenderFields = { pais: 1, priority: 1, tipoTrabajo: 1, riesgo: 1 };
  if (rerenderFields[key]) _crpMount();
}

function edCrearProyectoGoStep(n) {
  var v = EDCP.values;
  if (n > EDCP.step) {
    if (EDCP.step === 1) {
      if (!v.nombre || !v.nombre.trim()) { toast(t('Nombre requerido'), 'error'); return; }
      if (!v.pais) { toast(t('Seleccioná un país'), 'error'); return; }
      if (!v.priority) { toast(t('Seleccioná una prioridad'), 'error'); return; }
    } else if (EDCP.step === 2) {
      if (!v.deadline) { toast(t('Plazo requerido'), 'error'); return; }
    }
  }
  EDCP.step = n;
  _crpMount();
}

function edCrearProyectoSubmit() {
  var v = EDCP.values;
  if (!v.nombre || !v.nombre.trim()) { toast(t('Nombre requerido'), 'error'); return; }
  if (!v.pais) { toast(t('País requerido'), 'error'); return; }
  var btn = $('crpSubmit'); if (btn) btn.disabled = true;
  if (typeof showLoader === 'function') showLoader();
  google.script.run
    .withSuccessHandler(function(res) {
      if (typeof hideLoader === 'function') hideLoader();
      if (btn) btn.disabled = false;
      if (res && res.success) {
        toast(t('✅ Proyecto #') + res.id + t(' creado'), 'success');
        try { localStorage.removeItem('lt-edcp-draft'); } catch(e){}
        edCrearProyectoClose();
        if (typeof reload === 'function') reload();
      } else {
        toast(t('Error: ') + ((res && res.error) || t('desconocido')), 'error');
      }
    })
    .withFailureHandler(function(e) {
      if (typeof hideLoader === 'function') hideLoader();
      if (btn) btn.disabled = false;
      toast(t('Error: ') + (e && e.message || t('desconocido')), 'error');
    })
    .addProject({
      nombre: v.nombre.trim(),
      descripcion: (v.descripcion || '').trim(),
      responsable: (typeof _effectiveUserName === 'function' && _effectiveUserName()) || '',
      lider: '',
      pais: v.pais || '',
      priority: v.priority || 'Media',
      tipoTrabajo: v.tipoTrabajo || '',
      riesgo: v.riesgo || '',
      deadline: v.deadline || '',
      status: 'Activo',
      notas: '',
      participantes: (v.participantes || '').trim(),
      contrapartesConflicto: (v.contrapartesConflicto || '').trim()
    });
}

// Render real de la vista Biblioteca: lee la hoja Templates vía getTemplates().
// La data tiene forma { tipoTrabajo: [item1, item2, ...] }. Solo manager y
// head pueden crear/editar/eliminar; specialist es read-only. Cuando se
// cambia una plantilla, invalidamos _TEMPLATES_CACHE para forzar refresh
// en el wizard de Crear (sino el dropdown sigue mostrando la versión vieja
// hasta que recargue la página).
// Biblioteca tiene 2 sub-secciones: Plantillas y Documentos. rEdPlantillas es
// el dispatcher (lo llama goEd); cada sub-render inyecta la sub-nav arriba.
var EDBIB_TAB = 'plantillas';
function edBibSetTab(tab) {
  EDBIB_TAB = (tab === 'documentos') ? 'documentos' : 'plantillas';
  rEdPlantillas(D);
}
function _bibSubnav(active) {

// "Usar plantilla": abre el wizard de crear con el tipo de trabajo ya
// seleccionado — el backend inserta el checklist en las notas al crear
// (si la descripción queda vacía). Es lo que vuelve accionable la vista
// de Plantillas para cualquier rol (antes era una tabla solo-lectura).
function edPltUseTemplate(tipo) {
  if (typeof edCrearOpen === 'function') edCrearOpen();
  // edCrearOpen resetea EDC.values y puede restaurar un draft — seteamos el
  // tipo después para que gane la plantilla elegida.
  setTimeout(function() {
    if (typeof edCrearSetField === 'function') edCrearSetField('tipo', tipo);
  }, 80);
}
function rEdPlantillas(D) {
  // Biblioteca = vista única de Documentos. La pestaña "Plantillas" (checklists
  // por tipo de trabajo) se retiró de la UI: confundía con Documentos y el
  // estante de modelos es lo que el equipo realmente necesita. El motor de
  // checklists del backend queda dormido (recuperable); el panel de tarea
  // sigue renderizando listas "- ítem" manuales.
  return _rEdBibDocs(D);
}
function _rEdBibPlantillas(D) {
  var v = $('vEdPlantillas'); if (!v) return;
  var role = _effectiveRole();
  var canApprove = (role === 'manager' || role === 'head');
  var myName = _effectiveUserName();
  function _sameName(a, b){ return (a || '').toString().trim().toLowerCase() === (b || '').toString().trim().toLowerCase(); }

  // Cache de la lista rica (estado+autor). Se recarga al mutar.
  if (_BIBLIO_CACHE == null) {
    v.innerHTML = '<div class="pa-page">' + _bibSubnav('plantillas') + ltSkeleton(5) + '</div>';
    _loadBiblioteca(function() { _rEdBibPlantillas(D); });

  }

  var items = (_BIBLIO_CACHE || []).slice().sort(function(a, b) {
    if (a.tipo !== b.tipo) return a.tipo.localeCompare(b.tipo);

    return a.estado === 'pendiente' ? -1 : 1; // pendiente primero
  });
  var pendCount = items.filter(function(x){ return x.estado === 'pendiente'; }).length;

       +      (pendCount ? ' · ' + pendCount + ' ' + esc(pendCount === 1 ? t('pendiente de aprobación') : t('pendientes de aprobación')) : '') + '</span>'
       +    '<div class="pa-page-meta">'

       +    '</div>'
       + '</div>';
  html += _bibSubnav('plantillas');

  // El ciclo completo en una frase: plantilla → tarea de ese tipo → checklist
  // con progreso en el panel. Antes el copy solo hablaba de "pre-cargar notas"
  // y la feature parecía decorativa.
  html += '<div class="pa-narrative">'
       +    t('Una plantilla define los <b>pasos estándar</b> de un tipo de trabajo. Al crear una tarea de ese tipo, los pasos aparecen como un <b>checklist con progreso</b> en el panel de la tarea — usá <b>Usar →</b> para arrancar una ya.')
       +    ' ' + (canApprove
            ? t('Las propuestas de specialists quedan <b>pendientes</b> hasta que las apruebes.')
            : t('Podés proponer una: quedará <b>pendiente</b> hasta que un manager o Global la apruebe.'))
       + '</div>';

  if (items.length === 0) {
    html += paEmpty('doc', t('Tu biblioteca está vacía.'), t('Creá la primera con "Nueva plantilla". Cada tipo de trabajo puede tener una.'));
    html += '</div>';
    v.innerHTML = html;
    return;
  }

  html += '<div class="pa-tbl" style="margin-top:14px">'
       +    '<div class="pa-tbl-h" style="grid-template-columns: 170px 1fr 80px 110px 130px 230px">'
       +      '<div>' + esc(t('Tipo')) + '</div><div>Checklist</div><div>' + esc(t('Pasos')) + '</div><div>' + esc(t('Estado')) + '</div><div>' + esc(t('Autor')) + '</div><div></div>'
       +    '</div>';
  items.forEach(function(it) {
    var preview = it.checklist.slice(0, 3).join(' · ');
    if (it.checklist.length > 3) preview += ' · …';
    var estadoPill = it.estado === 'pendiente'
      ? '<span class="pa-pill pa-pill-warn">' + esc(t('Pendiente')) + '</span>'
      : '<span class="pa-pill pa-pill-good">' + esc(t('Aprobada')) + '</span>';
    var mine = _sameName(it.autor, myName);
    var canDelete = canApprove || (it.estado === 'pendiente' && mine);
    var btns = '<div style="display:flex;gap:6px;justify-content:flex-end">';
    // CTA principal: crear una tarea de este tipo con el checklist puesto.

    if (it.estado !== 'pendiente') {
      btns += '<button class="pa-btn pa-btn-primary" style="height:26px;font-size:11px;padding:0 10px" title="' + esc(t('Crear una tarea de este tipo con el checklist puesto')) + '" onclick="event.stopPropagation();edPltUseTemplate(\'' + esc(escJs(it.tipo)) + '\')">' + esc(t('Usar')) + ' →</button>';
    }
    if (canApprove && it.estado === 'pendiente') {
      btns += '<button class="pa-btn pa-btn-primary" style="height:26px;font-size:11px;padding:0 8px" onclick="event.stopPropagation();edPltApprove(\'' + esc(escJs(it.tipo)) + '\')">' + esc(t('Aprobar')) + '</button>';
    }
    btns += '<button class="pa-btn pa-btn-ghost" style="height:26px;font-size:11px;padding:0 8px" onclick="event.stopPropagation();edPltOpenEditor(\'' + esc(escJs(it.tipo)) + '\',\'' + esc(it.estado) + '\')">' + esc(canApprove || mine ? t('Editar') : t('Proponer cambio')) + '</button>';
    if (canDelete) {
      btns += '<button class="pa-btn pa-btn-ghost" style="height:26px;font-size:11px;padding:0 8px;color:var(--critical-fg)" onclick="event.stopPropagation();edPltDelete(\'' + esc(escJs(it.tipo)) + '\',\'' + esc(it.estado) + '\')">' + esc(t('Eliminar')) + '</button>';
    }
    btns += '</div>';
    html += '<div class="pa-tbl-r" style="grid-template-columns: 170px 1fr 80px 110px 130px 230px;height:48px">'
         +    '<div><span class="pa-pill pa-pill-tipo">' + esc(it.tipo) + '</span></div>'
         +    '<div style="font-size:12px;color:var(--fg-2);line-height:1.45">' + esc(preview) + '</div>'
         +    '<div class="mono" style="font-size:12px;color:var(--fg-2)">' + it.checklist.length + '</div>'
         +    '<div>' + estadoPill + '</div>'
         +    '<div style="font-size:12px;color:var(--fg-3)">' + esc(it.autor || '—') + '</div>'
         +    btns
         + '</div>';
  });
  html += '</div></div>';
  v.innerHTML = html;
  return;
}

// Editor de plantilla: modal con dropdown de tipoTrabajo + textarea de items
// (uno por línea). Si `tipo` se pasa, edita la existente; si null, crea nueva.
var EDPLT_EDIT = { tipo: null, estado: null, items: [], saving: false };
function edPltOpenEditor(tipo, estado) {
  // Cualquiera puede abrir el editor. El estado final (aprobada/pendiente) lo
  // decide el backend según el rol; acá solo pre-cargamos los ítems.
  EDPLT_EDIT.tipo = tipo || null;
  EDPLT_EDIT.estado = estado || null;
  var match = null;
  if (tipo) {
    match = (_BIBLIO_CACHE || []).filter(function(x){ return x.tipo === tipo && (!estado || x.estado === estado); })[0]
         || (_BIBLIO_CACHE || []).filter(function(x){ return x.tipo === tipo; })[0];
  }
  EDPLT_EDIT.items = (match && match.checklist) ? match.checklist.slice() : [];
  EDPLT_EDIT.saving = false;
  _edPltMountEditor();
}
function edPltCloseEditor() {
  var host = $('edPltHost'); if (host) host.innerHTML = '';
  EDPLT_EDIT.saving = false;
}
function _edPltMountEditor() {
  var host = $('edPltHost');
  if (!host) {
    host = document.createElement('div');
    host.id = 'edPltHost';
    document.body.appendChild(host);
  }
  var isNew = !EDPLT_EDIT.tipo;
  // Cualquier tipo es elegible; el backend hace upsert por (tipo, estado).
  var availableTipos = isNew ? (_CR_TIPOS || []).slice() : [EDPLT_EDIT.tipo];
  var noTiposLeft = false;
  var itemsText = (EDPLT_EDIT.items || []).join('\n');
  var willBePending = (typeof _effectiveRole === 'function') && _effectiveRole() === 'specialist';

  var html = '<div class="cr-overlay" onclick="if(event.target===this)edPltCloseEditor()">'
           +   '<div class="cr-backdrop" onclick="edPltCloseEditor()"></div>'
           +   '<div class="cr-modal" role="dialog" aria-modal="true" aria-label="Editor de plantilla">'
           +     '<div class="cr-head">'
           +       '<div>'
           +         '<div class="cr-eye">— ' + (isNew ? 'Nueva' : 'Editar') + ' plantilla</div>'
           +         '<div class="cr-title">' + (isNew ? 'Crear plantilla' : ('Editar plantilla · ' + esc(EDPLT_EDIT.tipo))) + '</div>'
           +       '</div>'
           +       '<button type="button" class="cr-x" onclick="edPltCloseEditor()" aria-label="Cerrar">×</button>'
           +     '</div>'
           +     '<div class="cr-body">';

  if (noTiposLeft) {
    html += '<div class="pa-narrative">Ya tenés una plantilla para cada tipo de trabajo. Editá las existentes desde la lista, o eliminá alguna para crear otra con ese tipo.</div>';
  } else {
    if (willBePending) {
      html += '<div class="pa-narrative" style="border-left:3px solid var(--warn);padding-left:10px">Tu propuesta quedará <b>pendiente</b> hasta que un manager o Global la apruebe. Recién entonces se aplicará en el wizard de Crear.</div>';
    }
    html += '<div class="cr-field">'
         +    '<div class="cr-label">Tipo de trabajo <span class="req">*</span></div>'
         +    (isNew
         ?      '<select id="edPltTipoSelect" class="cr-input" onchange="EDPLT_EDIT.tipo=this.value">'
         +        '<option value="">Seleccionar…</option>'
         +        availableTipos.map(function(t){
                    return '<option value="' + esc(t) + '"' + (EDPLT_EDIT.tipo === t ? ' selected' : '') + '>' + esc(t) + '</option>';
                  }).join('')
         +      '</select>'
         :      '<input class="cr-input" value="' + esc(EDPLT_EDIT.tipo) + '" disabled>')
         + '</div>'
         + '<div class="cr-field">'
         +   '<div class="cr-label">Checklist · un ítem por línea <span class="req">*</span></div>'
         +   '<textarea id="edPltItemsTa" class="cr-input cr-textarea" style="min-height:200px;font-family:var(--font-mono);font-size:12px" placeholder="Revisar contraparte\nValidar firma autorizada\nAdjuntar minuta\n…">' + esc(itemsText) + '</textarea>'
         +   '<div style="font-size:11px;color:var(--fg-3);margin-top:6px">Máx 50 ítems, 200 caracteres por ítem. Líneas vacías se ignoran.</div>'
         + '</div>';
  }

  html += '</div>'
       +    '<div class="cr-foot">'
       +      '<div class="cr-foot-info">' + (isNew ? 'La plantilla se aplica al elegir este tipo en el wizard de Crear.' : 'Los cambios afectan tareas nuevas — las ya creadas no se modifican.') + '</div>'
       +      '<button type="button" class="ed-btn ghost" onclick="edPltCloseEditor()">Cancelar</button>'
       +      (noTiposLeft ? '' : '<button type="button" class="ed-btn accent" id="edPltSaveBtn" onclick="edPltSave()">Guardar</button>')
       +    '</div>'
       +  '</div>'
       + '</div>';
  host.innerHTML = html;
  setTimeout(function() {
    var ta = $('edPltItemsTa');

function edPltSave() {
  if (EDPLT_EDIT.saving) return;
  var tipo = EDPLT_EDIT.tipo;
  if (!tipo) {
    var sel = $('edPltTipoSelect');
    tipo = sel && sel.value;
    if (!tipo) { toast('Elegí un tipo de trabajo.', 'error'); return; }
    EDPLT_EDIT.tipo = tipo;
  }
  var ta = $('edPltItemsTa');
  if (!ta) return;
  var items = (ta.value || '').split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
  if (!items.length) { toast('Agregá al menos un ítem.', 'error'); return; }
  EDPLT_EDIT.saving = true;
  var btn = $('edPltSaveBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
  google.script.run
    .withSuccessHandler(function(res) {
      EDPLT_EDIT.saving = false;
      if (btn) { btn.disabled = false; btn.textContent = 'Guardar'; }
      if (res && res.success) {
        // Invalidar ambas caches: wizard (aprobadas) + biblioteca (rica).
        _TEMPLATES_CACHE = null;
        _BIBLIO_CACHE = null;
        toast(res.estado === 'pendiente' ? 'Propuesta enviada · pendiente de aprobación' : 'Plantilla guardada', 'success');
        edPltCloseEditor();
        rEdPlantillas(D);
      } else {
        toast((res && res.error) || 'No se pudo guardar.', 'error');
      }
    })
    .withFailureHandler(function(e) {
      EDPLT_EDIT.saving = false;
      if (btn) { btn.disabled = false; btn.textContent = 'Guardar'; }
      toast('Error: ' + (e && e.message || 'desconocido'), 'error');
    })
    .saveTemplate(tipo, items);
}
// Aprobar una propuesta pendiente (manager/Global). Reemplaza la aprobada vigente.
function edPltApprove(tipo) {
  confirm_('¿Aprobar la plantilla de "' + tipo + '"? Reemplazará a la aprobada vigente para ese tipo y se aplicará en el wizard de Crear.', function() {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          _TEMPLATES_CACHE = null; _BIBLIO_CACHE = null;
          toast('Plantilla aprobada', 'success');
          rEdPlantillas(D);
        } else {
          toast((res && res.error) || 'No se pudo aprobar.', 'error');
        }
      })
      .withFailureHandler(function(e) {
        toast('Error: ' + (e && e.message || 'desconocido'), 'error');
      })
      .approveTemplate(tipo);

// Cognitivamente más útil que el ISO crudo (YYYY-MM-DD). Fallback al slice si
// no parsea.
function _bibRelTime(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso).slice(0, 10);
  var diffMs = Date.now() - d.getTime();
  var min = Math.floor(diffMs / 60000);
  if (min < 1) return 'recién';
  if (min < 60) return 'hace ' + min + ' min';
  var h = Math.floor(min / 60);
  if (h < 24) return 'hace ' + h + (h === 1 ? ' hora' : ' horas');
  var d2 = Math.floor(h / 24);
  if (d2 < 7) return 'hace ' + d2 + (d2 === 1 ? ' día' : ' días');
  if (d2 < 30) { var sem = Math.floor(d2 / 7); return 'hace ' + sem + ' sem'; }
  if (d2 < 365) { var mes = Math.floor(d2 / 30); return 'hace ' + mes + (mes === 1 ? ' mes' : ' meses'); }
