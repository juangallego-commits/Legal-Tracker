<body data-theme="dark">

<div class="app">
<div class="ed-root">
<aside class="ed-side" id="edSide">
  <!-- Renderizado por mountEdShell() en Dashboard.js -->
</aside>
<main class="ed-main" id="edMain">
<header class="ed-head" id="edHead">
  <!-- Renderizado por mountEdShell() en Dashboard.js -->
</header>

<!-- ═══ EDITORIAL HOME (specialist/manager/hq) ═══ -->
<div class="view active" id="vEdHome"></div>
<!-- ═══ EDITORIAL TRACKER ═══ -->
<div class="view" id="vEdTracker"></div>
<!-- ═══ EDITORIAL CALENDARIO ═══ -->
<div class="view" id="vEdCalendar"></div>
<!-- ═══ EDITORIAL PROYECTOS — INDEX ═══ -->
<div class="view" id="vEdProyectosIndex"></div>
<!-- ═══ EDITORIAL HISTORIAL / CERRADAS ═══ -->
<div class="view" id="vEdHistorial"></div>
<!-- ═══ EDITORIAL MI EQUIPO (manager/head) ═══ -->
<div class="view" id="vEdMiequipo"></div>
<!-- ═══ EDITORIAL ANALYTICS ═══ -->
<div class="view" id="vEdAnalytics"></div>
<!-- ═══ EDITORIAL POR PAÍS / RESUMEN (head only) ═══ -->
<div class="view" id="vEdResumen"></div>
<!-- ═══ EDITORIAL BIBLIOTECA DE PLANTILLAS ═══ -->
<div class="view" id="vEdPlantillas"></div>
<!-- Task panel slide-in container -->
<div id="tkPanelHost"></div>

<!-- ═══ CREAR MODAL (tarea o proyecto) ═══ -->
<div class="modal-overlay" id="createOv" onclick="if(event.target===this)closeCreate()">
<div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="createT-title">
<div class="modal-header">
  <h2 id="createT">Crear</h2>
  <button class="modal-close" onclick="closeCreate()" aria-label="Cerrar">✕</button>
</div>
<div class="modal-body">
  <div class="sub-tabs">
    <button class="sub-tab active" onclick="goSub('newTask')">📝 Nueva tarea</button>
    <button class="sub-tab" onclick="goSub('newProj')">📁 Nuevo proyecto</button>
  </div>

  <!-- SUB: New Task -->
  <div class="sub-view active" id="svNewTask">
    <div class="card"><div class="card-header"><span class="card-title">Crear tarea</span></div><div class="card-body">
      <div class="form-section"><div class="form-section-title">Información</div>
        <div class="form-group" style="margin-bottom:14px"><label>Nombre *</label><input type="text" id="fNom" placeholder="Descripción breve" maxlength="80"></div>
        <div class="form-3col"><div class="form-group"><label>Proyecto</label><select id="fProj" onchange="checkContraparteConflict()"><option value="">Sin proyecto</option></select></div><div class="form-group"><label>País</label><select id="fPais"><option value="">Auto</option></select></div><div class="form-group"><label>Prioridad</label><select id="fPrio"><option value="Alta">🔴 Alta</option><option value="Media" selected>🟡 Media</option><option value="Baja">🟢 Baja</option></select></div></div>
        <div class="form-grid"><div class="form-group"><label>Tipo de trabajo</label><select id="fTipo"><option value="">Sin definir</option><option>Contencioso</option><option>Regulatorio</option><option>Contractual</option><option>Privacy</option><option>Operativo</option></select></div><div class="form-group"><label>Nivel de riesgo</label><select id="fRiesgo"><option value="">Sin definir</option><option>Legal alto</option><option>Reputacional</option><option>Operativo</option></select></div></div>
        <div class="form-group" style="margin-top:14px"><label>Contraparte</label><input type="text" id="fContraparte" placeholder="Contraparte (opcional)" maxlength="120" oninput="checkContraparteConflict()"></div>
        <div id="fConflictWarn" style="display:none;margin-top:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--warn);background:var(--warn-soft,rgba(255,185,56,.14));color:var(--warn);font-size:13px;font-weight:600"></div>
      </div>
      <div class="form-section"><div class="form-section-title">Asignación</div>
        <div class="form-3col"><div class="form-group"><label>Responsable *</label><select id="fResp"><option value="">Seleccionar...</option></select></div><div class="form-group"><label>Líder</label><select id="fLider"><option value="">Auto</option></select></div><div class="form-group"><label>Plazo</label><input type="date" id="fDl"></div></div>
      </div>
      <div class="form-section"><div class="form-section-title">Detalle</div>
        <div class="form-grid">
  <div class="form-group"><label>Accionables <span style="font-weight:400;color:var(--text-dim)">(Enter para agregar)</span></label>
    <div class="tags-input" id="fAccTags" onclick="this.querySelector('.tags-text').focus()"></div>
    <input type="hidden" id="fAcc">
  </div>
  <div class="form-group"><label>Notas</label><input type="text" id="fNot" placeholder="Contexto"></div>
</div>
      </div>
      <button class="btn-submit" id="btnT" onclick="submitTask()">Crear tarea</button><div class="form-msg" id="fMsg"></div>
    </div></div>
  </div>

  <!-- SUB: New Project -->
  <div class="sub-view" id="svNewProj">
    <div class="card"><div class="card-header"><span class="card-title">Crear proyecto</span></div><div class="card-body">
      <div class="form-section"><div class="form-section-title">Información del proyecto</div>
        <div class="form-group" style="margin-bottom:14px"><label>Nombre del proyecto *</label><input type="text" id="pNom" placeholder="Ej: Compliance GDPR Brasil" maxlength="80"></div>
        <div class="form-group" style="margin-bottom:14px"><label>Descripción</label><textarea id="pDesc" placeholder="¿De qué se trata este proyecto?" rows="2"></textarea></div>
        <div class="form-3col"><div class="form-group"><label>País</label><select id="pPais"><option value="">Seleccionar...</option></select></div><div class="form-group"><label>Prioridad</label><select id="pPrio"><option value="Alta">🔴 Alta</option><option value="Media" selected>🟡 Media</option><option value="Baja">🟢 Baja</option></select></div><div class="form-group"><label>Plazo</label><input type="date" id="pDl"></div></div>
        <div class="form-grid"><div class="form-group"><label>Tipo de trabajo</label><select id="pTipo"><option value="">Sin definir</option><option>Contencioso</option><option>Regulatorio</option><option>Contractual</option><option>Privacy</option><option>Operativo</option></select></div><div class="form-group"><label>Nivel de riesgo</label><select id="pRiesgo"><option value="">Sin definir</option><option>Legal alto</option><option>Reputacional</option><option>Operativo</option></select></div></div>
      </div>
      <div class="form-section"><div class="form-section-title">Asignación</div>
        <div class="form-grid"><div class="form-group"><label>Responsable principal</label><select id="pResp"><option value="">Seleccionar...</option></select></div><div class="form-group"><label>Líder</label><select id="pLider"><option value="">Auto</option></select></div></div><div class="form-group" style="margin-bottom:14px">
  <label>Participantes <span style="font-weight:400;color:var(--text-dim)">(selecciona de la lista o escribe)</span></label>
  <div class="tags-input" id="pPartTags" onclick="this.querySelector('.tags-text').focus()"></div>
  <input type="hidden" id="pPart">
  <div style="margin-top:8px"><select id="pPartSelect" style="width:100%;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:var(--font);font-size:13px" onchange="addParticipant(this)"><option value="">+ Agregar participante...</option></select></div>
</div>
      </div>
      <div class="form-section"><div class="form-section-title">Notas</div>
        <div class="form-group"><label>Notas adicionales</label><input type="text" id="pNot" placeholder="Contexto o enlaces relevantes"></div>
      </div>
      <button class="btn-submit" id="btnP" onclick="submitProj()">Crear proyecto</button><div class="form-msg" id="pMsg"></div>
    </div></div>
  </div>
</div>
</div>
</div>

<button class="fab" id="fabCreate" onclick="edCrearOpen()" aria-label="Crear tarea (atajo: N)" title="Crear tarea (N)">+</button>
<button class="ed-fb-fab" id="edFbFab" onclick="edFeedbackOpen()" aria-label="Enviar feedback (Beta)" title="Enviar feedback — estamos en Beta">💬 Feedback</button>

<div class="footer">⚖ Made with care for the Legal Team · Rappi · MyDash v3.6 · Beta</div>
</main>
</div><!-- /.ed-root -->
</div><!-- /.app -->

<div class="modal-overlay" id="editOv" onclick="if(event.target===this)closeEdit()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="editT"><div class="modal-header"><h2 id="editT">Editar</h2><button class="modal-close" onclick="closeEdit()" aria-label="Cerrar">✕</button></div><div class="modal-body" id="editB"></div><div class="modal-footer"><button class="btn-secondary" onclick="closeEdit()">Cancelar</button><button class="btn-submit" id="editSaveBtn" onclick="saveEdit()">Guardar</button></div></div></div>
<!-- CONFIRM -->
<div class="modal-overlay" id="confOv" onclick="if(event.target===this)closeCf()"><div class="modal" style="max-width:420px" role="alertdialog" aria-modal="true" aria-labelledby="confTxt"><div class="modal-header"><h2>Confirmar</h2><button class="modal-close" onclick="closeCf()" aria-label="Cerrar">✕</button></div><div class="modal-body"><p id="confTxt" style="font-size:14px;color:var(--fg-2);line-height:1.55;margin:0"></p></div><div class="modal-footer"><button class="btn-secondary" onclick="closeCf()">Cancelar</button><button class="btn-submit" id="confBtn">Confirmar</button></div></div></div>
<div class="dd-overlay" id="ddO" onclick="closeDD()"></div><div class="dd-menu" id="ddM"></div>
<!-- EDITORIAL ACTUALIZAR · panel deslizable (avanzar/cerrar/bloquear) -->
<div id="uaHost"></div>
<!-- EDITORIAL CREAR · wizard de 3 pasos (versión simplificada) -->
<div id="crHost"></div>
<!-- EDITORIAL CREAR PROYECTO · wizard de 3 pasos -->
<div id="crpHost"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  window.__DATA__ = <?!= data ?>;
  window.__USER__ = <?!= currentUser ?>;
</script>
